---
- name: Verify nginx configuration
  hosts: all
  gather_facts: false
  tasks:
    - name: Check nginx configuration files
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /tmp/molecule_test/etc/nginx/nginx.conf
        - /tmp/molecule_test/etc/nginx/conf.d/security.conf
      loop_control:
        loop_var: item_config
      register: nginx_config_results

    - name: Assert nginx configuration files exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Nginx configuration file not found"
      loop: "{{ nginx_config_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check nginx.conf content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/nginx.conf
      register: nginx_conf_content

    - name: Assert nginx.conf contains required directives
      ansible.builtin.assert:
        that:
          - "'worker_processes' in (nginx_conf_content['content'] | b64decode)"
          - "'worker_connections' in (nginx_conf_content['content'] | b64decode)"
          - "'include /etc/nginx/sites-enabled/' in (nginx_conf_content['content'] | b64decode)"
        fail_msg: "Nginx configuration missing required directives"

    - name: Check security.conf content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/conf.d/security.conf
      register: security_conf_content

    - name: Assert security.conf contains required directives
      ansible.builtin.assert:
        that:
          - "'server_tokens off' in (security_conf_content['content'] | b64decode)"
          - "'ssl_protocols' in (security_conf_content['content'] | b64decode)"
        fail_msg: "Security configuration missing required directives"

- name: Verify site configurations
  hosts: all
  gather_facts: false
  tasks:
    - name: Check site configuration files
      ansible.builtin.stat:
        path: "{{ item_site_config }}"
      loop:
        - /tmp/molecule_test/etc/nginx/sites-available/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_site_config
      register: site_config_results

    - name: Assert site configuration files exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Site configuration file not found"
      loop: "{{ site_config_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check site symlinks
      ansible.builtin.stat:
        path: "{{ item_site_link }}"
      loop:
        - /tmp/molecule_test/etc/nginx/sites-enabled/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_site_link
      register: site_link_results

    - name: Assert site symlinks exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['islnk']
        fail_msg: "Site symlink not found"
      loop: "{{ site_link_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check site configuration content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/nginx/sites-available/{{ item_site }}"
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site
      register: site_content_results

    - name: Assert site configurations contain required directives
      ansible.builtin.assert:
        that:
          - "'server_name {{ item_result[\"item\"] }}' in (item_result['content'] | b64decode)"
          - "'ssl_certificate' in (item_result['content'] | b64decode)"
          - "'root /opt/server/' in (item_result['content'] | b64decode)"
        fail_msg: "Site configuration missing required directives"
      loop: "{{ site_content_results['results'] }}"
      loop_control:
        loop_var: item_result

- name: Verify document roots and content
  hosts: all
  gather_facts: false
  tasks:
    - name: Check document root directories
      ansible.builtin.stat:
        path: "{{ item_docroot }}"
      loop:
        - /tmp/molecule_test/opt/server/test
        - /tmp/molecule_test/opt/server/ci
        - /tmp/molecule_test/opt/server/status
      loop_control:
        loop_var: item_docroot
      register: docroot_results

    - name: Assert document root directories exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Document root directory not found"
      loop: "{{ docroot_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check index.html files
      ansible.builtin.stat:
        path: "{{ item_index }}"
      loop:
        - /tmp/molecule_test/opt/server/test/index.html
        - /tmp/molecule_test/opt/server/ci/index.html
        - /tmp/molecule_test/opt/server/status/index.html
      loop_control:
        loop_var: item_index
      register: index_results

    - name: Assert index.html files exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Index.html file not found"
      loop: "{{ index_results['results'] }}"
      loop_control:
        loop_var: item_result

- name: Verify SSL certificates
  hosts: all
  gather_facts: false
  tasks:
    - name: Check SSL certificates
      ansible.builtin.stat:
        path: "{{ item_cert }}"
      loop:
        - /tmp/molecule_test/etc/ssl/certs/test.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/certs/ci.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_cert
      register: cert_results

    - name: Assert SSL certificates exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "SSL certificate not found"
      loop: "{{ cert_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check SSL private keys
      ansible.builtin.stat:
        path: "{{ item_key }}"
      loop:
        - /tmp/molecule_test/etc/ssl/private/test.cluster.local.key
        - /tmp/molecule_test/etc/ssl/private/ci.cluster.local.key
        - /tmp/molecule_test/etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: key_results

    - name: Assert SSL private keys exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "SSL private key not found"
      loop: "{{ key_results['results'] }}"
      loop_control:
        loop_var: item_result

- name: Verify security configurations
  hosts: all
  gather_facts: false
  tasks:
    - name: Check fail2ban configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/fail2ban/jail.local
      register: fail2ban_config

    - name: Assert fail2ban configuration exists
      ansible.builtin.assert:
        that:
          - fail2ban_config['stat']['exists']
          - fail2ban_config['stat']['size'] > 0
        fail_msg: "Fail2ban configuration not found"

    - name: Check fail2ban configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/fail2ban/jail.local
      register: fail2ban_content

    - name: Assert fail2ban configuration contains required directives
      ansible.builtin.assert:
        that:
          - "'bantime' in (fail2ban_content['content'] | b64decode)"
          - "'maxretry' in (fail2ban_content['content'] | b64decode)"
          - "'enabled = true' in (fail2ban_content['content'] | b64decode)"
        fail_msg: "Fail2ban configuration missing required directives"

    - name: Check sysctl security configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-security.conf
      register: sysctl_config

    - name: Assert sysctl security configuration exists
      ansible.builtin.assert:
        that:
          - sysctl_config['stat']['exists']
          - sysctl_config['stat']['size'] > 0
        fail_msg: "Sysctl security configuration not found"

    - name: Check sysctl security configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-security.conf
      register: sysctl_content

    - name: Assert sysctl security configuration contains required directives
      ansible.builtin.assert:
        that:
          - "'net.ipv4.conf.all.rp_filter' in (sysctl_content['content'] | b64decode)"
          - "'net.ipv4.tcp_syncookies' in (sysctl_content['content'] | b64decode)"
          - "'net.ipv4.conf.all.accept_redirects' in (sysctl_content['content'] | b64decode)"
        fail_msg: "Sysctl security configuration missing required directives"

    - name: Check SSH configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_config

    - name: Assert SSH configuration exists
      ansible.builtin.assert:
        that:
          - ssh_config['stat']['exists']
          - ssh_config['stat']['size'] > 0
        fail_msg: "SSH configuration not found"

    - name: Check SSH configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_content

    - name: Assert SSH configuration contains required directives
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (ssh_content['content'] | b64decode)"
          - "'PasswordAuthentication no' in (ssh_content['content'] | b64decode)"
        fail_msg: "SSH configuration missing required directives"

- name: Verify service checks (skipped in container)
  hosts: all
  gather_facts: false
  tasks:
    - name: Check nginx service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert nginx service is running
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service']['state'] == 'running'"
        fail_msg: "Nginx service is not running"
      tags: molecule-notest

    - name: Check fail2ban service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert fail2ban service is running
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - "ansible_facts.services['fail2ban.service']['state'] == 'running'"
        fail_msg: "Fail2ban service is not running"
      tags: molecule-notest

    - name: Check ports are listening
      ansible.builtin.wait_for:
        port: "{{ item_port }}"
        state: started
        timeout: 5
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_port
      tags: molecule-notest