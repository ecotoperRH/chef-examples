---
controller_credentials:
  - name: PostgreSQL Application Database - fastapi_tutorial
    description: Credentials and connection settings used by the FastAPI application to authenticate to its PostgreSQL database.
    organization: Default
    credential_type: PostgreSQL Application Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      database_name: "{{ database_name }}"
      database_host: "{{ database_host }}"
      database_port: "{{ database_port }}"
