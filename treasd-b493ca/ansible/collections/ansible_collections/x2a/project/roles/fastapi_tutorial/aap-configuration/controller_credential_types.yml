---
controller_credential_types:
  - name: PostgreSQL Application Database
    description: Credentials and connection settings used by the FastAPI application to authenticate to its PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL application role.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname or address of the PostgreSQL server.
        - id: database_port
          type: string
          label: Database Port
          help_text: Port used to connect to PostgreSQL; the plan implies the default port 5432.
      required:
        - db_username
        - db_password
        - database_name
        - database_host
        - database_port
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
        database_port: !unsafe "{{ database_port }}"
