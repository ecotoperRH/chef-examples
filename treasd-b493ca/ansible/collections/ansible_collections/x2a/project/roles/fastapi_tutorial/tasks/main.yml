---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize FastAPI tutorial repository # noqa: R104 - repository URL is an HTTPS role default controlled by the operator; noqa: R106 - repository source is an HTTPS role default controlled by the operator
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}" # noqa: R106 - repository source is an HTTPS role default controlled by the operator
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - destination is a role default controlled by the operator
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command path comes from a role default controlled by the operator
  ansible.builtin.command:
    cmd: python3 -m venv {{ fastapi_tutorial_venv_dir }}
    creates: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path is a role default controlled by the operator

- name: Install Python dependencies # noqa: R113 - requirements path comes from a role default controlled by the operator
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_venv_dir }}"
    virtualenv_command: python3 -m venv

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create PostgreSQL role and database # noqa: L039 - credential and database variables are supplied by the attached AAP credential and validated by the preceding task
  ansible.builtin.shell: # noqa: R101 - command arguments use validated credential variables required to create the configured database
    cmd: |
      psql -c "DO $BODY$ BEGIN
      IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '{{ db_username }}') THEN
        CREATE ROLE {{ db_username }} LOGIN PASSWORD '{{ db_password }}';
      ELSE
        ALTER ROLE {{ db_username }} WITH LOGIN PASSWORD '{{ db_password }}';
      END IF;
      END $BODY$;"
      psql -tc "SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'" | grep -q 1 || \
        createdb -O {{ db_username }} {{ database_name }}
      psql -d {{ database_name }} -c "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ db_username }};"
    executable: /bin/bash
  become: true # noqa: R108 - PostgreSQL role and database administration requires execution as the postgres user
  become_user: postgres
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write application environment file # noqa: L039 - credential and database variables are supplied by the attached AAP credential and validated by the preceding task
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="{{ fastapi_tutorial_project_name }}"
      API_VERSION={{ fastapi_tutorial_api_version }}
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ database_host }}:{{ database_port }}/{{ database_name }}
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path is a role default controlled by the operator
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Install FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host {{ fastapi_tutorial_bind_host }} --port {{ fastapi_tutorial_bind_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - path is a role default controlled by the operator
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd manager configuration

- name: Enable and start FastAPI service
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    daemon_reload: true
    enabled: true
    state: started
