---
controller_credentials:
- name: FastAPI PostgreSQL Application Credentials - fastapi_tutorial
  description: PostgreSQL database user credentials for the FastAPI application, hardcoded
    in the Chef recipe and written to the .env file. Must be migrated to Ansible Vault.
  organization: Default
  credential_type: FastAPI PostgreSQL Application Credentials
  update_secrets: true
  inputs:
    db_username: '{{ db_username }}'
    db_password: '{{ vault_db_password }}'
    db_host: '{{ db_host }}'
    db_name: '{{ db_name }}'
    database_url: '{{ vault_database_url }}'
