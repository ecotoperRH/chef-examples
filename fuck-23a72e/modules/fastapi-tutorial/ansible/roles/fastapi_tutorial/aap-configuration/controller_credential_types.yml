---
controller_credential_types:
- name: FastAPI PostgreSQL Application Credentials
  description: PostgreSQL database user credentials for the FastAPI application, hardcoded
    in the Chef recipe and written to the .env file. Must be migrated to Ansible Vault.
  kind: cloud
  inputs:
    fields:
    - id: db_username
      type: string
      label: Database Username
      help_text: PostgreSQL username for the FastAPI application database (e.g., 'fastapi')
    - id: db_password
      type: string
      label: Database Password
      secret: true
      help_text: PostgreSQL password for the FastAPI application user. Currently hardcoded
        as 'fastapi_password' in the recipe source and written to /opt/fastapi-tutorial/.env
        (mode 0644). Must be stored in Ansible Vault.
    - id: db_host
      type: string
      label: Database Host
      help_text: Hostname or IP address of the PostgreSQL server (e.g., 'localhost')
    - id: db_name
      type: string
      label: Database Name
      help_text: Name of the PostgreSQL database for the FastAPI application (e.g.,
        'fastapi_db')
    - id: database_url
      type: string
      label: Database URL
      secret: true
      help_text: 'Full PostgreSQL connection string written to /opt/fastapi-tutorial/.env
        as DATABASE_URL. Format: postgresql://<username>:<password>@<host>/<dbname>.
        Contains embedded password and must be treated as a secret.'
    required:
    - db_username
    - db_password
    - db_name
    - database_url
  injectors:
    extra_vars:
      db_username: !unsafe '{{ db_username }}'
      db_password: !unsafe '{{ db_password }}'
      db_host: !unsafe '{{ db_host }}'
      db_name: !unsafe '{{ db_name }}'
      database_url: !unsafe '{{ database_url }}'
