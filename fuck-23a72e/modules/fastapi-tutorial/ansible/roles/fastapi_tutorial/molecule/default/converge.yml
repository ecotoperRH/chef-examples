---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:

    # ──────────────────────────────────────────────────────────────
    # 1. Create expected directory structure under /tmp/molecule_test
    # ──────────────────────────────────────────────────────────────
    - name: Create application directory tree
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/opt/fastapi-tutorial
        - /tmp/molecule_test/opt/fastapi-tutorial/venv
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/lib
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/include
        - /tmp/molecule_test/opt/fastapi-tutorial/app
        - /tmp/molecule_test/etc/systemd/system
      loop_control:
        loop_var: item_dir

    # ──────────────────────────────────────────────────────────────
    # 2. Create requirements.txt (simulates cloned repo artifact)
    # ──────────────────────────────────────────────────────────────
    - name: Create requirements.txt stub
      ansible.builtin.copy:
        content: |
          fastapi>=0.95.0
          uvicorn[standard]>=0.21.0
          sqlalchemy>=2.0.0
          psycopg2-binary>=2.9.0
          pydantic>=1.10.0
          python-dotenv>=1.0.0
        dest: /tmp/molecule_test/opt/fastapi-tutorial/requirements.txt
        mode: "0644"
        backup: true

    # ──────────────────────────────────────────────────────────────
    # 3. Create venv binary stubs (simulates virtual environment)
    # ──────────────────────────────────────────────────────────────
    - name: Create venv binary stubs
      ansible.builtin.copy:
        content: "#!/bin/sh\nexec python3 \"$@\"\n"
        dest: "{{ item_bin }}"
        mode: "0755"
        backup: true
      loop:
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin/python
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin/pip
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin/uvicorn
      loop_control:
        loop_var: item_bin

    # ──────────────────────────────────────────────────────────────
    # 4. Create .env configuration file
    # ──────────────────────────────────────────────────────────────
    - name: Create application environment file
      ansible.builtin.copy:
        content: |
          PROJECT_NAME="FastAPI Tutorial"
          API_VERSION=1.0.0
          DATABASE_URL=postgresql://fastapi:fastapi_password@localhost/fastapi_db
        dest: /tmp/molecule_test/opt/fastapi-tutorial/.env
        mode: "0640"
        backup: true

    # ──────────────────────────────────────────────────────────────
    # 5. Create systemd unit file
    # ──────────────────────────────────────────────────────────────
    - name: Create systemd unit file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=FastAPI Tutorial Service
          After=network.target postgresql.service

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/fastapi-tutorial
          Environment="PATH=/opt/fastapi-tutorial/venv/bin"
          ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
          Restart=always

          [Install]
          WantedBy=multi-user.target
        dest: /tmp/molecule_test/etc/systemd/system/fastapi-tutorial.service
        mode: "0644"
        backup: true

    # ──────────────────────────────────────────────────────────────
    # 6. Create app module stub (simulates cloned application code)
    # ──────────────────────────────────────────────────────────────
    - name: Create app module stub
      ansible.builtin.copy:
        content: |
          # FastAPI Tutorial application stub
          from fastapi import FastAPI
          app = FastAPI(title="FastAPI Tutorial")
        dest: /tmp/molecule_test/opt/fastapi-tutorial/app/main.py
        mode: "0644"
        backup: true
