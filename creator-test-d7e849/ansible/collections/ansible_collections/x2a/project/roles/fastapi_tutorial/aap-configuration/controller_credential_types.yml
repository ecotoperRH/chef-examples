---
controller_credential_types:
  - name: FastAPI PostgreSQL Database
    description: Credential for the PostgreSQL role used by the FastAPI tutorial application.
    kind: cloud
    inputs:
      fields:
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL user `fastapi`; use it for role creation and the application's DATABASE_URL.
      required:
        - db_password
    injectors:
      extra_vars:
        db_password: !unsafe "{{ db_password }}"
