---
cache_secure_logging: true
cache_memcached_package: memcached
cache_memcached_service: memcached
cache_memcached_memory_mb: 64
cache_memcached_port: 11211
cache_memcached_udp_port: 11211
cache_memcached_listen: 0.0.0.0
cache_memcached_max_connections: 1024
cache_memcached_max_object_size: 1m
cache_memcached_ulimit: 1024
cache_memcached_log_dir: /var/log/memcached
cache_memcached_run_dir: /var/run/memcached
cache_redis_version: 3.2.11
cache_redis_package_install: false
cache_redis_package_name: redis-server
cache_redis_source_url: http://download.redis.io/releases/redis-{{ cache_redis_version }}.tar.gz
cache_redis_source_checksum: ""
cache_redis_source_dir: /usr/local/src/redis-{{ cache_redis_version }}
cache_redis_bin_path: /usr/local/bin
cache_redis_user: redis
cache_redis_group: redis
cache_redis_instance_name: "6379"
cache_redis_port: 6379
cache_redis_config_dir: /etc/redis
cache_redis_config_file: /etc/redis/6379.conf
cache_redis_data_dir: /var/lib/redis
cache_redis_pid_dir: /var/run/redis/6379
cache_redis_log_dir: /var/log/redis
cache_redis_log_file: "{{ cache_redis_log_dir }}/redis-{{ cache_redis_instance_name }}.log"
cache_redis_service_name: redis@{{ cache_redis_instance_name }}
cache_redis_service_manager: systemd
cache_redis_limit_nofile: 10032
cache_redis_tcp_backlog: 511
cache_redis_bind_address:
cache_redis_protected_mode: "no"
cache_redis_timeout: 0
cache_redis_keepalive: 0
cache_redis_loglevel: notice
cache_redis_syslog_enabled: "yes"
cache_redis_syslog_facility: local0
cache_redis_databases: 16
cache_redis_save:
  - 900 1
  - 300 10
  - 60 10000
cache_redis_stop_writes_on_bgsave_error: "yes"
cache_redis_rdb_compression: "yes"
cache_redis_rdb_checksum: "yes"
cache_redis_db_filename: dump-{{ cache_redis_instance_name }}.rdb
cache_redis_replicaof:
cache_redis_replica_serve_stale_data: "yes"
cache_redis_replica_read_only: "yes"
cache_redis_repl_diskless_sync: "no"
cache_redis_repl_diskless_sync_delay: 5
cache_redis_repl_ping_replica_period: 10
cache_redis_repl_timeout: 60
cache_redis_repl_disable_tcp_nodelay: "no"
cache_redis_repl_backlog_size: 1mb
cache_redis_repl_backlog_ttl: 3600
cache_redis_replica_priority: 100
cache_redis_max_clients: 10000
cache_redis_max_memory: ""
cache_redis_max_memory_policy: volatile-lru
cache_redis_max_memory_samples: 5
cache_redis_appendonly: "no"
cache_redis_append_filename: appendonly-{{ cache_redis_instance_name }}.aof
cache_redis_append_fsync: everysec
cache_redis_no_appendfsync_on_rewrite: "no"
cache_redis_aof_rewrite_percentage: 100
cache_redis_aof_rewrite_min_size: 64mb
cache_redis_aof_load_truncated: "yes"
cache_redis_lua_time_limit: 5000
cache_redis_slowlog_log_slower_than: 10000
cache_redis_slowlog_max_len: 128
cache_redis_notify_keyspace_events: ""
cache_redis_hash_max_ziplist_entries: 512
cache_redis_hash_max_ziplist_value: 64
cache_redis_set_max_intset_entries: 512
cache_redis_zset_max_ziplist_entries: 128
cache_redis_zset_max_ziplist_value: 64
cache_redis_hll_sparse_max_bytes: 3000
cache_redis_active_rehashing: "yes"
cache_redis_client_output_buffer_limits:
  - normal 0 0 0
  - replica 256mb 64mb 60
  - pubsub 32mb 8mb 60
cache_redis_hz: 10
cache_redis_aof_rewrite_incremental_fsync: "yes"
cache_redis_required_start: $network $local_fs $remote_fs
cache_redis_required_stop: $network $local_fs $remote_fs
cache_redis_shutdown_save: false
