---
- name: Install Memcached package
  ansible.builtin.package:
    name:
      - "{{ cache_memcached_package }}"
    state: present

- name: Create Memcached log directory
  ansible.builtin.file:
    path: "{{ cache_memcached_log_dir }}" # noqa: R114 - path comes from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Memcached runtime directory
  ansible.builtin.file:
    path: "{{ cache_memcached_run_dir }}" # noqa: R114 - path comes from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Memcached service is enabled and running
  ansible.builtin.service:
    name: "{{ cache_memcached_service }}"
    state: started
    enabled: true
