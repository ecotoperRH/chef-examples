---
- name: Create Redis service group
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    state: present
    system: true

- name: Create Redis service account
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    home: "{{ cache_redis_data_dir }}" # noqa: R114 - home comes from role defaults
    system: true
    create_home: false
    state: present

- name: Create Redis instance directories
  ansible.builtin.file:
    path: "{{ item_cache_redis_provider_directory['path'] }}" # noqa: R114 - path from role-defined directory list
    state: directory
    owner: "{{ item_cache_redis_provider_directory['owner'] }}"
    group: "{{ cache_redis_group }}"
    mode: "{{ item_cache_redis_provider_directory['mode'] }}"
  loop:
    - path: "{{ cache_redis_config_dir }}"
      owner: root
      mode: "0775"
    - path: "{{ cache_redis_data_dir }}"
      owner: "{{ cache_redis_user }}"
      mode: "0775"
    - path: "{{ cache_redis_pid_dir }}"
      owner: "{{ cache_redis_user }}"
      mode: "0755"
    - path: "{{ cache_redis_log_dir }}"
      owner: "{{ cache_redis_user }}"
      mode: "0755"
  loop_control:
    loop_var: item_cache_redis_provider_directory

- name: Render Redis instance configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}" # noqa: R114 - config path comes from role defaults
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0640"
    backup: true
  no_log: "{{ cache_secure_logging }}"
