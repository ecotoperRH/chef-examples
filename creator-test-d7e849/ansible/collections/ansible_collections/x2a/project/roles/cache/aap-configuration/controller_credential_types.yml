---
controller_credential_types:
  - name: Redis Client Authentication
    description: Credential for the Redis instance on port 6379.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password configured as Redis requirepass for Redis instance 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
