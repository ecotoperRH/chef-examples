---
nginx_multisite_sites:
  test.cluster.local:
    document_root: /opt/server/test
    ssl_enabled: true
  ci.cluster.local:
    document_root: /opt/server/ci
    ssl_enabled: true
  status.cluster.local:
    document_root: /opt/server/status
    ssl_enabled: true
nginx_multisite_certificate_path: /etc/ssl/certs
nginx_multisite_private_key_path: /etc/ssl/private
nginx_multisite_fail2ban_enabled: true
nginx_multisite_ufw_enabled: true
nginx_multisite_disable_ssh_root: true
nginx_multisite_disable_ssh_password_auth: true
nginx_multisite_secure_logging: true
