---
argument_specs:
  main:
    short_description: Configure Nginx with multiple SSL-enabled static virtual hosts
    description:
      - Installs Nginx and security services, deploys static sites, and configures self-signed TLS.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Mapping of virtual host names to document roots and TLS settings.
        options:
          document_root:
            type: str
            required: true
            description: Absolute filesystem path serving static site content.
          ssl_enabled:
            type: bool
            required: true
            description: Whether the site uses TLS.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for generated TLS certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for generated TLS private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban is enabled for the role.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW is enabled for the role.
      nginx_multisite_disable_ssh_root:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_disable_ssh_password_auth:
        type: bool
        required: false
        default: true
        description: Whether SSH password authentication is disabled.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Controls logging suppression for tasks handling secret material.
