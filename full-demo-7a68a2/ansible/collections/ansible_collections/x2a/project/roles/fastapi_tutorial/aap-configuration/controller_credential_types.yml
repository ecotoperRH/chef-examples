---
controller_credential_types:
  - name: PostgreSQL FastAPI Application
    description: Credentials for the local FastAPI application's PostgreSQL role and connection configuration, currently hardcoded in the Chef recipe.
    kind: cloud
    inputs:
      fields:
        - id: postgresql_username
          type: string
          label: PostgreSQL Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: postgresql_password
          type: string
          label: PostgreSQL Password
          secret: true
          help_text: Password for the FastAPI PostgreSQL role.
        - id: database_url
          type: string
          label: Database URL
          secret: true
          help_text: PostgreSQL connection URL written to the FastAPI application environment file.
      required:
        - postgresql_username
        - postgresql_password
        - database_url
    injectors:
      extra_vars:
        postgresql_username: !unsafe "{{ postgresql_username }}"
        postgresql_password: !unsafe "{{ postgresql_password }}"
        database_url: !unsafe "{{ database_url }}"
