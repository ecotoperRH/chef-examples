---
- name: Install FastAPI tutorial system packages # noqa: R113 - package list is selected from trusted role OS variables
  ansible.builtin.package:
    name: "{{ fastapi_tutorial_packages }}" # noqa: R113 - package list is selected from trusted role OS variables
    state: present

- name: Create FastAPI tutorial application directory # noqa: R114 - path comes from trusted role defaults
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize FastAPI tutorial application source # noqa: R104 - repository default uses HTTPS; noqa: R106 - repository URL comes from trusted role defaults
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_git_repository }}" # noqa: R106 - repository URL comes from trusted role defaults
    dest: "{{ fastapi_tutorial_app_path }}"
    version: "{{ fastapi_tutorial_git_revision }}"
    update: true

- name: Create FastAPI tutorial virtual environment # noqa: R101 - path comes from trusted role defaults
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_app_path }}/venv"
    creates: "{{ fastapi_tutorial_app_path }}/venv/bin/python"

- name: Install FastAPI tutorial Python dependencies # noqa: R113 - requirements path is based on trusted role defaults
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt" # noqa: R113 - requirements path is based on trusted role defaults
    virtualenv: "{{ fastapi_tutorial_app_path }}/venv"
    virtualenv_command: python3 -m venv

- name: Initialize PostgreSQL database cluster on RedHat
  ansible.builtin.command:
    argv:
      - postgresql-setup
      - --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] == 'RedHat'

- name: Enable and start PostgreSQL service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_postgresql_service }}"
    enabled: true
    state: started

- name: Provision FastAPI PostgreSQL role and database # noqa: L039 - credentials are asserted by validate_credentials.yml before this task; noqa: R101 - credential values are passed as psql variables, not shell input; noqa: R108 - PostgreSQL administration requires the postgres account
  ansible.builtin.command: # noqa: R101 - credential values are passed as psql variables, not shell input
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -v
      - username={{ postgresql_username }}
      - -v
      - password={{ postgresql_password }}
      - -v
      - database_name={{ fastapi_tutorial_database_name }}
    stdin: |
      SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'username', :'password')
      WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'username') \gexec
      SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'username', :'password') \gexec
      SELECT format('CREATE DATABASE %I OWNER %I', :'database_name', :'username')
      WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'database_name') \gexec
      SELECT format('GRANT ALL PRIVILEGES ON DATABASE %I TO %I', :'database_name', :'username') \gexec
  changed_when: false
  become: true # noqa: R108 - PostgreSQL administration requires the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI tutorial environment configuration # noqa: L039 - database URL is asserted by validate_credentials.yml before this task; noqa: R114 - destination path comes from trusted role defaults
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL={{ database_url }}
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - destination path comes from trusted role defaults
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI tutorial systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target {{ fastapi_tutorial_postgresql_service }}.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_app_path }}/venv/bin"
      ExecStart={{ fastapi_tutorial_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_app_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/fastapi-tutorial.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd daemon

- name: Reload systemd before managing FastAPI tutorial service
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI tutorial service
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
