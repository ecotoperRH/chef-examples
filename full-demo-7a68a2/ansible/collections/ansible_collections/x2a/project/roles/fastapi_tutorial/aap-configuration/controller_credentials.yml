---
controller_credentials:
  - name: PostgreSQL FastAPI Application - fastapi_tutorial
    description: Credentials for the local FastAPI application's PostgreSQL role and connection configuration, currently hardcoded in the Chef recipe.
    organization: Default
    credential_type: PostgreSQL FastAPI Application
    update_secrets: true
    inputs:
      postgresql_username: "{{ postgresql_username }}"
      postgresql_password: "{{ vault_postgresql_password }}"
      database_url: "{{ vault_database_url }}"
