---
argument_specs:
  main:
    short_description: Install and secure an NGINX multisite web server
    description:
      - Installs NGINX and configures TLS-enabled static virtual hosts and host security settings.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Mapping of NGINX virtual hosts and their document roots.
        options:
          document_root:
            type: str
            required: true
            description: Absolute path to the virtual host document root.
          ssl_enabled:
            type: bool
            required: true
            description: Whether TLS is enabled for the virtual host.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory where generated TLS certificates are stored.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory where generated TLS private keys are stored.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban is enabled and configured.
      nginx_multisite_firewall_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall rules are configured on Debian-family hosts.
      nginx_multisite_disable_ssh_root_login:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_disable_ssh_password_authentication:
        type: bool
        required: false
        default: true
        description: Whether SSH password authentication is disabled.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether tasks handling generated TLS private keys suppress logging.
