---
- name: Create NGINX virtual-host directories # noqa: R114 - loop iterates over fixed role task directory values, not user input
  ansible.builtin.file:
    path: "{{ item_nginx_multisite_nginx_directory }}"
    owner: root
    group: root
    mode: "0755"
    state: directory
  loop:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
  loop_control:
    loop_var: item_nginx_multisite_nginx_directory

- name: Configure NGINX virtual hosts
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_nginx_multisite_site['key'] }} # noqa: R114 - path from role-defined sites dict, not user input
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site
  notify: Reload NGINX
  no_log: "{{ nginx_multisite_secure_logging }}"
  vars:
    server_name: "{{ item_nginx_multisite_site['key'] }}"
    document_root: "{{ item_nginx_multisite_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_nginx_multisite_site['value']['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_certificate_path }}/{{ item_nginx_multisite_site['key'] }}.crt"
    key_file: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_multisite_site['key'] }}.key"

- name: Enable NGINX virtual hosts
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_nginx_multisite_enabled_site['key'] }} # noqa: R114 - path from role-defined sites dict, not user input
    dest: /etc/nginx/sites-enabled/{{ item_nginx_multisite_enabled_site['key'] }} # noqa: R114 - path from role-defined sites dict, not user input
    state: link
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_enabled_site
  notify: Reload NGINX

- name: Remove the default NGINX site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload NGINX

- name: Enable and start NGINX
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
