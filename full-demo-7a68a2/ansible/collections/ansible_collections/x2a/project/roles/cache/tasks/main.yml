---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Memcached instance
  ansible.builtin.include_tasks: memcached.yml

- name: Configure Redis instance using the approved Redis role # noqa: L038 - approved external role is provisioned by the deployment environment and has no local dependency declaration
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_install_method: "{{ cache_redis_install_method }}"
    redis_version: "{{ cache_redis_version }}"
    redis_port: "{{ cache_redis_port }}"
    redis_requirepass: "{{ redis_6379_requirepass }}"
    redis_rdb_enabled: true
    redis_aof_enabled: false
    redis_cluster_enabled: false
    redis_sentinel_enabled: false

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_directory }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"

- name: Remove unsupported replica directives from Redis configuration
  ansible.builtin.replace:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a role default, not user input
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).* ?
    replace: ""
  notify: Restart Redis
