---
controller_credential_types:
  - name: Redis 6379 Authentication
    description: Protected credential for the Redis instance listening on port 6379.
    kind: cloud
    inputs:
      fields:
        - id: redis_6379_requirepass
          type: string
          label: Redis 6379 Requirepass
          secret: true
          help_text: Password rendered as the Redis requirepass directive and used by clients for AUTH.
      required:
        - redis_6379_requirepass
    injectors:
      extra_vars:
        redis_6379_requirepass: !unsafe "{{ redis_6379_requirepass }}"
