---
- name: Load operating system variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  when: ansible_facts['os_family'] is defined

- name: Install Memcached package
  ansible.builtin.package:
    name:
      - "{{ cache_memcached_package_name }}"
    state: present

- name: Configure Memcached command-line options
  ansible.builtin.lineinfile:
    path: "{{ cache_memcached_environment_file }}" # noqa: R114 - path is defined in trusted OS-family vars
    regexp: ^OPTIONS=
    line: >-
      OPTIONS="-m {{ cache_memcached_memory }} -p {{ cache_memcached_port }}
      -U {{ cache_memcached_udp_port }} -l {{ cache_memcached_listen }}
      -c {{ cache_memcached_maxconn }} -I {{ cache_memcached_max_object_size }}
      -n {{ cache_memcached_ulimit }}{% if cache_memcached_threads is not none %}
      -t {{ cache_memcached_threads }}{% endif %}"
    create: false
    backup: true
  when: ansible_facts['os_family'] == 'Debian'
  notify: Restart Memcached

- name: Start and enable Memcached service
  ansible.builtin.service:
    name: "{{ cache_memcached_service_name }}"
    state: started
    enabled: true
