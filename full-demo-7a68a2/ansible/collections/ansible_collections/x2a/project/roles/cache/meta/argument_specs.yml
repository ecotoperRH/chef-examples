---
argument_specs:
  main:
    short_description: Install and configure Memcached and Redis cache services
    description:
      - Deploys a Memcached service and a source-installed Redis instance with protected authentication.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Controls suppression of task output that may expose Redis credentials.
      cache_memcached_memory:
        type: int
        required: false
        default: 64
        description: Memory in megabytes allocated to Memcached.
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: TCP port on which Memcached listens.
      cache_memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: UDP port on which Memcached listens.
      cache_memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Address on which Memcached listens.
      cache_memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum number of Memcached client connections.
      cache_memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum size of a Memcached object.
      cache_memcached_threads:
        type: raw
        required: false
        default:
        description: Optional number of Memcached worker threads.
      cache_memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached file-descriptor limit.
      cache_memcached_log_directory:
        type: str
        required: false
        default: /var/log/memcached
        description: Directory used for Memcached logs.
      cache_redis_install_method:
        type: str
        required: false
        default: source
        description: Redis installation method passed to the approved Redis role.
      cache_redis_version:
        type: str
        required: false
        default: 3.2.11
        description: Redis version passed to the approved Redis role.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port of the standalone Redis instance.
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: Operating-system user that owns Redis runtime files.
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: Operating-system group that owns Redis runtime files.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Directory used for Redis logs.
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Redis configuration file whose unsupported directives are removed.
      cache_redis_data_directory:
        type: str
        required: false
        default: /var/lib/redis
        description: Redis persistence data directory.
      cache_redis_pid_directory:
        type: str
        required: false
        default: /var/run/redis/6379
        description: Redis PID directory.
      cache_redis_tcp_backlog:
        type: int
        required: false
        default: 511
        description: Redis TCP backlog setting.
      cache_redis_databases:
        type: int
        required: false
        default: 16
        description: Number of Redis logical databases.
      cache_redis_maxclients:
        type: int
        required: false
        default: 10000
        description: Maximum number of Redis client connections.
      cache_redis_rdb_save_points:
        type: list
        elements: str
        required: false
        default:
          - 900 1
          - 300 10
          - 60 10000
        description: Redis RDB persistence save points.
      cache_redis_appendfsync:
        type: str
        required: false
        default: everysec
        description: Redis AOF fsync policy.
      cache_redis_syslog_enabled:
        type: bool
        required: false
        default: true
        description: Whether Redis syslog logging is enabled.
      cache_redis_syslog_facility:
        type: str
        required: false
        default: local0
        description: Syslog facility used by Redis.
      redis_6379_requirepass:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
