---
all:
  children:
    molecule_targets:
      hosts:
        x2a_cache:
          ansible_connection: containers.podman.podman
          ansible_user: root
          ansible_podman_host: x2a_cache
          container_image: "{{ lookup('env', 'X2A_MOLECULE_IMAGE') | default('quay.io/centos/centos:stream9', true) }}"
          container_command: /usr/sbin/init
          container_privileged: true
