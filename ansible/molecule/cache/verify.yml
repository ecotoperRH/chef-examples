---
# Unsupported pre-flight checks: configuration grep commands do not state expected
# values (and the Redis password check would require exposing a secret); the
# redis ulimit grep has no stated expected result. `memcached -vv -p 11211`
# is a foreground diagnostic rather than a safe verification operation.

- name: Verify cache services and dependencies
  hosts: all
  gather_facts: false
  tasks:
    - name: Collect installed package facts for pre-flight package checks
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify gcc is installed
      ansible.builtin.assert:
        that:
          - "'gcc' in ansible_facts.packages"
        fail_msg: gcc is not installed
        success_msg: gcc is installed

    - name: Verify make is installed
      ansible.builtin.assert:
        that:
          - "'make' in ansible_facts.packages"
        fail_msg: make is not installed
        success_msg: make is installed

    - name: Verify libjemalloc-dev is installed
      ansible.builtin.assert:
        that:
          - "'libjemalloc-dev' in ansible_facts.packages"
        fail_msg: libjemalloc-dev is not installed
        success_msg: libjemalloc-dev is installed

    - name: Verify memcached is installed
      ansible.builtin.assert:
        that:
          - "'memcached' in ansible_facts.packages"
        fail_msg: memcached is not installed
        success_msg: memcached is installed

    - name: Collect service facts for Memcached and Redis status checks
      ansible.builtin.service_facts:

    - name: Verify Memcached service is active
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
          - ansible_facts.services['memcached.service'].state == 'running'
        fail_msg: Memcached service is not active
        success_msg: Memcached service is active

    - name: Verify Redis Server 1 service is active
      ansible.builtin.assert:
        that:
          - "'redis_server_1.service' in ansible_facts.services"
          - ansible_facts.services['redis_server_1.service'].state == 'running'
        fail_msg: Redis Server 1 service is not active
        success_msg: Redis Server 1 service is active

    - name: Verify Redis Server 2 service is active
      ansible.builtin.assert:
        that:
          - "'redis_server_2.service' in ansible_facts.services"
          - ansible_facts.services['redis_server_2.service'].state == 'running'
        fail_msg: Redis Server 2 service is not active
        success_msg: Redis Server 2 service is active

    - name: Verify Memcached endpoint is listening on port 11211
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 11211
        state: started
        timeout: 5

    - name: Verify Redis Server 1 endpoint is listening on port 6379
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        state: started
        timeout: 5

    - name: Verify Redis Server 2 endpoint is listening on port 6380
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6380
        state: started
        timeout: 5

    - name: Check Redis Server 1 responds to PING
      ansible.builtin.command:
        argv:
          - redis-cli
          - -p
          - '6379'
          - PING
      register: redis_server_1_ping
      changed_when: false

    - name: Verify Redis Server 1 responds with PONG
      ansible.builtin.assert:
        that:
          - redis_server_1_ping.stdout | trim == 'PONG'
        fail_msg: Redis Server 1 did not respond with PONG
        success_msg: Redis Server 1 responded with PONG

    - name: Check Redis Server 2 responds to PING
      ansible.builtin.command:
        argv:
          - redis-cli
          - -p
          - '6380'
          - PING
      register: redis_server_2_ping
      changed_when: false

    - name: Verify Redis Server 2 responds with PONG
      ansible.builtin.assert:
        that:
          - redis_server_2_ping.stdout | trim == 'PONG'
        fail_msg: Redis Server 2 did not respond with PONG
        success_msg: Redis Server 2 responded with PONG
