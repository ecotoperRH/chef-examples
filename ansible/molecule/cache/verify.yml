# Unsupported pre-flight checks: Redis requirepass checks require a secret value that must not be embedded here;
# `memcached -vv -p 11211` is a foreground diagnostic and is not safe for a verification play.
---
- name: Verify cache prerequisites and services
  hosts: all
  gather_facts: true
  tasks:
    - name: Collect installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify required packages are installed
      ansible.builtin.assert:
        that:
          - item_ in ansible_facts.packages
          - ansible_facts.packages[item_] | length > 0
        fail_msg: "Required package is not installed: {{ item_ }}"
      loop:
        - gcc
        - make
        - libjemalloc-dev
        - memcached
      loop_control:
        loop_var: item_

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Verify cache services are running
      ansible.builtin.assert:
        that:
          - item_ + '.service' in ansible_facts.services
          - ansible_facts.services[item_ + '.service'].state == 'running'
        fail_msg: "Cache service is not running: {{ item_ }}"
      loop:
        - memcached
        - redis_server_1
        - redis_server_2
      loop_control:
        loop_var: item_

    - name: Verify cache service endpoints are reachable
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_['port'] }}"
        state: started
        timeout: 5
      loop:
        - name: memcached
          port: 11211
        - name: redis_server_1
          port: 6379
        - name: redis_server_2
          port: 6380
      loop_control:
        loop_var: item_

    - name: Read Memcached configuration
      ansible.builtin.slurp:
        src: /etc/memcached.conf
      register: memcached_config

    - name: Verify Memcached configuration flags
      ansible.builtin.assert:
        that:
          - memcached_config.content | b64decode is search('(?m)^-m\\s+64(?:\\s|$)')
          - memcached_config.content | b64decode is search('(?m)^-c\\s+1024(?:\\s|$)')
          - memcached_config.content | b64decode is search('(?m)^-u\\s+memcache(?:\\s|$)')
        fail_msg: Memcached configuration does not contain the expected flags.

    - name: Read Redis ulimit configuration
      ansible.builtin.slurp:
        src: /etc/security/limits.d/redis.conf
      register: redis_ulimit_config

    - name: Verify Redis ulimit configuration mentions Redis
      ansible.builtin.assert:
        that:
          - redis_ulimit_config.content | b64decode is search('(?i)redis')
        fail_msg: Redis ulimit configuration does not mention redis.

    - name: Verify Redis Server 1 responds to PING
      ansible.builtin.command:
        argv:
          - redis-cli
          - -p
          - '6379'
          - PING
      register: redis_server_1_ping
      changed_when: false

    - name: Assert Redis Server 1 PING result
      ansible.builtin.assert:
        that:
          - redis_server_1_ping.rc == 0
          - redis_server_1_ping.stdout | trim == 'PONG'
        fail_msg: Redis Server 1 did not respond successfully to PING.

    - name: Verify Redis Server 2 responds to PING
      ansible.builtin.command:
        argv:
          - redis-cli
          - -p
          - '6380'
          - PING
      register: redis_server_2_ping
      changed_when: false

    - name: Assert Redis Server 2 PING result
      ansible.builtin.assert:
        that:
          - redis_server_2_ping.rc == 0
          - redis_server_2_ping.stdout | trim == 'PONG'
        fail_msg: Redis Server 2 did not respond successfully to PING.
