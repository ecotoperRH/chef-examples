---
dependency:
  name: galaxy
  options:
    requirements-file: molecule/requirements.yml
  env:
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/collections

driver:
  name: podman

platforms:
  - name: x2a_nginx_multisite
    image: ${X2A_MOLECULE_IMAGE:-registry.access.redhat.com/ubi9/ubi-init:latest}
    command: /sbin/init
    systemd: always
    privileged: true

provisioner:
  name: ansible

ansible:
  executor:
    backend: ansible-playbook
  env:
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/collections
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
