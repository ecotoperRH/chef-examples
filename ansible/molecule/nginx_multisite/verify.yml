---
# Unsupported pre-flight diagnostics without a stated expected outcome: rendered
# configuration content, certificate subject/dates, HTTP response headers, service
# logs, effective listen addresses, sysctl output, and nginx log locations.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify required packages are installed
      ansible.builtin.assert:
        that:
          - "item_package in ansible_facts.packages"
        fail_msg: "Required package is not installed"
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify fail2ban is enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts.services['fail2ban.service'].state == 'running'"
          - "ansible_facts.services['fail2ban.service'].status == 'enabled'"
        fail_msg: "fail2ban is not enabled and active"

    - name: Verify nginx is enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts.services['nginx.service'].state == 'running'"
          - "ansible_facts.services['nginx.service'].status == 'enabled'"
        fail_msg: "nginx is not enabled and active"

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
        changed_when: false

    - name: Check required files and directories
      ansible.builtin.stat:
        path: "{{ item_path }}"
      loop:
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /opt/server/test
        - /opt/server/test/index.html
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /opt/server/status
        - /opt/server/status/index.html
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_path
      register: required_paths

    - name: Assert required files and directories exist
      ansible.builtin.assert:
        that:
          - item_path.stat.exists
          - (item_path.stat.isdir if item_path.item in ['/opt/server/test', '/opt/server/ci', '/opt/server/status'] else item_path.stat.isreg)
        fail_msg: "Required path is missing or has the wrong type"
      loop: "{{ required_paths.results }}"
      loop_control:
        loop_var: item_path

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_site }}"
        follow: false
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_site
      register: enabled_site_links

    - name: Verify enabled site links are symbolic links
      ansible.builtin.assert:
        that:
          - item_link.stat.islnk
        fail_msg: "Enabled site is not a symbolic link"
      loop: "{{ enabled_site_links.results }}"
      loop_control:
        loop_var: item_link

    - name: Verify the default site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert the default site is absent
      ansible.builtin.assert:
        that:
          - not default_site.stat.exists
        fail_msg: "The default nginx site is present"

    - name: Check TLS private key metadata
      ansible.builtin.stat:
        path: "{{ item_key }}"
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: tls_key_stats

    - name: Verify TLS key ownership and permissions
      ansible.builtin.assert:
        that:
          - item_key.stat.pw_name == 'root'
          - item_key.stat.gr_name == 'ssl-cert'
          - item_key.stat.mode == '0640'
        fail_msg: "TLS private key metadata is incorrect"
      loop: "{{ tls_key_stats.results }}"
      loop_control:
        loop_var: item_key

    - name: Check SSH hardening settings
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config

    - name: Verify SSH hardening settings
      ansible.builtin.assert:
        that:
          - (sshd_config.content | b64decode) is search('(?m)^\\s*PermitRootLogin\\s+no\\s*$')
          - (sshd_config.content | b64decode) is search('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')
        fail_msg: "SSH hardening settings are not present"

    - name: Check firewall policy
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
        changed_when: false
      register: firewall_status

    - name: Verify firewall policy and allowed services
      ansible.builtin.assert:
        that:
          - firewall_status.stdout is search('(?i)Default: deny \(incoming\)')
          - firewall_status.stdout is search('(?im)^80/tcp') or firewall_status.stdout is search('(?im)ALLOW.*80')
          - firewall_status.stdout is search('(?im)^443/tcp') or firewall_status.stdout is search('(?im)ALLOW.*443')
          - firewall_status.stdout is search('(?im)22/tcp') or firewall_status.stdout is search('(?im)ALLOW.*22')
        fail_msg: "Firewall policy does not deny incoming traffic or allow SSH, HTTP, and HTTPS"
