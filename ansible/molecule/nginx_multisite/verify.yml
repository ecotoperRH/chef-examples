# Unsupported pre-flight checks: configuration/log content dumps and greps without stated
# expected output, certificate subject/date inspection, curl response checks, sysctl
# output, listening-port diagnostics, and journal/log review have no explicit expected
# outcome suitable for a verification assertion.
---
- name: Verify nginx_multisite
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed package facts for the required packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts.packages
        fail_msg: "Required package is not installed: {{ item_package }}"
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert required services are enabled and active
      ansible.builtin.assert:
        that:
          - item_service + '.service' in ansible_facts.services
          - ansible_facts.services[item_service + '.service'].status == 'enabled'
          - ansible_facts.services[item_service + '.service'].state == 'running'
        fail_msg: "Service is not enabled and active: {{ item_service }}"
      loop:
        - fail2ban
        - nginx
      loop_control:
        loop_var: item_service

    - name: Validate the nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
        chdir: /
      register: nginx_test
      changed_when: false
      failed_when: false

    - name: Assert nginx configuration validation succeeds
      ansible.builtin.assert:
        that:
          - nginx_test.rc == 0
        fail_msg: "nginx -t did not succeed"

    - name: Check required configuration files
      ansible.builtin.stat:
        path: "{{ item_file }}"
      register: configuration_files
      loop:
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_file

    - name: Assert required configuration files exist
      ansible.builtin.assert:
        that:
          - item_result.stat.exists
          - item_result.stat.isreg
        fail_msg: "Required configuration file is missing: {{ item_result.item }}"
      loop: "{{ configuration_files.results }}"
      loop_control:
        loop_var: item_result

    - name: Check document roots and index files
      ansible.builtin.stat:
        path: "{{ item_path }}"
      register: document_files
      loop:
        - /opt/server/test
        - /opt/server/test/index.html
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /opt/server/status
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_path

    - name: Assert document roots and index files exist
      ansible.builtin.assert:
        that:
          - item_result.stat.exists
          - (item_result.stat.isdir if item_result.item in ['/opt/server/test', '/opt/server/ci', '/opt/server/status'] else item_result.stat.isreg)
        fail_msg: "Required document path is missing or has the wrong type: {{ item_result.item }}"
      loop: "{{ document_files.results }}"
      loop_control:
        loop_var: item_result

    - name: Check TLS certificates and private keys exist
      ansible.builtin.stat:
        path: "{{ item_path }}"
      register: tls_files
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_path

    - name: Assert TLS certificates and private keys exist
      ansible.builtin.assert:
        that:
          - item_result.stat.exists
          - item_result.stat.isreg
        fail_msg: "Required TLS file is missing: {{ item_result.item }}"
      loop: "{{ tls_files.results }}"
      loop_control:
        loop_var: item_result

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_link }}"
        follow: false
      register: site_links
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_link

    - name: Assert enabled site links exist as symbolic links
      ansible.builtin.assert:
        that:
          - item_result.stat.exists
          - item_result.stat.islnk
        fail_msg: "Enabled site link is missing or is not a symlink: {{ item_result.item }}"
      loop: "{{ site_links.results }}"
      loop_control:
        loop_var: item_result

    - name: Check that the default site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert that the default site is absent
      ansible.builtin.assert:
        that:
          - not default_site.stat.exists
        fail_msg: "The default nginx site is still present"

    - name: Check TLS private-key ownership and permissions
      ansible.builtin.stat:
        path: "{{ item_key }}"
      register: private_key_stats
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key

    - name: Assert TLS private-key ownership and permissions
      ansible.builtin.assert:
        that:
          - item_result.stat.pw_name == 'root'
          - item_result.stat.gr_name == 'ssl-cert'
          - item_result.stat.mode == '0640'
        fail_msg: "TLS private-key ownership or permissions are incorrect: {{ item_result.item }}"
      loop: "{{ private_key_stats.results }}"
      loop_control:
        loop_var: item_result

    - name: Check that the ssl-cert group exists
      ansible.builtin.getent:
        database: group
        key: ssl-cert

    - name: Assert that the ssl-cert group exists
      ansible.builtin.assert:
        that:
          - "'ssl-cert' in ansible_facts.getent_group"
        fail_msg: "The ssl-cert group does not exist"

    - name: Read SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config

    - name: Assert SSH hardening settings
      ansible.builtin.assert:
        that:
          - (sshd_config.content | b64decode) is search('(?m)^\\s*PermitRootLogin\\s+no\\s*$')
          - (sshd_config.content | b64decode) is search('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')
        fail_msg: "SSH hardening settings are not present"

    - name: Check firewall policy and allowed services
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: ufw_status
      changed_when: false
      failed_when: false

    - name: Assert firewall policy and allowed services
      ansible.builtin.assert:
        that:
          - ufw_status.rc == 0
          - ufw_status.stdout is search('(?im)Default:\s+deny\s+\(incoming\)')
          - ufw_status.stdout is search('(?im)(22/tcp|ssh|openssh).*ALLOW')
          - ufw_status.stdout is search('(?im)(80/tcp|http).*ALLOW')
          - ufw_status.stdout is search('(?im)(443/tcp|https).*ALLOW')
        fail_msg: "UFW does not have the expected default policy and allowed services"
