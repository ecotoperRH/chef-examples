---
argument_specs:
  main:
    short_description: Install and configure a secure Nginx multisite deployment
    description:
      - Installs Nginx, Fail2ban, UFW, OpenSSL, and CA certificates.
      - Configures three HTTPS virtual hosts with local self-signed certificates and security hardening.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Mapping of site names to document roots and TLS settings.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory where site certificates are stored.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory where site private keys are stored.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure Fail2ban.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure and enable UFW.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login.
      nginx_multisite_password_authentication:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is permitted.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide generated TLS private-key command output by default.
      nginx_multisite_ssl_certificate_days:
        type: int
        required: false
        default: 365
        description: Validity period for generated self-signed certificates.
      nginx_multisite_ssl_renew:
        type: bool
        required: false
        default: false
        description: Explicitly allow certificate regeneration for renewal.
