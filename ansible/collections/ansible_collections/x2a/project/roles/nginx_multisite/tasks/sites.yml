---
- name: Deploy Nginx site configuration for each site  # noqa: R114 - dest path from role-defined sites dict
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_site['key'] }}
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: reload nginx

- name: Enable Nginx site by creating symlink
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_site['key'] }}
    dest: /etc/nginx/sites-enabled/{{ item_site['key'] }}  # noqa: R114 - path from role-defined sites dict, not user input
    state: link
    # noqa: L021 - mode not applicable for symlink
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: reload nginx

- name: Remove default Nginx site symlink if present
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
    # noqa: L021 - mode not applicable for file removal
  notify: reload nginx
