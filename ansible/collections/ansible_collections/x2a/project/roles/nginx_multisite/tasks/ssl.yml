---
- name: Install TLS packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_certificate_path }}" # noqa: R114 - path is a trusted role default
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}" # noqa: R114 - path is a trusted role default
    owner: root
    group: ssl-cert
    mode: "0710"
    state: directory

- name: Generate initial self-signed TLS certificates  # noqa: R101 - command uses trusted role defaults and role-defined site names
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "{{ nginx_multisite_ssl_certificate_days }}"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx_multisite_private_key_path }}/{{ item_nginx_ssl['key'] }}.key"
      - -out
      - "{{ nginx_multisite_certificate_path }}/{{ item_nginx_ssl['key'] }}.crt"
      - -subj
      - /C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_nginx_ssl['key'] }}/emailAddress=admin@example.com
  when: item_nginx_ssl['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_ssl
  notify: Validate and reload nginx
  no_log: "{{ nginx_multisite_secure_logging }}"
  changed_when: false
  args:
    creates: "{{ nginx_multisite_certificate_path }}/{{ item_nginx_ssl['key'] }}.crt"

- name: Set private key ownership and permissions
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_key['key'] }}.key" # noqa: R114 - path from role-defined sites dictionary
    owner: root
    group: ssl-cert
    mode: "0640"
    state: file
  when: item_nginx_key['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_key
  no_log: "{{ nginx_multisite_secure_logging }}"
