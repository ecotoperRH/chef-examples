---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Ensure fail2ban is enabled and started
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started

- name: Deploy fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Set UFW default incoming policy
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if ! ufw status verbose | grep -q 'Default: deny (incoming)'; then
        ufw --force default deny
      fi
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false
  args:
    executable: /bin/sh

- name: Allow SSH through UFW
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if ! ufw status | grep -qE '(^|[[:space:]])22(/tcp)?[[:space:]].*ALLOW'; then
        ufw allow ssh
      fi
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false
  args:
    executable: /bin/sh

- name: Allow HTTP through UFW
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if ! ufw status | grep -qE '(^|[[:space:]])80(/tcp)?[[:space:]].*ALLOW'; then
        ufw allow http
      fi
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false
  args:
    executable: /bin/sh

- name: Allow HTTPS through UFW
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if ! ufw status | grep -qE '(^|[[:space:]])443(/tcp)?[[:space:]].*ALLOW'; then
        ufw allow https
      fi
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false
  args:
    executable: /bin/sh

- name: Enable UFW
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if ! ufw status | grep -q '^Status: active'; then
        ufw --force enable
      fi
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false
  args:
    executable: /bin/sh

- name: Deploy kernel security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx multisite sysctl

- name: Disable SSH root login # noqa: L068 - lineinfile performs an exact targeted replacement without rewriting unrelated sshd configuration
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    state: present
    create: false
    backup: true
    mode: "0644"
  when: nginx_multisite_ssh_disable_root | bool
  notify: Restart SSH

- name: Disable SSH password authentication # noqa: L068 - lineinfile performs an exact targeted replacement without rewriting unrelated sshd configuration
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    state: present
    create: false
    backup: true
    mode: "0644"
  when: not nginx_multisite_ssh_password_auth | bool
  notify: Restart SSH
