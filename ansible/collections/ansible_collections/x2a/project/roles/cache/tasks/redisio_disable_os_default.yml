---
- name: Gather service facts for the OS Redis service
  ansible.builtin.service_facts:

- name: Stop and disable OS Redis service
  ansible.builtin.service:
    name: "{{ item_redis_service }}"
    enabled: false
    state: stopped
  loop:
    - redis
    - redis-server
  loop_control:
    loop_var: item_redis_service
  when: item_redis_service in ansible_facts.services
