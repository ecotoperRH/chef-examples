---
- name: Install Redis via package manager
  ansible.builtin.package:
    name: "{{ redisio_package_name }}"
    state: present
  when: redisio_package_install | bool

- name: Include Redis install prerequisites
  ansible.builtin.import_tasks: redis_install_prereqs.yml
  when: not (redisio_package_install | bool)

- name: Ensure build-essential packages are installed
  ansible.builtin.package:
    name:
      - gcc
      - make
      - libjemalloc-dev
    state: present
  when: not (redisio_package_install | bool)

- name: Download Redis source archive # noqa: R104,R106 - internal mirror uses HTTP and templated source acceptable
  ansible.builtin.get_url: # noqa: R104,R106 - internal mirror uses HTTP and templated source acceptable
    url: "{{ redisio_mirror }}/{{ redisio_base_name }}{{ redisio_version }}{{ redisio_artifact_type }}"
    dest: "/tmp/{{ redisio_base_name }}{{ redisio_version }}{{ redisio_artifact_type }}"
    mode: "0644"
  when: not (redisio_package_install | bool)

- name: Extract Redis source archive  # noqa: L021 - unarchive module does not support mode, acceptable
  ansible.builtin.unarchive:
    src: "/tmp/{{ redisio_base_name }}{{ redisio_version }}{{ redisio_artifact_type }}"
    dest: "{{ redisio_install_dir | default('/opt/redis') }}"
    remote_src: true
  when: not (redisio_package_install | bool)

- name: Build and install Redis from source
  ansible.builtin.command:
    cmd: "make && make install"
    chdir: "{{ redisio_install_dir | default('/opt/redis') }}/{{ redisio_base_name }}{{ redisio_version }}"
    creates: "/usr/local/bin/redis-server"
  # changed_when not required due to creates parameter
  when: not (redisio_package_install | bool)

- name: Include Redis ulimit configuration
  ansible.builtin.import_tasks: redis_ulimit.yml