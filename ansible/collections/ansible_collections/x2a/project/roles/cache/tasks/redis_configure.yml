---
- name: Ensure /etc/redis directory exists
  ansible.builtin.file:
    path: /etc/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Deploy Redis configuration files
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/{{ item_redis['key'] }}.conf # noqa: R114 - path from role-defined redis_instances dict, trusted
    mode: "0644"
    backup: true
  loop: "{{ redis_instances | dict2items }}"
  loop_control:
    loop_var: item_redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_password: "{{ redis_password }}"
