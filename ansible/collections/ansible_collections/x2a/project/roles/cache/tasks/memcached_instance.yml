---
- name: Install Memcached package
  ansible.builtin.package:
    name: "{{ cache_memcached_package }}"
    state: present

- name: Render Memcached instance configuration
  ansible.builtin.template:
    src: memcached.conf.j2
    dest: "{{ cache_memcached_config }}" # noqa: R114 - path is a trusted role default
    mode: "0644"
    backup: true
  notify: Restart memcached
