---
- name: Stop and disable default Redis service on Debian
  ansible.builtin.service:
    name: redis-server
    state: stopped
    enabled: false
  when: ansible_facts['os_family'] == 'Debian'

- name: Stop and disable default Redis service on RedHat/Fedora
  ansible.builtin.service:
    name: redis
    state: stopped
    enabled: false
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']
