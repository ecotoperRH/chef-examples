---
- name: Install Memcached
  ansible.builtin.package:
    name: "{{ cache_memcached_package }}"
    state: present

- name: Render Memcached configuration
  ansible.builtin.template:
    src: memcached.conf.j2
    dest: "{{ cache_memcached_config }}" # noqa: R114 - destination is a role default path
    mode: "0644"
    backup: true
  notify: Restart memcached

- name: Enable and start Memcached
  ansible.builtin.service:
    name: "{{ cache_memcached_service }}"
    enabled: true
    state: started
