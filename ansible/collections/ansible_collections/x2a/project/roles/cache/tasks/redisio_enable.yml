---
- name: Ensure Redis service units exist
  ansible.builtin.template:
    src: redis-instance.service.j2
    dest: /etc/systemd/system/{{ item_redis_service.name }}.service # noqa: R114 - service name comes from role-defined redis_servers
    mode: "0644"
    backup: true
  loop: "{{ redis_servers }}"
  loop_control:
    loop_var: item_redis_service
  notify: Reload systemd

- name: Enable and start Redis instances
  ansible.builtin.service:
    name: "{{ item_redis_service.name }}"
    state: started
    enabled: true
  loop: "{{ redis_servers }}"
  loop_control:
    loop_var: item_redis_service
