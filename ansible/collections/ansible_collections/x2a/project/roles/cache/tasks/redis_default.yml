---
- name: Update apt cache if package installation is required
  ansible.builtin.apt:
    update_cache: true
    state: present  # noqa: L044 - state set explicitly for clarity
  when: not redisio_package_install | bool

- name: Install prerequisite packages for Redis
  ansible.builtin.import_tasks: redis_install_prereqs.yml
  when: not redisio_package_install | bool

- name: Install build-essential package
  ansible.builtin.package:
    name: build-essential
    state: present
  when: not redisio_package_install | bool

- name: Install Redis (custom install tasks)  # noqa: L039 - variable defined in role defaults
  ansible.builtin.import_tasks: redis_install.yml
  when: not redisio_bypass_setup | bool

- name: Disable OS default Redis service  # noqa: L039 - variable defined in role defaults
  ansible.builtin.import_tasks: redis_disable_os_default.yml
  when: not redisio_bypass_setup | bool

- name: Configure Redis instances  # noqa: L039 - variable defined in role defaults
  ansible.builtin.import_tasks: redis_configure.yml
  when: not redisio_bypass_setup | bool
