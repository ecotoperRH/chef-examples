---
- name: Ensure Redis limits directory exists
  ansible.builtin.file:
    path: /etc/security/limits.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render Redis user limits
  ansible.builtin.template:
    src: redis_ulimit.conf.j2
    dest: /etc/security/limits.d/redis.conf
    mode: "0644"
    backup: true
  vars:
    redis_user: "{{ cache_redis_user }}"
    redis_ulimit_nofile: "{{ cache_redis_ulimit_nofile }}"
