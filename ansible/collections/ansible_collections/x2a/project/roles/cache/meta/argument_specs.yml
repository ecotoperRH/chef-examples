---
argument_specs:
  main:
    short_description: Migrated cache role handling Memcached and Redis services
    description:
      - This role installs and configures Memcached and Redis cache services, supporting package or source installation for Redis, ulimit configuration, and 
        secure handling of Redis passwords.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Toggle to enable no_log on tasks handling secrets.
      redisio_package_install:
        type: bool
        required: false
        default: false
        description: Whether to install Redis via package manager instead of building from source.
      redisio_package_name:
        type: str
        required: false
        default: redis
        description: Name of the Redis package when using package installation.
      redisio_version:
        type: str
        required: false
        default: 6.2.6
        description: Redis version to download and build from source.
      redisio_mirror:
        type: str
        required: false
        default: http://download.redis.io
        description: Base URL for downloading Redis source archives.
      redisio_base_name:
        type: str
        required: false
        default: redis-
        description: Prefix for Redis source archive filenames.
      redisio_artifact_type:
        type: str
        required: false
        default: tar.gz
        description: File extension for Redis source archive.
      redisio_install_dir:
        type: str
        required: false
        default: /opt/redis
        description: Directory where Redis will be installed when building from source.
      redisio_download_dir:
        type: str
        required: false
        default: /tmp
        description: Temporary directory for downloading Redis source archives.
      cache_ulimit_users:
        type: dict
        required: false
        default: {}
        description: Mapping of Redis users to ulimit attributes.
      redis_password:
        type: str
        required: false
        default: ""
        description: Redis password (secret) injected via AAP credential.
