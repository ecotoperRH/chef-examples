---
controller_credential_types:
  - name: Encrypted Data Bag Redis Password
    description: Credential type for Encrypted Data Bag Redis Password
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password used for Redis requirepass directive
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
