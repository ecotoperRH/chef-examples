---
controller_credential_types:
  - name: Redis Cache Password
    description: Password used to authenticate clients to the configured Redis instances.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required by Redis clients to authenticate to the configured Redis servers.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
