---
- name: Install TLS packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create TLS private key group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create TLS certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_certificate_path }}" # noqa: R114 - path is from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create TLS private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}" # noqa: R114 - path is from role defaults
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Check for existing TLS certificates
  ansible.builtin.stat:
    path: "{{ nginx_multisite_certificate_path }}/{{ item_nginx_multisite['key'] }}.crt" # noqa: R114 - paths from role-defined sites dict
  when: item_nginx_multisite['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
  register: nginx_multisite_certificate_stats

- name: Check for existing TLS private keys
  ansible.builtin.stat:
    path: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_multisite['key'] }}.key" # noqa: R114 - paths from role-defined sites dict
  when: item_nginx_multisite['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
  register: nginx_multisite_private_key_stats

- name: Generate development self-signed TLS certificates # noqa: R101 - command paths are from role defaults and role-defined sites, not user input
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx_multisite_private_key_path }}/{{ item_nginx_multisite['key'] }}.key"
      - -out
      - "{{ nginx_multisite_certificate_path }}/{{ item_nginx_multisite['key'] }}.crt"
      - -subj
      - "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_nginx_multisite['key'] }}/emailAddress=admin@example.com"
  when:
    - item_nginx_multisite['value']['ssl_enabled']
    - not (nginx_multisite_certificate_stats['results'][nginx_multisite_site_index]['stat']['exists'] and nginx_multisite_private_key_stats['results'][nginx_multisite_site_index]['stat']['exists']) # noqa: L039 - certificate and private-key stats are registered by the preceding stat tasks
  changed_when: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
    index_var: nginx_multisite_site_index
  notify: Reload NGINX

- name: Set TLS private key permissions
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_multisite['key'] }}.key" # noqa: R114 - path from role-defined sites dict
    state: file
    owner: root
    group: ssl-cert
    mode: "0640"
  when: item_nginx_multisite['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
