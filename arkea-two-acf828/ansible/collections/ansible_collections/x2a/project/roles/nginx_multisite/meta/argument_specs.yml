---
argument_specs:
  main:
    short_description: Configure NGINX with multiple SSL-enabled static virtual hosts
    description:
      - Installs NGINX and host security components, generates development TLS certificates, and publishes configurable static virtual hosts.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Mapping of virtual host names to document roots and TLS settings.
        options:
          document_root:
            type: str
            required: true
            description: Absolute path to the virtual host document root.
          ssl_enabled:
            type: bool
            required: true
            description: Whether to create and configure development TLS for the site.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory containing TLS certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory containing TLS private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Retained source setting for Fail2ban enablement.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Retained source setting for UFW enablement.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is enabled.
