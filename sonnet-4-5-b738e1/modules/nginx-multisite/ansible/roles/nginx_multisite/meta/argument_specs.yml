---
argument_specs:
  main:
    short_description: Install and configure nginx with multiple SSL-enabled virtual hosts and security hardening
    description:
      - Deploys a hardened nginx web server hosting multiple SSL-enabled virtual hosts.
      - Configures fail2ban intrusion prevention, UFW firewall rules, and kernel sysctl hardening.
      - Generates self-signed TLS certificates for each configured site.
      - Disables SSH root login and password authentication.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: >-
          Dictionary of virtual host sites to configure. Each key is the server_name (FQDN)
          and the value is a dict with document_root (str) and ssl_enabled (bool).
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory path where SSL certificates (.crt files) are stored.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory path where SSL private keys (.key files) are stored.
      nginx_multisite_ssl_country:
        type: str
        required: false
        default: US
        description: Country code (C) for self-signed certificate subject.
      nginx_multisite_ssl_state:
        type: str
        required: false
        default: Example
        description: State or province (ST) for self-signed certificate subject.
      nginx_multisite_ssl_locality:
        type: str
        required: false
        default: Example
        description: Locality or city (L) for self-signed certificate subject.
      nginx_multisite_ssl_org:
        type: str
        required: false
        default: Example Org
        description: Organization name (O) for self-signed certificate subject.
      nginx_multisite_ssl_ou:
        type: str
        required: false
        default: IT
        description: Organizational unit (OU) for self-signed certificate subject.
      nginx_multisite_ssl_email:
        type: str
        required: false
        default: admin@example.com
        description: Email address for self-signed certificate subject.
      nginx_multisite_ssl_days:
        type: int
        required: false
        default: 365
        description: Number of days the self-signed certificate is valid.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and enable fail2ban intrusion prevention.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure UFW firewall rules.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login in sshd_config.
      nginx_multisite_ssh_disable_password_auth:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH password authentication in sshd_config.
      nginx_multisite_web_user:
        type: str
        required: false
        default: www-data
        description: System user that nginx runs as and owns document root files.
      nginx_multisite_web_group:
        type: str
        required: false
        default: www-data
        description: System group that nginx runs as and owns document root files.
