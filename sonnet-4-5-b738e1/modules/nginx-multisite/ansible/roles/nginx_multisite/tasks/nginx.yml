---
- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Deploy global nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Deploy nginx security snippet
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Enable and start nginx service
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Create shared document root parent directory
  ansible.builtin.file:
    path: /opt/server
    state: directory
    owner: "{{ nginx_multisite_web_user }}"
    group: "{{ nginx_multisite_web_group }}"
    mode: "0755"

- name: Create site document root directories
  ansible.builtin.file:
    path: "{{ item_site['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dict, not user input
    state: directory
    owner: "{{ nginx_multisite_web_user }}"
    group: "{{ nginx_multisite_web_group }}"
    mode: "0755"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site

- name: Deploy static index.html files for each site
  ansible.builtin.copy:
    src: "{{ item_site['key'].split('.')[0] }}/index.html"
    dest: "{{ item_site['value']['document_root'] }}/index.html" # noqa: R114 - path from role-defined sites dict, not user input
    owner: "{{ nginx_multisite_web_user }}"
    group: "{{ nginx_multisite_web_group }}"
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
