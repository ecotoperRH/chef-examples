---
argument_specs:
  main:
    short_description: Configure Memcached and Redis caching services
    description:
      - Installs and configures Memcached (in-memory object cache) and Redis (key-value store) on a single host.
      - Memcached is deployed via a systemd unit with configurable memory, port, and connection limits.
      - Redis is compiled from source tarball (version 3.2.11 by default), configured via /etc/redis/<port>.conf, and managed via systemd.
      - The Redis authentication password is injected at runtime via the AAP credential type variable redis_password.
    options:
      cache_memcached_memory:
        type: int
        required: false
        default: 64
        description: Amount of memory in MB to allocate to Memcached.
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: TCP port Memcached listens on.
      cache_memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: UDP port Memcached listens on.
      cache_memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: IP address Memcached binds to.
      cache_memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum number of simultaneous connections for Memcached.
      cache_memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum size of a single object stored in Memcached.
      cache_memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: File descriptor ulimit for the Memcached process.
      cache_memcached_logfilepath:
        type: str
        required: false
        default: /var/log/memcached
        description: Directory path for Memcached log files.
      cache_memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: List of experimental CLI options to pass to Memcached.
      cache_memcached_extra_cli_options:
        type: list
        elements: str
        required: false
        default: []
        description: List of extra CLI options to pass to Memcached.
      cache_memcached_user:
        type: str
        required: false
        default: memcache (Debian) / memcached (RedHat)
        description: OS user account that runs the Memcached service.
      cache_memcached_group:
        type: str
        required: false
        default: memcache (Debian) / memcached (RedHat)
        description: OS group for the Memcached service user.
      cache_redis_version:
        type: str
        required: false
        default: 3.2.11
        description: Redis version to download and compile from source.
      cache_redis_mirror:
        type: str
        required: false
        default: http://download.redis.io/releases/
        description: Base URL for downloading the Redis source tarball.
      cache_redis_base_name:
        type: str
        required: false
        default: redis-
        description: Prefix of the Redis tarball filename.
      cache_redis_artifact_type:
        type: str
        required: false
        default: tar.gz
        description: Archive type of the Redis source tarball.
      cache_redis_install_dir:
        type: str
        required: false
        default: /usr/local/bin
        description: Directory where Redis binaries are installed.
      cache_redis_bin_path:
        type: str
        required: false
        default: /usr/local/bin
        description: Path to the Redis binary directory.
      cache_redis_safe_install:
        type: bool
        required: false
        default: true
        description: >-
          When true, skip Redis compilation if the binary already exists
          at cache_redis_install_dir/redis-server.
      cache_redis_port:
        type: str
        required: false
        default: "6379"
        description: TCP port the Redis instance listens on.
      cache_redis_name:
        type: str
        required: false
        default: "6379"
        description: >-
          Name identifier for the Redis instance, used in config file names,
          PID file names, and service names.
      cache_redis_configdir:
        type: str
        required: false
        default: /etc/redis
        description: Directory containing Redis configuration files.
      cache_redis_datadir:
        type: str
        required: false
        default: /var/lib/redis
        description: Directory where Redis stores its data files.
      cache_redis_base_piddir:
        type: str
        required: false
        default: /var/run/redis
        description: Base directory for Redis PID files.
      cache_redis_piddir:
        type: str
        required: false
        default: /var/run/redis/6379
        description: Directory for the Redis instance PID file.
      cache_redis_job_control:
        type: str
        required: false
        default: systemd
        description: >-
          Service management type. One of systemd, initd, upstart, or rcinit.
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: OS user account that runs the Redis service.
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: OS group for the Redis service user.
      cache_redis_homedir:
        type: str
        required: false
        default: /var/lib/redis
        description: Home directory for the Redis service user.
      cache_redis_shell:
        type: str
        required: false
        default: /bin/false
        description: Login shell for the Redis service user.
      cache_redis_ulimit:
        type: int
        required: false
        default: 0
        description: File descriptor ulimit for the Redis process (0 = use system default).
      cache_redis_limit_nofile:
        type: int
        required: false
        default: 10032
        description: >-
          Maximum number of open file descriptors for Redis
          (typically maxclients + 32).
      cache_redis_address:
        type: str
        required: false
        default:
        description: >-
          IP address(es) Redis binds to. Null means listen on all interfaces.
          Can be a string or list of strings.
      cache_redis_tcpbacklog:
        type: str
        required: false
        default: "511"
        description: TCP listen() backlog size.
      cache_redis_timeout:
        type: str
        required: false
        default: "0"
        description: >-
          Close connection after client is idle for N seconds (0 to disable).
      cache_redis_keepalive:
        type: str
        required: false
        default: "0"
        description: TCP keepalive interval in seconds (0 to disable).
      cache_redis_loglevel:
        type: str
        required: false
        default: notice
        description: >-
          Redis log verbosity level. One of debug, verbose, notice, or warning.
      cache_redis_logfile:
        type: str
        required: false
        default:
        description: >-
          Path to the Redis log file. Null means log to syslog only
          (when syslogenabled is yes).
      cache_redis_syslogenabled:
        type: str
        required: false
        default: "yes"
        description: Whether to enable syslog logging (yes or no).
      cache_redis_syslogfacility:
        type: str
        required: false
        default: local0
        description: Syslog facility for Redis log messages.
      cache_redis_databases:
        type: str
        required: false
        default: "16"
        description: Number of Redis databases.
      cache_redis_backuptype:
        type: str
        required: false
        default: rdb
        description: >-
          Persistence backup type. One of rdb, aof, or both.
      cache_redis_save:
        type: list
        elements: str
        required: false
        default:
        description: >-
          List of RDB save points in "seconds changes" format.
          Null uses Redis defaults (900 1, 300 10, 60 10000).
      cache_redis_maxclients:
        type: int
        required: false
        default: 10000
        description: Maximum number of simultaneous Redis clients.
      cache_redis_maxmemory:
        type: str
        required: false
        default:
        description: >-
          Maximum memory Redis may use (e.g. 512mb). Null means no limit.
      cache_redis_requirepass:
        type: str
        required: false
        default:
        description: >-
          Redis authentication password. In production, use the AAP credential
          variable redis_password instead of setting this directly.
      cache_redis_clientoutputbufferlimit:
        type: list
        required: false
        default:
          - [normal, "0", "0", "0"]
          - [replica, 256mb, 64mb, "60"]
          - [pubsub, 32mb, 8mb, "60"]
        description: >-
          Client output buffer limits as a list of [class, hard, soft, seconds].
      cache_redis_clusterenabled:
        type: str
        required: false
        default: "no"
        description: Whether to enable Redis cluster mode (yes or no).
