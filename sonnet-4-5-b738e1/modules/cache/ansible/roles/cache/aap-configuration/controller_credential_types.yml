---
controller_credential_types:
  - name: Redis Authentication Password
    description: Redis instance authentication credential for the cache cookbook. Must be migrated from hardcoded plaintext to an Ansible Vault-encrypted
      variable (e.g., vault_redis_password).
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password for Redis authentication, set as the 'requirepass' directive in /etc/redis/6379.conf. All Redis clients must supply this via AUTH
            before executing commands.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
