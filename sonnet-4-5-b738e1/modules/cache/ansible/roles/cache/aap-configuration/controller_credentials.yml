---
controller_credentials:
  - name: Redis Authentication Password - cache
    description: Redis instance authentication credential for the cache cookbook. Must be migrated from hardcoded plaintext to an Ansible Vault-encrypted
      variable (e.g., vault_redis_password).
    organization: Default
    credential_type: Redis Authentication Password
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
