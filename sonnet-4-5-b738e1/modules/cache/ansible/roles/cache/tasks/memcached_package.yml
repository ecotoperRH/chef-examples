---
- name: Install memcached package
  ansible.builtin.package:
    name: memcached
    state: present

- name: Create memcached system group
  ansible.builtin.group:
    name: "{{ cache_memcached_group }}"
    system: true
    state: present

- name: Create memcached system user
  ansible.builtin.user:
    name: "{{ cache_memcached_user }}"
    system: true
    create_home: false
    home: /nonexistent
    comment: Memcached
    shell: /bin/false
    group: "{{ cache_memcached_group }}"
    password_lock: true
    state: present

- name: Create memcached log directory
  ansible.builtin.file:
    path: "{{ cache_memcached_logfilepath }}" # noqa: R114 - path from role defaults, not user input
    owner: "{{ cache_memcached_user }}"
    group: "{{ cache_memcached_group }}"
    mode: "0755"
    state: directory

- name: Create memcached run directory
  ansible.builtin.file:
    path: /var/run/memcached
    owner: "{{ cache_memcached_user }}"
    group: "{{ cache_memcached_group }}"
    mode: "0755"
    state: directory
