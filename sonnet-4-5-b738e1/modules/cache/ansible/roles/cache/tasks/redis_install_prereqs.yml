---
- name: Install Redis build prerequisites
  ansible.builtin.package:
    name:
      - tar
      - gcc
      - g++
      - make
      - binutils
      - autoconf
      - automake
      - libtool
      - m4
      - pkg-config
    state: present
  when: ansible_facts['os_family'] in ['Debian', 'RedHat']
