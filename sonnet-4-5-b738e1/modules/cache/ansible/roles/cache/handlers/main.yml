---
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart memcached
  ansible.builtin.service:
    name: memcached
    state: restarted

- name: Restart redis
  ansible.builtin.service:
    name: "{{ 'redis@' + cache_redis_name if cache_redis_job_control == 'systemd' else 'redis' + cache_redis_name }}"
    state: restarted
