---
controller_credential_types:
  - name: FastAPI PostgreSQL Database
    description: PostgreSQL credentials for the FastAPI application database user and connection string
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL application user (e.g., 'fastapi') used to own and access the fastapi_db database
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL 'fastapi' user. Hardcoded as 'fastapi_password' in the original recipe — must be replaced with an Ansible
            Vault-encrypted variable
        - id: db_name
          type: string
          label: Database Name
          help_text: Name of the PostgreSQL database (e.g., 'fastapi_db') owned by the application user
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname or IP address of the PostgreSQL server (e.g., 'localhost')
        - id: database_url
          type: string
          label: Database URL
          secret: true
          help_text: Full PostgreSQL connection URL written to /opt/fastapi-tutorial/.env (e.g., postgresql://fastapi:fastapi_password@localhost/fastapi_db).
            Contains embedded credentials and must be treated as a secret
      required:
        - db_username
        - db_password
        - db_name
        - db_host
        - database_url
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_name: !unsafe "{{ db_name }}"
        db_host: !unsafe "{{ db_host }}"
        database_url: !unsafe "{{ database_url }}"
