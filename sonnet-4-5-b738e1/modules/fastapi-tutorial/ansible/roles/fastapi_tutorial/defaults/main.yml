---
# Application directory and repository
fastapi_tutorial_app_dir: /opt/fastapi-tutorial
fastapi_tutorial_git_repo: https://github.com/dibanez/fastapi_tutorial.git
fastapi_tutorial_git_branch: main
# Python virtual environment
fastapi_tutorial_venv_dir: /opt/fastapi-tutorial/venv
# Application settings
fastapi_tutorial_project_name: FastAPI Tutorial
fastapi_tutorial_api_version: 1.0.0
fastapi_tutorial_asgi_app: app.main:app
fastapi_tutorial_bind_host: 0.0.0.0
fastapi_tutorial_port: 8000
# Service settings
fastapi_tutorial_service_name: fastapi-tutorial
fastapi_tutorial_service_user: root
# PostgreSQL settings
# db_username, db_password, db_name, db_host, database_url are injected by AAP credential type
fastapi_tutorial_db_owner: "{{ db_username }}"
# System packages to install
fastapi_tutorial_packages:
  - python3
  - python3-pip
  - python3-venv
  - git
  - postgresql
  - postgresql-contrib
  - libpq-dev
