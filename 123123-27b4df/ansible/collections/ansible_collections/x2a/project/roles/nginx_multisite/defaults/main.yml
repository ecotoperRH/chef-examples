---
# defaults file for x2a.project.nginx_multisite
nginx_multisite_sites:
  test.cluster.local:
    document_root: /opt/server/test
    ssl_enabled: true
  ci.cluster.local:
    document_root: /opt/server/ci
    ssl_enabled: true
  status.cluster.local:
    document_root: /opt/server/status
    ssl_enabled: true
nginx_multisite_ssl_certificate_path: /etc/ssl/certs
nginx_multisite_ssl_private_key_path: /etc/ssl/private
nginx_multisite_security_fail2ban_enabled: true
nginx_multisite_security_ufw_enabled: true
nginx_multisite_security_ssh_disable_root: true
nginx_multisite_security_ssh_password_auth: false
nginx_multisite_ssl_cert_days: 365
nginx_multisite_ssl_key_size: 2048
nginx_multisite_ssl_country: US
nginx_multisite_ssl_state: Example
nginx_multisite_ssl_locality: Example
nginx_multisite_ssl_organization: Example Org
nginx_multisite_ssl_organizational_unit: IT
nginx_multisite_ssl_email: admin@example.com
nginx_multisite_web_user: www-data
nginx_multisite_web_group: www-data
nginx_multisite_ssl_group: ssl-cert
nginx_multisite_secure_logging: true
