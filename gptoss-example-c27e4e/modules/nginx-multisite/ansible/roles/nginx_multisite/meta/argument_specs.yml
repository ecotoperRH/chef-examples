---
argument_specs:
  main:
    short_description: Deploy and configure Nginx multisite with security hardening
    description:
      - Installs Nginx, configures multiple TLS-enabled virtual hosts, sets up firewall, fail2ban, and system security settings.
    options:
      nginx_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Mapping of site names to their document roots and SSL enable flag.
      nginx_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory path where SSL certificates are stored.
      nginx_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory path where SSL private keys are stored.
      security_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Enable fail2ban service.
      security_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Enable UFW firewall.
      security_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Disable SSH root login.
      security_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Disable SSH password authentication.
