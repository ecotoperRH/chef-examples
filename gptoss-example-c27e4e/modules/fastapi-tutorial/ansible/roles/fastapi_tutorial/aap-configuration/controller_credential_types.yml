---
controller_credential_types:
  - name: PostgreSQL FastAPI User
    description: Credential type for PostgreSQL FastAPI User
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: Username for PostgreSQL user used by FastAPI
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for PostgreSQL user used by FastAPI
      required:
        - db_username
        - db_password
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
