---
argument_specs:
  main:
    short_description: Deploy and configure the FastAPI tutorial application with PostgreSQL
    description:
      - Installs system packages, clones the FastAPI tutorial repository from GitHub, creates a Python virtual environment, installs pip dependencies,
        provisions a PostgreSQL database and user, writes a .env configuration file, and manages the fastapi-tutorial systemd service.
    options:
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Filesystem path where the FastAPI application will be installed.
      fastapi_tutorial_venv_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Path to the Python virtual environment directory.
      fastapi_tutorial_repo_url:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL for the FastAPI tutorial application.
      fastapi_tutorial_repo_branch:
        type: str
        required: false
        default: main
        description: Git branch or revision to check out from the repository.
      fastapi_tutorial_entry_point:
        type: str
        required: false
        default: app.main:app
        description: ASGI application entry point passed to uvicorn (module:attribute format).
      fastapi_tutorial_bind_host:
        type: str
        required: false
        default: 0.0.0.0
        description: Host address that uvicorn binds to.
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port that the uvicorn/FastAPI application listens on.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Project name written to the .env file as PROJECT_NAME.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version string written to the .env file as API_VERSION.
      fastapi_tutorial_db_user:
        type: str
        required: false
        description: PostgreSQL database username. Defaults to the AAP credential variable db_username (resolved at runtime via defaults/main.yml). Override to
          use a static value.
      fastapi_tutorial_db_name:
        type: str
        required: false
        description: PostgreSQL database name. Defaults to the AAP credential variable db_name (resolved at runtime via defaults/main.yml). Override to use a
          static value.
      fastapi_tutorial_db_host:
        type: str
        required: false
        description: PostgreSQL database host. Defaults to the AAP credential variable db_host (resolved at runtime via defaults/main.yml). Override to use a
          static value.
      db_username:
        type: str
        required: true
        description: PostgreSQL username injected by the AAP credential type at runtime.
      db_password:
        type: str
        required: true
        description: PostgreSQL password injected by the AAP credential type at runtime. Used when creating the database user and in the DATABASE_URL connection
          string.
      db_host:
        type: str
        required: true
        description: PostgreSQL host injected by the AAP credential type at runtime.
      db_name:
        type: str
        required: true
        description: PostgreSQL database name injected by the AAP credential type at runtime.
      database_url:
        type: str
        required: true
        description: Full PostgreSQL connection URL injected by the AAP credential type at runtime. Written to the .env file as DATABASE_URL.
