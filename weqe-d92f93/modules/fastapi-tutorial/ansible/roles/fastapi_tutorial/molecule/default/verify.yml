---
# ────────────────────────────────────────────────────────────────────────────
# Play 1 — Filesystem structure: directories, git-cloned files, venv binaries
# ────────────────────────────────────────────────────────────────────────────
- name: Verify filesystem structure
  hosts: all
  gather_facts: false
  tasks:

    # ── 1a. Directories exist ────────────────────────────────────────────────
    - name: Stat expected application directories
      ansible.builtin.stat:
        path: "{{ item_dir }}"
      loop:
        - /tmp/molecule_test/opt/fastapi-tutorial
        - /tmp/molecule_test/opt/fastapi-tutorial/venv
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin
        - /tmp/molecule_test/etc/systemd/system
      loop_control:
        loop_var: item_dir
      register: dir_stat_results

    - name: Assert expected directories exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected directory is missing or is not a directory"
      loop: "{{ dir_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # ── 1b. requirements.txt present (confirms simulated git clone) ──────────
    - name: Stat requirements.txt
      ansible.builtin.stat:
        path: /tmp/molecule_test/opt/fastapi-tutorial/requirements.txt
      register: requirements_stat

    - name: Assert requirements.txt exists and is non-empty
      ansible.builtin.assert:
        that:
          - requirements_stat['stat']['exists']
          - requirements_stat['stat']['size'] > 0
        fail_msg: "requirements.txt is missing or empty"

    # ── 1c. Venv binaries present ────────────────────────────────────────────
    - name: Stat expected venv binaries
      ansible.builtin.stat:
        path: "{{ item_bin }}"
      loop:
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin/uvicorn
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin/python3
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin/pip
      loop_control:
        loop_var: item_bin
      register: venv_bin_stat_results

    - name: Assert venv binaries exist and are executable
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['executable']
        fail_msg: "Expected venv binary is missing or not executable"
      loop: "{{ venv_bin_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

# ────────────────────────────────────────────────────────────────────────────
# Play 2 — Configuration file content: .env and systemd unit
# ────────────────────────────────────────────────────────────────────────────
- name: Verify configuration file content
  hosts: all
  gather_facts: false
  tasks:

    # ── 2a. .env file: existence and permissions ─────────────────────────────
    - name: Stat .env configuration file
      ansible.builtin.stat:
        path: /tmp/molecule_test/opt/fastapi-tutorial/.env
      register: env_file_stat

    - name: Assert .env file exists with correct mode
      ansible.builtin.assert:
        that:
          - env_file_stat['stat']['exists']
          - env_file_stat['stat']['mode'] == '0644'
        fail_msg: ".env file is missing or has wrong permissions"

    # ── 2b. .env file: content verification ─────────────────────────────────
    - name: Slurp .env configuration file
      ansible.builtin.slurp:
        src: /tmp/molecule_test/opt/fastapi-tutorial/.env
      register: env_file_content

    - name: Assert .env contains required configuration keys
      ansible.builtin.assert:
        that:
          - env_file_content['content'] | b64decode | regex_search('PROJECT_NAME=')
          - env_file_content['content'] | b64decode | regex_search('API_VERSION=')
          - env_file_content['content'] | b64decode | regex_search('DATABASE_URL=')
          - env_file_content['content'] | b64decode | regex_search('postgresql://')
        fail_msg: ".env file is missing required configuration keys"

    # ── 2c. Systemd unit file: existence and permissions ────────────────────
    - name: Stat systemd unit file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/systemd/system/fastapi-tutorial.service
      register: unit_file_stat

    - name: Assert systemd unit file exists with correct mode
      ansible.builtin.assert:
        that:
          - unit_file_stat['stat']['exists']
          - unit_file_stat['stat']['mode'] == '0644'
        fail_msg: "systemd unit file is missing or has wrong permissions"

    # ── 2d. Systemd unit file: content verification ──────────────────────────
    - name: Slurp systemd unit file
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/systemd/system/fastapi-tutorial.service
      register: unit_file_content

    - name: Assert systemd unit file contains required directives
      ansible.builtin.assert:
        that:
          - unit_file_content['content'] | b64decode | regex_search('After=network.target postgresql.service')
          - unit_file_content['content'] | b64decode | regex_search('WorkingDirectory=/opt/fastapi-tutorial')
          - unit_file_content['content'] | b64decode | regex_search('ExecStart=.*/uvicorn app.main:app --host 0.0.0.0 --port 8000')
          - unit_file_content['content'] | b64decode | regex_search('Restart=always')
          - unit_file_content['content'] | b64decode | regex_search('WantedBy=multi-user.target')
        fail_msg: "systemd unit file is missing required directives"

# ────────────────────────────────────────────────────────────────────────────
# Play 3 — Service, port, and HTTP checks (container-unsafe: molecule-notest)
# ────────────────────────────────────────────────────────────────────────────
- name: Verify services and network endpoints
  hosts: all
  gather_facts: false
  tasks:

    # ── 3a. PostgreSQL service ───────────────────────────────────────────────
    - name: Gather service facts
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert PostgreSQL service is active and enabled
      ansible.builtin.assert:
        that:
          - "'postgresql.service' in ansible_facts['services']"
          - "ansible_facts['services']['postgresql.service']['state'] == 'running'"
          - "ansible_facts['services']['postgresql.service']['status'] == 'enabled'"
        fail_msg: "PostgreSQL service is not running or not enabled"
      tags: molecule-notest

    # ── 3b. fastapi-tutorial service ────────────────────────────────────────
    - name: Assert fastapi-tutorial service is active and enabled
      ansible.builtin.assert:
        that:
          - "'fastapi-tutorial.service' in ansible_facts['services']"
          - "ansible_facts['services']['fastapi-tutorial.service']['state'] == 'running'"
          - "ansible_facts['services']['fastapi-tutorial.service']['status'] == 'enabled'"
        fail_msg: "fastapi-tutorial service is not running or not enabled"
      tags: molecule-notest

    # ── 3c. PostgreSQL port 5432 ─────────────────────────────────────────────
    - name: Check PostgreSQL is listening on port 5432
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 5432
        timeout: 5
        state: started
      tags: molecule-notest

    # ── 3d. FastAPI application port 8000 ────────────────────────────────────
    - name: Check FastAPI application is listening on port 8000
      ansible.builtin.wait_for:
        host: 0.0.0.0
        port: 8000
        timeout: 5
        state: started
      tags: molecule-notest

    # ── 3e. HTTP health check ────────────────────────────────────────────────
    - name: Check FastAPI HTTP endpoint responds
      ansible.builtin.uri:
        url: http://localhost:8000/
        method: GET
        status_code:
          - 200
          - 307
        timeout: 10
      tags: molecule-notest

    - name: Check FastAPI OpenAPI docs endpoint
      ansible.builtin.uri:
        url: http://localhost:8000/openapi.json
        method: GET
        status_code: 200
        timeout: 10
      register: openapi_response
      tags: molecule-notest

    - name: Assert OpenAPI response contains expected title
      ansible.builtin.assert:
        that:
          - openapi_response['json']['info']['title'] is defined
        fail_msg: "OpenAPI response did not contain expected info.title field"
      tags: molecule-notest
