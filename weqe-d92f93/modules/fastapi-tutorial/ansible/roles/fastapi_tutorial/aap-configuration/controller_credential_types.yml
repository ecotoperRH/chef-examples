---
controller_credential_types:
- name: FastAPI PostgreSQL Database
  description: Hardcoded PostgreSQL credentials for the FastAPI application database,
    currently stored as plaintext in the recipe and .env file
  kind: cloud
  inputs:
    fields:
    - id: db_username
      type: string
      label: Database Username
      help_text: PostgreSQL username for the FastAPI application (e.g., 'fastapi')
    - id: db_password
      type: string
      label: Database Password
      secret: true
      help_text: PostgreSQL password for the FastAPI application user; currently hardcoded
        as 'fastapi_password' in the recipe SQL commands and .env file
    - id: db_host
      type: string
      label: Database Host
      help_text: Hostname or IP address of the PostgreSQL server (e.g., 'localhost')
    - id: db_name
      type: string
      label: Database Name
      help_text: Name of the PostgreSQL database for the FastAPI application (e.g.,
        'fastapi_db')
    - id: database_url
      type: string
      label: Database Connection URL
      secret: true
      help_text: Full PostgreSQL connection URL written to /opt/fastapi-tutorial/.env
        as DATABASE_URL; contains embedded credentials (e.g., postgresql://fastapi:fastapi_password@localhost/fastapi_db)
    required:
    - db_username
    - db_password
    - db_host
    - db_name
    - database_url
  injectors:
    extra_vars:
      db_username: !unsafe '{{ db_username }}'
      db_password: !unsafe '{{ db_password }}'
      db_host: !unsafe '{{ db_host }}'
      db_name: !unsafe '{{ db_name }}'
      database_url: !unsafe '{{ database_url }}'
