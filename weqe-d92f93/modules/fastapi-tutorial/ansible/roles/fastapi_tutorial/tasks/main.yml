---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Clone FastAPI tutorial repository
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repo_url }}"
    dest: "{{ fastapi_tutorial_app_dir }}"
    version: "{{ fastapi_tutorial_repo_branch }}"
    force: false
- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv {{ fastapi_tutorial_venv_dir }}
    creates: "{{ fastapi_tutorial_venv_dir }}"
- name: Install Python dependencies
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_venv_dir }}"
    state: present
- name: Enable and start PostgreSQL service
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
- name: Create PostgreSQL database user
  ansible.builtin.shell:
    cmd: sudo -u postgres psql -c "CREATE USER {{ fastapi_tutorial_db_user }} WITH PASSWORD '{{ db_password }}';" || true
  changed_when: false
- name: Create PostgreSQL database
  ansible.builtin.shell:
    cmd: sudo -u postgres psql -c "CREATE DATABASE {{ fastapi_tutorial_db_name }} OWNER {{ fastapi_tutorial_db_user }};" || true
  changed_when: false
- name: Grant privileges on PostgreSQL database
  ansible.builtin.shell:
    cmd: sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ fastapi_tutorial_db_name }} TO {{ fastapi_tutorial_db_user }};" || true
  changed_when: false
- name: Deploy .env configuration file
  ansible.builtin.template:
    src: fastapi-tutorial.env.j2
    dest: "{{ fastapi_tutorial_app_dir }}/.env"
    owner: root
    group: root
    mode: "0644"
    backup: true
- name: Deploy systemd unit file
  ansible.builtin.template:
    src: fastapi-tutorial.service.j2
    dest: /etc/systemd/system/fastapi-tutorial.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Reload systemd daemon
    - Restart fastapi-tutorial service
- name: Flush handlers to reload systemd before managing the service
  ansible.builtin.meta: flush_handlers
- name: Enable and start fastapi-tutorial service
  ansible.builtin.service:
    name: fastapi-tutorial
    state: started
    enabled: true
