---
- name: Build merged Redis instance configuration
  ansible.builtin.set_fact:
    cache_redis_current: "{{ cache_redis_default_settings | combine(item_redis_server) }}"
- name: Set Redis server name
  ansible.builtin.set_fact:
    cache_redis_server_name: "{{ cache_redis_current['name'] | default(cache_redis_current['port'], true) }}"
- name: Set Redis PID directory
  ansible.builtin.set_fact:
    cache_redis_piddir: "{{ cache_redis_base_piddir }}/{{ cache_redis_server_name }}"
- name: Set Redis descriptor limit
  ansible.builtin.set_fact:
    cache_redis_descriptors: "{{ (cache_redis_current['maxclients'] | int + 32)\n   if (cache_redis_current['ulimit'] | int == 0)\n   else cache_redis_current['ulimit']
      | int }}"
- name: Create Redis system user
  ansible.builtin.user:
    name: "{{ cache_redis_current['user'] }}"
    comment: Redis service account
    home: "{{ cache_redis_current['homedir'] }}"
    shell: "{{ cache_redis_current['shell'] }}"
    system: "{{ cache_redis_current['systemuser'] | bool }}"
    create_home: true
    state: present
- name: Create Redis configuration directory
  ansible.builtin.file:
    path: "{{ cache_redis_current['configdir'] }}"
    owner: root
    group: "{{ cache_redis_current['group'] }}"
    mode: "0775"
    state: directory
- name: Create Redis data directory
  ansible.builtin.file:
    path: "{{ cache_redis_current['datadir'] }}"
    owner: "{{ cache_redis_current['user'] }}"
    group: "{{ cache_redis_current['group'] }}"
    mode: "0775"
    state: directory
- name: Create Redis PID directory
  ansible.builtin.file:
    path: "{{ cache_redis_piddir }}"
    owner: "{{ cache_redis_current['user'] }}"
    group: "{{ cache_redis_current['group'] }}"
    mode: "0755"
    state: directory
- name: Set Redis file descriptor limit via limits.d
  ansible.builtin.copy:
    dest: "{{ cache_ulimit_security_limits_directory }}/redis.conf"
    content: "{{ cache_redis_current['user'] }} soft nofile {{ cache_redis_descriptors }}\n{{ cache_redis_current['user'] }} hard nofile {{ cache_redis_descriptors
      }}\n"
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: ansible_os_family != 'FreeBSD'
- name: Check for Redis config breadcrumb
  ansible.builtin.stat:
    path: "{{ cache_redis_current['configdir'] }}/{{ cache_redis_server_name }}.conf.breadcrumb"
  register: cache_redis_breadcrumb_stat
- name: Deploy Redis configuration file
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_current['configdir'] }}/{{ cache_redis_server_name }}.conf"
    owner: "{{ cache_redis_current['user'] }}"
    group: "{{ cache_redis_current['group'] }}"
    mode: "{{ cache_redis_current['permissions'] }}"
    backup: true
  vars:
    redis_job_control: "{{ cache_redis_job_control }}"
    redis_piddir: "{{ cache_redis_piddir }}"
    redis_instance_name: "{{ cache_redis_server_name }}"
    redis_port: "{{ cache_redis_current['port'] }}"
    redis_tcpbacklog: "{{ cache_redis_current['tcpbacklog'] }}"
    redis_address: "{{ cache_redis_current['address'] }}"
    redis_databases: "{{ cache_redis_current['databases'] }}"
    redis_backuptype: "{{ cache_redis_current['backuptype'] }}"
    redis_datadir: "{{ cache_redis_current['datadir'] }}"
    redis_unixsocket: "{{ cache_redis_current['unixsocket'] }}"
    redis_unixsocketperm: "{{ cache_redis_current['unixsocketperm'] }}"
    redis_timeout: "{{ cache_redis_current['timeout'] }}"
    redis_keepalive: "{{ cache_redis_current['keepalive'] }}"
    redis_loglevel: "{{ cache_redis_current['loglevel'] }}"
    redis_logfile: "{{ cache_redis_current['logfile'] }}"
    redis_syslogenabled: "{{ cache_redis_current['syslogenabled'] }}"
    redis_syslogfacility: "{{ cache_redis_current['syslogfacility'] }}"
    redis_save: "{{ cache_redis_current['save'] }}"
    redis_stopwritesonbgsaveerror: "{{ cache_redis_current['stopwritesonbgsaveerror'] }}"
    redis_rdbcompression: "{{ cache_redis_current['rdbcompression'] }}"
    redis_rdbchecksum: "{{ cache_redis_current['rdbchecksum'] }}"
    redis_dbfilename: "{{ cache_redis_current['dbfilename'] }}"
    redis_replicaof: "{{ cache_redis_current['replicaof'] }}"
    redis_protected_mode: "{{ cache_redis_current['protected_mode'] }}"
    redis_masterauth: "{{ cache_redis_current['masterauth'] }}"
    redis_replicaservestaledata: "{{ cache_redis_current['replicaservestaledata'] }}"
    redis_replicareadonly: "{{ cache_redis_current['replicareadonly'] }}"
    redis_repldisklesssync: "{{ cache_redis_current['repldisklesssync'] }}"
    redis_repldisklesssyncdelay: "{{ cache_redis_current['repldisklesssyncdelay'] }}"
    redis_replpingreplicaperiod: "{{ cache_redis_current['replpingreplicaperiod'] }}"
    redis_repltimeout: "{{ cache_redis_current['repltimeout'] }}"
    redis_repldisabletcpnodelay: "{{ cache_redis_current['repldisabletcpnodelay'] }}"
    redis_replbacklogsize: "{{ cache_redis_current['replbacklogsize'] }}"
    redis_replbacklogttl: "{{ cache_redis_current['replbacklogttl'] }}"
    redis_replicapriority: "{{ cache_redis_current['replicapriority'] }}"
    redis_requirepass: "{{ cache_redis_current['requirepass'] }}"
    redis_rename_commands: "{{ cache_redis_current['rename_commands'] }}"
    redis_maxclients: "{{ cache_redis_current['maxclients'] }}"
    redis_maxmemory: "{{ cache_redis_current['maxmemory'] | default('') }}"
    redis_maxmemorypolicy: "{{ cache_redis_current['maxmemorypolicy'] }}"
    redis_maxmemorysamples: "{{ cache_redis_current['maxmemorysamples'] }}"
    redis_appendfilename: "{{ cache_redis_current['appendfilename'] }}"
    redis_appendfsync: "{{ cache_redis_current['appendfsync'] }}"
    redis_noappendfsynconrewrite: "{{ cache_redis_current['noappendfsynconrewrite'] }}"
    redis_aofrewritepercentage: "{{ cache_redis_current['aofrewritepercentage'] }}"
    redis_aofrewriteminsize: "{{ cache_redis_current['aofrewriteminsize'] }}"
    redis_aofloadtruncated: "{{ cache_redis_current['aofloadtruncated'] }}"
    redis_luatimelimit: "{{ cache_redis_current['luatimelimit'] }}"
    redis_slowloglogslowerthan: "{{ cache_redis_current['slowloglogslowerthan'] }}"
    redis_slowlogmaxlen: "{{ cache_redis_current['slowlogmaxlen'] }}"
    redis_notifykeyspaceevents: "{{ cache_redis_current['notifykeyspaceevents'] }}"
    redis_hashmaxziplistentries: "{{ cache_redis_current['hashmaxziplistentries'] }}"
    redis_hashmaxziplistvalue: "{{ cache_redis_current['hashmaxziplistvalue'] }}"
    redis_setmaxintsetentries: "{{ cache_redis_current['setmaxintsetentries'] }}"
    redis_zsetmaxziplistentries: "{{ cache_redis_current['zsetmaxziplistentries'] }}"
    redis_zsetmaxziplistvalue: "{{ cache_redis_current['zsetmaxziplistvalue'] }}"
    redis_hllsparsemaxbytes: "{{ cache_redis_current['hllsparsemaxbytes'] }}"
    redis_activerehasing: "{{ cache_redis_current['activerehasing'] }}"
    redis_clientoutputbufferlimit: "{{ cache_redis_current['clientoutputbufferlimit'] }}"
    redis_hz: "{{ cache_redis_current['hz'] }}"
    redis_aofrewriteincrementalfsync: "{{ cache_redis_current['aofrewriteincrementalfsync'] }}"
    redis_clusterenabled: "{{ cache_redis_current['clusterenabled'] }}"
    redis_clusterconfigfile: "{{ cache_redis_current['clusterconfigfile'] }}"
    redis_clusternodetimeout: "{{ cache_redis_current['clusternodetimeout'] }}"
    redis_clusterport: "{{ cache_redis_current['clusterport'] }}"
    redis_includes: "{{ cache_redis_current['includes'] }}"
    redis_aclfile: "{{ cache_redis_current['aclfile'] }}"
    redis_minreplicastowrite: "{{ cache_redis_current['minreplicastowrite'] }}"
    redis_minreplicasmaxlag: "{{ cache_redis_current['minreplicasmaxlag'] }}"
    redis_tlsport: "{{ cache_redis_current['tlsport'] }}"
    redis_tlscertfile: "{{ cache_redis_current['tlscertfile'] }}"
    redis_tlskeyfile: "{{ cache_redis_current['tlskeyfile'] }}"
    redis_tlskeyfilepass: "{{ cache_redis_current['tlskeyfilepass'] }}"
    redis_tlsclientcertfile: "{{ cache_redis_current['tlsclientcertfile'] }}"
    redis_tlsclientkeyfile: "{{ cache_redis_current['tlsclientkeyfile'] }}"
    redis_tlsclientkeyfilepass: "{{ cache_redis_current['tlsclientkeyfilepass'] }}"
    redis_tlsdhparamsfile: "{{ cache_redis_current['tlsdhparamsfile'] }}"
    redis_tlscacertfile: "{{ cache_redis_current['tlscacertfile'] }}"
    redis_tlscacertdir: "{{ cache_redis_current['tlscacertdir'] }}"
    redis_tlsauthclients: "{{ cache_redis_current['tlsauthclients'] }}"
    redis_tlsreplication: "{{ cache_redis_current['tlsreplication'] }}"
    redis_tlscluster: "{{ cache_redis_current['tlscluster'] }}"
    redis_tlsprotocols: "{{ cache_redis_current['tlsprotocols'] }}"
    redis_tlsciphers: "{{ cache_redis_current['tlsciphers'] }}"
    redis_tlsciphersuites: "{{ cache_redis_current['tlsciphersuites'] }}"
    redis_tlspreferserverciphers: "{{ cache_redis_current['tlspreferserverciphers'] }}"
    redis_tlssessioncaching: "{{ cache_redis_current['tlssessioncaching'] }}"
    redis_tlssessioncachesize: "{{ cache_redis_current['tlssessioncachesize'] }}"
    redis_tlssessioncachetimeout: "{{ cache_redis_current['tlssessioncachetimeout'] }}"
  when: not cache_redis_breadcrumb_stat.stat.exists
  notify: Reload systemd daemon
- name: Create Redis config breadcrumb file
  ansible.builtin.copy:
    dest: "{{ cache_redis_current['configdir'] }}/{{ cache_redis_server_name }}.conf.breadcrumb"
    content: "This file prevents the ansible role from overwriting the redis config more than once "
    owner: root
    group: root
    mode: "0644"
    force: false
    backup: false
  when: cache_redis_current['breadcrumb'] | bool
- name: Create tmpfiles.d entry for Redis PID directory (systemd)
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/redis@{{ cache_redis_server_name }}.conf
    content: "d {{ cache_redis_piddir }} 0755 {{ cache_redis_current['user'] }} {{ cache_redis_current['group'] }} "
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: cache_redis_job_control == 'systemd'
  notify: Reload systemd daemon
- name: Deploy Redis systemd unit file
  ansible.builtin.template:
    src: redis@.service.j2
    dest: /lib/systemd/system/redis@{{ cache_redis_server_name }}.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  vars:
    redis_svc_bin_path: "{{ cache_redis_bin_path }}"
    redis_svc_user: "{{ cache_redis_current['user'] }}"
    redis_svc_group: "{{ cache_redis_current['group'] }}"
    redis_svc_limit_nofile: "{{ cache_redis_descriptors }}"
  when: cache_redis_job_control == 'systemd'
  notify: Reload systemd daemon
- name: Deploy Redis init.d script
  ansible.builtin.template:
    src: redis.init.j2
    dest: /etc/init.d/redis{{ cache_redis_server_name }}
    owner: root
    group: root
    mode: "0755"
    backup: true
  vars:
    redis_init_name: "{{ cache_redis_server_name }}"
    redis_init_bin_path: "{{ cache_redis_bin_path }}"
    redis_init_port: "{{ cache_redis_current['port'] }}"
    redis_init_address: "{{ cache_redis_current['address'] }}"
    redis_init_user: "{{ cache_redis_current['user'] }}"
    redis_init_configdir: "{{ cache_redis_current['configdir'] }}"
    redis_init_piddir: "{{ cache_redis_piddir }}"
    redis_init_requirepass: "{{ cache_redis_current['requirepass'] }}"
    redis_init_shutdown_save: "{{ cache_redis_current['shutdown_save'] }}"
    redis_init_platform: "{{ ansible_distribution | lower }}"
    redis_init_unixsocket: "{{ cache_redis_current['unixsocket'] }}"
    redis_init_ulimit: "{{ cache_redis_descriptors }}"
    redis_init_required_start: ""
    redis_init_required_stop: ""
  when: cache_redis_job_control == 'initd'
- name: Deploy Redis upstart configuration
  ansible.builtin.template:
    src: redis.upstart.conf.j2
    dest: /etc/init/redis{{ cache_redis_server_name }}.conf
    owner: "{{ cache_redis_current['user'] }}"
    group: "{{ cache_redis_current['group'] }}"
    mode: "0644"
    backup: true
  vars:
    redis_upstart_name: "{{ cache_redis_server_name }}"
    redis_upstart_bin_path: "{{ cache_redis_bin_path }}"
    redis_upstart_port: "{{ cache_redis_current['port'] }}"
    redis_upstart_user: "{{ cache_redis_current['user'] }}"
    redis_upstart_group: "{{ cache_redis_current['group'] }}"
    redis_upstart_configdir: "{{ cache_redis_current['configdir'] }}"
    redis_upstart_piddir: "{{ cache_redis_piddir }}"
  when: cache_redis_job_control == 'upstart'
- name: Deploy Redis rcinit script (FreeBSD)
  ansible.builtin.template:
    src: redis.rcinit.j2
    dest: /usr/local/etc/rc.d/redis{{ cache_redis_server_name }}
    owner: "{{ cache_redis_current['user'] }}"
    group: "{{ cache_redis_current['group'] }}"
    mode: "0755"
    backup: true
  vars:
    redis_rcinit_name: "{{ cache_redis_server_name }}"
    redis_rcinit_bin_path: "{{ cache_redis_bin_path }}"
    redis_rcinit_user: "{{ cache_redis_current['user'] }}"
    redis_rcinit_configdir: "{{ cache_redis_current['configdir'] }}"
    redis_rcinit_piddir: "{{ cache_redis_piddir }}"
  when: cache_redis_job_control == 'rcinit'
