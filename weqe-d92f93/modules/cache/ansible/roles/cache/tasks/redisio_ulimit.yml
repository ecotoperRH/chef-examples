---
- name: Deploy PAM su configuration for ulimit support (Debian/Ubuntu)
  ansible.builtin.template:
    src: pam_su.j2
    dest: /etc/pam.d/su
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: ansible_os_family == 'Debian'
- name: Deploy PAM sudo configuration for ulimit support (Debian/Ubuntu)
  ansible.builtin.copy:
    src: pam_sudo
    dest: /etc/pam.d/sudo
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: ansible_os_family == 'Debian'
