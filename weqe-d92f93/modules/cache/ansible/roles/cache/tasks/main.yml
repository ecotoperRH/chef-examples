---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Configure Memcached
  ansible.builtin.include_tasks: memcached.yml
- name: Create Redis system group
  ansible.builtin.group:
    name: "{{ cache_redis_default_settings['group'] }}"
    system: true
    state: present
- name: Create Redis system user
  ansible.builtin.user:
    name: "{{ cache_redis_default_settings['user'] }}"
    comment: Redis service account
    home: "{{ cache_redis_default_settings['homedir'] }}"
    shell: "{{ cache_redis_default_settings['shell'] }}"
    system: "{{ cache_redis_default_settings['systemuser'] | bool }}"
    group: "{{ cache_redis_default_settings['group'] }}"
    create_home: true
    state: present
- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    owner: "{{ cache_redis_default_settings['user'] }}"
    group: "{{ cache_redis_default_settings['group'] }}"
    mode: "0755"
    state: directory
- name: Configure Redis (redisio)
  ansible.builtin.include_tasks: redisio.yml
- name: Remove incompatible directives from Redis config (compatibility fix)
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: "{{ item_redis_fix['pattern'] }}"
    state: absent
    backup: true
  loop:
    - pattern: ^replica-serve-stale-data
    - pattern: ^replica-read-only
    - pattern: ^repl-ping-replica-period
    - pattern: ^client-output-buffer-limit
    - pattern: ^replica-priority
  loop_control:
    loop_var: item_redis_fix
    label: "{{ item_redis_fix['pattern'] }}"
- name: Enable Redis service instances
  ansible.builtin.include_tasks: redisio_enable.yml
