---
controller_credential_types:
- name: Redis Authentication Password
  description: Hardcoded Redis requirepass credential migrated from plaintext Chef
    recipe to AAP credential store
  kind: cloud
  inputs:
    fields:
    - id: redis_password
      type: string
      label: Redis Password
      secret: true
      help_text: Password used for Redis AUTH command (requirepass directive in /etc/redis/6379.conf).
        All clients connecting to Redis on port 6379 must authenticate with this password.
    required:
    - redis_password
  injectors:
    extra_vars:
      redis_password: !unsafe '{{ redis_password }}'
