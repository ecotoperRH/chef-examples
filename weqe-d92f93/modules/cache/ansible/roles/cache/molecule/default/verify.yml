---
# verify.yml — validates the filesystem state produced by the cache role.
# All paths are under /tmp/molecule_test/ (container-safe).
# Service/port checks are tagged molecule-notest (cannot run in EE container).

# ===========================================================================
# Play 1: Verify Redis configuration files and directories
# ===========================================================================
- name: Verify Redis configuration files and directories
  hosts: all
  gather_facts: false
  tasks:

    - name: Stat Redis configuration files and sentinel
      ansible.builtin.stat:
        path: "{{ item_redis_file }}"
      loop:
        - /tmp/molecule_test/etc/redis/6379.conf
        - /tmp/molecule_test/etc/redis/6379.conf.breadcrumb
        - /tmp/molecule_test/etc/tmpfiles.d/redis@6379.conf
        - /tmp/molecule_test/lib/systemd/system/redis@6379.service
        - /tmp/molecule_test/etc/security/limits.d/redis.conf
      loop_control:
        loop_var: item_redis_file
      register: redis_file_stat_results

    - name: Assert Redis configuration files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected Redis file not found or empty"
      loop: "{{ redis_file_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Stat Redis directories
      ansible.builtin.stat:
        path: "{{ item_redis_dir }}"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis/6379
        - /tmp/molecule_test/var/log/redis
      loop_control:
        loop_var: item_redis_dir
      register: redis_dir_stat_results

    - name: Assert Redis directories exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected Redis directory not found"
      loop: "{{ redis_dir_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read Redis configuration file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/redis/6379.conf
      register: redis_conf_slurp

    - name: Assert Redis config contains required port directive
      ansible.builtin.assert:
        that:
          - "'port 6379' in (redis_conf_slurp['content'] | b64decode)"
        fail_msg: "Redis config missing 'port 6379' directive"

    - name: Assert Redis config contains requirepass directive
      ansible.builtin.assert:
        that:
          - "'requirepass redis_secure_password_123' in (redis_conf_slurp['content'] | b64decode)"
        fail_msg: "Redis config missing requirepass directive"

    - name: Assert Redis config contains maxclients directive
      ansible.builtin.assert:
        that:
          - "'maxclients 10000' in (redis_conf_slurp['content'] | b64decode)"
        fail_msg: "Redis config missing 'maxclients 10000' directive"

    - name: Assert Redis config contains syslog-enabled directive
      ansible.builtin.assert:
        that:
          - "'syslog-enabled yes' in (redis_conf_slurp['content'] | b64decode)"
        fail_msg: "Redis config missing 'syslog-enabled yes' directive"

    - name: Assert Redis config contains databases directive
      ansible.builtin.assert:
        that:
          - "'databases 16' in (redis_conf_slurp['content'] | b64decode)"
        fail_msg: "Redis config missing 'databases 16' directive"

    - name: Assert stripped directives are absent from Redis config
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in (redis_conf_slurp['content'] | b64decode)"
          - "'replica-read-only' not in (redis_conf_slurp['content'] | b64decode)"
          - "'repl-ping-replica-period' not in (redis_conf_slurp['content'] | b64decode)"
          - "'client-output-buffer-limit' not in (redis_conf_slurp['content'] | b64decode)"
          - "'replica-priority' not in (redis_conf_slurp['content'] | b64decode)"
        fail_msg: "Redis config still contains directives that should have been stripped"

# ===========================================================================
# Play 2: Verify Redis systemd unit and tmpfiles.d content
# ===========================================================================
- name: Verify Redis systemd unit and tmpfiles.d content
  hosts: all
  gather_facts: false
  tasks:

    - name: Read Redis systemd unit file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/lib/systemd/system/redis@6379.service
      register: redis_service_slurp

    - name: Assert Redis systemd unit contains ExecStart with redis-server
      ansible.builtin.assert:
        that:
          - "'redis-server' in (redis_service_slurp['content'] | b64decode)"
        fail_msg: "Redis systemd unit missing redis-server in ExecStart"

    - name: Assert Redis systemd unit contains LimitNOFILE
      ansible.builtin.assert:
        that:
          - "'LimitNOFILE' in (redis_service_slurp['content'] | b64decode)"
        fail_msg: "Redis systemd unit missing LimitNOFILE directive"

    - name: Read Redis tmpfiles.d content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/tmpfiles.d/redis@6379.conf
      register: redis_tmpfiles_slurp

    - name: Assert Redis tmpfiles.d entry references correct PID directory
      ansible.builtin.assert:
        that:
          - "'/var/run/redis/6379' in (redis_tmpfiles_slurp['content'] | b64decode)"
        fail_msg: "Redis tmpfiles.d entry missing expected PID directory path"

    - name: Read Redis limits.d content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/security/limits.d/redis.conf
      register: redis_limits_slurp

    - name: Assert Redis limits.d contains descriptor limit 10032
      ansible.builtin.assert:
        that:
          - "'10032' in (redis_limits_slurp['content'] | b64decode)"
        fail_msg: "Redis limits.d missing expected file descriptor limit 10032"

# ===========================================================================
# Play 3: Verify Memcached directories and PAM files
# ===========================================================================
- name: Verify Memcached directories and PAM files
  hosts: all
  gather_facts: false
  tasks:

    - name: Stat Memcached directories
      ansible.builtin.stat:
        path: "{{ item_mc_dir }}"
      loop:
        - /tmp/molecule_test/var/log/memcached
        - /tmp/molecule_test/var/run/memcached
      loop_control:
        loop_var: item_mc_dir
      register: memcached_dir_stat_results

    - name: Assert Memcached directories exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected Memcached directory not found"
      loop: "{{ memcached_dir_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Stat PAM configuration files
      ansible.builtin.stat:
        path: "{{ item_pam_file }}"
      loop:
        - /tmp/molecule_test/etc/pam.d/su
        - /tmp/molecule_test/etc/pam.d/sudo
      loop_control:
        loop_var: item_pam_file
      register: pam_file_stat_results

    - name: Assert PAM configuration files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected PAM configuration file not found or empty"
      loop: "{{ pam_file_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

# ===========================================================================
# Play 4: Service and port checks (tagged molecule-notest — skipped in EE)
# ===========================================================================
- name: Verify cache service endpoints (skipped in container)
  hosts: all
  gather_facts: false
  tasks:

    - name: Gather service facts
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert memcached service is active
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts['services']"
          - "ansible_facts['services']['memcached.service']['state'] == 'running'"
        fail_msg: "memcached service is not running"
      tags: molecule-notest

    - name: Assert redis@6379 service is active
      ansible.builtin.assert:
        that:
          - "'redis@6379.service' in ansible_facts['services']"
          - "ansible_facts['services']['redis@6379.service']['state'] == 'running'"
        fail_msg: "redis@6379 service is not running"
      tags: molecule-notest

    - name: Assert Redis is listening on TCP 6379
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        timeout: 5
        state: started
      tags: molecule-notest

    - name: Assert Memcached is listening on TCP 11211
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 11211
        timeout: 5
        state: started
      tags: molecule-notest
