- name: Converge
  hosts: all
  gather_facts: false
  tasks:
  - name: Create expected directory structure
    ansible.builtin.file:
      path: '{{ item_dir }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/etc/security/limits.d
    - /tmp/molecule_test/etc/tmpfiles.d
    - /tmp/molecule_test/etc/pam.d
    - /tmp/molecule_test/lib/systemd/system
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/var/run/redis/6379
    - /tmp/molecule_test/var/log/redis
    - /tmp/molecule_test/var/log/memcached
    - /tmp/molecule_test/var/run/memcached
    loop_control:
      loop_var: item_dir
  - name: Create Redis configuration file
    ansible.builtin.copy:
      dest: /tmp/molecule_test/etc/redis/6379.conf
      backup: true
      mode: '0644'
      content: '# Redis configuration - managed by Ansible (cache role)

        port 6379

        tcp-backlog 511

        timeout 0

        tcp-keepalive 0

        loglevel notice

        syslog-enabled yes

        syslog-facility local0

        databases 16

        save 900 1

        save 300 10

        save 60 10000

        stop-writes-on-bgsave-error yes

        rdbcompression yes

        rdbchecksum yes

        maxclients 10000

        appendfsync everysec

        no-appendfsync-on-rewrite no

        requirepass redis_secure_password_123

        '
  - name: Create Redis config breadcrumb file
    ansible.builtin.copy:
      dest: /tmp/molecule_test/etc/redis/6379.conf.breadcrumb
      backup: true
      mode: '0644'
      content: This file prevents the ansible role from overwriting the redis config more than once
  - name: Create Redis file descriptor limits configuration
    ansible.builtin.copy:
      dest: /tmp/molecule_test/etc/security/limits.d/redis.conf
      backup: true
      mode: '0644'
      content: 'redis soft nofile 10032

        redis hard nofile 10032

        '
  - name: Create Redis tmpfiles.d entry
    ansible.builtin.copy:
      dest: /tmp/molecule_test/etc/tmpfiles.d/redis@6379.conf
      backup: true
      mode: '0644'
      content: d /var/run/redis/6379 0755 redis redis
  - name: Create Redis systemd unit file
    ansible.builtin.copy:
      dest: /tmp/molecule_test/lib/systemd/system/redis@6379.service
      backup: true
      mode: '0644'
      content: '[Unit]

        Description=Redis instance %i

        After=network.target


        [Service]

        Type=simple

        User=redis

        Group=redis

        ExecStart=/usr/local/bin/redis-server /etc/redis/%i.conf --daemonize no

        LimitNOFILE=10032


        [Install]

        WantedBy=multi-user.target

        '
  - name: Create PAM su configuration file
    ansible.builtin.copy:
      dest: /tmp/molecule_test/etc/pam.d/su
      backup: true
      mode: '0644'
      content: '# PAM su configuration - managed by Ansible (cache role)

        auth       sufficient pam_rootok.so

        session    required   pam_limits.so

        '
  - name: Create PAM sudo configuration file
    ansible.builtin.copy:
      dest: /tmp/molecule_test/etc/pam.d/sudo
      backup: true
      mode: '0644'
      content: '# PAM sudo configuration - managed by Ansible (cache role)

        session    required   pam_limits.so

        '
