---
cache_memcached_version:
cache_memcached_memory: 64
cache_memcached_port: 11211
cache_memcached_udp_port: 11211
cache_memcached_listen: 0.0.0.0
cache_memcached_maxconn: 1024
cache_memcached_max_object_size: 1m
cache_memcached_experimental_options: []
cache_memcached_extra_cli_options: []
cache_memcached_ulimit: 1024
cache_memcached_logfilepath: /var/log/memcached
cache_memcached_user: memcached
cache_memcached_group: memcached
cache_redis_package_install: false
cache_redis_package_name: redis-server
cache_redis_bypass_setup: false
cache_redis_safe_install: true
cache_redis_version: 3.2.11
cache_redis_mirror: http://download.redis.io/releases/
cache_redis_base_name: redis-
cache_redis_artifact_type: tar.gz
cache_redis_bin_path: /usr/local/bin
cache_redis_install_dir:
cache_redis_base_piddir: /var/run/redis
cache_redis_job_control: systemd
cache_redis_servers:
  - port: "6379"
    requirepass: "{{ redis_password }}"
cache_redis_default_settings:
  user: redis
  group: redis
  permissions: "0644"
  homedir: /var/lib/redis
  shell: /bin/false
  systemuser: true
  uid:
  ulimit: 0
  configdir: /etc/redis
  name:
  tcpbacklog: "511"
  address:
  databases: "16"
  backuptype: rdb
  datadir: /var/lib/redis
  unixsocket:
  unixsocketperm:
  timeout: "0"
  keepalive: "0"
  loglevel: notice
  logfile:
  syslogenabled: "yes"
  syslogfacility: local0
  shutdown_save: false
  save:
  stopwritesonbgsaveerror: "yes"
  rdbcompression: "yes"
  rdbchecksum: "yes"
  dbfilename:
  replicaof:
  protected_mode:
  masterauth:
  replicaservestaledata: "yes"
  replicareadonly: "yes"
  repldisklesssync: "no"
  repldisklesssyncdelay: "5"
  replpingreplicaperiod: "10"
  repltimeout: "60"
  repldisabletcpnodelay: "no"
  replbacklogsize: 1mb
  replbacklogttl: 3600
  replicapriority: "100"
  requirepass:
  rename_commands:
  maxclients: 10000
  maxmemory:
  maxmemorypolicy:
  maxmemorysamples:
  appendfilename:
  appendfsync: everysec
  noappendfsynconrewrite: "no"
  aofrewritepercentage: "100"
  aofrewriteminsize: 64mb
  aofloadtruncated: "yes"
  luatimelimit: "5000"
  slowloglogslowerthan: "10000"
  slowlogmaxlen: "1024"
  notifykeyspaceevents: ""
  hashmaxziplistentries: "512"
  hashmaxziplistvalue: "64"
  setmaxintsetentries: "512"
  zsetmaxziplistentries: "128"
  zsetmaxziplistvalue: "64"
  hllsparsemaxbytes: "3000"
  activerehasing: "yes"
  clientoutputbufferlimit:
    - - normal
      - "0"
      - "0"
      - "0"
    - - replica
      - 256mb
      - 64mb
      - "60"
    - - pubsub
      - 32mb
      - 8mb
      - "60"
  hz: "10"
  aofrewriteincrementalfsync: "yes"
  clusterenabled: "no"
  clusterconfigfile:
  clusternodetimeout: 5000
  clusterport:
  includes:
  aclfile:
  data_bag_name:
  data_bag_item:
  data_bag_key:
  minreplicastowrite:
  minreplicasmaxlag:
  breadcrumb: true
  tlsport:
  tlscertfile:
  tlskeyfile:
  tlskeyfilepass:
  tlsclientcertfile:
  tlsclientkeyfile:
  tlsclientkeyfilepass:
  tlsdhparamsfile:
  tlscacertfile:
  tlscacertdir:
  tlsauthclients:
  tlsreplication:
  tlscluster:
  tlsprotocols:
  tlsciphers:
  tlsciphersuites:
  tlspreferserverciphers:
  tlssessioncaching:
  tlssessioncachesize:
  tlssessioncachetimeout:
cache_ulimit_pam_su_template: pam_su.j2
cache_ulimit_security_limits_directory: /etc/security/limits.d
