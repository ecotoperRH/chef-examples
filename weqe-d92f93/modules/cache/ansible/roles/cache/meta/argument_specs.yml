---
argument_specs:
  main:
    short_description: Install and configure Memcached and Redis caching services
    description:
      - Deploys and configures two caching services on a single host.
      - Memcached is installed from the OS package manager with configurable memory, port, and connection limits.
      - Redis is installed from source (version 3.2.11 by default) or from an OS package, configured via a generated redis.conf, and managed via systemd (or
        init.d/upstart/rcinit on older systems).
      - A post-configuration step removes incompatible directives from the Redis config for version compatibility.
    options:
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by AAP credential type at runtime. Used as the requirepass directive in /etc/redis/6379.conf.
      cache_memcached_version:
        type: str
        required: false
        default:
        description: Memcached package version to install. Null means latest available.
      cache_memcached_memory:
        type: int
        required: false
        default: 64
        description: Amount of memory (in MB) allocated to Memcached.
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: TCP port Memcached listens on.
      cache_memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: UDP port Memcached listens on.
      cache_memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: IP address Memcached binds to.
      cache_memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum number of simultaneous connections for Memcached.
      cache_memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum size of a single Memcached object.
      cache_memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: List of experimental Memcached options.
      cache_memcached_extra_cli_options:
        type: list
        elements: str
        required: false
        default: []
        description: List of extra CLI options passed to Memcached.
      cache_memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: File descriptor ulimit for the Memcached process.
      cache_memcached_logfilepath:
        type: str
        required: false
        default: /var/log/memcached
        description: Directory path for Memcached log files.
      cache_memcached_user:
        type: str
        required: false
        default: memcached
        description: System user that runs the Memcached service.
      cache_memcached_group:
        type: str
        required: false
        default: memcached
        description: System group for the Memcached service user.
      cache_redis_package_install:
        type: bool
        required: false
        default: false
        description: When true, install Redis from the OS package manager. When false (default), compile Redis from source tarball.
      cache_redis_package_name:
        type: str
        required: false
        default: redis-server
        description: OS package name for Redis (used when cache_redis_package_install is true).
      cache_redis_bypass_setup:
        type: bool
        required: false
        default: false
        description: When true, skip all Redis install and configure steps.
      cache_redis_safe_install:
        type: bool
        required: false
        default: true
        description: When true, skip compilation if the Redis binary already exists.
      cache_redis_version:
        type: str
        required: false
        default: 3.2.11
        description: Redis version to download and compile from source.
      cache_redis_mirror:
        type: str
        required: false
        default: http://download.redis.io/releases/
        description: Base URL for downloading the Redis source tarball.
      cache_redis_base_name:
        type: str
        required: false
        default: redis-
        description: Filename prefix for the Redis source tarball.
      cache_redis_artifact_type:
        type: str
        required: false
        default: tar.gz
        description: Archive format of the Redis source tarball.
      cache_redis_bin_path:
        type: str
        required: false
        default: /usr/local/bin
        description: Directory where Redis binaries are installed.
      cache_redis_install_dir:
        type: str
        required: false
        default:
        description: Custom installation directory for Redis. Null uses cache_redis_bin_path.
      cache_redis_base_piddir:
        type: str
        required: false
        default: /var/run/redis
        description: Base directory for Redis PID files.
      cache_redis_job_control:
        type: str
        required: false
        default: systemd
        description: Init system used to manage Redis services. Valid values are systemd, initd, upstart, rcinit.
      cache_redis_servers:
        type: list
        elements: dict
        required: false
        default:
          - port: "6379"
            requirepass: "{{ redis_password }}"
        description: List of Redis server instance configurations. Each entry is merged with cache_redis_default_settings. At minimum, each entry should specify
          a port.
      cache_redis_default_settings:
        type: dict
        required: false
        description: Default configuration settings applied to all Redis instances. Individual instance entries in cache_redis_servers override these defaults.
      cache_ulimit_pam_su_template:
        type: str
        required: false
        default: pam_su.j2
        description: Template file name for the PAM su configuration (Debian/Ubuntu only).
      cache_ulimit_security_limits_directory:
        type: str
        required: false
        default: /etc/security/limits.d
        description: Directory for security limits configuration files.
