---
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
- name: Restart memcached
  ansible.builtin.service:
    name: memcached
    state: restarted
- name: Restart redis
  ansible.builtin.service:
    name: redis@6379
    state: restarted
  when: cache_redis_job_control == 'systemd'
