---
# ======================================================================
# Play 1: Verify nginx configuration files
# ======================================================================
- name: Verify nginx configuration files
  hosts: all
  gather_facts: false
  tasks:

    - name: Stat nginx configuration files
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /tmp/molecule_test/etc/nginx/nginx.conf
        - /tmp/molecule_test/etc/nginx/conf.d/security.conf
        - /tmp/molecule_test/etc/nginx/sites-available/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_config
      register: nginx_config_stat

    - name: Assert nginx configuration files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected nginx config file not found or empty"
      loop: "{{ nginx_config_stat['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Slurp nginx.conf
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/nginx.conf
      register: nginx_conf_content

    - name: Assert nginx.conf contains required directives
      ansible.builtin.assert:
        that:
          - "'worker_processes' in (nginx_conf_content['content'] | b64decode)"
          - "'worker_connections' in (nginx_conf_content['content'] | b64decode)"
          - "'keepalive_timeout' in (nginx_conf_content['content'] | b64decode)"
          - "'gzip on' in (nginx_conf_content['content'] | b64decode)"
          - "'sites-enabled' in (nginx_conf_content['content'] | b64decode)"
        fail_msg: "nginx.conf is missing required directives"

    - name: Slurp security.conf
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/conf.d/security.conf
      register: security_conf_content

    - name: Assert security.conf contains required directives
      ansible.builtin.assert:
        that:
          - "'server_tokens off' in (security_conf_content['content'] | b64decode)"
          - "'limit_req_zone' in (security_conf_content['content'] | b64decode)"
          - "'client_max_body_size' in (security_conf_content['content'] | b64decode)"
          - "'ssl_protocols' in (security_conf_content['content'] | b64decode)"
          - "'TLSv1.2' in (security_conf_content['content'] | b64decode)"
          - "'TLSv1.3' in (security_conf_content['content'] | b64decode)"
        fail_msg: "security.conf is missing required security directives"

    - name: Slurp per-site nginx configs
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/nginx/sites-available/{{ item_site }}"
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site
      register: site_conf_slurp

    - name: Assert per-site configs contain SSL and security headers
      ansible.builtin.assert:
        that:
          - "'listen 443' in (item_result['content'] | b64decode)"
          - "'ssl_certificate' in (item_result['content'] | b64decode)"
          - "'ssl_certificate_key' in (item_result['content'] | b64decode)"
          - "'Strict-Transport-Security' in (item_result['content'] | b64decode)"
          - "'X-Frame-Options' in (item_result['content'] | b64decode)"
          - "'X-Content-Type-Options' in (item_result['content'] | b64decode)"
          - "'return 301' in (item_result['content'] | b64decode)"
        fail_msg: "Site config is missing required SSL or security header directives"
      loop: "{{ site_conf_slurp['results'] }}"
      loop_control:
        loop_var: item_result

# ======================================================================
# Play 2: Verify sites-enabled symlinks and default site removal
# ======================================================================
- name: Verify sites-enabled symlinks and default site removal
  hosts: all
  gather_facts: false
  tasks:

    - name: Stat sites-enabled symlinks
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/nginx/sites-enabled/{{ item_link }}"
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_link
      register: sites_enabled_stat

    - name: Assert sites-enabled symlinks exist and are symlinks
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['islnk']
        fail_msg: "Expected sites-enabled symlink not found or is not a symlink"
      loop: "{{ sites_enabled_stat['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Assert symlinks point to correct sites-available paths
      ansible.builtin.assert:
        that:
          - item_result['stat']['lnk_target'] is search('sites-available')
        fail_msg: "Symlink does not point to sites-available directory"
      loop: "{{ sites_enabled_stat['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Stat default nginx site (must be absent)
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/nginx/sites-enabled/default
      register: default_site_stat

    - name: Assert default nginx site has been removed
      ansible.builtin.assert:
        that:
          - not default_site_stat['stat']['exists']
        fail_msg: "Default nginx site still exists — it should have been removed"

# ======================================================================
# Play 3: Verify document roots and static index files
# ======================================================================
- name: Verify document roots and static index files
  hosts: all
  gather_facts: false
  tasks:

    - name: Stat document root directories
      ansible.builtin.stat:
        path: "{{ item_docroot }}"
      loop:
        - /tmp/molecule_test/opt/server/test
        - /tmp/molecule_test/opt/server/ci
        - /tmp/molecule_test/opt/server/status
      loop_control:
        loop_var: item_docroot
      register: docroot_stat

    - name: Assert document root directories exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected document root directory not found"
      loop: "{{ docroot_stat['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Stat static index files
      ansible.builtin.stat:
        path: "{{ item_html }}"
      loop:
        - /tmp/molecule_test/opt/server/test/index.html
        - /tmp/molecule_test/opt/server/ci/index.html
        - /tmp/molecule_test/opt/server/status/index.html
      loop_control:
        loop_var: item_html
      register: index_stat

    - name: Assert static index files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
          - item_result['stat']['isreg']
        fail_msg: "Expected index.html not found or empty"
      loop: "{{ index_stat['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Slurp static index files
      ansible.builtin.slurp:
        src: "{{ item_html }}"
      loop:
        - /tmp/molecule_test/opt/server/test/index.html
        - /tmp/molecule_test/opt/server/ci/index.html
        - /tmp/molecule_test/opt/server/status/index.html
      loop_control:
        loop_var: item_html
      register: index_slurp

    - name: Assert static index files contain HTML content
      ansible.builtin.assert:
        that:
          - "'<!DOCTYPE html>' in (item_result['content'] | b64decode)"
        fail_msg: "index.html does not contain expected HTML content"
      loop: "{{ index_slurp['results'] }}"
      loop_control:
        loop_var: item_result

# ======================================================================
# Play 4: Verify SSL certificate and key files
# ======================================================================
- name: Verify SSL certificate and key files
  hosts: all
  gather_facts: false
  tasks:

    - name: Stat SSL certificate files
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/ssl/certs/{{ item_cert }}.crt"
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_cert
      register: ssl_cert_stat

    - name: Assert SSL certificate files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL certificate file not found or empty"
      loop: "{{ ssl_cert_stat['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Stat SSL private key files
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/ssl/private/{{ item_key }}.key"
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_key
      register: ssl_key_stat

    - name: Assert SSL private key files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL private key file not found or empty"
      loop: "{{ ssl_key_stat['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Assert SSL private key files have restricted permissions (0640)
      ansible.builtin.assert:
        that:
          - item_result['stat']['mode'] == '0640'
        fail_msg: "SSL private key does not have expected mode 0640"
      loop: "{{ ssl_key_stat['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Stat SSL certificate directory
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/ssl/certs
      register: ssl_certs_dir_stat

    - name: Assert SSL certificate directory exists
      ansible.builtin.assert:
        that:
          - ssl_certs_dir_stat['stat']['exists']
          - ssl_certs_dir_stat['stat']['isdir']
        fail_msg: "SSL certificate directory not found"

    - name: Stat SSL private key directory
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/ssl/private
      register: ssl_private_dir_stat

    - name: Assert SSL private key directory exists
      ansible.builtin.assert:
        that:
          - ssl_private_dir_stat['stat']['exists']
          - ssl_private_dir_stat['stat']['isdir']
        fail_msg: "SSL private key directory not found"

# ======================================================================
# Play 5: Verify security configuration files
# ======================================================================
- name: Verify security configuration files
  hosts: all
  gather_facts: false
  tasks:

    - name: Stat fail2ban jail.local
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/fail2ban/jail.local
      register: jail_local_stat

    - name: Assert fail2ban jail.local exists and is non-empty
      ansible.builtin.assert:
        that:
          - jail_local_stat['stat']['exists']
          - jail_local_stat['stat']['size'] > 0
        fail_msg: "fail2ban jail.local not found or empty"

    - name: Slurp fail2ban jail.local
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/fail2ban/jail.local
      register: jail_local_content

    - name: Assert fail2ban jail.local contains required jail sections
      ansible.builtin.assert:
        that:
          - "'[DEFAULT]' in (jail_local_content['content'] | b64decode)"
          - "'bantime' in (jail_local_content['content'] | b64decode)"
          - "'findtime' in (jail_local_content['content'] | b64decode)"
          - "'maxretry' in (jail_local_content['content'] | b64decode)"
          - "'[sshd]' in (jail_local_content['content'] | b64decode)"
          - "'[nginx-http-auth]' in (jail_local_content['content'] | b64decode)"
          - "'[nginx-limit-req]' in (jail_local_content['content'] | b64decode)"
          - "'[nginx-botsearch]' in (jail_local_content['content'] | b64decode)"
        fail_msg: "fail2ban jail.local is missing required jail sections"

    - name: Stat sysctl security config
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-security.conf
      register: sysctl_conf_stat

    - name: Assert sysctl security config exists and is non-empty
      ansible.builtin.assert:
        that:
          - sysctl_conf_stat['stat']['exists']
          - sysctl_conf_stat['stat']['size'] > 0
        fail_msg: "sysctl 99-security.conf not found or empty"

    - name: Slurp sysctl security config
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-security.conf
      register: sysctl_conf_content

    - name: Assert sysctl config contains required kernel hardening parameters
      ansible.builtin.assert:
        that:
          - "'rp_filter' in (sysctl_conf_content['content'] | b64decode)"
          - "'accept_redirects' in (sysctl_conf_content['content'] | b64decode)"
          - "'send_redirects' in (sysctl_conf_content['content'] | b64decode)"
          - "'accept_source_route' in (sysctl_conf_content['content'] | b64decode)"
          - "'log_martians' in (sysctl_conf_content['content'] | b64decode)"
          - "'icmp_echo_ignore_all' in (sysctl_conf_content['content'] | b64decode)"
          - "'tcp_syncookies' in (sysctl_conf_content['content'] | b64decode)"
          - "'tcp_max_syn_backlog' in (sysctl_conf_content['content'] | b64decode)"
          - "'disable_ipv6' in (sysctl_conf_content['content'] | b64decode)"
        fail_msg: "sysctl config is missing required kernel hardening parameters"

# ======================================================================
# Play 6: Verify SSH hardening and log files
# ======================================================================
- name: Verify SSH hardening and log files
  hosts: all
  gather_facts: false
  tasks:

    - name: Stat sshd_config
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/ssh/sshd_config
      register: sshd_config_stat

    - name: Assert sshd_config exists
      ansible.builtin.assert:
        that:
          - sshd_config_stat['stat']['exists']
          - sshd_config_stat['stat']['size'] > 0
        fail_msg: "sshd_config not found or empty"

    - name: Slurp sshd_config
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/ssh/sshd_config
      register: sshd_config_content

    - name: Assert sshd_config has PermitRootLogin no
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (sshd_config_content['content'] | b64decode)"
        fail_msg: "sshd_config does not contain 'PermitRootLogin no'"

    - name: Assert sshd_config has PasswordAuthentication no
      ansible.builtin.assert:
        that:
          - "'PasswordAuthentication no' in (sshd_config_content['content'] | b64decode)"
        fail_msg: "sshd_config does not contain 'PasswordAuthentication no'"

    - name: Stat nginx log files
      ansible.builtin.stat:
        path: "/tmp/molecule_test/var/log/nginx/{{ item_log }}"
      loop:
        - access.log
        - error.log
        - test.cluster.local_access.log
        - test.cluster.local_error.log
        - ci.cluster.local_access.log
        - ci.cluster.local_error.log
        - status.cluster.local_access.log
        - status.cluster.local_error.log
      loop_control:
        loop_var: item_log
      register: nginx_log_stat

    - name: Assert nginx log files exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
        fail_msg: "Expected nginx log file not found"
      loop: "{{ nginx_log_stat['results'] }}"
      loop_control:
        loop_var: item_result

# ======================================================================
# Play 7: Service and network checks (container-unsafe — tagged notest)
# ======================================================================
- name: Verify services and network ports (skipped in container)
  hosts: all
  gather_facts: false
  tasks:

    - name: Gather service facts
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert nginx service is active
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts['services']"
          - "ansible_facts['services']['nginx.service']['state'] == 'running'"
        fail_msg: "nginx service is not running"
      tags: molecule-notest

    - name: Assert fail2ban service is active
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts['services']"
          - "ansible_facts['services']['fail2ban.service']['state'] == 'running'"
        fail_msg: "fail2ban service is not running"
      tags: molecule-notest

    - name: Check nginx is listening on port 80
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 80
        timeout: 5
        state: started
      tags: molecule-notest

    - name: Check nginx is listening on port 443
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 443
        timeout: 5
        state: started
      tags: molecule-notest

    - name: Check HTTP redirect for test.cluster.local
      ansible.builtin.uri:
        url: http://test.cluster.local
        follow_redirects: none
        status_code: 301
        validate_certs: false
      tags: molecule-notest

    - name: Check HTTPS response for test.cluster.local
      ansible.builtin.uri:
        url: https://test.cluster.local
        status_code: 200
        validate_certs: false
      tags: molecule-notest

    - name: Check HTTP redirect for ci.cluster.local
      ansible.builtin.uri:
        url: http://ci.cluster.local
        follow_redirects: none
        status_code: 301
        validate_certs: false
      tags: molecule-notest

    - name: Check HTTPS response for ci.cluster.local
      ansible.builtin.uri:
        url: https://ci.cluster.local
        status_code: 200
        validate_certs: false
      tags: molecule-notest

    - name: Check HTTP redirect for status.cluster.local
      ansible.builtin.uri:
        url: http://status.cluster.local
        follow_redirects: none
        status_code: 301
        validate_certs: false
      tags: molecule-notest

    - name: Check HTTPS response for status.cluster.local
      ansible.builtin.uri:
        url: https://status.cluster.local
        status_code: 200
        validate_certs: false
      tags: molecule-notest
