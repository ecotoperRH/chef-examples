---
fastapi_tutorial_app_directory: /opt/fastapi-tutorial
fastapi_tutorial_repository: https://github.com/dibanez/fastapi_tutorial.git
fastapi_tutorial_revision: main
fastapi_tutorial_virtualenv: /opt/fastapi-tutorial/venv
fastapi_tutorial_service_name: fastapi-tutorial
fastapi_tutorial_service_file: /etc/systemd/system/fastapi-tutorial.service
fastapi_tutorial_listen_host: 0.0.0.0
fastapi_tutorial_listen_port: 8000
fastapi_tutorial_project_name: FastAPI Tutorial
fastapi_tutorial_api_version: 1.0.0
fastapi_tutorial_postgresql_service: postgresql
fastapi_tutorial_packages:
  Debian:
    - python3
    - python3-pip
    - python3-venv
    - git
    - postgresql
    - postgresql-contrib
    - libpq-dev
  RedHat:
    - python3
    - python3-pip
    - python3-venv
    - git
    - postgresql-server
    - postgresql-contrib
    - libpq-devel
