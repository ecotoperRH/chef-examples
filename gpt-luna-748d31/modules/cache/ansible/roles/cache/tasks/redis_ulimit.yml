---
- name: Configure PAM su limits when configured
  ansible.builtin.template:
    src: pam_su.j2
    dest: /etc/pam.d/su
    mode: "0644"
    backup: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - redis_pam_su_template | length > 0

- name: Install PAM sudo limits file when configured
  ansible.builtin.copy:
    src: "{{ redis_pam_sudo_source }}" # noqa: R114 - source is a trusted role setting
    dest: /etc/pam.d/sudo
    mode: "0644"
    backup: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - redis_pam_sudo_source | length > 0

- name: Configure Redis user limits
  ansible.builtin.copy:
    content: |
      redis soft nofile {{ redis_ulimit }}
      redis hard nofile {{ redis_ulimit }}
    dest: /etc/security/limits.d/redis.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: ansible_facts['os_family'] != 'FreeBSD'
