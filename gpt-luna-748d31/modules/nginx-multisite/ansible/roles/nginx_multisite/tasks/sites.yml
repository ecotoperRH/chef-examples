---
- name: Create nginx virtual host directories  # noqa: R114 - paths come from the role-defined loop values
  ansible.builtin.file:
    path: "{{ item_nginx_directory }}"
    owner: root
    group: root
    mode: "0755"
    state: directory
  loop:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
  loop_control:
    loop_var: item_nginx_directory

- name: Configure nginx virtual hosts
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item_site['key'] }}" # noqa: R114 - site names come from the role-defined sites dictionary
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: Reload nginx
  vars:
    server_name: "{{ item_site['key'] }}"
    document_root: "{{ item_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_site['value']['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_site['key'] }}.crt"
    key_file: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_site['key'] }}.key"

- name: Enable nginx virtual hosts
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item_enabled['key'] }}" # noqa: R114 - source uses role-defined site names
    dest: "/etc/nginx/sites-enabled/{{ item_enabled['key'] }}" # noqa: R114 - destination uses role-defined site names
    state: link
    mode: "0644"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_enabled
  notify: Reload nginx

- name: Remove default nginx virtual host
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
