---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Deploy fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: "{{ nginx_multisite_fail2ban_enabled }}"
    state: started

- name: Set UFW default policy to deny
  ansible.builtin.command:
    cmd: ufw --force default deny
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Allow SSH through UFW
  ansible.builtin.command:
    cmd: ufw allow ssh
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Allow HTTP through UFW
  ansible.builtin.command:
    cmd: ufw allow http
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    cmd: ufw allow https
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Enable UFW
  ansible.builtin.command:
    cmd: ufw --force enable
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Deploy kernel security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true

- name: Disable root SSH login
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*$
    replace: PermitRootLogin no
    backup: true
  when: nginx_multisite_disable_root_login | bool

- name: Disable SSH password authentication
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*$
    replace: PasswordAuthentication no
    backup: true
  when: not nginx_multisite_password_auth | bool
