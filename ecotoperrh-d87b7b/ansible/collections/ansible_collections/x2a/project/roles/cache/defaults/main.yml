---
cache_secure_logging: true
# Memcached defaults
cache_memcached_version:
cache_memcached_memory: 64
cache_memcached_port: 11211
cache_memcached_udp_port: 11211
cache_memcached_listen: 0.0.0.0
cache_memcached_maxconn: 1024
cache_memcached_max_object_size: 1m
cache_memcached_experimental_options: []
cache_memcached_extra_cli_options: []
cache_memcached_ulimit: 1024
cache_memcached_logfilepath: /var/log/memcached
cache_memcached_threads: 4
cache_memcached_user: service_user
# Redis defaults
cache_redis_package_install: false
cache_redis_version: 3.2.11
cache_redis_safe_install: true
cache_redis_bypass_setup: false
cache_redis_mirror: http://download.redis.io/releases/
cache_redis_base_name: redis-
cache_redis_artifact_type: tar.gz
cache_redis_base_piddir: /var/run/redis
cache_redis_install_dir:
cache_redis_config_dir: /etc/redis
cache_redis_package_name: redis-server
cache_redis_service_name: redis-server
cache_redis_job_control: systemd
cache_redis_servers:
  - port: 6379
    requirepass: "{{ redis_requirepass }}"
    name: "6379"
    user: redis
    group: redis
    homedir: /var/lib/redis
    datadir: /var/lib/redis
    configdir: /etc/redis
    tcpbacklog: "511"
    databases: "16"
    loglevel: notice
    syslogenabled: "yes"
    maxclients: 10000
    logfile: /var/log/redis/6379.log
    unixsocket:
    replicaservestaledata:
cache_redis_default_settings:
  user: redis
  group: redis
  homedir: /var/lib/redis
  shell: /bin/false
  systemuser: true
  configdir: /etc/redis
  datadir: /var/lib/redis
  tcpbacklog: "511"
  databases: "16"
  loglevel: notice
  syslogenabled: "yes"
  maxclients: 10000
  requirepass:
cache_redis_build_packages:
  - build-essential
  - tcl
cache_redis_ulimit_users: {}
cache_redis_ulimit_security_limits_directory: /etc/security/limits.d
cache_redis_ulimit_pam_su_template:
cache_redis_ulimit_sudo_file_name: sudo
