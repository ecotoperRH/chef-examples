---
- name: Configure PAM su limits on Debian-family systems
  ansible.builtin.template:
    src: pam_su.j2
    dest: /etc/pam.d/su
    mode: "0644"
    backup: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - cache_redis_ulimit_pam_su_template is not none

- name: Check for optional PAM sudo limits file
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ cache_redis_ulimit_sudo_file_name }}"
  delegate_to: localhost
  become: false
  register: cache_pam_sudo_file
  when: ansible_facts['os_family'] == 'Debian'

- name: Deploy PAM sudo limits file on Debian-family systems # noqa: L039 - cache_pam_sudo_file is registered by the preceding stat task
  ansible.builtin.copy: # noqa: R114 - destination is a fixed system path
    src: "{{ cache_redis_ulimit_sudo_file_name }}"
    dest: /etc/pam.d/sudo
    mode: "0644"
    backup: true
    force: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - cache_pam_sudo_file.stat.exists | default(false)

- name: Configure per-user Redis limits
  ansible.builtin.include_tasks: redis_user_ulimit.yml
  loop: "{{ cache_redis_ulimit_users | dict2items }}"
  loop_control:
    loop_var: item_cache
