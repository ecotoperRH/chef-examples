---
- name: Render virtual host configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_site['key'] }} # noqa: R114 - site names come from role-defined sites dictionary
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: Reload nginx_multisite nginx
  vars:
    server_name: "{{ item_site['key'] }}"
    document_root: "{{ item_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_site['value']['ssl_enabled'] }}"
    cert_file: "{{ item_site['value']['cert_file'] }}"
    key_file: "{{ item_site['value']['key_file'] }}"

- name: Enable virtual host configurations
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_enabled['key'] }} # noqa: R114 - site names come from role-defined sites dictionary
    dest: /etc/nginx/sites-enabled/{{ item_enabled['key'] }} # noqa: R114 - site names come from role-defined sites dictionary
    state: link
    force: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_enabled
  notify: Reload nginx_multisite nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx_multisite nginx

- name: Validate Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
