---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory # noqa: R114 - path comes from role defaults
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create private key directory # noqa: R114 - path comes from role defaults
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}"
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Generate self-signed certificates # noqa: R101 - command arguments come from role-defined sites dictionary
  ansible.builtin.shell:
    cmd: |
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \\
        -keyout "{{ item_ssl['value']['key_file'] }}" \\
        -out "{{ item_ssl['value']['cert_file'] }}" \\
        -subj "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl['key'] }}/emailAddress=admin@example.com"
      chmod 0640 "{{ item_ssl['value']['key_file'] }}"
      chown root:ssl-cert "{{ item_ssl['value']['key_file'] }}"
    creates: "{{ item_ssl['value']['cert_file'] }}"
  when: item_ssl['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl
  notify: Reload nginx_multisite nginx
