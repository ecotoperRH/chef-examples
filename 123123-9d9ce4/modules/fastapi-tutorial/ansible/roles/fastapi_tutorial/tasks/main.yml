---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install required system packages
  ansible.builtin.package:
    name: "{{ required_packages }}"
    state: present
- name: Enable and start PostgreSQL service
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
- name: Check if PostgreSQL user exists
  ansible.builtin.command:
    cmd: sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ username }}'"
  register: user_exists
  changed_when: false
  no_log: true
- name: Create PostgreSQL user
  ansible.builtin.shell:
    cmd: sudo -u postgres psql -c "CREATE USER {{ username }} WITH PASSWORD '{{ password }}';"
  register: create_user
  when: user_exists.stdout == ""
  changed_when: create_user.rc == 0
  failed_when: create_user.rc != 0 and "already exists" not in create_user.stderr
  no_log: true
- name: Check if PostgreSQL database exists
  ansible.builtin.command:
    cmd: sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ database_name }}'"
  register: db_exists
  changed_when: false
  no_log: true
- name: Create PostgreSQL database
  ansible.builtin.shell:
    cmd: sudo -u postgres psql -c "CREATE DATABASE {{ database_name }} OWNER {{ username }};"
  register: create_db
  when: db_exists.stdout == ""
  changed_when: create_db.rc == 0
  failed_when: create_db.rc != 0 and "already exists" not in create_db.stderr
  no_log: true
- name: Grant privileges on database
  ansible.builtin.shell:
    cmd: sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ username }};"
  register: grant_privileges
  changed_when: grant_privileges.rc == 0
  failed_when: grant_privileges.rc != 0
  no_log: true
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Clone FastAPI tutorial repository
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_branch }}"
- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv "{{ python_venv_path }}"
    creates: "{{ python_venv_path }}"
- name: Install Python dependencies
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ python_venv_path }}"
    state: present
- name: Create environment configuration file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: root
    group: root
    mode: "0644"
- name: Create systemd service file
  ansible.builtin.template:
    src: fastapi-tutorial.service.j2
    dest: /etc/systemd/system/fastapi-tutorial.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd daemon
- name: Enable and start FastAPI service
  ansible.builtin.service:
    name: fastapi-tutorial
    state: started
    enabled: true
