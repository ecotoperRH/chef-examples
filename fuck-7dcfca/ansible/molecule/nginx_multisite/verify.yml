---
# Unsupported pre-flight checks: detailed UFW policy output, sysctl contents, fail2ban-client
# status, SSH access availability, log review, symlink target text, HTTP/HTTPS curl checks,
# and listener enumeration have no explicit expected result here or depend on the pending
# listener confirmation in site.conf.erb.
- name: Verify nginx-multisite deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        fail_msg: "A required package is not installed"
      loop:
        - fail2ban
        - ufw
        - nginx
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather managed service facts
      ansible.builtin.service_facts:

    - name: Verify managed services are present
      ansible.builtin.assert:
        that:
          - (item_service['name'] ~ '.service') in ansible_facts['services']
        fail_msg: "A managed service is not present"
      loop:
        - name: fail2ban
        - name: nginx
      loop_control:
        loop_var: item_service

    - name: Verify managed services are running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts['services'][item_service['name'] ~ '.service']['state'] == 'running'
          - ansible_facts['services'][item_service['name'] ~ '.service']['status'] == 'enabled'
        fail_msg: "A managed service is not running and enabled"
      loop:
        - name: fail2ban
        - name: nginx
      loop_control:
        loop_var: item_service

    - name: Validate Nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Dump Nginx configuration for configured host checks
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      changed_when: false
      register: nginx_configuration_dump

    - name: Verify configured site names are present in Nginx configuration
      ansible.builtin.assert:
        that:
          - item_site in nginx_configuration_dump['stdout']
        fail_msg: "A configured site name is missing from the Nginx configuration"
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site

    - name: Check required rendered directories
      ansible.builtin.stat:
        path: "{{ item_directory }}"
        follow: false
      loop:
        - /opt/server/test
        - /opt/server/ci
        - /opt/server/status
      loop_control:
        loop_var: item_directory
      register: rendered_directories

    - name: Verify required rendered directories exist
      ansible.builtin.assert:
        that:
          - item_directory_stat['stat']['exists']
          - item_directory_stat['stat']['isdir']
        fail_msg: "A required document root directory is missing"
      loop: "{{ rendered_directories['results'] }}"
      loop_control:
        loop_var: item_directory_stat

    - name: Check required rendered files
      ansible.builtin.stat:
        path: "{{ item_file }}"
        follow: false
      loop:
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_file
      register: rendered_files

    - name: Verify required rendered files exist
      ansible.builtin.assert:
        that:
          - item_file_stat['stat']['exists']
          - item_file_stat['stat']['isreg']
        fail_msg: "A required rendered file is missing"
      loop: "{{ rendered_files['results'] }}"
      loop_control:
        loop_var: item_file_stat

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_link }}"
        follow: false
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_link
      register: enabled_site_links

    - name: Verify enabled site links exist
      ansible.builtin.assert:
        that:
          - item_link_stat['stat']['exists']
          - item_link_stat['stat']['islnk']
        fail_msg: "A required enabled-site symlink is missing"
      loop: "{{ enabled_site_links['results'] }}"
      loop_control:
        loop_var: item_link_stat

    - name: Check the default Nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
        follow: false
      register: default_site

    - name: Verify the default Nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']
        fail_msg: "The default Nginx site still exists"

    - name: Check TLS private-key metadata
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
        follow: false
      loop:
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: tls_key_metadata

    - name: Verify TLS private-key metadata
      ansible.builtin.assert:
        that:
          - item_key_stat['stat']['pw_name'] == 'root'
          - item_key_stat['stat']['gr_name'] == 'ssl-cert'
          - item_key_stat['stat']['mode'] == '0640'
        fail_msg: "A TLS private key has unexpected metadata"
      loop: "{{ tls_key_metadata['results'] }}"
      loop_control:
        loop_var: item_key_stat

    - name: Inspect TLS certificate subjects
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
      changed_when: false
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          common_name: test.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
          common_name: ci.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
          common_name: status.cluster.local
      loop_control:
        loop_var: item_certificate
      register: certificate_subjects

    - name: Verify TLS certificate common names
      ansible.builtin.assert:
        that:
          - (('CN=' ~ item_certificate_result['item']['common_name']) in item_certificate_result['stdout']) or
            (('CN = ' ~ item_certificate_result['item']['common_name']) in item_certificate_result['stdout'])
        fail_msg: "A TLS certificate has an unexpected common name"
      loop: "{{ certificate_subjects['results'] }}"
      loop_control:
        loop_var: item_certificate_result

    - name: Verify TLS certificates are not expired
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate_check }}"
          - -noout
          - -checkend
          - "0"
      changed_when: false
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_certificate_check
