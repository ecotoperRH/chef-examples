---
- name: Install Nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Ensure Nginx service group exists
  ansible.builtin.group:
    name: www-data
    system: true
    state: present

- name: Ensure Nginx service account exists
  ansible.builtin.user:
    name: www-data
    group: www-data
    system: true
    state: present

- name: Render Nginx global configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Validate and reload nginx

- name: Render Nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Validate and reload nginx

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Create site document roots
  ansible.builtin.file:
    path: "{{ item_nginx_site['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dictionary
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
    recurse: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site

- name: Deploy site index files
  ansible.builtin.copy:
    src: "{{ item_index['key'].split('.')[0] }}/index.html"
    dest: "{{ item_index['value']['document_root'] }}/index.html" # noqa: R114 - destination from role-defined sites dictionary
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_index
