---
- name: Validate Nginx configuration and reload
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
  notify: Reload nginx
  listen: Validate and reload nginx

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
  listen: Reload nginx

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload security sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

- name: Restart ssh
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}"
    state: restarted
