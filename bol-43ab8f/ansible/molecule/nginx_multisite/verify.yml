---
# Unsupported pre-flight checks omitted: service-log review; the unquantified
# nginx.conf/security.conf and sysctl file contents; sysctl --system semantics;
# exact HTTP status/body responses; and template render counts.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts.packages
        fail_msg: "Required package is not installed: {{ item_package }}"
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify managed services are enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ item_service }}"
      register: enabled_service_checks
      changed_when: false
      loop:
        - nginx
        - fail2ban
      loop_control:
        loop_var: item_service

    - name: Assert managed services are enabled
      ansible.builtin.assert:
        that:
          - item_service_check.stdout | trim == 'enabled'
        fail_msg: "Managed service is not enabled"
      loop: "{{ enabled_service_checks.results }}"
      loop_control:
        loop_var: item_service_check

    - name: Verify managed services are active
      ansible.builtin.assert:
        that:
          - ansible_facts.services[item_service + '.service']['state'] == 'running'
        fail_msg: "Managed service is not active"
      loop:
        - nginx
        - fail2ban
      loop_control:
        loop_var: item_service

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: nginx_config_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_config_test.rc == 0
        fail_msg: "nginx configuration validation failed"

    - name: Check required configuration files
      ansible.builtin.stat:
        path: "{{ item_config_path }}"
      register: configuration_file_checks
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_config_path

    - name: Assert required configuration files exist
      ansible.builtin.assert:
        that:
          - item_configuration.stat.exists
          - item_configuration.stat.isreg
        fail_msg: "Required configuration file is missing"
      loop: "{{ configuration_file_checks.results }}"
      loop_control:
        loop_var: item_configuration

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_site_link['link'] }}"
        follow: false
      register: enabled_site_link_checks
      loop:
        - link: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - link: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - link: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_site_link

    - name: Assert enabled site links resolve correctly
      ansible.builtin.assert:
        that:
          - item_enabled_link.stat.islnk
          - item_enabled_link.stat.lnk_source == item_enabled_link.item['target']
        fail_msg: "Enabled site link is missing or points to the wrong configuration"
      loop: "{{ enabled_site_link_checks.results }}"
      loop_control:
        loop_var: item_enabled_link

    - name: Check the default enabled site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site_check

    - name: Assert the default enabled site is absent
      ansible.builtin.assert:
        that:
          - not default_site_check.stat.exists
        fail_msg: "The default nginx site must not exist"

    - name: Check site document roots and index files
      ansible.builtin.stat:
        path: "{{ item_site_path }}"
      register: site_path_checks
      loop:
        - /opt/server/test
        - /opt/server/test/index.html
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /opt/server/status
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_site_path

    - name: Assert site document roots and index files exist
      ansible.builtin.assert:
        that:
          - item_site_path_check.stat.exists
        fail_msg: "Required site path is missing"
      loop: "{{ site_path_checks.results }}"
      loop_control:
        loop_var: item_site_path_check

    - name: Check TLS certificate and private key files
      ansible.builtin.stat:
        path: "{{ item_tls['path'] }}"
      register: tls_file_checks
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          kind: certificate
        - path: /etc/ssl/private/test.cluster.local.key
          kind: key
        - path: /etc/ssl/certs/ci.cluster.local.crt
          kind: certificate
        - path: /etc/ssl/private/ci.cluster.local.key
          kind: key
        - path: /etc/ssl/certs/status.cluster.local.crt
          kind: certificate
        - path: /etc/ssl/private/status.cluster.local.key
          kind: key
      loop_control:
        loop_var: item_tls

    - name: Assert TLS files exist
      ansible.builtin.assert:
        that:
          - item_tls_check.stat.exists
          - item_tls_check.stat.isreg
        fail_msg: "Required TLS file is missing"
      loop: "{{ tls_file_checks.results }}"
      loop_control:
        loop_var: item_tls_check

    - name: Verify TLS private-key ownership and mode
      ansible.builtin.stat:
        path: "{{ item_key_path }}"
      register: private_key_metadata
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key_path

    - name: Assert TLS private-key ownership and mode
      ansible.builtin.assert:
        that:
          - item_key_metadata.stat.pw_name == 'root'
          - item_key_metadata.stat.gr_name == 'ssl-cert'
          - item_key_metadata.stat.mode == '0640'
        fail_msg: "TLS private-key ownership or mode is incorrect"
      loop: "{{ private_key_metadata.results }}"
      loop_control:
        loop_var: item_key_metadata

    - name: Inspect certificate subjects and issuers
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
          - -issuer
      register: certificate_identity_checks
      changed_when: false
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          common_name: test.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
          common_name: ci.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
          common_name: status.cluster.local
      loop_control:
        loop_var: item_certificate

    - name: Assert certificates are self-signed with site-specific common names
      ansible.builtin.assert:
        that:
          - item_certificate_identity.stdout is search(item_certificate_identity.item['common_name'])
          - item_certificate_identity.stdout_lines | length == 2
          - (item_certificate_identity.stdout_lines[0] | regex_replace('^subject=', '')) == (item_certificate_identity.stdout_lines[1] | regex_replace('^issuer=', ''))
        fail_msg: "Certificate identity or self-signature is incorrect"
      loop: "{{ certificate_identity_checks.results }}"
      loop_control:
        loop_var: item_certificate_identity

    - name: Check SSH effective hardening settings
      ansible.builtin.command:
        argv:
          - sshd
          - -T
      register: ssh_effective_settings
      changed_when: false

    - name: Assert SSH effective hardening settings
      ansible.builtin.assert:
        that:
          - ssh_effective_settings.stdout is search('(?m)^permitrootlogin no$')
          - ssh_effective_settings.stdout is search('(?m)^passwordauthentication no$')
        fail_msg: "SSH hardening settings are not effective"

    - name: Validate SSH configuration syntax
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      changed_when: false

    - name: Verify UFW policy and allowances
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: ufw_status_check
      changed_when: false

    - name: Assert UFW denies incoming traffic and allows SSH HTTP and HTTPS
      ansible.builtin.assert:
        that:
          - ufw_status_check.stdout is search('Default: deny \(incoming\)')
          - ufw_status_check.stdout is search('22')
          - ufw_status_check.stdout is search('80')
          - ufw_status_check.stdout is search('443')
        fail_msg: "UFW policy or required allowance is missing"

    - name: Verify nginx listens on HTTP and HTTPS ports
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_listen_port }}"
        state: started
        timeout: 5
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_listen_port
