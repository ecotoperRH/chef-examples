---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_security_fail2ban_enabled | bool

- name: Configure fail2ban jail
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_security_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Set UFW default incoming policy
  community.general.ufw:
    policy: deny
    direction: incoming
  when: nginx_multisite_security_ufw_enabled | bool

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    name: OpenSSH
  when: nginx_multisite_security_ufw_enabled | bool

- name: Allow HTTP through UFW
  community.general.ufw:
    rule: allow
    name: WWW
  when: nginx_multisite_security_ufw_enabled | bool

- name: Allow HTTPS through UFW
  community.general.ufw:
    rule: allow
    name: "WWW Secure"
  when: nginx_multisite_security_ufw_enabled | bool

- name: Enable UFW
  community.general.ufw:
    state: enabled
  when: nginx_multisite_security_ufw_enabled | bool

- name: Configure kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Apply sysctl settings

- name: Check SSH daemon configuration
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable root SSH login  # noqa: L039 - variable is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin.*"
    line: PermitRootLogin no
    state: present
    create: false
  when:
    - nginx_multisite_security_ssh_disable_root | bool
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart SSH

- name: Disable SSH password authentication  # noqa: L039 - variable is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication.*"
    line: PasswordAuthentication no
    state: present
    create: false
  when:
    - not nginx_multisite_security_ssh_password_auth | bool
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart SSH
