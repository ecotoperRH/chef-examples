---
controller_credentials:
  - name: Nginx TLS Private Keys - nginx_multisite
    description: Three locally generated, passphrase-free RSA private keys used by the Nginx HTTPS virtual hosts. The migration should move their secret 
      material into Ansible Vault or an approved enterprise secret manager.
    organization: Default
    credential_type: Nginx TLS Private Keys
    update_secrets: true
    inputs:
      test_cluster_local_private_key: "{{ vault_test_cluster_local_private_key }}"
      ci_cluster_local_private_key: "{{ vault_ci_cluster_local_private_key }}"
      status_cluster_local_private_key: "{{ vault_status_cluster_local_private_key }}"
