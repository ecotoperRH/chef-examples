---
controller_credential_types:
  - name: Nginx TLS Private Keys
    description: Three locally generated, passphrase-free RSA private keys used by the Nginx HTTPS virtual hosts. The migration should move their secret 
      material into Ansible Vault or an approved enterprise secret manager.
    kind: cloud
    inputs:
      fields:
        - id: test_cluster_local_private_key
          type: string
          label: Test Cluster Local Private Key
          secret: true
          help_text: RSA private key for the test.cluster.local HTTPS virtual host; currently stored at /etc/ssl/private/test.cluster.local.key.
        - id: ci_cluster_local_private_key
          type: string
          label: CI Cluster Local Private Key
          secret: true
          help_text: RSA private key for the ci.cluster.local HTTPS virtual host; currently stored at /etc/ssl/private/ci.cluster.local.key.
        - id: status_cluster_local_private_key
          type: string
          label: Status Cluster Local Private Key
          secret: true
          help_text: RSA private key for the status.cluster.local HTTPS virtual host; currently stored at /etc/ssl/private/status.cluster.local.key.
      required:
        - test_cluster_local_private_key
        - ci_cluster_local_private_key
        - status_cluster_local_private_key
    injectors:
      extra_vars:
        test_cluster_local_private_key: !unsafe "{{ test_cluster_local_private_key }}"
        ci_cluster_local_private_key: !unsafe "{{ ci_cluster_local_private_key }}"
        status_cluster_local_private_key: !unsafe "{{ status_cluster_local_private_key }}"
