---
argument_specs:
  main:
    short_description: Install and configure a secure Nginx multisite deployment
    description:
      - Installs Nginx, Fail2ban, UFW, and TLS prerequisites.
      - Configures three HTTPS-enabled virtual hosts with security hardening.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Site names and their document root and TLS settings.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory containing site certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory containing site private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban protection is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      nginx_multisite_disable_root_ssh:
        type: bool
        required: false
        default: true
        description: Whether root SSH login is disabled.
      nginx_multisite_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide private key values from task output.
      test_cluster_local_private_key:
        type: str
        required: true
        description: Private key injected by an AAP credential type for test.cluster.local.
      ci_cluster_local_private_key:
        type: str
        required: true
        description: Private key injected by an AAP credential type for ci.cluster.local.
      status_cluster_local_private_key:
        type: str
        required: true
        description: Private key injected by an AAP credential type for status.cluster.local.
