---
# Unsupported: source-tree inspection; curl response checks; certificate identity/date checks;
# key metadata; readlink output; socket/listener checks; service journals; and log-location dumps.
- name: Verify nginx_multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed package facts for package verification
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        loop:
          - nginx
          - fail2ban
          - ufw
          - openssl
          - ca-certificates
        loop_control:
          loop_var: item_package
        fail_msg: "A required package is not installed."

    - name: Gather service facts for service status verification
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban services are enabled and active
      ansible.builtin.assert:
        that:
          - item_service['name'] in ansible_facts['services']
          - ansible_facts['services'][item_service['name']]['status'] == 'enabled'
          - ansible_facts['services'][item_service['name']]['state'] == 'running'
        loop:
          - name: nginx.service
          - name: fail2ban.service
        loop_control:
          loop_var: item_service
        fail_msg: "A required service is not enabled and active."

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: item_nginx_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - item_nginx_test['rc'] == 0
        fail_msg: "nginx -t did not validate the configuration."

    - name: Check required files
      ansible.builtin.stat:
        path: "{{ item_path }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
      loop_control:
        loop_var: item_path
      register: item_file_checks

    - name: Assert required files exist
      ansible.builtin.assert:
        that:
          - item_file['stat']['exists']
        loop: "{{ item_file_checks['results'] }}"
        loop_control:
          loop_var: item_file
        fail_msg: "A required configuration or content file is missing."

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_link }}"
        follow: false
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_link
      register: item_enabled_links

    - name: Assert enabled site links are symbolic links
      ansible.builtin.assert:
        that:
          - item_link['stat']['islnk'] | default(false)
        loop: "{{ item_enabled_links['results'] }}"
        loop_control:
          loop_var: item_link
        fail_msg: "A configured site is not enabled by a symbolic link."

    - name: Check that the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: item_default_site

    - name: Assert that the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not item_default_site['stat']['exists']
        fail_msg: "The default nginx site is present."

    - name: Check UFW state and required rules
      ansible.builtin.command:
        argv:
          - ufw
          - status
      register: item_ufw_status
      changed_when: false

    - name: Assert UFW reports the required SSH, HTTP, and HTTPS rules
      ansible.builtin.assert:
        that:
          - item_ufw_status['rc'] == 0
          - item_ufw_status['stdout'] is search('22')
          - item_ufw_status['stdout'] is search('80')
          - item_ufw_status['stdout'] is search('443')
        fail_msg: "UFW did not report all required service rules."

    - name: Read nginx configuration for structural directives
      ansible.builtin.slurp:
        src: /etc/nginx/nginx.conf
      register: item_nginx_conf

    - name: Assert nginx configuration contains required structural directives
      ansible.builtin.assert:
        that:
          - item_nginx_conf['content'] | b64decode is search('worker')
          - item_nginx_conf['content'] | b64decode is search('events')
          - item_nginx_conf['content'] | b64decode is search('http')
          - item_nginx_conf['content'] | b64decode is search('include')
        fail_msg: "nginx.conf is missing a required structural directive."

    - name: Read sysctl security configuration
      ansible.builtin.slurp:
        src: /etc/sysctl.d/99-security.conf
      register: item_sysctl_conf

    - name: Assert sysctl security configuration contains network or kernel settings
      ansible.builtin.assert:
        that:
          - item_sysctl_conf['content'] | b64decode is search('net\\.|kernel\\.')
        fail_msg: "The sysctl security configuration has no net or kernel setting."

    - name: Read SSH configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: item_ssh_conf

    - name: Assert SSH hardening directives are configured
      ansible.builtin.assert:
        that:
          - item_ssh_conf['content'] | b64decode is search('(?m)^PermitRootLogin no$')
          - item_ssh_conf['content'] | b64decode is search('(?m)^PasswordAuthentication no$')
        fail_msg: "The required SSH hardening directives are missing."
