---
argument_specs:
  main:
    short_description: Install and configure an Nginx multisite web server
    description:
      - Installs Nginx, security tooling, and self-signed TLS certificates for multiple sites.
      - Configures virtual hosts, firewall rules, and operating system security settings.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
            index_content: <!doctype html><html><head><title>test.cluster.local</title></head><body><h1>test.cluster.local</h1></body></html>
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
            index_content: <!doctype html><html><head><title>ci.cluster.local</title></head><body><h1>ci.cluster.local</h1></body></html>
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
            index_content: <!doctype html><html><head><title>status.cluster.local</title></head><body><h1>status.cluster.local</h1></body></html>
        description: Sites to configure, including document roots, TLS state, and index content.
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory where site certificates are stored.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory where site private keys are stored.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban security configuration is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_password_authentication:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
