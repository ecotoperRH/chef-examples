---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Reload nginx multisite sysctl
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.rp_filter
    value: "1"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-security.conf

- name: Restart SSH
  ansible.builtin.service:
    name: ssh
    state: restarted
