---
nginx_multisite_sites:
  test.cluster.local:
    document_root: /opt/server/test
    ssl_enabled: true
    index_content: <!doctype html><html><head><title>test.cluster.local</title></head><body><h1>test.cluster.local</h1></body></html>
  ci.cluster.local:
    document_root: /opt/server/ci
    ssl_enabled: true
    index_content: <!doctype html><html><head><title>ci.cluster.local</title></head><body><h1>ci.cluster.local</h1></body></html>
  status.cluster.local:
    document_root: /opt/server/status
    ssl_enabled: true
    index_content: <!doctype html><html><head><title>status.cluster.local</title></head><body><h1>status.cluster.local</h1></body></html>
nginx_multisite_ssl_certificate_path: /etc/ssl/certs
nginx_multisite_ssl_private_key_path: /etc/ssl/private
nginx_multisite_fail2ban_enabled: true
nginx_multisite_ufw_enabled: true
nginx_multisite_disable_root_login: true
nginx_multisite_password_authentication: false
