---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path is a trusted role default
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository  # noqa: R104 - repository URL is a trusted HTTPS role default  # noqa: R106 - repository source is a trusted role default
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - destination is a trusted role default
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment  # noqa: R101 - command arguments come from trusted role defaults
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_path }}"
  args:
    creates: "{{ fastapi_tutorial_venv_path }}/bin/python" # noqa: R114 - path is a trusted role default

- name: Install Python dependencies  # noqa: R113 - requirements path comes from a trusted role default
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt" # noqa: R114 - path is a trusted role default
    virtualenv: "{{ fastapi_tutorial_venv_path }}" # noqa: R114 - path is a trusted role default

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create PostgreSQL application role  # noqa: L039 - credential variables are validated by the prior task  # noqa: R101 - command uses validated credential variables  # noqa: R108 - PostgreSQL role administration requires the postgres account
  ansible.builtin.shell:
    cmd: |
      psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ db_username }}'" | grep -q 1 || \
      psql -c "CREATE USER {{ db_username }} WITH PASSWORD '{{ db_password }}';"
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Set PostgreSQL application role password  # noqa: L039 - credential variables are validated by the prior task  # noqa: R101 - command uses validated credential variables  # noqa: R108 - PostgreSQL role administration requires the postgres account
  ansible.builtin.shell:
    cmd: psql -c "ALTER USER {{ db_username }} WITH PASSWORD '{{ db_password }}';"
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create application database  # noqa: L039 - database variables are validated by the prior task  # noqa: R101 - command uses validated database variables  # noqa: R108 - PostgreSQL database administration requires the postgres account
  ansible.builtin.shell:
    cmd: |
      psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ db_name }}'" | grep -q 1 || \
      psql -c "CREATE DATABASE {{ db_name }} OWNER {{ db_username }};"
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant database privileges  # noqa: L039 - database variables are validated by the prior task  # noqa: R101 - command uses validated database variables  # noqa: R108 - PostgreSQL privilege administration requires the postgres account
  ansible.builtin.shell:
    cmd: psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_username }};"
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write application environment file  # noqa: L039 - credential and database variables are validated by the prior task
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - destination is a trusted role default
    content: |-
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}/{{ db_name }}
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Install systemd unit
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - destination is a trusted role default
    content: |-
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_venv_path }}/bin"
      ExecStart={{ fastapi_tutorial_venv_path }}/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_app_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Enable and start FastAPI service
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
