---
controller_credential_types:
  - name: PostgreSQL Database
    description: Credentials for the fastapi PostgreSQL role and FastAPI application database connection; the password is currently hardcoded and must be stored
      in Ansible Vault.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; store this value in Ansible Vault.
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname used by the application to connect to PostgreSQL.
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
      required:
        - db_username
        - db_password
        - db_host
        - db_name
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_host: !unsafe "{{ db_host }}"
        db_name: !unsafe "{{ db_name }}"
