---
controller_credentials:
  - name: PostgreSQL Database - fastapi_tutorial
    description: Credentials for the fastapi PostgreSQL role and FastAPI application database connection; the password is currently hardcoded and must be stored
      in Ansible Vault.
    organization: Default
    credential_type: PostgreSQL Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      db_host: "{{ db_host }}"
      db_name: "{{ db_name }}"
