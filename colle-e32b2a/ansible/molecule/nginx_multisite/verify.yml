# Unsupported pre-flight checks: service enabled/active/status diagnostics, UFW status and
# rules, sysctl output, fail2ban-client status, journal/tail diagnostics, certificate
# subject/dates, and stat output have no explicit expected result in the pre-flight section.
---
- name: Verify nginx multisite pre-flight checks
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify files and directories requested by pre-flight checks
      ansible.builtin.stat:
        path: "{{ item_path }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
        - /opt/server/test
        - /opt/server/test/index.html
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /opt/server/status
        - /opt/server/status/index.html
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
        - /var/log/nginx/access.log
        - /var/log/nginx/error.log
        - /var/log/nginx/test.cluster.local_access.log
        - /var/log/nginx/test.cluster.local_error.log
        - /var/log/nginx/ci.cluster.local_access.log
        - /var/log/nginx/ci.cluster.local_error.log
        - /var/log/nginx/status.cluster.local_access.log
        - /var/log/nginx/status.cluster.local_error.log
        - /var/log/auth.log
      loop_control:
        loop_var: item_path
      register: preflight_paths

    - name: Assert requested files and directories exist
      ansible.builtin.assert:
        that:
          - item_path_result['stat']['exists']
      loop: "{{ preflight_paths['results'] }}"
      loop_control:
        loop_var: item_path_result

    - name: Verify the default nginx site was removed
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert the default nginx site does not exist
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
        changed_when: false
      register: nginx_config_test

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_config_test['rc'] == 0

    - name: Verify all configured virtual hosts appear in nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -T
        changed_when: false
      register: nginx_dump

    - name: Assert configured virtual hosts appear in nginx configuration
      ansible.builtin.assert:
        that:
          - "'test.cluster.local' in nginx_dump['stdout']"
          - "'ci.cluster.local' in nginx_dump['stdout']"
          - "'status.cluster.local' in nginx_dump['stdout']"

    - name: Verify HTTP and HTTPS listeners
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
        changed_when: false
      register: listening_sockets

    - name: Assert ports 80 and 443 are listening
      ansible.builtin.assert:
        that:
          - listening_sockets['rc'] == 0
          - listening_sockets['stdout'] is search(':80([[:space:]]|$)')
          - listening_sockets['stdout'] is search(':443([[:space:]]|$)')

    - name: Verify SSH hardening directives
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - PermitRootLogin no
          - /etc/ssh/sshd_config
        changed_when: false
      register: root_login_setting

    - name: Verify SSH password authentication is disabled
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - PasswordAuthentication no
          - /etc/ssh/sshd_config
        changed_when: false
      register: password_auth_setting

    - name: Assert SSH hardening directives are present
      ansible.builtin.assert:
        that:
          - root_login_setting['rc'] == 0
          - password_auth_setting['rc'] == 0

    - name: Verify enabled virtual-host links resolve to their configurations
      ansible.builtin.command:
        argv:
          - readlink
          - -f
          - "{{ item_link['link'] }}"
        changed_when: false
      loop:
        - link: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - link: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - link: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_link
      register: enabled_site_targets

    - name: Assert enabled virtual-host links have the expected targets
      ansible.builtin.assert:
        that:
          - item_link_target['stdout'] == item_link_target['item']['target']
      loop: "{{ enabled_site_targets['results'] }}"
      loop_control:
        loop_var: item_link_target

    - name: Verify HTTP redirects for each virtual host
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_site['name'] }}"
        follow_redirects: none
        return_content: false
        status_code: [301]
      loop:
        - name: test.cluster.local
        - name: ci.cluster.local
        - name: status.cluster.local
      loop_control:
        loop_var: item_site
      register: http_redirects

    - name: Assert HTTP redirects point to HTTPS
      ansible.builtin.assert:
        that:
          - item_redirect['status'] == 301
          - item_redirect['location'] is match('^https://')
      loop: "{{ http_redirects['results'] }}"
      loop_control:
        loop_var: item_redirect

    - name: Verify HTTPS security headers for each virtual host
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_https_site['name'] }}"
        validate_certs: false
        follow_redirects: none
        return_content: false
      loop:
        - name: test.cluster.local
        - name: ci.cluster.local
        - name: status.cluster.local
      loop_control:
        loop_var: item_https_site
      register: https_headers

    - name: Assert HTTPS security headers are present
      ansible.builtin.assert:
        that:
          - "'strict-transport-security' in item_https_result['headers']"
          - "'x-frame-options' in item_https_result['headers']"
          - "'x-content-type-options' in item_https_result['headers']"
          - "'referrer-policy' in item_https_result['headers']"
      loop: "{{ https_headers['results'] }}"
      loop_control:
        loop_var: item_https_result
