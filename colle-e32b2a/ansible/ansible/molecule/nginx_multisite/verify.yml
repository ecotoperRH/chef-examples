---
# Unsupported: raw journal/tail output, sysctl values, certificate subject/dates,
# readlink output, and UFW verbose/default-policy output have no stated expected
# result. Certificate/key stat output is covered below by explicit permissions.

- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: false
  tasks:
    - name: Collect service status
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts.services['nginx.service']['state'] == 'running'"
          - "ansible_facts.services['nginx.service']['status'] == 'enabled'"
          - "ansible_facts.services['fail2ban.service']['state'] == 'running'"
          - "ansible_facts.services['fail2ban.service']['status'] == 'enabled'"
        fail_msg: nginx and fail2ban must be enabled and active

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv: [nginx, -t]
      register: nginx_test_result
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that: nginx_test_result.rc == 0
        fail_msg: nginx -t must succeed

    - name: Inspect loaded nginx configuration
      ansible.builtin.command:
        argv: [nginx, -T]
      register: nginx_dump_result
      changed_when: false

    - name: Assert all virtual hosts are loaded
      ansible.builtin.assert:
        that:
          - "'test.cluster.local' in nginx_dump_result.stdout"
          - "'ci.cluster.local' in nginx_dump_result.stdout"
          - "'status.cluster.local' in nginx_dump_result.stdout"
        fail_msg: all three cluster virtual hosts must be loaded

    - name: Verify HTTP and HTTPS listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_port['port'] }}"
        state: started
        timeout: 5
      loop:
        - { port: 80 }
        - { port: 443 }
      loop_control:
        loop_var: item_port

    - name: Inspect firewall rules
      ansible.builtin.command:
        argv: [ufw, status]
      register: ufw_status_result
      changed_when: false

    - name: Assert SSH HTTP and HTTPS are allowed
      ansible.builtin.assert:
        that:
          - "'22/tcp' in ufw_status_result.stdout"
          - "'80/tcp' in ufw_status_result.stdout"
          - "'443/tcp' in ufw_status_result.stdout"
        fail_msg: UFW must allow SSH, HTTP, and HTTPS

    - name: Read SSH configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config_result

    - name: Assert SSH hardening directives
      ansible.builtin.assert:
        that:
          - "(sshd_config_result.content | b64decode) is search('(?m)^\\s*PermitRootLogin\\s+no\\s*$')"
          - "(sshd_config_result.content | b64decode) is search('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')"
        fail_msg: SSH must disable root login and password authentication

    - name: Check configured fail2ban jails
      ansible.builtin.command:
        argv: [fail2ban-client, status, "{{ item_jail['name'] }}"]
      register: fail2ban_results
      changed_when: false
      loop:
        - { name: sshd }
        - { name: nginx-http-auth }
        - { name: nginx-limit-req }
        - { name: nginx-botsearch }
      loop_control:
        loop_var: item_jail

    - name: Assert configured fail2ban jails are available
      ansible.builtin.assert:
        that: item_jail_result.rc == 0
        loop: "{{ fail2ban_results.results }}"
        loop_control:
          loop_var: item_jail_result
        fail_msg: every configured fail2ban jail must be available

    - name: Check required files and directories
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
        follow: false
      register: required_paths
      loop:
        - { path: /etc/nginx/nginx.conf }
        - { path: /etc/nginx/conf.d/security.conf }
        - { path: /etc/nginx/sites-available/test.cluster.local }
        - { path: /etc/nginx/sites-available/ci.cluster.local }
        - { path: /etc/nginx/sites-available/status.cluster.local }
        - { path: /etc/nginx/sites-enabled/test.cluster.local }
        - { path: /etc/nginx/sites-enabled/ci.cluster.local }
        - { path: /etc/nginx/sites-enabled/status.cluster.local }
        - { path: /opt/server/test }
        - { path: /opt/server/test/index.html }
        - { path: /opt/server/ci }
        - { path: /opt/server/ci/index.html }
        - { path: /opt/server/status }
        - { path: /opt/server/status/index.html }
        - { path: /etc/ssl/certs/test.cluster.local.crt }
        - { path: /etc/ssl/private/test.cluster.local.key }
        - { path: /etc/ssl/certs/ci.cluster.local.crt }
        - { path: /etc/ssl/private/ci.cluster.local.key }
        - { path: /etc/ssl/certs/status.cluster.local.crt }
        - { path: /etc/ssl/private/status.cluster.local.key }
        - { path: /etc/fail2ban/jail.local }
        - { path: /etc/sysctl.d/99-security.conf }
        - { path: /etc/ssh/sshd_config }
        - { path: /var/log/nginx/access.log }
        - { path: /var/log/nginx/error.log }
        - { path: /var/log/nginx/test.cluster.local_access.log }
        - { path: /var/log/nginx/test.cluster.local_error.log }
        - { path: /var/log/nginx/ci.cluster.local_access.log }
        - { path: /var/log/nginx/ci.cluster.local_error.log }
        - { path: /var/log/nginx/status.cluster.local_access.log }
        - { path: /var/log/nginx/status.cluster.local_error.log }
        - { path: /var/log/auth.log }
      loop_control:
        loop_var: item_path

    - name: Assert required files and directories exist
      ansible.builtin.assert:
        that: item_path_result.stat.exists
        loop: "{{ required_paths.results }}"
        loop_control:
          loop_var: item_path_result
        fail_msg: every explicitly listed pre-flight path must exist

    - name: Check explicit ownership and modes
      ansible.builtin.stat:
        path: "{{ item_owned['path'] }}"
        follow: false
      register: ownership_results
      loop:
        - { path: /opt/server/test, owner: www-data, group: www-data, mode: '0755' }
        - { path: /opt/server/ci, owner: www-data, group: www-data, mode: '0755' }
        - { path: /opt/server/status, owner: www-data, group: www-data, mode: '0755' }
        - { path: /opt/server/test/index.html, owner: www-data, group: www-data, mode: '0644' }
        - { path: /opt/server/ci/index.html, owner: www-data, group: www-data, mode: '0644' }
        - { path: /opt/server/status/index.html, owner: www-data, group: www-data, mode: '0644' }
        - { path: /etc/ssl/certs, owner: root, group: root, mode: '0755' }
        - { path: /etc/ssl/private, owner: root, group: ssl-cert, mode: '0710' }
        - { path: /etc/ssl/private/test.cluster.local.key, owner: root, group: ssl-cert, mode: '0640' }
        - { path: /etc/ssl/private/ci.cluster.local.key, owner: root, group: ssl-cert, mode: '0640' }
        - { path: /etc/ssl/private/status.cluster.local.key, owner: root, group: ssl-cert, mode: '0640' }
        - { path: /etc/nginx/nginx.conf, mode: '0644' }
        - { path: /etc/nginx/conf.d/security.conf, mode: '0644' }
        - { path: /etc/nginx/sites-available/test.cluster.local, mode: '0644' }
        - { path: /etc/nginx/sites-available/ci.cluster.local, mode: '0644' }
        - { path: /etc/nginx/sites-available/status.cluster.local, mode: '0644' }
      loop_control:
        loop_var: item_owned

    - name: Assert explicit ownership and modes
      ansible.builtin.assert:
        that:
          - item_owned_result.stat.pw_name == item_owned_result.item.owner if item_owned_result.item.owner is defined else true
          - item_owned_result.stat.gr_name == item_owned_result.item.group if item_owned_result.item.group is defined else true
          - item_owned_result.stat.mode == item_owned_result.item.mode
        loop: "{{ ownership_results.results }}"
        loop_control:
          loop_var: item_owned_result
        fail_msg: an explicitly checked path has incorrect ownership or mode

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_link['path'] }}"
        follow: false
      register: link_results
      loop:
        - { path: /etc/nginx/sites-enabled/test.cluster.local }
        - { path: /etc/nginx/sites-enabled/ci.cluster.local }
        - { path: /etc/nginx/sites-enabled/status.cluster.local }
      loop_control:
        loop_var: item_link

    - name: Assert enabled sites are symbolic links
      ansible.builtin.assert:
        that: item_link_result.stat.islnk | default(false)
        loop: "{{ link_results.results }}"
        loop_control:
          loop_var: item_link_result
        fail_msg: each virtual host must be enabled by a symbolic link

    - name: Check default site removal
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
        follow: false
      register: default_site

    - name: Assert default site is absent
      ansible.builtin.assert:
        that: not default_site.stat.exists
        fail_msg: the default nginx site must not exist

    - name: Check HTTP redirects
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers: { Host: "{{ item_host['host'] }}" }
        follow_redirects: none
        status_code: 301
      register: redirect_results
      loop:
        - { host: test.cluster.local }
        - { host: ci.cluster.local }
        - { host: status.cluster.local }
      loop_control:
        loop_var: item_host

    - name: Assert HTTP Location headers begin with HTTPS
      ansible.builtin.assert:
        that:
          - item_redirect.location is defined
          - "item_redirect.location is match('^https://')"
        loop: "{{ redirect_results.results }}"
        loop_control:
          loop_var: item_redirect
        fail_msg: each HTTP virtual host must redirect to an HTTPS URL

    - name: Check HTTPS security headers
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers: { Host: "{{ item_host['host'] }}" }
        validate_certs: false
        return_content: false
      register: https_results
      loop:
        - { host: test.cluster.local }
        - { host: ci.cluster.local }
        - { host: status.cluster.local }
      loop_control:
        loop_var: item_host

    - name: Assert required HTTPS security headers are present
      ansible.builtin.assert:
        that:
          - "'strict-transport-security' in item_https.headers"
          - "'x-frame-options' in item_https.headers"
          - "'x-content-type-options' in item_https.headers"
          - "'referrer-policy' in item_https.headers"
        loop: "{{ https_results.results }}"
        loop_control:
          loop_var: item_https
        fail_msg: each HTTPS virtual host must return the required security headers
