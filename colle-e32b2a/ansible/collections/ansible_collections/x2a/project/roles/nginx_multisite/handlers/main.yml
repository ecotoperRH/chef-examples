---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload security sysctl
  ansible.builtin.command:  # noqa: args[module] - command has no name parameter
    cmd: sysctl -p /etc/sysctl.d/99-security.conf  # noqa: command-instead-of-module - applies the complete sysctl configuration file
  changed_when: true

- name: Restart SSH
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
