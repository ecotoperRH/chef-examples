---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Ensure fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Configure fail2ban
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Read UFW status
  ansible.builtin.command:
    cmd: ufw status verbose
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false
  register: nginx_multisite_ufw_status

- name: Set UFW default policy to deny  # noqa: L039 - status is registered by the prior UFW status task; no-changed-when command-instead-of-module
  ansible.builtin.command:
    cmd: ufw --force default deny
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Default: deny' not in nginx_multisite_ufw_status.stdout"

- name: Allow SSH through UFW  # noqa: L039 - status is registered by the prior UFW status task; no-changed-when command-instead-of-module
  ansible.builtin.command:
    cmd: ufw allow ssh
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTP through UFW  # noqa: L039 - status is registered by the prior UFW status task; no-changed-when command-instead-of-module
  ansible.builtin.command:
    cmd: ufw allow http
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTPS through UFW  # noqa: L039 - status is registered by the prior UFW status task; no-changed-when command-instead-of-module
  ansible.builtin.command:
    cmd: ufw allow https
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Enable UFW  # noqa: L039 - status is registered by the prior UFW status task; no-changed-when command-instead-of-module
  ansible.builtin.command:
    cmd: ufw --force enable
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Status: active' not in nginx_multisite_ufw_status.stdout"

- name: Configure kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    backup: true
  when: nginx_multisite_ssh_disable_root | bool
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    backup: true
  when: not (nginx_multisite_ssh_password_auth | bool)
  notify: Restart SSH
