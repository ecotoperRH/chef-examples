---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Ensure ssl-cert group exists
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}"  # noqa: R114 - path is a role-defined default
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}"  # noqa: R114 - path is a role-defined default
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Check site certificate files
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl_site['key'] }}.crt"  # noqa: R114 - path is from the role-defined sites dictionary
  register: nginx_multisite_certificates
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site

- name: Check site private key files
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key"  # noqa: R114 - path is from the role-defined sites dictionary
  register: nginx_multisite_private_keys
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site

- name: Generate self-signed site certificates  # noqa: L039,R101 - certificate and key results are registered by prior tasks; command uses role-defined paths and site keys
  ansible.builtin.command:  # noqa: command-instead-of-module - openssl req creates a certificate with a custom subject
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - '365'
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key"
      - -out
      - "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl_site['key'] }}.crt"
      - -subj
      - "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl_site['key'] }}/emailAddress=admin@example.com"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  when:
    - item_ssl_site['value']['ssl_enabled']
    - not (nginx_multisite_certificates['results'][ansible_loop.index0]['stat']['exists'] and
      nginx_multisite_private_keys['results'][ansible_loop.index0]['stat']['exists'])
  changed_when: true  # noqa: no-changed-when - runs only when either certificate or key is absent
  notify: Reload nginx

- name: Set private key ownership and mode
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key"  # noqa: R114 - path is from the role-defined sites dictionary
    state: file
    owner: root
    group: ssl-cert
    mode: "0640"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  when: item_ssl_site['value']['ssl_enabled']
