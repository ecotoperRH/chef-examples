---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}"  # noqa: R114 - path comes from role defaults, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}"  # noqa: R114 - path comes from role defaults, not user input
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Check site certificate
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl_site['key'] }}.crt"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  register: nginx_multisite_certificate_stat

- name: Check site private key
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  register: nginx_multisite_key_stat

- name: Generate self-signed certificates  # noqa: R101, L039 - command uses role-default paths and role-defined site keys; certificate and key stats are registered by preceding tasks
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key"
      - -out
      - "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl_site['key'] }}.crt"
      - -subj
      - "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl_site['key'] }}/emailAddress=admin@example.com"
  when:
    - item_ssl_site['value']['ssl_enabled']
    - not (nginx_multisite_certificate_stat.results[item_ssl_site_index].stat.exists and nginx_multisite_key_stat.results[item_ssl_site_index].stat.exists)
  changed_when: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
    index_var: item_ssl_site_index
  register: nginx_multisite_certificate_result
  notify: Reload nginx

- name: Protect generated private keys
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key" # noqa: R114 - path from role-defined sites dictionary
    state: file
    owner: root
    group: ssl-cert
    mode: "0640"
  when: item_ssl_site['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
