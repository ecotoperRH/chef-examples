---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Reload sysctl security settings
  ansible.builtin.command:
    argv:
      - sysctl
      - --system
  changed_when: false

- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted
