---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
      - procps
    state: present

- name: Configure Fail2ban
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Set UFW default incoming policy
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - default
      - deny
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Allow SSH through UFW
  ansible.builtin.command:
    argv: [ufw, allow, ssh]
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Allow HTTP through UFW
  ansible.builtin.command:
    argv: [ufw, allow, http]
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    argv: [ufw, allow, https]
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Enable UFW
  ansible.builtin.command:
    argv: [ufw, --force, enable]
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Deploy kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    backup: true
  when: nginx_multisite_disable_root_login | bool
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    backup: true
  when: not nginx_multisite_password_authentication | bool
  notify: Restart SSH
