---
- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Configure nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Configure nginx security settings
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Create nginx site document roots
  ansible.builtin.file:
    path: "{{ item_nginx_site['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dictionary
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
    recurse: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site

- name: Deploy placeholder site index files
  ansible.builtin.copy:
    content: "{{ item_nginx_index['key'] }} "
    dest: "{{ item_nginx_index['value']['document_root'] }}/index.html" # noqa: R114 - path from role-defined sites dictionary
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_index

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
