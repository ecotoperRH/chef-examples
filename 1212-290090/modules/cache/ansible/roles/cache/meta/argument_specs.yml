---
argument_specs:
  main:
    short_description: Configure Memcached and Redis cache services
    description:
      - Installs and configures Memcached and a Redis instance on port 6379.
    options:
      cache_secure_logging: {type: bool, default: true, description: Hide Redis secrets in logs.}
      redis_requirepass: {type: str, required: true, description: Redis authentication password.}
      redis_package_install: {type: bool, default: false, description: Install Redis from packages.}
      redis_version: {type: str, default: 3.2.11, description: Redis source version.}
      redis_mirror: {type: str, default: http://download.redis.io/releases/}
      redis_base_name: {type: str, default: redis-}
      redis_artifact_type: {type: str, default: tar.gz}
      redis_install_dir: {type: str, default: /usr/local}
      redis_bin_path: {type: str, default: /usr/local/bin}
      redis_job_control: {type: str, default: systemd}
      redis_package_name: {type: str, default: redis-server}
      redis_user: {type: str, default: redis}
      redis_group: {type: str, default: redis}
      redis_shell: {type: str, default: /bin/false}
      redis_data_dir: {type: str, default: /var/lib/redis}
      redis_config_dir: {type: str, default: /etc/redis}
      redis_pid_base_dir: {type: str, default: /var/run/redis}
      redis_log_dir: {type: str, default: /var/log/redis}
      redis_config_file: {type: str, default: /etc/redis/6379.conf}
      redis_port: {type: int, default: 6379}
      redis_databases: {type: int, default: 16}
      redis_maxclients: {type: int, default: 10000}
      redis_tcp_backlog: {type: str, default: "511"}
      redis_address: {type: raw, required: false}
      redis_protected_mode: {type: raw, required: false}
      redis_backuptype: {type: str, default: rdb}
      redis_timeout: {type: str, default: "0"}
      redis_keepalive: {type: str, default: "0"}
      redis_loglevel: {type: str, default: notice}
      redis_logfile: {type: raw, required: false}
      redis_syslog_enabled: {type: str, default: "yes"}
      redis_syslog_facility: {type: str, default: local0}
      redis_shutdown_save: {type: bool, default: false}
      redis_save: {type: list, elements: str, required: false}
      redis_stop_writes_on_bgsave_error: {type: str, default: "yes"}
      redis_rdbcompression: {type: str, default: "yes"}
      redis_rdbchecksum: {type: str, default: "yes"}
      redis_dbfilename: {type: raw, required: false}
      redis_replicaof: {type: raw, required: false}
      redis_masterauth: {type: raw, required: false}
      redis_replica_serve_stale_data: {type: raw, required: false}
      redis_replica_read_only: {type: str, default: "yes"}
      redis_maxmemory: {type: str, default: ""}
      redis_maxmemory_policy: {type: raw, required: false}
      redis_maxmemory_samples: {type: raw, required: false}
      redis_appendfilename: {type: raw, required: false}
      redis_appendfsync: {type: str, default: everysec}
      redis_no_appendfsync_on_rewrite: {type: str, default: "no"}
      redis_aof_rewrite_percentage: {type: int, default: 100}
      redis_aof_rewrite_min_size: {type: str, default: 64mb}
      redis_aof_load_truncated: {type: str, default: "yes"}
      redis_lua_time_limit: {type: int, default: 5000}
      redis_slowlog_log_slower_than: {type: int, default: 10000}
      redis_slowlog_max_len: {type: int, default: 1024}
      redis_notify_keyspace_events: {type: str, default: ""}
      redis_hash_max_ziplist_entries: {type: int, default: 512}
      redis_hash_max_ziplist_value: {type: int, default: 64}
      redis_set_max_intset_entries: {type: int, default: 512}
      redis_zset_max_ziplist_entries: {type: int, default: 128}
      redis_zset_max_ziplist_value: {type: int, default: 64}
      redis_hll_sparse_max_bytes: {type: int, default: 3000}
      redis_active_rehashing: {type: str, default: "yes"}
      redis_client_output_buffer_limit: {type: list, elements: list, default: []}
      redis_hz: {type: int, default: 10}
      redis_aof_rewrite_incremental_fsync: {type: str, default: "yes"}
      redis_cluster_enabled: {type: str, default: "no"}
      redis_cluster_config_file: {type: raw, required: false}
      redis_cluster_node_timeout: {type: int, default: 5000}
      redis_includes: {type: list, elements: str, default: []}
      redis_ulimit: {type: int, default: 0}
      redis_required_start: {type: list, elements: str, default: []}
      redis_required_stop: {type: list, elements: str, default: []}
      redis_limit_nofile: {type: int, default: 65536}
      redis_datadir: {type: str, default: /var/lib/redis}
      redis_tls_port: {type: raw, required: false}
      memcached_memory: {type: int, default: 64}
      memcached_port: {type: int, default: 11211}
      memcached_udp_port: {type: int, default: 11211}
      memcached_listen: {type: str, default: 0.0.0.0}
      memcached_maxconn: {type: int, default: 1024}
      memcached_max_object_size: {type: str, default: 1m}
      memcached_threads: {type: int, default: 4}
      memcached_ulimit: {type: int, default: 1024}
      memcached_package_name: {type: str, default: memcached}
      memcached_service_name: {type: str, default: memcached}
