---
argument_specs:
  main:
    short_description: Configure Memcached and Redis cache services
    description:
      - Installs and configures Memcached and a Redis 6379 instance.
    options:
      cache_secure_logging: {type: bool, required: false, default: true}
      cache_memcached_package: {type: str, required: false, default: memcached}
      cache_memcached_service: {type: str, required: false, default: memcached}
      cache_memcached_memory: {type: int, required: false, default: 64}
      cache_memcached_port: {type: int, required: false, default: 11211}
      cache_memcached_udp_port: {type: int, required: false, default: 11211}
      cache_memcached_listen: {type: str, required: false, default: 0.0.0.0}
      cache_memcached_maxconn: {type: int, required: false, default: 1024}
      cache_memcached_user: {type: str, required: false, default: memcached}
      cache_memcached_max_object_size: {type: str, required: false, default: 1m}
      cache_memcached_threads: {type: int, required: false, default: 4}
      cache_memcached_ulimit: {type: int, required: false, default: 1024}
      cache_memcached_experimental_options: {type: list, elements: str, required: false, default: []}
      cache_memcached_extra_cli_options: {type: list, elements: str, required: false, default: []}
      cache_redis_package_install: {type: bool, required: false, default: false}
      cache_redis_package_name: {type: str, required: false, default: redis-server}
      cache_redis_version: {type: str, required: false, default: 3.2.11}
      cache_redis_download_url: {type: str, required: false, default: http://download.redis.io/releases/redis-3.2.11.tar.gz}
      cache_redis_download_dir: {type: path, required: false, default: /usr/local/src}
      cache_redis_source_dir: {type: path, required: false, default: /usr/local/src/redis-3.2.11}
      cache_redis_install_dir: {type: path, required: false, default: /usr/local}
      cache_redis_user: {type: str, required: false, default: redis}
      cache_redis_group: {type: str, required: false, default: redis}
      cache_redis_shell: {type: path, required: false, default: /bin/false}
      cache_redis_config_dir: {type: path, required: false, default: /etc/redis}
      cache_redis_config_file: {type: path, required: false, default: /etc/redis/6379.conf}
      cache_redis_data_dir: {type: path, required: false, default: /var/lib/redis}
      cache_redis_pid_dir: {type: path, required: false, default: /var/run/redis/6379}
      cache_redis_log_dir: {type: path, required: false, default: /var/log/redis}
      cache_redis_port: {type: int, required: false, default: 6379}
      cache_redis_bind: {type: str, required: false, default: 0.0.0.0}
      cache_redis_databases: {type: int, required: false, default: 16}
      cache_redis_maxclients: {type: int, required: false, default: 10000}
      cache_redis_loglevel: {type: str, required: false, default: notice}
      cache_redis_syslog_enabled: {type: str, required: false, default: "yes"}
      cache_redis_syslog_facility: {type: str, required: false, default: local0}
      cache_redis_shutdown_save: {type: bool, required: false, default: false}
      cache_redis_job_control: {type: str, required: false, default: systemd}
      cache_redis_package_prerequisites: {type: list, elements: str, required: false, default: [tar, build-essential]}
      cache_redis_save: {type: list, elements: str, required: false, default: [900 1, 300 10, 60 10000]}
      cache_redis_requirepass: {type: str, required: false, default: "{{ redis_requirepass }}"}
