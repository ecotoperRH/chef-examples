---
- name: Restart memcached
  ansible.builtin.service:
    name: "{{ cache_memcached_service }}"
    state: restarted

- name: Restart redis
  ansible.builtin.service:
    name: redis@{{ cache_redis_port }}
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
