---
- name: Install and enable Redis systemd unit
  ansible.builtin.template:
    src: redis@.service.j2
    dest: /etc/systemd/system/redis@.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Reload systemd
    - Restart Redis

- name: Enable and start Redis instance
  ansible.builtin.service:
    name: redis@6379
    state: started
    enabled: true
