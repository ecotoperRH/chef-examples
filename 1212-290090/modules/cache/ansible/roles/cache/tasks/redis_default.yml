---
- name: Install Redis prerequisites and build dependencies
  ansible.builtin.include_tasks: redis_install_prereqs.yml
  when: not cache_redis_package_install | bool

- name: Install Redis
  ansible.builtin.include_tasks: redis_install.yml
  when: not cache_redis_bypass_setup | default(false) | bool  # noqa: L039 - variable comes from role parameters

- name: Disable distribution Redis service
  ansible.builtin.include_tasks: redis_disable_os_default.yml
  when: not cache_redis_bypass_setup | default(false) | bool  # noqa: L039 - variable comes from role parameters

- name: Configure Redis ulimits
  ansible.builtin.include_tasks: redis_ulimit.yml
  when: not cache_redis_bypass_setup | default(false) | bool  # noqa: L039 - variable comes from role parameters
