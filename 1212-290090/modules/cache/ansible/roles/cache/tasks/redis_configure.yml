---
- name: Create Redis group
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    state: present

- name: Create Redis user
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    home: "{{ cache_redis_datadir }}"
    shell: "{{ cache_redis_shell }}"
    system: true
    create_home: true
    state: present

- name: Create Redis directories
  ansible.builtin.file:
    path: "{{ item_cache_dir['path'] }}" # noqa: R114 - paths are role-defined fixed directories
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "{{ item_cache_dir['mode'] }}"
  loop:
    - path: /etc/redis
      mode: "0775"
    - path: /var/lib/redis
      mode: "0775"
    - path: /var/run/redis/6379
      mode: "0755"
    - path: /var/log/redis
      mode: "0755"
  loop_control:
    loop_var: item_cache_dir

- name: Render Redis configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}" # noqa: R114 - path is a role default, not user input
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0644"
    backup: true
  notify: Restart Redis instance
  no_log: "{{ cache_secure_logging }}"
  vars:
    cache_redis_config_dir: "{{ cache_redis_config_dir }}"

- name: Install Redis systemd unit
  ansible.builtin.template:
    src: redis@.service.j2
    dest: /lib/systemd/system/redis@.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: cache_redis_job_control == 'systemd'
  notify: Restart Redis instance

- name: Reload systemd manager
  ansible.builtin.systemd:
    daemon_reload: true
  when: cache_redis_job_control == 'systemd'
