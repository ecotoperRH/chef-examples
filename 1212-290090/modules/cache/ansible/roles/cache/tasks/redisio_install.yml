---
- name: Install Redis prerequisites
  ansible.builtin.package:
    name: "{{ cache_redis_package_prerequisites }}"
    state: present

- name: Create Redis download directory
  ansible.builtin.file:
    path: "{{ cache_redis_download_dir }}" # noqa: R114 - path comes from role defaults
    state: directory
    mode: "0755"

- name: Download Redis source archive # noqa: R106 - download URL is role-controlled by role defaults
  ansible.builtin.get_url:
    url: "{{ cache_redis_download_url | regex_replace('^http://', 'https://') }}" # noqa: R104 - download URL is role-controlled
    dest: "{{ cache_redis_download_dir }}/redis-{{ cache_redis_version }}.tar.gz" # noqa: R114 - fixed role-controlled source path
    mode: "0644"
    backup: true

- name: Create Redis source directory
  ansible.builtin.file:
    path: "{{ cache_redis_source_dir }}" # noqa: R114 - fixed role-controlled source path
    state: directory
    mode: "0755"

- name: Extract Redis source
  ansible.builtin.unarchive:
    src: "{{ cache_redis_download_dir }}/redis-{{ cache_redis_version }}.tar.gz" # noqa: R104,R106 - source path is built from role defaults
    dest: "{{ cache_redis_source_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "{{ cache_redis_source_dir }}/src/redis-server"

- name: Build Redis
  ansible.builtin.shell:
    cmd: |
      make clean && make
    chdir: "{{ cache_redis_source_dir }}"
    creates: "{{ cache_redis_source_dir }}/src/redis-server"
  changed_when: true

- name: Install Redis # noqa: R101 - install command uses role-default paths, not user input
  ansible.builtin.shell:
    cmd: |
      make PREFIX={{ cache_redis_install_dir }} install
    chdir: "{{ cache_redis_source_dir }}"
    creates: "{{ cache_redis_install_dir }}/bin/redis-server"
  changed_when: true
