---
- name: Check distribution Redis service
  ansible.builtin.service_facts:

- name: Stop and disable distribution Redis service
  ansible.builtin.service:
    name: "{{ 'redis-server' if ansible_facts['os_family'] == 'Debian' else 'redis' }}"
    enabled: false
    state: stopped
  when: "((('redis-server' if ansible_facts['os_family'] == 'Debian' else 'redis') + '.service') in ansible_facts.services) or (('redis-server' if ansible_facts['os_family'] == 'Debian' else 'redis') in ansible_facts.services)"