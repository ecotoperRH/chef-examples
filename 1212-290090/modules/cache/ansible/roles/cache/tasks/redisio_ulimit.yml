---
- name: Check PAM su configuration
  ansible.builtin.stat:
    path: /etc/pam.d/su
  register: cache_pam_su

- name: Check PAM sudo configuration
  ansible.builtin.stat:
    path: /etc/pam.d/sudo
  register: cache_pam_sudo

- name: Install PAM su configuration # noqa: L039 - cache_pam_su is registered by the preceding stat task
  ansible.builtin.template:
    src: su.j2
    dest: /etc/pam.d/su
    mode: "0644"
    backup: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - cache_pam_su.stat.exists

- name: Install PAM sudo configuration # noqa: L039 - cache_pam_sudo is registered by the preceding stat task
  ansible.builtin.copy:
    src: sudo
    dest: /etc/pam.d/sudo
    mode: "0644"
    backup: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - cache_pam_sudo.stat.exists
