---
cache_secure_logging: true
redis_requirepass: ""
redis_package_install: false
redis_version: 3.2.11
redis_mirror: http://download.redis.io/releases/
redis_base_name: redis-
redis_artifact_type: tar.gz
redis_install_dir: /usr/local
redis_bin_path: /usr/local/bin
redis_job_control: systemd
redis_package_name: redis-server
redis_user: redis
redis_group: redis
redis_shell: /bin/false
redis_data_dir: /var/lib/redis
redis_config_dir: /etc/redis
redis_pid_base_dir: /var/run/redis
redis_log_dir: /var/log/redis
redis_config_file: /etc/redis/6379.conf
redis_port: 6379
redis_databases: 16
redis_maxclients: 10000
redis_tcp_backlog: "511"
redis_address:
redis_protected_mode:
redis_backuptype: rdb
redis_timeout: "0"
redis_keepalive: "0"
redis_loglevel: notice
redis_logfile:
redis_syslog_enabled: "yes"
redis_syslog_facility: local0
redis_shutdown_save: false
redis_save:
redis_stop_writes_on_bgsave_error: "yes"
redis_rdbcompression: "yes"
redis_rdbchecksum: "yes"
redis_dbfilename:
redis_replicaof:
redis_masterauth:
redis_replica_serve_stale_data:
redis_replica_read_only: "yes"
redis_maxmemory: ""
redis_maxmemory_policy:
redis_maxmemory_samples:
redis_appendfilename:
redis_appendfsync: everysec
redis_no_appendfsync_on_rewrite: "no"
redis_aof_rewrite_percentage: 100
redis_aof_rewrite_min_size: 64mb
redis_aof_load_truncated: "yes"
redis_lua_time_limit: 5000
redis_slowlog_log_slower_than: 10000
redis_slowlog_max_len: 1024
redis_notify_keyspace_events: ""
redis_hash_max_ziplist_entries: 512
redis_hash_max_ziplist_value: 64
redis_set_max_intset_entries: 512
redis_zset_max_ziplist_entries: 128
redis_zset_max_ziplist_value: 64
redis_hll_sparse_max_bytes: 3000
redis_active_rehashing: "yes"
redis_client_output_buffer_limit: []
redis_hz: 10
redis_aof_rewrite_incremental_fsync: "yes"
redis_cluster_enabled: "no"
redis_cluster_config_file:
redis_cluster_node_timeout: 5000
redis_includes: []
redis_ulimit: 0
redis_required_start: []
redis_required_stop: []
memcached_memory: 64
memcached_port: 11211
memcached_udp_port: 11211
memcached_listen: 0.0.0.0
memcached_maxconn: 1024
memcached_max_object_size: 1m
memcached_threads: 4
memcached_ulimit: 1024
memcached_package_name: memcached
memcached_service_name: memcached
redis_limit_nofile: 65536
redis_datadir: /var/lib/redis
redis_tls_port:
