---
controller_credential_types:
  - name: Redis Authentication
    description: Authentication credential for the Redis instance on port 6379.
    kind: cloud
    inputs:
      fields:
        - id: redis_requirepass
          type: string
          label: Redis Password
          secret: true
          help_text: Password required to authenticate to the Redis instance.
      required:
        - redis_requirepass
    injectors:
      extra_vars:
        redis_requirepass: !unsafe "{{ redis_requirepass }}"
