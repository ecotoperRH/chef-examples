---
- name: Ensure Nginx site directories exist
  ansible.builtin.file:
    path: "{{ item_nginx_site_dir['value']['document_root'] }}" # noqa: R114 - path comes from the role-defined sites dictionary
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site_dir

- name: Render Nginx virtual host configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_nginx_vhost['key'] }} # noqa: R114 - filename comes from the role-defined sites dictionary
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_vhost
  notify: Reload nginx
  vars:
    server_name: "{{ item_nginx_vhost['key'] }}"
    document_root: "{{ item_nginx_vhost['value']['document_root'] }}"
    ssl_enabled: "{{ item_nginx_vhost['value']['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_certificate_path }}/{{ item_nginx_vhost['key'] }}.crt"
    key_file: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_vhost['key'] }}.key"

- name: Enable Nginx virtual hosts
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_nginx_link['key'] }}
    dest: /etc/nginx/sites-enabled/{{ item_nginx_link['key'] }} # noqa: R114 - link name comes from the role-defined sites dictionary
    state: link
    force: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_link
  notify: Reload nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
