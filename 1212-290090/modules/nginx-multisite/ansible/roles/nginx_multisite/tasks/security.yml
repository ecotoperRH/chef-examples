---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Deploy Fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Set UFW default incoming policy
  ansible.builtin.shell:
    cmd: ufw --force default deny
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Default incoming policy changed' in nginx_multisite_ufw_default.stdout"
  register: nginx_multisite_ufw_default
  args:
    executable: /bin/bash

- name: Allow required UFW services # noqa: R101 - UFW service names come from a fixed role loop, not untrusted user input
  ansible.builtin.shell:
    cmd: ufw allow {{ item_ufw_service }}
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Skipping adding existing rule' not in nginx_multisite_ufw_rule.stdout"
  register: nginx_multisite_ufw_rule
  loop:
    - ssh
    - http
    - https
  loop_control:
    loop_var: item_ufw_service
  args:
    executable: /bin/bash

- name: Enable UFW
  ansible.builtin.shell:
    cmd: ufw --force enable
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Firewall is active and enabled' in nginx_multisite_ufw_enable.stdout and 'already active' not in nginx_multisite_ufw_enable.stdout"
  register: nginx_multisite_ufw_enable
  args:
    executable: /bin/bash

- name: Deploy kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    create: false
    backup: true
  when: nginx_multisite_disable_root_login | bool
  notify: Restart ssh

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    create: false
    backup: true
  when: not nginx_multisite_password_authentication | bool
  notify: Restart ssh
