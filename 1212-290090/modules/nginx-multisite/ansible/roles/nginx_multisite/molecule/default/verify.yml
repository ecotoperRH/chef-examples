---
- name: Verify packages and services
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        fail_msg: "Required package is not installed"
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert Nginx and Fail2ban are active and enabled
      ansible.builtin.assert:
        that:
          - "'{{ item_service }}' in ansible_facts['services']"
          - ansible_facts['services'][item_service]['state'] == 'running'
          - ansible_facts['services'][item_service]['status'] == 'enabled'
        fail_msg: "Required service is not active and enabled"
      loop:
        - nginx.service
        - fail2ban.service
      loop_control:
        loop_var: item_service

    - name: Check Nginx configuration syntax
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Check SSH daemon configuration syntax
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      changed_when: false

- name: Verify configuration files and links
  hosts: all
  gather_facts: false
  tasks:
    - name: Check generated files and directories
      ansible.builtin.stat:
        path: "{{ item_config_path }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /opt/server/test
        - /opt/server/test/index.html
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /opt/server/status
        - /opt/server/status/index.html
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
      loop_control:
        loop_var: item_config_path
      register: config_stat_results

    - name: Assert generated files and directories exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - (item_result['stat']['isdir'] if item_result['item'] in ['/opt/server/test', '/opt/server/ci', '/opt/server/status'] else item_result['stat']['size'] > 0)
        fail_msg: "Expected generated path is missing or empty"
      loop: "{{ config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check enabled virtual host links
      ansible.builtin.stat:
        path: "{{ item_link_path }}"
        follow: false
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_link_path
      register: link_stat_results

    - name: Assert enabled virtual host links target available sites
      ansible.builtin.assert:
        that:
          - item_link_result['stat']['islnk']
          - item_link_result['stat']['lnk_source'] == item_link_result['item'].replace('/etc/nginx/sites-enabled/', '/etc/nginx/sites-available/')
        fail_msg: "Enabled virtual host link is missing or points to the wrong site"
      loop: "{{ link_stat_results['results'] }}"
      loop_control:
        loop_var: item_link_result

    - name: Check default Nginx site
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site_stat

    - name: Assert default Nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site_stat['stat']['exists']
        fail_msg: "The default Nginx site should be removed"

- name: Verify content, certificates, firewall, and endpoints
  hosts: all
  gather_facts: false
  tasks:
    - name: Read rendered configuration files
      ansible.builtin.slurp:
        src: "{{ item_rendered_path }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/ssh/sshd_config
      loop_control:
        loop_var: item_rendered_path
      register: rendered_file_results

    - name: Assert rendered configurations contain expected settings
      ansible.builtin.assert:
        that:
          - item_rendered['content'] | b64decode | length > 0
        fail_msg: "Rendered configuration file is empty"
      loop: "{{ rendered_file_results['results'] }}"
      loop_control:
        loop_var: item_rendered

    - name: Assert SSH hardening settings
      ansible.builtin.assert:
        that:
          - rendered_file_results['results'][5]['content'] | b64decode is search('(?m)^PermitRootLogin no$')
          - rendered_file_results['results'][5]['content'] | b64decode is search('(?m)^PasswordAuthentication no$')
        fail_msg: "Expected SSH hardening settings are missing"

    - name: Check TLS certificates and private keys
      ansible.builtin.stat:
        path: "{{ item_tls_path }}"
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_tls_path
      register: tls_stat_results

    - name: Assert TLS files and private-key permissions exist
      ansible.builtin.assert:
        that:
          - item_tls['stat']['exists']
          - item_tls['stat']['size'] > 0
          - (item_tls['stat']['mode'] == '0640' if '/private/' in item_tls['item'] else true)
          - (item_tls['stat']['pw_name'] == 'root' if '/private/' in item_tls['item'] else true)
          - (item_tls['stat']['gr_name'] == 'ssl-cert' if '/private/' in item_tls['item'] else true)
        fail_msg: "TLS certificate or private key has incorrect state"
      loop: "{{ tls_stat_results['results'] }}"
      loop_control:
        loop_var: item_tls

    - name: Check UFW status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      changed_when: false
      register: ufw_status_result

    - name: Assert UFW is active with required rules
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status_result['stdout']"
          - "'Default: deny (incoming)' in ufw_status_result['stdout']"
          - "'22/tcp' in ufw_status_result['stdout'] or 'SSH' in ufw_status_result['stdout']"
          - "'80/tcp' in ufw_status_result['stdout'] or 'WWW' in ufw_status_result['stdout']"
          - "'443/tcp' in ufw_status_result['stdout'] or 'HTTPS' in ufw_status_result['stdout']"
        fail_msg: "UFW is not active with the expected policy and rules"

    - name: Wait for HTTP and HTTPS listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_listener_port }}"
        state: started
        timeout: 30
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_listener_port

    - name: Check test site over HTTPS
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: test.cluster.local
        validate_certs: false
        status_code: 200
      register: test_https_result

    - name: Check all sites over HTTP
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_site_host }}"
        status_code: 200
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site_host
