---
- name: Verify nginx_multisite files
  hosts: all
  gather_facts: false
  tasks:
    - name: Check expected files and directories
      ansible.builtin.stat:
        path: "{{ item_nginx_path }}"  # noqa: R114 - fixed paths from the role's production configuration
        follow: false
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
        - /opt/server/test
        - /opt/server/test/index.html
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /opt/server/status
        - /opt/server/status/index.html
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_nginx_path
      register: nginx_multisite_path_stats

    - name: Assert expected files and directories exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir'] or item_result['stat']['isreg'] or item_result['stat']['islnk']
        fail_msg: "An expected nginx_multisite path is missing"
      loop: "{{ nginx_multisite_path_stats['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check the default site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: nginx_multisite_default_site

    - name: Assert the default site is absent
      ansible.builtin.assert:
        that:
          - not nginx_multisite_default_site['stat']['exists']
        fail_msg: "The default nginx site should have been removed"

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "/etc/nginx/sites-enabled/{{ item_nginx_link['key'] }}"  # noqa: R114 - hostname comes from role defaults
        follow: false
      loop: "{{ nginx_multisite_sites | dict2items }}"
      loop_control:
        loop_var: item_nginx_link
      register: nginx_multisite_link_stats

    - name: Assert enabled site links resolve correctly
      ansible.builtin.assert:
        that:
          - item_result['stat']['islnk']
          - item_result['stat']['lnk_source'] == '/etc/nginx/sites-available/' ~ item_result['item']['key']
        fail_msg: "An nginx virtual host link is missing or points to the wrong file"
      loop: "{{ nginx_multisite_link_stats['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read rendered nginx configuration
      ansible.builtin.slurp:
        src: "{{ item_nginx_config }}"  # noqa: R114 - fixed paths from the role's production configuration
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
      loop_control:
        loop_var: item_nginx_config
      register: nginx_multisite_config_contents

    - name: Assert rendered configuration is non-empty
      ansible.builtin.assert:
        that:
          - item_result['content'] | b64decode | length > 0
        fail_msg: "An nginx_multisite configuration file is empty"
      loop: "{{ nginx_multisite_config_contents['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read virtual host configurations
      ansible.builtin.slurp:
        src: "/etc/nginx/sites-available/{{ item_nginx_vhost['key'] }}"  # noqa: R114 - hostname comes from role defaults
      loop: "{{ nginx_multisite_sites | dict2items }}"
      loop_control:
        loop_var: item_nginx_vhost
      register: nginx_multisite_vhost_contents

    - name: Assert virtual host configurations contain site settings
      ansible.builtin.assert:
        that:
          - item_result['content'] | b64decode is search(item_result['item']['key'])
          - item_result['content'] | b64decode is search(item_result['item']['value']['document_root'])
          - item_result['content'] | b64decode is search('443')
          - item_result['content'] | b64decode is search('ssl_certificate')
          - item_result['content'] | b64decode is search('ssl_certificate_key')
        fail_msg: "A virtual host configuration is missing expected TLS settings"
      loop: "{{ nginx_multisite_vhost_contents['results'] }}"
      loop_control:
        loop_var: item_result

- name: Verify nginx_multisite services and endpoints
  hosts: all
  gather_facts: false
  tasks:
    - name: Check nginx and fail2ban services
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are running and enabled
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - ansible_facts.services['nginx.service']['state'] == 'running'
          - ansible_facts.services['nginx.service']['status'] == 'enabled'
          - "'fail2ban.service' in ansible_facts.services"
          - ansible_facts.services['fail2ban.service']['state'] == 'running'
          - ansible_facts.services['fail2ban.service']['status'] == 'enabled'
        fail_msg: "nginx or fail2ban is not running and enabled"

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Check HTTP endpoints
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_nginx_http['key'] }}"
        status_code: 200
      loop: "{{ nginx_multisite_sites | dict2items }}"
      loop_control:
        loop_var: item_nginx_http

    - name: Check HTTPS endpoints
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_nginx_https['key'] }}"
        validate_certs: false
        status_code: 200
      loop: "{{ nginx_multisite_sites | dict2items }}"
      loop_control:
        loop_var: item_nginx_https

    - name: Check fail2ban responds
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - ping
      changed_when: false

    - name: Read SSH configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: nginx_multisite_ssh_config

    - name: Assert SSH hardening settings
      ansible.builtin.assert:
        that:
          - nginx_multisite_ssh_config['content'] | b64decode is search('(?m)^PermitRootLogin\\s+no\\s*$')
          - nginx_multisite_ssh_config['content'] | b64decode is search('(?m)^PasswordAuthentication\\s+no\\s*$')
        fail_msg: "SSH hardening settings are not present"

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      changed_when: false
