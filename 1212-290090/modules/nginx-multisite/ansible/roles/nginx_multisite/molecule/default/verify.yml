---
- name: Verify nginx_multisite files and services
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - "item_package in ansible_facts.packages"
        fail_msg: "A required package is not installed"
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert required services are active
      ansible.builtin.assert:
        that:
          - "item_service in ansible_facts.services"
          - "ansible_facts.services[item_service]['state'] == 'running'"
        fail_msg: "A required service is not running"
      loop:
        - nginx.service
        - fail2ban.service
      loop_control:
        loop_var: item_service

    - name: Check expected files and directories
      ansible.builtin.stat:
        path: "{{ item_nginx_path }}" # noqa: R114 - paths are fixed production paths from the migration plan
        follow: false
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
        - /opt/server/test
        - /opt/server/test/index.html
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /opt/server/status
        - /opt/server/status/index.html
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_nginx_path
      register: nginx_multisite_path_stats

    - name: Assert expected files and directories exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
        fail_msg: "An expected nginx_multisite path is missing"
      loop: "{{ nginx_multisite_path_stats['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_nginx_link }}" # noqa: R114 - paths are fixed production paths from the migration plan
        follow: false
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_nginx_link
      register: nginx_multisite_link_stats

    - name: Assert enabled site links point to available sites
      ansible.builtin.assert:
        that:
          - item_result['stat']['islnk']
          - item_result['stat']['lnk_source'] == item_result['stat']['path'] | regex_replace('sites-enabled', 'sites-available')
        fail_msg: "An enabled nginx site link has an unexpected target"
      loop: "{{ nginx_multisite_link_stats['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check default site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: nginx_multisite_default_site

    - name: Assert default site is absent
      ansible.builtin.assert:
        that:
          - not nginx_multisite_default_site['stat']['exists']
        fail_msg: "The default nginx site should be absent"

    - name: Read nginx and SSH configuration
      ansible.builtin.slurp:
        src: "{{ item_nginx_config }}" # noqa: R114 - paths are fixed production paths from the migration plan
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/ssh/sshd_config
      loop_control:
        loop_var: item_nginx_config
      register: nginx_multisite_config_contents

    - name: Assert configuration contains expected settings
      ansible.builtin.assert:
        that:
          - item_result['content'] | b64decode | length > 0
        fail_msg: "An expected configuration file is empty"
      loop: "{{ nginx_multisite_config_contents['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Assert SSH hardening is configured
      ansible.builtin.assert:
        that:
          - >-
            (nginx_multisite_config_contents['results'][5]['content'] | b64decode) is search('(?m)^\\s*PermitRootLogin\\s+no\\s*$')
          - >-
            (nginx_multisite_config_contents['results'][5]['content'] | b64decode) is search('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')
        fail_msg: "SSH hardening settings are missing"

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

- name: Verify nginx_multisite network and TLS state
  hosts: all
  gather_facts: false
  tasks:
    - name: Check HTTP and HTTPS listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_nginx_port }}"
        state: started
        timeout: 10
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_nginx_port

    - name: Verify HTTP virtual hosts
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_nginx_host }}"
        status_code: [200, 301, 302, 403]
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_nginx_host

    - name: Verify HTTPS virtual hosts
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_nginx_host }}"
        validate_certs: false
        status_code: [200, 301, 302, 403]
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_nginx_host

    - name: Check TLS private key metadata
      ansible.builtin.stat:
        path: "{{ item_nginx_key }}" # noqa: R114 - paths are fixed production paths from the migration plan
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_nginx_key
      register: nginx_multisite_key_stats

    - name: Assert TLS private key ownership and permissions
      ansible.builtin.assert:
        that:
          - item_result['stat']['pw_name'] == 'root'
          - item_result['stat']['gr_name'] == 'ssl-cert'
          - item_result['stat']['mode'] == '0640'
        fail_msg: "A TLS private key has incorrect ownership or permissions"
      loop: "{{ nginx_multisite_key_stats['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check Fail2ban responds
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - ping
      changed_when: false

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      changed_when: false

    - name: Apply-check sysctl configuration
      ansible.builtin.command:
        argv:
          - sysctl
          - -p
          - /etc/sysctl.d/99-security.conf
      changed_when: false
