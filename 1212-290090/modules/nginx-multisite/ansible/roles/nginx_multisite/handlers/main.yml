---
- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload security sysctl
  ansible.builtin.command:
    argv:
      - sysctl
      - --system
  changed_when: false

- name: Restart SSH
  ansible.builtin.service:
    name: ssh
    state: restarted
