---
controller_credential_types:
  - name: PostgreSQL Database
    description: Credentials for the FastAPI application to authenticate to its PostgreSQL database; the password should be migrated to Ansible Vault.
    kind: cloud
    inputs:
      fields:
        - id: database_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application; currently fastapi.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL role used to authenticate to fastapi_db; currently hardcoded and must be stored in Ansible Vault.
      required:
        - database_username
        - database_password
    injectors:
      extra_vars:
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
