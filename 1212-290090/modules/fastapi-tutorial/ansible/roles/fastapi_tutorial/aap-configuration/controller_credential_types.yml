---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection settings for the FastAPI application's PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application; the source value is fastapi.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role, used for database authentication and stored in the application DATABASE_URL.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application; the source value is fastapi_db.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL connection; the source value is localhost.
        - id: database_port
          type: string
          label: Database Port
          help_text: TCP port for the PostgreSQL connection; the source default is 5432.
      required:
        - db_username
        - db_password
        - database_name
        - database_host
        - database_port
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
        database_port: !unsafe "{{ database_port }}"
