---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application
    description:
      - Deploys the FastAPI tutorial application, its Python environment, PostgreSQL database, and systemd service.
    options:
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_tutorial_venv_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_env_file:
        type: str
        required: false
        default: /opt/fastapi-tutorial/.env
        description: Application environment file path.
      fastapi_tutorial_service_file:
        type: str
        required: false
        default: /etc/systemd/system/fastapi-tutorial.service
        description: Systemd unit file path.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Application systemd service name.
      fastapi_tutorial_database_service:
        type: str
        required: false
        default: postgresql
        description: PostgreSQL systemd service name.
      fastapi_tutorial_database_name:
        type: str
        required: false
        default: fastapi_db
        description: PostgreSQL database name.
      fastapi_tutorial_database_host:
        type: str
        required: false
        default: localhost
        description: PostgreSQL connection host.
      fastapi_tutorial_database_port:
        type: int
        required: false
        default: 5432
        description: PostgreSQL connection port.
      fastapi_tutorial_database_url:
        type: str
        required: false
        default: postgresql://{{ database_username }}:{{ database_password }}@{{ fastapi_tutorial_database_host }}/{{ fastapi_tutorial_database_name }}
        description: Database URL written to the application environment file.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide tasks that handle the database password from logs.
      database_username:
        type: str
        required: true
        description: Database username injected by an AAP credential type.
      database_password:
        type: str
        required: true
        description: Database password injected by an AAP credential type.
