---
argument_specs:
  main:
    short_description: Deploy the FastAPI tutorial application and PostgreSQL database
    description:
      - Installs the FastAPI tutorial application and its dependencies.
      - Configures PostgreSQL credentials and manages the application systemd service.
    options:
      fastapi_tutorial_app_directory:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Directory where the application repository is deployed.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_virtualenv:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment path.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Name of the application service.
      fastapi_tutorial_service_file:
        type: str
        required: false
        default: /etc/systemd/system/fastapi-tutorial.service
        description: Path to the systemd unit file.
      fastapi_tutorial_app_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by Uvicorn.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations that handle the database password.
      db_username:
        type: str
        required: true
        description: PostgreSQL username injected by an AAP credential type.
      db_password:
        type: str
        required: true
        description: PostgreSQL password injected by an AAP credential type.
      db_host:
        type: str
        required: true
        description: PostgreSQL host injected by an AAP credential type.
      db_name:
        type: str
        required: true
        description: PostgreSQL database name injected by an AAP credential type.
      db_port:
        type: int
        required: true
        description: PostgreSQL port injected by an AAP credential type.
