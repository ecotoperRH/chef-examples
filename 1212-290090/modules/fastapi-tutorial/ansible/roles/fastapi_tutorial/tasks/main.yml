---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI system packages  # noqa: R113 - package names are a fixed role-defined list
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create FastAPI application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_path }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check out FastAPI tutorial repository  # noqa: R104 - repository URL is a trusted HTTPS role default; noqa: R106 - repository source is a trusted role default
  ansible.builtin.git: # noqa: R106 - repository source is a trusted role default
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_path }}" # noqa: R114 - destination is a role default controlled by the operator
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment  # noqa: R101 - command arguments use trusted role defaults
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_path }}"
    creates: "{{ fastapi_tutorial_venv_path }}" # noqa: R114 - path is a role default controlled by the operator

- name: Install Python application dependencies
  ansible.builtin.pip: # noqa: R113 - requirements path and virtualenv are trusted role defaults
    requirements: "{{ fastapi_tutorial_path }}/requirements.txt" # noqa: R114 - path is a role default controlled by the operator
    virtualenv: "{{ fastapi_tutorial_venv_path }}" # noqa: R114 - path is a role default controlled by the operator

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the PostgreSQL application role exists  # noqa: L039 - database_username is supplied as a validated role parameter; noqa: R101 - command uses a validated role parameter
  ansible.builtin.command: # noqa: R101 - command uses a validated role parameter
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = '{{ database_username }}';
    become: true
    become_user: postgres
  changed_when: false
  register: fastapi_tutorial_role_exists
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL application role  # noqa: L039 - database credentials are supplied as validated role parameters; noqa: R101 - command uses validated role parameters
  ansible.builtin.command: # noqa: R101 - command uses validated role parameters
    argv:
      - psql
      - -c
      - CREATE ROLE {{ database_username }} LOGIN PASSWORD '{{ database_password }}';
    become: true
    become_user: postgres
  when: fastapi_tutorial_role_exists.stdout | trim != '1'
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether the application database exists  # noqa: L039 - database_name is supplied as a validated role parameter; noqa: R101 - command uses a validated role parameter
  ansible.builtin.command: # noqa: R101 - command uses a validated role parameter
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}';
    become: true
    become_user: postgres
  changed_when: false
  register: fastapi_tutorial_database_exists

- name: Create application database  # noqa: L039 - database parameters are supplied as validated role parameters; noqa: R101 - command uses validated role parameters
  ansible.builtin.command: # noqa: R101 - command uses validated role parameters
    argv:
      - createdb
      - -O
      - "{{ database_username }}"
      - "{{ database_name }}"
    become: true
    become_user: postgres
  when: fastapi_tutorial_database_exists.stdout | trim != '1'

- name: Grant application database privileges  # noqa: L039 - database parameters are supplied as validated role parameters; noqa: R101 - command uses validated role parameters
  ansible.builtin.command: # noqa: R101 - command uses validated role parameters
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE "{{ database_name }}" TO "{{ database_username }}";
    become: true
    become_user: postgres
  changed_when: false

- name: Deploy FastAPI environment file  # noqa: L039 - database connection parameters are supplied as validated role parameters
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="{{ fastapi_tutorial_project_name }}"
      API_VERSION={{ fastapi_tutorial_api_version }}
      DATABASE_URL=postgresql://{{ database_username }}:{{ database_password }}@{{ database_host }}:{{ database_port }}/{{ database_name }}
    dest: "{{ fastapi_tutorial_path }}/.env" # noqa: R114 - destination is a role default controlled by the operator
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_path }}
      Environment="PATH={{ fastapi_tutorial_venv_path }}/bin"
      ExecStart={{ fastapi_tutorial_venv_path }}/bin/uvicorn {{ fastapi_tutorial_app_module }} --host {{ fastapi_tutorial_bind_address }} --port {{ fastapi_tutorial_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - destination is a role default controlled by the operator
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd configuration

- name: Apply systemd unit changes before starting FastAPI
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
