---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI tutorial system packages # noqa: R113 - package names are fixed role requirements
  ansible.builtin.package: # noqa: R113 - package names are fixed role requirements
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create FastAPI tutorial application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_directory }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Check out FastAPI tutorial repository # noqa: R104 - repository URL is a role default using HTTPS; noqa: R106 - repository source is a trusted role default; noqa: R114 - path is a role default, not user input
  ansible.builtin.git: # noqa: R106 - repository source is a trusted role default; noqa: R114 - path is a role default, not user input
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_directory }}" # noqa: R114 - path is a role default, not user input
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment parent directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_virtualenv | dirname }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Python virtual environment # noqa: R101 - executable and path come from trusted role defaults
  ansible.builtin.command: # noqa: R101 - executable and path come from trusted role defaults
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_virtualenv }}"
    creates: "{{ fastapi_tutorial_virtualenv }}" # noqa: R114 - path is a role default, not user input

- name: Install application dependencies # noqa: R113 - virtualenv path is a trusted role default, not a package target
  ansible.builtin.pip: # noqa: R113 - virtualenv path is a trusted role default, not a package target
    requirements: "{{ fastapi_tutorial_app_directory }}/requirements.txt" # noqa: R114 - path is a role default, not user input
    virtualenv: "{{ fastapi_tutorial_virtualenv }}" # noqa: R114 - path is a role default, not user input

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Check whether the PostgreSQL application role exists # noqa: L039 - database credentials come from the attached AAP credential
  ansible.builtin.command: # noqa: R101 - SQL uses trusted credential variables
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = '{{ db_username }}';
  register: postgres_role_exists
  changed_when: false
  become: true # noqa: R108 - PostgreSQL inspection runs as the postgres system user
  become_user: postgres

- name: Create PostgreSQL application role # noqa: L039 - database credentials come from the attached AAP credential
  ansible.builtin.command: # noqa: R101 - SQL uses trusted credential variables
    argv:
      - psql
      - -c
      - CREATE ROLE {{ db_username }} LOGIN PASSWORD '{{ db_password }}';
  when: postgres_role_exists.stdout | trim != '1'
  become: true # noqa: R108 - PostgreSQL administration requires the postgres system user
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether the FastAPI application database exists # noqa: L039 - database name comes from the attached AAP credential
  ansible.builtin.command: # noqa: R101 - SQL uses trusted credential variables
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ db_name }}';
  register: postgres_database_exists
  changed_when: false
  become: true # noqa: R108 - PostgreSQL inspection runs as the postgres system user
  become_user: postgres

- name: Create FastAPI application database # noqa: L039 - database credentials come from the attached AAP credential
  ansible.builtin.command: # noqa: R101 - SQL uses trusted credential variables
    argv:
      - psql
      - -c
      - CREATE DATABASE {{ db_name }} OWNER {{ db_username }};
  when: postgres_database_exists.stdout | trim != '1'
  become: true # noqa: R108 - PostgreSQL administration requires the postgres system user
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check application database privileges # noqa: L039 - database credentials come from the attached AAP credential
  ansible.builtin.command: # noqa: R101 - SQL uses trusted credential variables
    argv:
      - psql
      - -tAc
      - SELECT has_database_privilege('{{ db_username }}', '{{ db_name }}', 'CREATE') AND has_database_privilege('{{ db_username }}', '{{ db_name }}', 'CONNECT');
  register: postgres_privileges
  changed_when: false
  become: true # noqa: R108 - PostgreSQL inspection runs as the postgres system user
  become_user: postgres

- name: Grant database privileges to the application role # noqa: L039 - database credentials come from the attached AAP credential
  ansible.builtin.command: # noqa: R101 - SQL uses trusted credential variables
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_username }};
  when: postgres_privileges.stdout | trim != 't'
  become: true # noqa: R108 - PostgreSQL administration requires the postgres system user
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI environment configuration # noqa: L039 - database credentials come from the attached AAP credential
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/{{ db_name }}
    dest: "{{ fastapi_tutorial_app_directory }}/.env" # noqa: R114 - path is a role default, not user input
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_directory }}
      Environment="PATH={{ fastapi_tutorial_virtualenv }}/bin"
      ExecStart={{ fastapi_tutorial_virtualenv }}/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_app_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - path is a role default, not user input
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Enable and start FastAPI tutorial service
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
