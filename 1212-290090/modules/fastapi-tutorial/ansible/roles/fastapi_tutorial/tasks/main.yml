---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install required system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-psycopg2
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - fixed role default path
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Check out FastAPI tutorial repository # noqa: R104,R106 - repository URL is a trusted HTTPS role default and repository source is a trusted role default
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - fixed role default path
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command uses the trusted role-default virtualenv path
  ansible.builtin.command:
    cmd: python3 -m venv {{ fastapi_tutorial_venv_dir }}
    creates: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - fixed role default path

- name: Install Python application dependencies # noqa: R113 - requirements target is the fixed application requirements file
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt" # noqa: R114 - fixed role default path
    virtualenv: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - fixed role default path

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_database_service }}"
    enabled: true
    state: started

- name: Create PostgreSQL application role when absent # noqa: L039,L047,R108 - credentials are validated by the preceding task and supplied by the attached AAP credential; password logging is disabled; PostgreSQL role creation must become postgres
  community.postgresql.postgresql_user:
    name: "{{ database_username }}"
    password: "{{ database_password }}"
    state: present
  become: true
  become_user: postgres
  no_log: true

- name: Create application database when absent # noqa: L039,R108 - database_username is supplied by the attached AAP credential; task must become postgres to create the database owner
  community.postgresql.postgresql_db:
    name: "{{ fastapi_tutorial_database_name }}"
    owner: "{{ database_username }}"
    state: present
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant application database privileges # noqa: L039,R108 - database_username is supplied by the attached AAP credential; task must become postgres to grant database privileges
  community.postgresql.postgresql_privs:
    database: "{{ fastapi_tutorial_database_name }}"
    type: database
    roles: "{{ database_username }}"
    privs: ALL
    state: present
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write application environment file
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_env_file }}" # noqa: R114 - fixed role default path
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL={{ fastapi_tutorial_database_url }}
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write systemd service unit
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - fixed role default path
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Enable and start FastAPI tutorial service # noqa: R108 - task manages a systemd service and requires root
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
