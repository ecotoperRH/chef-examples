---
- name: Verify FastAPI application files and packages
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        fail_msg: "A required FastAPI or PostgreSQL package is missing"
      loop:
        - python3
        - python3-pip
        - python3-venv
        - git
        - postgresql
        - postgresql-contrib
        - libpq-dev
      loop_control:
        loop_var: item_package

    - name: Check application paths
      ansible.builtin.stat:
        path: "{{ item_path }}"
      loop:
        - /opt/fastapi-tutorial
        - /opt/fastapi-tutorial/venv
        - /opt/fastapi-tutorial/requirements.txt
        - /opt/fastapi-tutorial/venv/bin/python
        - /opt/fastapi-tutorial/venv/bin/pip
        - /opt/fastapi-tutorial/.env
        - /etc/systemd/system/fastapi-tutorial.service
      loop_control:
        loop_var: item_path
      register: application_path_stats

    - name: Assert application paths exist and have expected types
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - >-
            (item_result['stat']['isdir'] and item_result['item'] in
            ['/opt/fastapi-tutorial', '/opt/fastapi-tutorial/venv']) or
            (not item_result['stat']['isdir'])
        fail_msg: "An expected FastAPI application path is missing"
      loop: "{{ application_path_stats['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check repository revision
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - rev-parse
          - --abbrev-ref
          - HEAD
      changed_when: false
      register: repository_branch

    - name: Assert repository is on main
      ansible.builtin.assert:
        that:
          - repository_branch['stdout'] | trim == 'main'
        fail_msg: "The FastAPI repository is not checked out at the main branch"

    - name: Validate the Python environment
      ansible.builtin.command:
        argv:
          - /opt/fastapi-tutorial/venv/bin/pip
          - check
      changed_when: false
      register: pip_check

    - name: Assert Python dependencies are consistent
      ansible.builtin.assert:
        that:
          - pip_check['rc'] == 0
        fail_msg: "The FastAPI virtual environment has missing or incompatible dependencies"

    - name: Read systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: service_unit

    - name: Assert systemd unit configuration
      ansible.builtin.assert:
        that:
          - service_unit['content'] | b64decode is search('ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000')
          - service_unit['content'] | b64decode is search('WorkingDirectory=/opt/fastapi-tutorial')
          - service_unit['content'] | b64decode is search('Restart=always')
        fail_msg: "The FastAPI systemd unit has unexpected configuration"

    - name: Check application environment file metadata
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/.env
      register: environment_file

    - name: Assert environment file permissions
      ansible.builtin.assert:
        that:
          - environment_file['stat']['exists']
          - environment_file['stat']['mode'] == '0644'
          - environment_file['stat']['pw_name'] == 'root'
          - environment_file['stat']['gr_name'] == 'root'
        fail_msg: "The FastAPI environment file has unexpected metadata"

- name: Verify PostgreSQL and FastAPI services
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert required services are active and enabled
      ansible.builtin.assert:
        that:
          - item_service in ansible_facts['services']
          - ansible_facts['services'][item_service]['state'] == 'running'
          - ansible_facts['services'][item_service]['status'] == 'enabled'
        fail_msg: "A required service is not active and enabled"
      loop:
        - postgresql.service
        - fastapi-tutorial.service
      loop_control:
        loop_var: item_service

    - name: Check PostgreSQL role  # noqa: R108 - task must run as the postgres system user to inspect PostgreSQL roles
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - SELECT rolname FROM pg_roles WHERE rolname='fastapi';
      become: true
      become_user: postgres
      changed_when: false
      register: postgres_role

    - name: Check application database owner  # noqa: R108 - task must run as the postgres system user to inspect database ownership
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname='fastapi_db';
      become: true
      become_user: postgres
      changed_when: false
      register: postgres_database_owner

    - name: Assert PostgreSQL objects exist
      ansible.builtin.assert:
        that:
          - postgres_role['stdout'] | trim == 'fastapi'
          - postgres_database_owner['stdout'] | trim == 'fastapi'
        fail_msg: "The FastAPI PostgreSQL role or database owner is incorrect"

    - name: Wait for PostgreSQL and FastAPI ports
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_port }}"
        timeout: 30
      loop:
        - 5432
        - 8000
      loop_control:
        loop_var: item_port

    - name: Check FastAPI endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/
        method: GET
        status_code:
          - 200
          - 404
          - 405
      register: fastapi_endpoint

    - name: Assert FastAPI endpoint responded
      ansible.builtin.assert:
        that:
          - fastapi_endpoint['status'] in [200, 404, 405]
        fail_msg: "The FastAPI service did not respond on port 8000"
