---
- name: Verify application files and packages
  hosts: all
  gather_facts: false
  vars:
    fastapi_tutorial_secure_logging: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        fail_msg: Required package is not installed
      loop:
        - python3
        - python3-pip
        - python3-venv
        - git
        - postgresql
        - postgresql-contrib
        - libpq-dev
      loop_control:
        loop_var: item_package

    - name: Check application files and directories
      ansible.builtin.stat:
        path: "{{ item_path }}" # noqa: R114 - fixed production paths defined by the migration plan
      loop:
        - /opt/fastapi-tutorial
        - /opt/fastapi-tutorial/venv
        - /opt/fastapi-tutorial/requirements.txt
        - /opt/fastapi-tutorial/venv/bin/python
        - /opt/fastapi-tutorial/venv/bin/pip
        - /opt/fastapi-tutorial/.env
        - /etc/systemd/system/fastapi-tutorial.service
      loop_control:
        loop_var: item_path
      register: application_file_stats

    - name: Assert application files and directories are present
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
        fail_msg: Expected FastAPI application path is missing
      loop: "{{ application_file_stats['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Assert application executables are executable
      ansible.builtin.assert:
        that:
          - item_result['stat']['executable'] | default(false)
        fail_msg: Expected virtual environment executable is not executable
      loop: "{{ application_file_stats['results'][3:5] }}"
      loop_control:
        loop_var: item_result

    - name: Check environment file without exposing its contents
      ansible.builtin.slurp:
        src: /opt/fastapi-tutorial/.env
      register: environment_file
      no_log: "{{ fastapi_tutorial_secure_logging }}"

    - name: Assert environment file contains required configuration
      ansible.builtin.assert:
        that:
          - "'PROJECT_NAME=\"FastAPI Tutorial\"' in (environment_file['content'] | b64decode)"
          - "'API_VERSION=1.0.0' in (environment_file['content'] | b64decode)"
          - "'DATABASE_URL=postgresql://' in (environment_file['content'] | b64decode)"
        fail_msg: Environment file is missing required configuration

    - name: Check repository revision
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - rev-parse
          - --abbrev-ref
          - HEAD
      register: repository_branch
      changed_when: false

    - name: Assert repository is on the expected branch
      ansible.builtin.assert:
        that:
          - repository_branch['stdout'] | trim == 'main'
        fail_msg: FastAPI repository is not checked out at the main branch

    - name: Check Python dependency consistency
      ansible.builtin.command:
        argv:
          - /opt/fastapi-tutorial/venv/bin/pip
          - check
      changed_when: false

- name: Verify PostgreSQL and FastAPI services
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert required services are active
      ansible.builtin.assert:
        that:
          - "'postgresql.service' in ansible_facts['services']"
          - ansible_facts['services']['postgresql.service']['state'] == 'running'
          - "'fastapi-tutorial.service' in ansible_facts['services']"
          - ansible_facts['services']['fastapi-tutorial.service']['state'] == 'running'
        fail_msg: Expected PostgreSQL and FastAPI services are not running

    - name: Wait for PostgreSQL
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 5432
        state: started
        timeout: 30

    - name: Wait for FastAPI
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8000
        state: started
        timeout: 30

    - name: Check FastAPI endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/
        method: GET
        status_code:
          - 200
          - 404
        return_content: false

    - name: Query PostgreSQL application objects # noqa: R108 - querying PostgreSQL as the postgres OS user is required for database inspection
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        db: postgres
        query: >-
          SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'fastapi') AS role_exists,
          EXISTS (SELECT 1 FROM pg_database WHERE datname = 'fastapi_db') AS database_exists,
          (SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'fastapi_db') AS database_owner;
      register: postgresql_objects

    - name: Assert PostgreSQL application objects exist
      ansible.builtin.assert:
        that:
          - postgresql_objects['query_result'][0]['role_exists'] | bool
          - postgresql_objects['query_result'][0]['database_exists'] | bool
          - postgresql_objects['query_result'][0]['database_owner'] == 'fastapi'
        fail_msg: Expected PostgreSQL role, database, or owner is missing

    - name: Check systemd unit content
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: service_unit

    - name: Assert systemd unit has expected application command
      ansible.builtin.assert:
        that:
          - "'WorkingDirectory=/opt/fastapi-tutorial' in (service_unit['content'] | b64decode)"
          - "'ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000' in (service_unit['content'] | b64decode)"
          - "'Restart=always' in (service_unit['content'] | b64decode)"
        fail_msg: FastAPI systemd unit does not contain the expected configuration
