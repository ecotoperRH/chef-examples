---
- name: Verify nginx configuration files
  hosts: all
  gather_facts: false
  tasks:
    - name: Check nginx configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /tmp/molecule_test/etc/nginx/nginx.conf
        - /tmp/molecule_test/etc/nginx/conf.d/security.conf
        - /tmp/molecule_test/etc/nginx/sites-available/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_config
      register: nginx_config_results

    - name: Assert nginx configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected nginx configuration file not found"
      loop: "{{ nginx_config_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check nginx site symlinks exist
      ansible.builtin.stat:
        path: "{{ item_link }}"
      loop:
        - /tmp/molecule_test/etc/nginx/sites-enabled/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_link
      register: nginx_link_results

    - name: Assert nginx site symlinks were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['islnk']
        fail_msg: "Expected nginx site symlink not found"
      loop: "{{ nginx_link_results['results'] }}"
      loop_control:
        loop_var: item_result

- name: Verify SSL certificates and keys
  hosts: all
  gather_facts: false
  tasks:
    - name: Check SSL certificates exist
      ansible.builtin.stat:
        path: "{{ item_cert }}"
      loop:
        - /tmp/molecule_test/etc/ssl/certs/test.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/certs/ci.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_cert
      register: ssl_cert_results

    - name: Assert SSL certificates were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL certificate not found"
      loop: "{{ ssl_cert_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check SSL private keys exist
      ansible.builtin.stat:
        path: "{{ item_key }}"
      loop:
        - /tmp/molecule_test/etc/ssl/private/test.cluster.local.key
        - /tmp/molecule_test/etc/ssl/private/ci.cluster.local.key
        - /tmp/molecule_test/etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: ssl_key_results

    - name: Assert SSL private keys were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL private key not found"
      loop: "{{ ssl_key_results['results'] }}"
      loop_control:
        loop_var: item_result

- name: Verify document roots and index files
  hosts: all
  gather_facts: false
  tasks:
    - name: Check document root directories exist
      ansible.builtin.stat:
        path: "{{ item_docroot }}"
      loop:
        - /tmp/molecule_test/opt/server/test
        - /tmp/molecule_test/opt/server/ci
        - /tmp/molecule_test/opt/server/status
      loop_control:
        loop_var: item_docroot
      register: docroot_results

    - name: Assert document root directories were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected document root directory not found"
      loop: "{{ docroot_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check index.html files exist
      ansible.builtin.stat:
        path: "{{ item_index }}"
      loop:
        - /tmp/molecule_test/opt/server/test/index.html
        - /tmp/molecule_test/opt/server/ci/index.html
        - /tmp/molecule_test/opt/server/status/index.html
      loop_control:
        loop_var: item_index
      register: index_results

    - name: Assert index.html files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected index.html file not found"
      loop: "{{ index_results['results'] }}"
      loop_control:
        loop_var: item_result

- name: Verify security configurations
  hosts: all
  gather_facts: false
  tasks:
    - name: Check fail2ban configuration exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/fail2ban/jail.local
      register: fail2ban_config_result

    - name: Assert fail2ban configuration was created
      ansible.builtin.assert:
        that:
          - fail2ban_config_result['stat']['exists']
          - fail2ban_config_result['stat']['size'] > 0
        fail_msg: "Expected fail2ban configuration not found"

    - name: Check sysctl security configuration exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-security.conf
      register: sysctl_config_result

    - name: Assert sysctl security configuration was created
      ansible.builtin.assert:
        that:
          - sysctl_config_result['stat']['exists']
          - sysctl_config_result['stat']['size'] > 0
        fail_msg: "Expected sysctl security configuration not found"

    - name: Check SSH configuration exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_config_result

    - name: Assert SSH configuration was created
      ansible.builtin.assert:
        that:
          - ssh_config_result['stat']['exists']
          - ssh_config_result['stat']['size'] > 0
        fail_msg: "Expected SSH configuration not found"

    - name: Get fail2ban configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/fail2ban/jail.local
      register: fail2ban_content

    - name: Assert fail2ban configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'[sshd]' in (fail2ban_content['content'] | b64decode)"
          - "'[nginx-http-auth]' in (fail2ban_content['content'] | b64decode)"
          - "'[nginx-limit-req]' in (fail2ban_content['content'] | b64decode)"
          - "'[nginx-botsearch]' in (fail2ban_content['content'] | b64decode)"
        fail_msg: "Fail2ban configuration missing expected sections"

    - name: Get sysctl security configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-security.conf
      register: sysctl_content

    - name: Assert sysctl configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'net.ipv4.conf.all.rp_filter = 1' in (sysctl_content['content'] | b64decode)"
          - "'net.ipv4.conf.all.accept_redirects = 0' in (sysctl_content['content'] | b64decode)"
          - "'net.ipv4.tcp_syncookies = 1' in (sysctl_content['content'] | b64decode)"
        fail_msg: "Sysctl security configuration missing expected settings"

    - name: Get SSH configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_content

    - name: Assert SSH configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (ssh_content['content'] | b64decode)"
          - "'PasswordAuthentication no' in (ssh_content['content'] | b64decode)"
        fail_msg: "SSH configuration missing expected settings"

- name: Verify service status (skipped in container)
  hosts: all
  gather_facts: false
  tasks:
    - name: Check nginx service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert nginx service is running
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service']['state'] == 'running'"
          - "ansible_facts.services['nginx.service']['status'] == 'enabled'"
        fail_msg: "Nginx service not running or not enabled"
      tags: molecule-notest

    - name: Check fail2ban service status
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - "ansible_facts.services['fail2ban.service']['state'] == 'running'"
          - "ansible_facts.services['fail2ban.service']['status'] == 'enabled'"
        fail_msg: "Fail2ban service not running or not enabled"
      tags: molecule-notest

    - name: Check UFW service status
      ansible.builtin.assert:
        that:
          - "'ufw.service' in ansible_facts.services"
          - "ansible_facts.services['ufw.service']['state'] == 'running'"
          - "ansible_facts.services['ufw.service']['status'] == 'enabled'"
        fail_msg: "UFW service not running or not enabled"
      tags: molecule-notest

    - name: Check port 80 is listening
      ansible.builtin.wait_for:
        port: 80
        state: started
        timeout: 5
      tags: molecule-notest

    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      tags: molecule-notest

    - name: Test HTTP to HTTPS redirect for test.cluster.local
      ansible.builtin.uri:
        url: http://test.cluster.local
        method: GET
        status_code: 301
        follow_redirects: none
      register: http_redirect
      tags: molecule-notest

    - name: Assert HTTP redirects to HTTPS
      ansible.builtin.assert:
        that:
          - "http_redirect.status == 301"
          - "'https://test.cluster.local' in http_redirect.location"
        fail_msg: "HTTP to HTTPS redirect not working correctly"
      tags: molecule-notest

    - name: Test HTTPS access for test.cluster.local
      ansible.builtin.uri:
        url: https://test.cluster.local
        method: GET
        validate_certs: false
        status_code: 200
      register: https_access
      tags: molecule-notest

    - name: Assert HTTPS access works
      ansible.builtin.assert:
        that:
          - "https_access.status == 200"
        fail_msg: "HTTPS access not working correctly"
      tags: molecule-notest