---
- name: Install Nginx
  ansible.builtin.package:
    name:
      - nginx
    state: present

- name: Create Nginx virtual-host directories
  ansible.builtin.file:
    path: "{{ item_nginx_multisite_nginx_directory }}" # noqa: R114 - loop values are role-defined fixed Nginx directories
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
  loop_control:
    loop_var: item_nginx_multisite_nginx_directory

- name: Configure Nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload Nginx

- name: Configure Nginx security settings
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload Nginx

- name: Create static site document roots
  ansible.builtin.file:
    path: "{{ item_nginx_multisite_site['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dict, not user input
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site

- name: Deploy static site content
  ansible.builtin.copy:
    src: "{{ item_nginx_multisite_site['key'].split('.')[0] }}/index.html"
    dest: "{{ item_nginx_multisite_site['value']['document_root'] }}/index.html" # noqa: R114 - path from role-defined sites dict, not user input
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site
