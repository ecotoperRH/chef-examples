---
- name: Install TLS packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create TLS private-key group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create TLS certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_certificate_path }}" # noqa: R114 - path from role default, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create TLS private-key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}" # noqa: R114 - path from role default, not user input
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Check for TLS private keys
  ansible.builtin.stat:
    path: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_multisite_site['key'] }}.key" # noqa: R114 - path from role-defined sites dict, not user input
  when: item_nginx_multisite_site['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site
    index_var: nginx_multisite_site_index
  register: nginx_multisite_tls_private_keys
  no_log: "{{ nginx_multisite_secure_logging }}"

- name: Check for TLS certificates
  ansible.builtin.stat:
    path: "{{ nginx_multisite_certificate_path }}/{{ item_nginx_multisite_site['key'] }}.crt" # noqa: R114 - path from role-defined sites dict, not user input
  when: item_nginx_multisite_site['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site
    index_var: nginx_multisite_site_index
  register: nginx_multisite_tls_certificates
  no_log: "{{ nginx_multisite_secure_logging }}"

- name: Generate self-signed TLS certificates # noqa: L039 - TLS results are registered by preceding stat tasks
  ansible.builtin.command: # noqa: R101 - command values are role defaults and role-defined site data
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "{{ nginx_multisite_certificate_days | string }}"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx_multisite_private_key_path }}/{{ item_nginx_multisite_site['key'] }}.key"
      - -out
      - "{{ nginx_multisite_certificate_path }}/{{ item_nginx_multisite_site['key'] }}.crt"
      - -subj
      - /C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_nginx_multisite_site['key'] }}/emailAddress=admin@example.com
  when:
    - item_nginx_multisite_site['value']['ssl_enabled']
    - >-
      not nginx_multisite_tls_private_keys.results[nginx_multisite_site_index].stat.exists
      or not nginx_multisite_tls_certificates.results[nginx_multisite_site_index].stat.exists
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site
    index_var: nginx_multisite_site_index
  notify: Reload Nginx
  no_log: "{{ nginx_multisite_secure_logging }}"

- name: Set TLS private-key ownership and permissions
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_multisite_site['key'] }}.key" # noqa: R114 - path from role-defined sites dict, not user input
    state: file
    owner: root
    group: ssl-cert
    mode: "0640"
  when: item_nginx_multisite_site['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site
  no_log: "{{ nginx_multisite_secure_logging }}"
