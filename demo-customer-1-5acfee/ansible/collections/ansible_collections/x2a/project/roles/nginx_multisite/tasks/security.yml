---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Configure Fail2ban jails
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart Fail2ban

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: "{{ nginx_multisite_fail2ban_enabled }}"
    state: "{{ nginx_multisite_fail2ban_enabled | ternary('started', 'stopped') }}"

- name: Set UFW default incoming policy to deny
  ansible.builtin.command:
    cmd: ufw --force default deny
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Default incoming policy changed' in nginx_multisite_ufw_default.stdout"
  register: nginx_multisite_ufw_default

- name: Allow required UFW ports
  ansible.builtin.command: # noqa: R101 - loop values are role-defined fixed UFW service names
    cmd: ufw allow {{ item_nginx_multisite_firewall_port }}
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Rule added' in nginx_multisite_ufw_rule.stdout"
  loop:
    - ssh
    - http
    - https
  loop_control:
    loop_var: item_nginx_multisite_firewall_port
  register: nginx_multisite_ufw_rule

- name: Enable UFW
  ansible.builtin.command:
    cmd: ufw --force enable
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Firewall is active' in nginx_multisite_ufw_enable.stdout"
  register: nginx_multisite_ufw_enable

- name: Configure kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl settings

- name: Check for SSH server configuration
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    create: false
  when:
    - nginx_multisite_disable_root_login | bool
    - nginx_multisite_sshd_config.stat.exists # noqa: L039 - registered by prior SSH configuration stat task
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    create: false
  when:
    - not nginx_multisite_password_authentication | bool
    - nginx_multisite_sshd_config.stat.exists # noqa: L039 - registered by prior SSH configuration stat task
  notify: Restart SSH
