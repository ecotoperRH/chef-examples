---
- name: Install Memcached package
  ansible.builtin.package:
    name:
      - memcached
    state: present

- name: Configure Memcached runtime options
  ansible.builtin.blockinfile:
    path: "{{ cache_memcached_config_file }}" # noqa: R114 - path is a role default, not user input
    create: false
    marker: "# {mark} ANSIBLE MANAGED CACHE SETTINGS"
    block: |
      -m {{ cache_memcached_memory }}
      -p {{ cache_memcached_port }}
      -U {{ cache_memcached_udp_port }}
      -l {{ cache_memcached_listen }}
      -c {{ cache_memcached_max_connections }}
      -I {{ cache_memcached_max_object_size }}
      -u {{ cache_memcached_user }}
      -t {{ cache_memcached_threads }}
  notify: Restart Memcached

- name: Ensure Memcached service is enabled and started
  ansible.builtin.service:
    name: memcached
    enabled: true
    state: started
