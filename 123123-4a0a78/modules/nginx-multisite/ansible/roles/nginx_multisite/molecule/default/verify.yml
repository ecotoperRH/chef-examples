---
# Play 1: Services and nginx configuration files
- name: Verify services and nginx config files
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert nginx service is active and enabled
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts['services']"
          - "ansible_facts['services']['nginx.service']['state'] == 'running'"
          - "ansible_facts['services']['nginx.service']['status'] == 'enabled'"
        fail_msg: "nginx service is not running or not enabled"

    - name: Assert fail2ban service is active and enabled
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts['services']"
          - "ansible_facts['services']['fail2ban.service']['state'] == 'running'"
          - "ansible_facts['services']['fail2ban.service']['status'] == 'enabled'"
        fail_msg: "fail2ban service is not running or not enabled"

    - name: Check nginx config files exist
      ansible.builtin.stat:
        path: "{{ item_cfg }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
      loop_control:
        loop_var: item_cfg
      register: nginx_cfg_stat_results

    - name: Assert nginx config files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected config file not found or empty"
      loop: "{{ nginx_cfg_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Slurp nginx.conf
      ansible.builtin.slurp:
        src: /etc/nginx/nginx.conf
      register: nginx_conf_content

    - name: Assert nginx.conf contains expected directives
      ansible.builtin.assert:
        that:
          - "'worker_processes' in (nginx_conf_content['content'] | b64decode)"
          - "'keepalive_timeout' in (nginx_conf_content['content'] | b64decode)"
          - "'gzip' in (nginx_conf_content['content'] | b64decode)"
          - "'sites-enabled' in (nginx_conf_content['content'] | b64decode)"
        fail_msg: "nginx.conf is missing expected directives"

    - name: Slurp security.conf
      ansible.builtin.slurp:
        src: /etc/nginx/conf.d/security.conf
      register: security_conf_content

    - name: Assert security.conf contains expected directives
      ansible.builtin.assert:
        that:
          - "'server_tokens' in (security_conf_content['content'] | b64decode)"
          - "'limit_req_zone' in (security_conf_content['content'] | b64decode)"
          - "'ssl_protocols' in (security_conf_content['content'] | b64decode)"
          - "'client_max_body_size' in (security_conf_content['content'] | b64decode)"
        fail_msg: "security.conf is missing expected directives"

    - name: Assert default nginx site symlink is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site_stat

    - name: Assert default site does not exist
      ansible.builtin.assert:
        that:
          - not default_site_stat['stat']['exists']
        fail_msg: "Default nginx site symlink still exists and should have been removed"

# Play 2: Virtual host configs and symlinks
- name: Verify virtual host configurations and symlinks
  hosts: all
  gather_facts: false
  tasks:
    - name: Check virtual host config files exist in sites-available
      ansible.builtin.stat:
        path: "{{ item_vhost }}"
      loop:
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_vhost
      register: vhost_cfg_stat_results

    - name: Assert virtual host config files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Virtual host config file not found or empty"
      loop: "{{ vhost_cfg_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check virtual host symlinks exist in sites-enabled
      ansible.builtin.stat:
        path: "{{ item_link }}"
        follow: false
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_link
      register: vhost_link_stat_results

    - name: Assert virtual host symlinks exist and are links
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['islnk']
        fail_msg: "Virtual host symlink not found or is not a symlink"
      loop: "{{ vhost_link_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Slurp test.cluster.local vhost config
      ansible.builtin.slurp:
        src: /etc/nginx/sites-available/test.cluster.local
      register: test_vhost_content

    - name: Assert test.cluster.local vhost config contains expected directives
      ansible.builtin.assert:
        that:
          - "'test.cluster.local' in (test_vhost_content['content'] | b64decode)"
          - "'return 301' in (test_vhost_content['content'] | b64decode)"
          - "'ssl_certificate' in (test_vhost_content['content'] | b64decode)"
          - "'/opt/server/test' in (test_vhost_content['content'] | b64decode)"
        fail_msg: "test.cluster.local vhost config is missing expected directives"

    - name: Slurp ci.cluster.local vhost config
      ansible.builtin.slurp:
        src: /etc/nginx/sites-available/ci.cluster.local
      register: ci_vhost_content

    - name: Assert ci.cluster.local vhost config contains expected directives
      ansible.builtin.assert:
        that:
          - "'ci.cluster.local' in (ci_vhost_content['content'] | b64decode)"
          - "'return 301' in (ci_vhost_content['content'] | b64decode)"
          - "'ssl_certificate' in (ci_vhost_content['content'] | b64decode)"
          - "'/opt/server/ci' in (ci_vhost_content['content'] | b64decode)"
        fail_msg: "ci.cluster.local vhost config is missing expected directives"

    - name: Slurp status.cluster.local vhost config
      ansible.builtin.slurp:
        src: /etc/nginx/sites-available/status.cluster.local
      register: status_vhost_content

    - name: Assert status.cluster.local vhost config contains expected directives
      ansible.builtin.assert:
        that:
          - "'status.cluster.local' in (status_vhost_content['content'] | b64decode)"
          - "'return 301' in (status_vhost_content['content'] | b64decode)"
          - "'ssl_certificate' in (status_vhost_content['content'] | b64decode)"
          - "'/opt/server/status' in (status_vhost_content['content'] | b64decode)"
        fail_msg: "status.cluster.local vhost config is missing expected directives"

# Play 3: Document roots and static files
- name: Verify document roots and static index files
  hosts: all
  gather_facts: false
  tasks:
    - name: Check site document root directories exist
      ansible.builtin.stat:
        path: "{{ item_docroot }}"
      loop:
        - /opt/server/test
        - /opt/server/ci
        - /opt/server/status
      loop_control:
        loop_var: item_docroot
      register: docroot_stat_results

    - name: Assert site document root directories exist and are directories
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Site document root directory not found or is not a directory"
      loop: "{{ docroot_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check site index.html files exist
      ansible.builtin.stat:
        path: "{{ item_html }}"
      loop:
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_html
      register: html_stat_results

    - name: Assert site index.html files exist with correct ownership and mode
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['pw_name'] == 'www-data'
          - item_result['stat']['gr_name'] == 'www-data'
          - item_result['stat']['mode'] == '0644'
        fail_msg: "index.html not found or has incorrect ownership/permissions"
      loop: "{{ html_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

# Play 4: SSL certificates and private keys
- name: Verify SSL certificates and private keys
  hosts: all
  gather_facts: false
  tasks:
    - name: Check SSL certificate files exist
      ansible.builtin.stat:
        path: "{{ item_cert }}"
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_cert
      register: ssl_cert_stat_results

    - name: Assert SSL certificate files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "SSL certificate file not found or empty"
      loop: "{{ ssl_cert_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check SSL private key files exist with correct permissions
      ansible.builtin.stat:
        path: "{{ item_key }}"
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: ssl_key_stat_results

    - name: Assert SSL private key files exist with mode 640 and root:ssl-cert ownership
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
          - item_result['stat']['mode'] == '0640'
          - item_result['stat']['pw_name'] == 'root'
          - item_result['stat']['gr_name'] == 'ssl-cert'
        fail_msg: "SSL private key not found or has incorrect permissions/ownership"
      loop: "{{ ssl_key_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check SSL certificate directory permissions
      ansible.builtin.stat:
        path: /etc/ssl/certs
      register: ssl_certs_dir_stat

    - name: Assert SSL certs directory has correct permissions
      ansible.builtin.assert:
        that:
          - ssl_certs_dir_stat['stat']['exists']
          - ssl_certs_dir_stat['stat']['isdir']
          - ssl_certs_dir_stat['stat']['mode'] == '0755'
        fail_msg: "SSL certs directory has incorrect permissions"

    - name: Check SSL private key directory permissions
      ansible.builtin.stat:
        path: /etc/ssl/private
      register: ssl_private_dir_stat

    - name: Assert SSL private directory has correct permissions
      ansible.builtin.assert:
        that:
          - ssl_private_dir_stat['stat']['exists']
          - ssl_private_dir_stat['stat']['isdir']
          - ssl_private_dir_stat['stat']['mode'] == '0710'
          - ssl_private_dir_stat['stat']['gr_name'] == 'ssl-cert'
        fail_msg: "SSL private directory has incorrect permissions or group"

    - name: Check ssl-cert group exists
      ansible.builtin.command:
        argv:
          - getent
          - group
          - ssl-cert
      register: ssl_cert_group_check
      changed_when: false
      failed_when: ssl_cert_group_check['rc'] not in [0, 2]

    - name: Assert ssl-cert group exists
      ansible.builtin.assert:
        that:
          - ssl_cert_group_check['rc'] == 0
        fail_msg: "ssl-cert group does not exist"

# Play 5: Network ports, HTTP connectivity, and security hardening
- name: Verify network ports, HTTP connectivity, and security hardening
  hosts: all
  gather_facts: false
  tasks:
    - name: Assert nginx is listening on port 80
      ansible.builtin.wait_for:
        port: 80
        host: 127.0.0.1
        timeout: 10
        state: started

    - name: Assert nginx is listening on port 443
      ansible.builtin.wait_for:
        port: 443
        host: 127.0.0.1
        timeout: 10
        state: started

    - name: Check HTTP redirects to HTTPS for test.cluster.local
      ansible.builtin.uri:
        url: http://localhost/
        headers:
          Host: test.cluster.local
        follow_redirects: none
        status_code: 301
      register: test_http_redirect

    - name: Assert test.cluster.local HTTP redirect location points to HTTPS
      ansible.builtin.assert:
        that:
          - "'https://test.cluster.local' in test_http_redirect['location']"
        fail_msg: "test.cluster.local HTTP redirect is not pointing to HTTPS"

    - name: Check HTTPS response for test.cluster.local
      ansible.builtin.uri:
        url: https://localhost/
        headers:
          Host: test.cluster.local
        validate_certs: false
        status_code: 200
      register: test_https_response

    - name: Assert test.cluster.local HTTPS response has security headers
      ansible.builtin.assert:
        that:
          - "'strict-transport-security' in test_https_response['x_strict_transport_security'] | default('')
            or 'strict-transport-security' in (test_https_response['headers'] | default({}))"
          - "test_https_response['x_frame_options'] | default('') == 'DENY'
            or (test_https_response['headers'] | default({})).get('x-frame-options', '') == 'DENY'"
        fail_msg: "test.cluster.local HTTPS response is missing expected security headers"

    - name: Check HTTP redirects to HTTPS for ci.cluster.local
      ansible.builtin.uri:
        url: http://localhost/
        headers:
          Host: ci.cluster.local
        follow_redirects: none
        status_code: 301
      register: ci_http_redirect

    - name: Assert ci.cluster.local HTTP redirect location points to HTTPS
      ansible.builtin.assert:
        that:
          - "'https://ci.cluster.local' in ci_http_redirect['location']"
        fail_msg: "ci.cluster.local HTTP redirect is not pointing to HTTPS"

    - name: Check HTTP redirects to HTTPS for status.cluster.local
      ansible.builtin.uri:
        url: http://localhost/
        headers:
          Host: status.cluster.local
        follow_redirects: none
        status_code: 301
      register: status_http_redirect

    - name: Assert status.cluster.local HTTP redirect location points to HTTPS
      ansible.builtin.assert:
        that:
          - "'https://status.cluster.local' in status_http_redirect['location']"
        fail_msg: "status.cluster.local HTTP redirect is not pointing to HTTPS"

# Play 6: Fail2ban, sysctl, and SSH hardening
- name: Verify fail2ban, sysctl hardening, and SSH configuration
  hosts: all
  gather_facts: false
  tasks:
    - name: Slurp fail2ban jail.local
      ansible.builtin.slurp:
        src: /etc/fail2ban/jail.local
      register: jail_local_content

    - name: Assert fail2ban jail.local contains expected configuration
      ansible.builtin.assert:
        that:
          - "'bantime' in (jail_local_content['content'] | b64decode)"
          - "'findtime' in (jail_local_content['content'] | b64decode)"
          - "'maxretry' in (jail_local_content['content'] | b64decode)"
          - "'[sshd]' in (jail_local_content['content'] | b64decode)"
          - "'[nginx-http-auth]' in (jail_local_content['content'] | b64decode)"
          - "'[nginx-limit-req]' in (jail_local_content['content'] | b64decode)"
          - "'[nginx-botsearch]' in (jail_local_content['content'] | b64decode)"
        fail_msg: "fail2ban jail.local is missing expected jail configuration"

    - name: Slurp sysctl security config
      ansible.builtin.slurp:
        src: /etc/sysctl.d/99-security.conf
      register: sysctl_conf_content

    - name: Assert sysctl security config contains expected kernel parameters
      ansible.builtin.assert:
        that:
          - "'rp_filter' in (sysctl_conf_content['content'] | b64decode)"
          - "'accept_redirects' in (sysctl_conf_content['content'] | b64decode)"
          - "'tcp_syncookies' in (sysctl_conf_content['content'] | b64decode)"
          - "'disable_ipv6' in (sysctl_conf_content['content'] | b64decode)"
          - "'icmp_echo_ignore_all' in (sysctl_conf_content['content'] | b64decode)"
        fail_msg: "sysctl security config is missing expected kernel parameters"

    - name: Check active sysctl values for key security parameters  # noqa: R101 - loop variable comes from a hardcoded role-defined list, not user input
      ansible.builtin.command:
        argv:
          - sysctl
          - -n
          - "{{ item_sysctl }}"
      loop:
        - net.ipv4.conf.all.rp_filter
        - net.ipv4.conf.all.accept_redirects
        - net.ipv4.conf.all.send_redirects
        - net.ipv4.conf.all.log_martians
        - net.ipv4.icmp_echo_ignore_all
        - net.ipv4.tcp_syncookies
      loop_control:
        loop_var: item_sysctl
      register: sysctl_value_results
      changed_when: false

    - name: Assert key sysctl security values are set correctly
      ansible.builtin.assert:
        that:
          - item_result['stdout'] | trim in ['0', '1', '2048']
        fail_msg: "Unexpected sysctl value returned"
      loop: "{{ sysctl_value_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Slurp sshd_config
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config_content

    - name: Assert sshd_config has PermitRootLogin disabled
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (sshd_config_content['content'] | b64decode)"
        fail_msg: "sshd_config does not have PermitRootLogin set to no"

    - name: Assert sshd_config has PasswordAuthentication disabled
      ansible.builtin.assert:
        that:
          - "'PasswordAuthentication no' in (sshd_config_content['content'] | b64decode)"
        fail_msg: "sshd_config does not have PasswordAuthentication set to no"
