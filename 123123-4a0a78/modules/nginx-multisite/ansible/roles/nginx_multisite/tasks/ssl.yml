---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Ensure ssl-cert group exists
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Ensure SSL certificate directory exists
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}"  # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure SSL private key directory exists
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}"  # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Generate self-signed SSL certificates  # noqa: R101 - command built from role defaults and loop over role-defined sites dict, not user input
  ansible.builtin.shell:
    cmd: |
      openssl req -x509 -nodes -days {{ nginx_multisite_ssl_cert_days }} -newkey rsa:2048 \
        -keyout {{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl['key'] }}.key \
        -out {{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl['key'] }}.crt \
        -subj "/C={{ nginx_multisite_ssl_cert_subject_country }}/ST={{ nginx_multisite_ssl_cert_subject_state }}/L={{ nginx_multisite_ssl_cert_subject_locality }}/O={{ nginx_multisite_ssl_cert_subject_org }}/OU={{ nginx_multisite_ssl_cert_subject_ou }}/CN={{ item_ssl['key'] }}/emailAddress={{ nginx_multisite_ssl_cert_subject_email }}"
      chmod 640 {{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl['key'] }}.key
      chown root:ssl-cert {{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl['key'] }}.key
    creates: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl['key'] }}.crt"
  when: item_ssl['value']['ssl_enabled'] | bool
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl
  notify: Reload nginx
