- name: Converge
  hosts: all
  gather_facts: false
  tasks:
  - name: Create base directory tree
    ansible.builtin.file:
      path: '{{ item_dir }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/nginx/conf.d
    - /tmp/molecule_test/etc/nginx/sites-available
    - /tmp/molecule_test/etc/nginx/sites-enabled
    - /tmp/molecule_test/etc/fail2ban
    - /tmp/molecule_test/etc/sysctl.d
    - /tmp/molecule_test/etc/ssh
    - /tmp/molecule_test/etc/ssl/certs
    - /tmp/molecule_test/etc/ssl/private
    - /tmp/molecule_test/opt/server/test
    - /tmp/molecule_test/opt/server/ci
    - /tmp/molecule_test/opt/server/status
    loop_control:
      loop_var: item_dir
  - name: Deploy nginx.conf
    ansible.builtin.copy:
      dest: /tmp/molecule_test/etc/nginx/nginx.conf
      mode: '0644'
      backup: true
      content: "user www-data;\nworker_processes auto;\npid /run/nginx.pid;\n\nevents {\n    worker_connections 768;\n}\n\nhttp {\n    sendfile on;\n    tcp_nopush
        on;\n    tcp_nodelay on;\n    keepalive_timeout 65;\n    types_hash_max_size 2048;\n\n    access_log /var/log/nginx/access.log;\n    error_log /var/log/nginx/error.log;\n\n
        \   gzip on;\n\n    include /etc/nginx/conf.d/*.conf;\n    include /etc/nginx/sites-enabled/*;\n}\n"
  - name: Deploy nginx security snippet
    ansible.builtin.copy:
      dest: /tmp/molecule_test/etc/nginx/conf.d/security.conf
      mode: '0644'
      backup: true
      content: '# Hide nginx version

        server_tokens off;


        # Rate limiting

        limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

        limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;


        # Prevent buffer overflow attacks

        client_body_buffer_size 1K;

        client_header_buffer_size 1k;

        client_max_body_size 1k;


        # Timeout settings

        client_body_timeout 10;

        client_header_timeout 10;

        send_timeout 10;


        # SSL settings

        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;

        ssl_prefer_server_ciphers on;

        '
  - name: Deploy site configs for each virtual host
    ansible.builtin.copy:
      dest: /tmp/molecule_test/etc/nginx/sites-available/{{ item_site['name'] }}
      mode: '0644'
      backup: true
      content: "server {\n    listen 80;\n    server_name {{ item_site['name'] }};\n    return 301 https://$server_name$request_uri;\n}\n\nserver {\n    listen 443
        ssl http2;\n    server_name {{ item_site['name'] }};\n    root {{ item_site['docroot'] }};\n    index index.html index.htm;\n\n    ssl_certificate /etc/ssl/certs/{{
        item_site['name'] }}.crt;\n    ssl_certificate_key /etc/ssl/private/{{ item_site['name'] }}.key;\n\n    ssl_protocols TLSv1.2 TLSv1.3;\n    ssl_prefer_server_ciphers
        on;\n\n    add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\" always;\n    add_header X-Frame-Options DENY always;\n    add_header
        X-Content-Type-Options nosniff always;\n    add_header X-XSS-Protection \"1; mode=block\" always;\n\n    gzip on;\n\n    location / {\n        try_files $uri
        $uri/ =404;\n    }\n\n    access_log /var/log/nginx/{{ item_site['name'] }}_access.log;\n    error_log /var/log/nginx/{{ item_site['name'] }}_error.log;\n}\n"
    loop:
    - name: test.cluster.local
      docroot: /opt/server/test
    - name: ci.cluster.local
      docroot: /opt/server/ci
    - name: status.cluster.local
      docroot: /opt/server/status
    loop_control:
      loop_var: item_site
  - name: Create sites-enabled symlinks
    ansible.builtin.file:
      src: /tmp/molecule_test/etc/nginx/sites-available/{{ item_link }}
      dest: /tmp/molecule_test/etc/nginx/sites-enabled/{{ item_link }}
      state: link
    loop:
    - test.cluster.local
    - ci.cluster.local
    - status.cluster.local
    loop_control:
      loop_var: item_link
  - name: Ensure default nginx site is absent
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/nginx/sites-enabled/default
      state: absent
  - name: Deploy test site index.html
    ansible.builtin.copy:
      dest: /tmp/molecule_test/opt/server/test/index.html
      mode: '0644'
      backup: true
      content: '<!DOCTYPE html>

        <html lang="en">

        <head><title>Test Environment - test.cluster.local</title></head>

        <body>

        <h1>Test Environment</h1>

        <p>Running on test.cluster.local</p>

        </body>

        </html>

        '
  - name: Deploy ci site index.html
    ansible.builtin.copy:
      dest: /tmp/molecule_test/opt/server/ci/index.html
      mode: '0644'
      backup: true
      content: '<!DOCTYPE html>

        <html lang="en">

        <head><title>CI/CD Dashboard - ci.cluster.local</title></head>

        <body>

        <h1>CI/CD Dashboard</h1>

        <p>Running on ci.cluster.local</p>

        </body>

        </html>

        '
  - name: Deploy status site index.html
    ansible.builtin.copy:
      dest: /tmp/molecule_test/opt/server/status/index.html
      mode: '0644'
      backup: true
      content: '<!DOCTYPE html>

        <html lang="en">

        <head><title>System Status - status.cluster.local</title></head>

        <body>

        <h1>System Status</h1>

        <p>All Systems Operational</p>

        </body>

        </html>

        '
  - name: Deploy SSL certificate placeholder files
    ansible.builtin.copy:
      dest: /tmp/molecule_test/etc/ssl/certs/{{ item_cert }}.crt
      mode: '0644'
      backup: true
      content: '-----BEGIN CERTIFICATE-----

        PLACEHOLDER SELF-SIGNED CERTIFICATE FOR MOLECULE TESTING

        CN={{ item_cert }}

        -----END CERTIFICATE-----

        '
    loop:
    - test.cluster.local
    - ci.cluster.local
    - status.cluster.local
    loop_control:
      loop_var: item_cert
  - name: Deploy SSL private key placeholder files
    ansible.builtin.copy:
      dest: /tmp/molecule_test/etc/ssl/private/{{ item_key }}.key
      mode: '0600'
      backup: true
      content: '-----BEGIN PRIVATE KEY-----

        PLACEHOLDER PRIVATE KEY FOR MOLECULE TESTING

        CN={{ item_key }}

        -----END PRIVATE KEY-----

        '
    loop:
    - test.cluster.local
    - ci.cluster.local
    - status.cluster.local
    loop_control:
      loop_var: item_key
  - name: Deploy fail2ban jail.local
    ansible.builtin.copy:
      dest: /tmp/molecule_test/etc/fail2ban/jail.local
      mode: '0644'
      backup: true
      content: '[DEFAULT]

        bantime = 3600

        findtime = 600

        maxretry = 3

        backend = auto


        [sshd]

        enabled = true

        port = ssh

        logpath = /var/log/auth.log

        bantime = 3600

        maxretry = 3


        [nginx-http-auth]

        enabled = true

        filter = nginx-http-auth

        port = http,https

        logpath = /var/log/nginx/*error.log

        bantime = 3600

        maxretry = 3


        [nginx-limit-req]

        enabled = true

        filter = nginx-limit-req

        port = http,https

        logpath = /var/log/nginx/*error.log

        bantime = 3600

        maxretry = 10


        [nginx-botsearch]

        enabled = true

        filter = nginx-botsearch

        port = http,https

        logpath = /var/log/nginx/*access.log

        bantime = 3600

        maxretry = 2

        '
  - name: Deploy sysctl security hardening config
    ansible.builtin.copy:
      dest: /tmp/molecule_test/etc/sysctl.d/99-security.conf
      mode: '0644'
      backup: true
      content: '# IP Spoofing protection

        net.ipv4.conf.default.rp_filter = 1

        net.ipv4.conf.all.rp_filter = 1


        # Ignore ICMP redirects

        net.ipv4.conf.all.accept_redirects = 0

        net.ipv6.conf.all.accept_redirects = 0


        # Ignore send redirects

        net.ipv4.conf.all.send_redirects = 0


        # Disable source packet routing

        net.ipv4.conf.all.accept_source_route = 0

        net.ipv6.conf.all.accept_source_route = 0


        # Log Martians

        net.ipv4.conf.all.log_martians = 1


        # Ignore ICMP ping requests

        net.ipv4.icmp_echo_ignore_all = 1


        # Disable IPv6 if not needed

        net.ipv6.conf.all.disable_ipv6 = 1

        net.ipv6.conf.default.disable_ipv6 = 1


        # TCP SYN flood protection

        net.ipv4.tcp_syncookies = 1

        net.ipv4.tcp_max_syn_backlog = 2048

        '
  - name: Deploy sshd_config with hardening settings
    ansible.builtin.copy:
      dest: /tmp/molecule_test/etc/ssh/sshd_config
      mode: '0644'
      backup: true
      content: '# SSH hardening configuration

        Port 22

        Protocol 2

        PermitRootLogin no

        PasswordAuthentication no

        PubkeyAuthentication yes

        AuthorizedKeysFile .ssh/authorized_keys

        PermitEmptyPasswords no

        ChallengeResponseAuthentication no

        UsePAM yes

        X11Forwarding no

        PrintMotd no

        AcceptEnv LANG LC_*

        Subsystem sftp /usr/lib/openssh/sftp-server

        '
