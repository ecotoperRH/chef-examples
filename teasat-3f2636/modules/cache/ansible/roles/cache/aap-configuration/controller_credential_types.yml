---
controller_credential_types:
- name: Redis Authentication Password
  description: Hardcoded Redis requirepass password extracted from the cache cookbook
    for use as an Ansible Vault-encrypted variable
  kind: cloud
  inputs:
    fields:
    - id: redis_password
      type: string
      label: Redis Password
      secret: true
      help_text: The Redis requirepass value written to /etc/redis/6379.conf. All
        Redis clients must authenticate with this password via the AUTH command before
        issuing any other commands.
    required:
    - redis_password
  injectors:
    extra_vars:
      redis_password: !unsafe '{{ redis_password }}'
