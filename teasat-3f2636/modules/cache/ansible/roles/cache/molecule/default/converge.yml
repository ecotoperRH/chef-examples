---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # ----------------------------------------------------------------
    # Base test directory
    # ----------------------------------------------------------------
    - name: Create molecule test root directory
      ansible.builtin.file:
        path: /tmp/molecule_test
        state: directory
        mode: "0755"

    # ----------------------------------------------------------------
    # Memcached directories
    # ----------------------------------------------------------------
    - name: Create memcached directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/var/log/memcached
        - /tmp/molecule_test/var/run/memcached
      loop_control:
        loop_var: item_dir

    # ----------------------------------------------------------------
    # Redis directories
    # ----------------------------------------------------------------
    - name: Create redis directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis/6379
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/etc/tmpfiles.d
        - /tmp/molecule_test/lib/systemd/system
        - /tmp/molecule_test/etc/security/limits.d
        - /tmp/molecule_test/usr/local/bin
      loop_control:
        loop_var: item_dir

    # ----------------------------------------------------------------
    # Redis configuration file
    # Represents /etc/redis/6379.conf rendered by redis.conf.j2
    # Deprecated replica directives are intentionally absent (stripped
    # by the ruby_block hack / ansible.builtin.replace tasks).
    # ----------------------------------------------------------------
    - name: Create Redis configuration file
      ansible.builtin.copy:
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0644"
        backup: true
        content: |
          # Redis configuration managed by Ansible
          pidfile /var/run/redis/6379/redis_6379.pid
          port 6379
          tcp-backlog 511
          timeout 0
          tcp-keepalive 0
          loglevel notice
          syslog-enabled yes
          syslog-ident redis-6379
          syslog-facility local0
          databases 16
            save 900 1
            save 300 10
            save 60 10000
          stop-writes-on-bgsave-error yes
          rdbcompression yes
          rdbchecksum yes
          dbfilename dump-6379.rdb
          dir /var/lib/redis
          repl-diskless-sync no
          repl-diskless-sync-delay 5
          repl-timeout 60
          repl-disable-tcp-nodelay no
          repl-backlog-size 1mb
          repl-backlog-ttl 3600
          requirepass redis_secure_password_123
          maxclients 10000
          appendonly no
          appendfilename appendonly-6379.aof
          appendfsync everysec
          no-appendfsync-on-rewrite no
          auto-aof-rewrite-percentage 100
          auto-aof-rewrite-min-size 64mb
          aof-load-truncated yes
          lua-time-limit 5000
          slowlog-log-slower-than 10000
          slowlog-max-len 1024
          notify-keyspace-events ""
          hash-max-ziplist-entries 512
          hash-max-ziplist-value 64
          set-max-intset-entries 512
          zset-max-ziplist-entries 128
          zset-max-ziplist-value 64
          hll-sparse-max-bytes 3000
          activerehashing yes
          hz 10
          aof-rewrite-incremental-fsync yes

    # ----------------------------------------------------------------
    # Redis breadcrumb sentinel file
    # ----------------------------------------------------------------
    - name: Create Redis config breadcrumb file
      ansible.builtin.copy:
        dest: /tmp/molecule_test/etc/redis/6379.conf.breadcrumb
        content: ""
        mode: "0644"
        backup: true

    # ----------------------------------------------------------------
    # Redis systemd unit file
    # Represents /lib/systemd/system/redis@6379.service
    # ----------------------------------------------------------------
    - name: Create Redis systemd unit file
      ansible.builtin.copy:
        dest: /tmp/molecule_test/lib/systemd/system/redis@6379.service
        mode: "0644"
        backup: true
        content: |
          [Unit]
          Description=Redis (6379) persistent key-value database
          Wants=network-online.target
          After=network-online.target

          [Service]
          ExecStart=/usr/local/bin/redis-server /etc/redis/%i.conf --daemonize no
          User=redis
          Group=redis
          LimitNOFILE=10032

          [Install]
          WantedBy=multi-user.target

    # ----------------------------------------------------------------
    # tmpfiles.d entry for Redis PID directory
    # Represents /etc/tmpfiles.d/redis@6379.conf
    # ----------------------------------------------------------------
    - name: Create Redis tmpfiles.d entry
      ansible.builtin.copy:
        dest: /tmp/molecule_test/etc/tmpfiles.d/redis@6379.conf
        mode: "0644"
        backup: true
        content: "d /var/run/redis/6379 0755 redis redis\n"

    # ----------------------------------------------------------------
    # Redis ulimit limits.d file
    # Represents /etc/security/limits.d/redis.conf
    # ----------------------------------------------------------------
    - name: Create Redis ulimit limits file
      ansible.builtin.copy:
        dest: /tmp/molecule_test/etc/security/limits.d/redis.conf
        mode: "0644"
        backup: true
        content: |
          # BEGIN ANSIBLE MANAGED BLOCK - redis ulimit
          redis soft nofile 10032
          redis hard nofile 10032
          # END ANSIBLE MANAGED BLOCK - redis ulimit

    # ----------------------------------------------------------------
    # Redis binary placeholder (represents compiled redis-server)
    # ----------------------------------------------------------------
    - name: Create Redis binary placeholder
      ansible.builtin.copy:
        dest: /tmp/molecule_test/usr/local/bin/redis-server
        content: "#!/bin/sh\necho 'Redis server v=3.2.11'\n"
        mode: "0755"
        backup: true
