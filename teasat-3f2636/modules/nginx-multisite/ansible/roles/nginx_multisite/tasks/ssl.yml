---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present
- name: Ensure ssl-cert group exists
  ansible.builtin.group:
    name: ssl-cert
    state: present
- name: Ensure SSL certificate directory exists
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Ensure SSL private key directory exists
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}"
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"
- name: Generate self-signed SSL certificates
  ansible.builtin.shell:
    cmd: "openssl req -x509 -nodes -days {{ nginx_multisite_ssl_days }} -newkey rsa:2048 \\\n  -keyout {{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_multisite_ssl['key']
      }}.key \\\n  -out {{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_multisite_ssl['key'] }}.crt \\\n  -subj \"/C={{ nginx_multisite_ssl_country }}/ST={{
      nginx_multisite_ssl_state }}/L={{ nginx_multisite_ssl_locality }}/O={{ nginx_multisite_ssl_org }}/OU={{ nginx_multisite_ssl_ou }}/CN={{ item_nginx_multisite_ssl['key']
      }}/emailAddress={{ nginx_multisite_ssl_email }}\"\nchmod 640 {{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_multisite_ssl['key'] }}.key\nchown root:ssl-cert
      {{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_multisite_ssl['key'] }}.key\n"
  args:
    creates: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_multisite_ssl['key'] }}.crt"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_ssl
  when: item_nginx_multisite_ssl['value']['ssl_enabled'] | bool
  notify: Reload nginx
