---
- name: Deploy nginx virtual host configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_nginx_multisite_site['key'] }}
    mode: "0644"
    backup: true
  vars:
    server_name: "{{ item_nginx_multisite_site['key'] }}"
    document_root: "{{ item_nginx_multisite_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_nginx_multisite_site['value']['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_multisite_site['key'] }}.crt"
    key_file: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_multisite_site['key'] }}.key"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site
  notify: Reload nginx
- name: Enable nginx virtual hosts via symlinks
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_nginx_multisite_site['key'] }}
    dest: /etc/nginx/sites-enabled/{{ item_nginx_multisite_site['key'] }}
    state: link
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site
  notify: Reload nginx
- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
