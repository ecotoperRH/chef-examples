---
argument_specs:
  main:
    short_description: Configures nginx with multiple SSL-enabled virtual hosts and OS hardening
    description:
      - Installs and configures Nginx to host multiple SSL-enabled virtual hosts.
      - Deploys self-signed TLS certificates for each configured site.
      - Hardens the OS with UFW firewall rules, kernel sysctl parameters, and Fail2Ban.
      - Optionally hardens SSH by disabling root login and password authentication.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Dictionary of virtual host configurations keyed by server name. Each entry must have document_root (str) and ssl_enabled (bool).
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory path where SSL certificates (.crt files) are stored.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory path where SSL private keys (.key files) are stored.
      nginx_multisite_ssl_country:
        type: str
        required: false
        default: US
        description: Country code (C) for the self-signed certificate subject.
      nginx_multisite_ssl_state:
        type: str
        required: false
        default: Example
        description: State or province (ST) for the self-signed certificate subject.
      nginx_multisite_ssl_locality:
        type: str
        required: false
        default: Example
        description: Locality or city (L) for the self-signed certificate subject.
      nginx_multisite_ssl_org:
        type: str
        required: false
        default: Example Org
        description: Organization name (O) for the self-signed certificate subject.
      nginx_multisite_ssl_ou:
        type: str
        required: false
        default: IT
        description: Organizational unit (OU) for the self-signed certificate subject.
      nginx_multisite_ssl_email:
        type: str
        required: false
        default: admin@example.com
        description: Email address for the self-signed certificate subject.
      nginx_multisite_ssl_days:
        type: int
        required: false
        default: 365
        description: Number of days the self-signed certificate is valid.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and configure Fail2Ban intrusion prevention.
      nginx_multisite_fail2ban_bantime:
        type: int
        required: false
        default: 3600
        description: Duration in seconds to ban an IP address after exceeding maxretry.
      nginx_multisite_fail2ban_findtime:
        type: int
        required: false
        default: 600
        description: Time window in seconds within which maxretry failures trigger a ban.
      nginx_multisite_fail2ban_maxretry:
        type: int
        required: false
        default: 3
        description: Number of failures allowed within findtime before banning.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure UFW firewall rules (deny default, allow SSH/HTTP/HTTPS).
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login in sshd_config.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether to allow SSH password authentication. Set to false (default) to disable password authentication and require key-based auth.
