---
- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present
- name: Deploy nginx global configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx
- name: Deploy nginx security snippet
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx
- name: Create site document root directories
  ansible.builtin.file:
    path: "{{ item_nginx_multisite['value']['document_root'] }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
- name: Deploy site index.html files
  ansible.builtin.copy:
    src: "{{ item_nginx_multisite['key'].split('.')[0] }}/index.html"
    dest: "{{ item_nginx_multisite['value']['document_root'] }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
- name: Enable and start nginx service
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
