---
memcached:
  version: null
  memory: 64
  port: 11211
  udp_port: 11211
  listen: '0.0.0.0'
  maxconn: 1024
  max_object_size: '1m'
  experimental_options: []
  extra_cli_options: []
  ulimit: 1024
  logfilepath: '/var/log/memcached'
redisio:
  package_bin_path: '/usr/bin'
  config_dir: '/etc/redis'
  default_package_install: false
  shell: '/bin/sh'
  homedir: '/var/lib/redis'
  package_name: 'redis'
  safe_install: true
  package_install: false
  bypass_setup: false
  mirror: 'http://download.redis.io/releases/'
  base_name: 'redis-'
  artifact_type: 'tar.gz'
  base_piddir: '/var/run/redis'
  version: '3.2.11'
  install_dir: null
  job_control: 'initd'
  init_d:
    required_start: []
    required_stop: []
  default_settings:
    user: 'redis'
    group: 'redis'
    permissions: '0644'
    homedir: '/var/lib/redis'
    shell: '/bin/sh'
    systemuser: true
    uid: null
    ulimit: 0
    configdir: '/etc/redis'
    name: null
    tcpbacklog: '511'
    address: null
    databases: '16'
    backuptype: 'rdb'
    datadir: '/var/lib/redis'
    unixsocket: null
    unixsocketperm: null
    timeout: '0'
    keepalive: '0'
    loglevel: 'notice'
    logfile: null
    syslogenabled: 'yes'
    syslogfacility: 'local0'
    shutdown_save: false
    save: null
    stopwritesonbgsaveerror: 'yes'
    rdbcompression: 'yes'
    rdbchecksum: 'yes'
    dbfilename: null
    replicaof: null
    protected_mode: null
    masterauth: null
    replicaservestaledata: 'yes'
    replicareadonly: 'yes'
    repldisklesssync: 'no'
    repldisklesssyncdelay: '5'
    replpingreplicaperiod: '10'
    repltimeout: '60'
    repldisabletcpnodelay: 'no'
    replbacklogsize: '1mb'
    replbacklogttl: 3600
    replicapriority: '100'
    requirepass: null
    rename_commands: null
    maxclients: 10000
    maxmemory: null
    maxmemorypolicy: null
    maxmemorysamples: null
    appendfilename: null
    appendfsync: 'everysec'
    noappendfsynconrewrite: 'no'
    aofrewritepercentage: '100'
    aofrewriteminsize: '64mb'
    aofloadtruncated: 'yes'
    luatimelimit: '5000'
    slowloglogslowerthan: '10000'
    slowlogmaxlen: '1024'
    notifykeyspaceevents: ''
    hashmaxziplistentries: '512'
    hashmaxziplistvalue: '64'
    setmaxintsetentries: '512'
    zsetmaxziplistentries: '128'
    zsetmaxziplistvalue: '64'
    hllsparsemaxbytes: '3000'
    activerehasing: 'yes'
    clientoutputbufferlimit:
      - ['normal', 0, 0, 0]
      - ['replica', '256mb', '64mb', 60]
      - ['pubsub', '32mb', '8mb', 60]
    hz: '10'
    aofrewriteincrementalfsync: 'yes'
    clusterenabled: 'no'
    clusterconfigfile: null
    clusternodetimeout: 5000
    clusterport: null
    includes: null
    aclfile: null
    data_bag_name: null
    data_bag_item: null
    data_bag_key: null
    minreplicastowrite: null
    minreplicasmaxlag: null
    breadcrumb: true
    tlsport: null
    tlscertfile: null
    tlskeyfile: null
    tlskeyfilepass: null
    tlsclientcertfile: null
    tlsclientkey: null
    tlsclientkeypass: null
    tlsdhparamsfile: null
    tlscacertfile: null
    tlscacertdir: null
    tlsauthclients: null
    tlsreplication: null
    tlscluster: null
    tlsprotocols: null
    tlsciphers: null
    tlsciphersuites: null
    tlspreferserverciphers: null
    tlssessioncaching: null
    tlssessioncachesize: null
    tlssessioncachetimeout: null
  servers: null
  bin_path: '/usr/local/bin'
  ulimit:
    pam_su_template_cookbook: null
    users: {}
    security_limits_directory: '/etc/security/limits.d'
    ulimit_overriding_sudo_file_name: 'sudo'
    ulimit_overriding_sudo_file_cookbook: null
