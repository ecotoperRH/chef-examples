---
memcached:
  version:
  memory: 64
  port: 11211
  udp_port: 11211
  listen: 0.0.0.0
  maxconn: 1024
  max_object_size: 1m
  experimental_options: []
  extra_cli_options: []
  ulimit: 1024
  logfilepath: /var/log/memcached
redisio:
  package_install: false
  package_name: redis-server
  safe_install: true
  bypass_setup: false
  mirror: http://download.redis.io/releases/
  base_name: redis-
  artifact_type: tar.gz
  base_piddir: /var/run/redis
  version: 3.2.11
  install_dir:
  job_control: systemd
  init:
    required_start: []
    required_stop: []
  default_settings:
    user: redis
    group: redis
    permissions: "0644"
    homedir: /var/lib/redis
    shell: /bin/sh
    systemuser: true
    uid:
    ulimit: 0
    configdir: /etc/redis
    name:
    tcpbacklog: "511"
    address:
    databases: "16"
    backuptype: rdb
    datadir: /var/lib/redis
    unixsocket:
    unixsocketperm:
    timeout: "0"
    keepalive: "0"
    loglevel: notice
    logfile:
    syslogenabled: "yes"
    syslogfacility: local0
    shutdown_save: false
    save:
    stopwritesonbgsaveerror: "yes"
    rdbcompression: "yes"
    rdbchecksum: "yes"
    dbfilename:
    replicaof:
    protected_mode:
    masterauth:
    replicaservestaledata: "yes"
    replicareadonly: "yes"
    repldisklesssync: "no"
    repldisklesssyncdelay: "5"
    replpingreplicaperiod: "10"
    repltimeout: "60"
    repldisabletcpnodelay: "no"
    replbacklogsize: 1mb
    replbacklogttl: 3600
    replicapriority: "100"
    requirepass:
    rename_commands:
    maxclients: 10000
    maxmemory:
    maxmemorypolicy:
    maxmemorysamples:
    appendfilename:
    appendfsync: everysec
    noappendfsynconrewrite: "no"
    aofrewritepercentage: "100"
    aofrewriteminsize: 64mb
    aofloadtruncated: "yes"
    luatimelimit: "5000"
    slowloglogslowerthan: "10000"
    slowlogmaxlen: "1024"
    notifykeyspaceevents: ""
    hashmaxziplistentries: "512"
    hashmaxziplistvalue: "64"
    setmaxintsetentries: "512"
    zsetmaxziplistentries: "128"
    zsetmaxziplistvalue: "64"
    hllsparsemaxbytes: "3000"
    activerehasing: "yes"
    clientoutputbufferlimit:
      - [normal, 0, 0, 0]
      - [replica, 256mb, 64mb, 60]
      - [pubsub, 32mb, 8mb, 60]
    hz: "10"
    aofrewriteincrementalfsync: "yes"
    clusterenabled: "no"
    clusterconfigfile:
    clusternodetimeout: 5000
    clusterport:
    includes:
    aclfile:
    data_bag_name:
    data_bag_item:
    data_bag_key:
    minreplicastowrite:
    minreplicasmaxlag:
    breadcrumb: true
    tlsport:
    tlscertfile:
    tlskeyfile:
    tlskeyfilepass:
    tlsclientcertfile:
    tlsclientkeyfile:
    tlsclientkeyfilepass:
    tlsdhparamsfile:
    tlscacertfile:
    tlscacertdir:
    tlsauthclients:
    tlsreplication:
    tlscluster:
    tlsprotocols:
    tlsciphers:
    tlsciphersuites:
    tlspreferserverciphers:
    tlssessioncaching:
    tlssessioncachesize:
    tlssessioncachetimeout:
  servers:
  bin_path: /usr/bin
  ulimit:
    pam_su_template_cookbook:
    users: {}
    security_limits_directory: /etc/security/limits.d
    ulimit_overriding_sudo_file_name: sudo
    ulimit_overriding_sudo_file_cookbook:
