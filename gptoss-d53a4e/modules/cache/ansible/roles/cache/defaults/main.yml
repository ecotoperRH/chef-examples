---
memcached_version:
memcached_memory: 64
memcached_port: 11211
memcached_udp_port: 11211
memcached_listen: 0.0.0.0
memcached_maxconn: 1024
memcached_max_object_size: 1m
memcached_experimental_options: []
memcached_extra_cli_options: []
memcached_ulimit: 1024
memcached_logfilepath: /var/log/memcached
redisio_package_install: false
redisio_package_name: redis
redisio_bypass_setup: false
redisio_safe_install: true
redisio_mirror: http://download.redis.io/releases/
redisio_version: 3.2.11
redisio_install_dir:
redisio_job_control: initd
redisio_init_d_required_start: []
redisio_init_d_required_stop: []
redisio_default_settings:
  user: redis
  group: redis
  permissions: "0644"
  homedir: /var/lib/redis
  shell: /bin/sh
  systemuser: true
  uid:
  ulimit: 0
  configdir: /etc/redis
  name:
  tcpbacklog: "511"
  address:
  databases: "16"
  backuptype: rdb
  datadir: /var/lib/redis
  unixsocket:
  unixsocketperm:
  timeout: "0"
  keepalive: "0"
  loglevel: notice
  logfile:
  syslogenabled: "yes"
  syslogfacility: local0
  shutdown_save: false
  save:
  stopwritesonbgsaveerror: "yes"
  rdbcompression: "yes"
  rdbchecksum: "yes"
  dbfilename:
  replicaof:
  protected_mode:
  masterauth:
  replicaservestaledata: "yes"
  replicareadonly: "yes"
  repldisklesssync: "no"
  repldisklesssyncdelay: "5"
  replpingreplicaperiod: "10"
  repltimeout: "60"
  repldisabletcpnodelay: "no"
  replbacklogsize: 1mb
  replbacklogttl: 3600
  replicapriority: "100"
  requirepass:
  rename_commands:
  maxclients: 10000
  maxmemory:
  maxmemorypolicy:
  maxmemorysamples:
  appendfilename:
  appendfsync: everysec
  noappendfsynconrewrite: "no"
  aofrewritepercentage: "100"
  aofrewriteminsize: 64mb
  aofloadtruncated: "yes"
  luatimelimit: "5000"
  slowloglogslowerthan: "10000"
  slowlogmaxlen: "1024"
  notifykeyspaceevents: ""
  hashmaxziplistentries: "512"
  hashmaxziplistvalue: "64"
  setmaxintsetentries: "512"
  zsetmaxziplistentries: "128"
  zsetmaxziplistvalue: "64"
  hllsparsemaxbytes: "3000"
  activerehasing: "yes"
  clientoutputbufferlimit:
    - [normal, 0, 0, 0]
    - [replica, 256mb, 64mb, 60]
    - [pubsub, 32mb, 8mb, 60]
  hz: "10"
  aofrewriteincrementalfsync: "yes"
  clusterenabled: "no"
  clusterconfigfile:
  clusternodetimeout: 5000
  clusterport:
  includes:
  aclfile:
  data_bag_name:
  data_bag_item:
  data_bag_key:
  minreplicastowrite:
  minreplicasmaxlag:
  breadcrumb: true
  tlsport:
  tlscertfile:
  tlskeyfile:
  tlskeyfilepass:
  tlsclientcertfile:
  tlsclientkeyfile:
  tlsclientkeyfilepass:
  tlsdhparamsfile:
  tlscacertfile:
  tlscacertdir:
  tlsauthclients:
  tlsreplication:
  tlscluster:
  tlsprotocols:
  tlsciphers:
  tlsciphersuites:
  tlspreferserverciphers:
  tlssessioncaching:
  tlssessioncachesize:
  tlssessioncachetimeout:
redisio_servers:
redisio_bin_path: /usr/bin
ulimit_pam_su_template_cookbook:
ulimit_users: {}
ulimit_security_limits_directory: /etc/security/limits.d
ulimit_ulimit_overriding_sudo_file_name: sudo
ulimit_ulimit_overriding_sudo_file_cookbook:
# Added defaults for Redis download and artifact handling
redisio_download_dir: /tmp/redis
redisio_base_name: redis-
redisio_artifact_type: tar.gz
