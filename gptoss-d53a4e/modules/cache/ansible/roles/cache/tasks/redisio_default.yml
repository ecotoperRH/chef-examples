---
# RedisIO default tasks placeholder

- name: Include Redis install prerequisites
  ansible.builtin.include_tasks: redis_install_prereqs.yml

- name: Include Redis install
  ansible.builtin.include_tasks: redis_install.yml

- name: Include Redis ulimit configuration
  ansible.builtin.include_tasks: redis_ulimit.yml

- name: Disable OS default Redis service
  ansible.builtin.include_tasks: redis_disable_os_default.yml

- name: Configure Redis instances
  ansible.builtin.include_tasks: redis_configure.yml

- name: Enable Redis services
  ansible.builtin.include_tasks: redis_enable.yml
