---
- name: Enable and start Redis instances
  ansible.builtin.service:
    name: "{{ 'redis@' + item_redis_enable['key'] if redisio.job_control == 'systemd' else 'redis' + item_redis_enable['key'] }}"
    state: started
    enabled: true
  loop: "{{ redisio.servers | dict2items }}"
  loop_control:
    loop_var: item_redis_enable
