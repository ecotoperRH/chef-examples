---
controller_credential_types:
  - name: PostgreSQL User Password
    description: Credential type for PostgreSQL User Password
    kind: cloud
    inputs:
      fields:
        - id: postgres_password
          type: string
          label: PostgreSQL Password
          secret: true
          help_text: Password for PostgreSQL role 'fastapi'
      required:
        - postgres_password
    injectors:
      extra_vars:
        postgres_password: !unsafe "{{ postgres_password }}"
  - name: FastAPI Application Secrets
    description: Credential type for FastAPI Application Secrets
    kind: cloud
    inputs:
      fields:
        - id: database_url
          type: string
          label: Database URL
          secret: true
          help_text: SQLAlchemy connection string for FastAPI, includes DB password
        - id: secret_key
          type: string
          label: Secret Key
          secret: true
          help_text: Application secret key used for cryptographic signing
      required:
        - database_url
        - secret_key
    injectors:
      extra_vars:
        database_url: !unsafe "{{ database_url }}"
        secret_key: !unsafe "{{ secret_key }}"
