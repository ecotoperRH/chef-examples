---
- name: Deploy site configuration for each site
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_site['key'] }}  # noqa: R114 - path from role defaults
    mode: "0644"
    backup: true
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: Reload nginx
  vars:
    server_name: "{{ item_site['key'] }}"
    document_root: "{{ item_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_site['value']['ssl_enabled'] }}"
    cert_file: "{{ nginx_ssl_certificate_path }}/{{ item_site['key'] }}.crt"
    key_file: "{{ nginx_ssl_private_key_path }}/{{ item_site['key'] }}.key"

- name: Enable site by creating symlink
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_site['key'] }}
    dest: /etc/nginx/sites-enabled/{{ item_site['key'] }}  # noqa: R114 - path from role defaults
    state: link
    force: true
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: Reload nginx

- name: Remove default site symlink
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
