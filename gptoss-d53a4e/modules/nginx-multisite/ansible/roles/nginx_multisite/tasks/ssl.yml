---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Ensure ssl-cert group exists
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Ensure certificate directory exists
  ansible.builtin.file:
    path: "{{ nginx_ssl_certificate_path }}"  # noqa: R114 - path from role defaults
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Ensure private key directory exists
  ansible.builtin.file:
    path: "{{ nginx_ssl_private_key_path }}"  # noqa: R114 - path from role defaults
    owner: root
    group: ssl-cert
    mode: "0710"
    state: directory

- name: Generate self-signed SSL certificates for sites
  ansible.builtin.command:  # noqa: R101 - command built from trusted site dict
    cmd: >
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
      -keyout {{ nginx_ssl_private_key_path }}/{{ item_ssl['key'] }}.key \
      -out {{ nginx_ssl_certificate_path }}/{{ item_ssl['key'] }}.crt \
      -subj "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl['key'] }}/emailAddress=admin@example.com"
    creates: "{{ nginx_ssl_certificate_path }}/{{ item_ssl['key'] }}.crt"
  when: item_ssl['value']['ssl_enabled']
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl
  notify: Reload nginx
