---
argument_specs:
  main:
    short_description: Install and configure a secure Nginx multisite server.
    description:
      - Installs Nginx, Fail2ban, UFW, and TLS dependencies.
      - Configures three HTTPS virtual hosts with self-signed certificates and security hardening.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Site definitions, document roots, and SSL settings.
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for generated site certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for generated private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban configuration is deployed.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW rules are configured and enabled.
      nginx_multisite_disable_root:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication remains enabled.
      nginx_multisite_certificate_days:
        type: int
        required: false
        default: 365
        description: Validity period in days for generated certificates.
      nginx_multisite_certificate_email:
        type: str
        required: false
        default: admin@example.com
        description: Email address included in generated certificate subjects.
