---
# Unsupported pre-flight checks: template render counts cannot be established from
# the resulting system, and the detailed security.conf values require comparison
# with the source template before they can be validated.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Gather service facts for nginx, fail2ban, and SSH
      ansible.builtin.service_facts:

    - name: Assert nginx is enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts.services['nginx.service'].state == 'running'"
          - "ansible_facts.services['nginx.service'].status == 'enabled'"

    - name: Assert fail2ban is enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts.services['fail2ban.service'].state == 'running'"
          - "ansible_facts.services['fail2ban.service'].status == 'enabled'"

    - name: Assert an SSH service is active
      ansible.builtin.assert:
        that:
          - >-
            ('ssh.service' in ansible_facts.services and
            ansible_facts.services['ssh.service'].state == 'running') or
            ('sshd.service' in ansible_facts.services and
            ansible_facts.services['sshd.service'].state == 'running')

    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts.packages
        loop:
          - nginx
          - fail2ban
          - ufw
          - openssl
          - ca-certificates
        loop_control:
          loop_var: item_package

    - name: Validate nginx configuration syntax
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: nginx_syntax
      changed_when: false

    - name: Assert nginx syntax validation succeeded
      ansible.builtin.assert:
        that:
          - nginx_syntax.rc == 0
          - "'syntax is ok' in (nginx_syntax.stderr | lower)"
          - "'test is successful' in (nginx_syntax.stderr | lower)"

    - name: Inspect listening HTTP and HTTPS ports
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: listening_ports
      changed_when: false

    - name: Assert TCP ports 80 and 443 are listening
      ansible.builtin.assert:
        that:
          - listening_ports.stdout is regex('(?m)[:.]80\\s')
          - listening_ports.stdout is regex('(?m)[:.]443\\s')

    - name: Inspect UFW status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: ufw_status
      changed_when: false

    - name: Assert UFW is active with the required policy and ports
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status.stdout"
          - "'Default: deny (incoming)' in ufw_status.stdout"
          - ufw_status.stdout is regex('(?m)22[/ ]+.*ALLOW')
          - ufw_status.stdout is regex('(?m)80[/ ]+.*ALLOW')
          - ufw_status.stdout is regex('(?m)443[/ ]+.*ALLOW')

    - name: Read SSH hardening directives
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - ^PermitRootLogin|^PasswordAuthentication
          - /etc/ssh/sshd_config
      register: ssh_hardening
      changed_when: false

    - name: Assert SSH hardening directives
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in ssh_hardening.stdout"
          - "'PasswordAuthentication no' in ssh_hardening.stdout"

    - name: Validate SSH configuration syntax
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      register: sshd_syntax
      changed_when: false

    - name: Assert SSH configuration syntax is valid
      ansible.builtin.assert:
        that:
          - sshd_syntax.rc == 0

    - name: Read required kernel security values
      ansible.builtin.command:
        argv:
          - sysctl
          - "{{ item_sysctl['name'] }}"
      register: sysctl_values
      changed_when: false
      loop:
        - name: net.ipv4.conf.default.rp_filter
          value: '1'
        - name: net.ipv4.conf.all.rp_filter
          value: '1'
        - name: net.ipv4.conf.all.accept_redirects
          value: '0'
        - name: net.ipv6.conf.all.disable_ipv6
          value: '1'
        - name: net.ipv4.tcp_syncookies
          value: '1'
        - name: net.ipv4.tcp_max_syn_backlog
          value: '2048'
      loop_control:
        loop_var: item_sysctl

    - name: Assert required kernel security values
      ansible.builtin.assert:
        that:
          - "item_sysctl_result.stdout is search('= ' ~ item_sysctl_result.item['value'] ~ '$')"
      loop: "{{ sysctl_values.results }}"
      loop_control:
        loop_var: item_sysctl_result

    - name: Check required Fail2ban jails
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
          - "{{ item_jail }}"
      register: fail2ban_jails
      changed_when: false
      loop:
        - sshd
        - nginx-http-auth
        - nginx-limit-req
        - nginx-botsearch
      loop_control:
        loop_var: item_jail

    - name: Assert required Fail2ban jails are enabled
      ansible.builtin.assert:
        that:
          - item_jail_result.rc == 0
      loop: "{{ fail2ban_jails.results }}"
      loop_control:
        loop_var: item_jail_result

    - name: Check required configuration and content paths
      ansible.builtin.stat:
        path: "{{ item_path }}"
      register: required_paths
      loop:
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
        - /opt/server/test
        - /opt/server/test/index.html
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /opt/server/status
        - /opt/server/status/index.html
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_path

    - name: Assert required paths exist
      ansible.builtin.assert:
        that:
          - item_path_result.stat.exists
      loop: "{{ required_paths.results }}"
      loop_control:
        loop_var: item_path_result

    - name: Assert the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Confirm the default nginx site does not exist
      ansible.builtin.assert:
        that:
          - not default_site.stat.exists

    - name: Check enabled-site links
      ansible.builtin.stat:
        path: "{{ item_link['path'] }}"
      register: site_links
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_link

    - name: Assert enabled-site links point to their available sites
      ansible.builtin.assert:
        that:
          - item_site_link.stat.islnk
          - item_site_link.stat.lnk_source == item_link_target['target']
      loop: "{{ site_links.results }}"
      loop_control:
        loop_var: item_site_link
        label: "{{ item_site_link.item['path'] }}"
      vars:
        item_link_target: "{{ item_site_link.item }}"

    - name: Check private TLS directory and key permissions
      ansible.builtin.stat:
        path: "{{ item_tls['path'] }}"
      register: tls_permissions
      loop:
        - path: /etc/ssl/private
          owner: root
          group: ssl-cert
          mode: '0710'
        - path: /etc/ssl/private/test.cluster.local.key
          owner: root
          group: ssl-cert
          mode: '0640'
        - path: /etc/ssl/private/ci.cluster.local.key
          owner: root
          group: ssl-cert
          mode: '0640'
        - path: /etc/ssl/private/status.cluster.local.key
          owner: root
          group: ssl-cert
          mode: '0640'
      loop_control:
        loop_var: item_tls

    - name: Assert private TLS permissions
      ansible.builtin.assert:
        that:
          - item_tls_result.stat.pw_name == item_tls_expected['owner']
          - item_tls_result.stat.gr_name == item_tls_expected['group']
          - item_tls_result.stat.mode == item_tls_expected['mode']
      loop: "{{ tls_permissions.results }}"
      loop_control:
        loop_var: item_tls_result
      vars:
        item_tls_expected: "{{ item_tls_result.item }}"

    - name: Check HTTP redirects for all virtual hosts
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_http_host }}"
        follow_redirects: none
        status_code: 301
      register: http_redirects
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_http_host

    - name: Check HTTPS responses for all virtual hosts
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_https_host }}"
        validate_certs: false
        return_content: true
        status_code: 200
      register: https_responses
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_https_host

    - name: Assert HTTPS responses contain served content
      ansible.builtin.assert:
        that:
          - item_https_response.status == 200
          - item_https_response.content | length > 0
      loop: "{{ https_responses.results }}"
      loop_control:
        loop_var: item_https_response

    - name: Assert expected security headers on the test HTTPS response
      ansible.builtin.assert:
        that:
          - "'strict-transport-security' in (https_responses.results[0].x509_certificate | default({})) or 'strict-transport-security' in (https_responses.results[0].headers | map('lower') | list)"
          - "'x-frame-options' in (https_responses.results[0].headers | map('lower') | list)"
          - "'x-content-type-options' in (https_responses.results[0].headers | map('lower') | list)"

    - name: Inspect TLS certificate subjects
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
          - -dates
      register: certificate_subjects
      changed_when: false
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          common_name: CN=test.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
          common_name: CN=ci.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
          common_name: CN=status.cluster.local
      loop_control:
        loop_var: item_certificate

    - name: Assert TLS certificate subjects contain expected common names
      ansible.builtin.assert:
        that:
          - item_certificate_result.stdout is search(item_certificate_expected['common_name'])
      loop: "{{ certificate_subjects.results }}"
      loop_control:
        loop_var: item_certificate_result
      vars:
        item_certificate_expected: "{{ item_certificate_result.item }}"

    - name: Check required nginx configuration directives
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - user|worker_processes|worker_connections|keepalive_timeout|access_log|error_log|gzip on|sites-enabled
          - /etc/nginx/nginx.conf
      register: nginx_global_directives
      changed_when: false

    - name: Assert global nginx configuration contains required directive classes
      ansible.builtin.assert:
        that:
          - nginx_global_directives.rc == 0
          - nginx_global_directives.stdout is search('user')
          - nginx_global_directives.stdout is search('worker_processes')
          - nginx_global_directives.stdout is search('worker_connections')
          - nginx_global_directives.stdout is search('keepalive_timeout')
          - nginx_global_directives.stdout is search('access_log')
          - nginx_global_directives.stdout is search('error_log')
          - nginx_global_directives.stdout is search('gzip on')
          - nginx_global_directives.stdout is search('sites-enabled')
