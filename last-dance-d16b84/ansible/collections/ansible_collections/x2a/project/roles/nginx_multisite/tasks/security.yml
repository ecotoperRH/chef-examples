---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Deploy Fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Set UFW default incoming policy
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - default
      - deny
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Default incoming policy changed' in nginx_multisite_ufw_policy.stdout"
  register: nginx_multisite_ufw_policy

- name: Allow SSH through UFW
  ansible.builtin.command:
    argv: [ufw, allow, ssh]
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Skipping adding existing rule' not in nginx_multisite_ufw_ssh.stdout"
  register: nginx_multisite_ufw_ssh

- name: Allow HTTP through UFW
  ansible.builtin.command:
    argv: [ufw, allow, http]
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Skipping adding existing rule' not in nginx_multisite_ufw_http.stdout"
  register: nginx_multisite_ufw_http

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    argv: [ufw, allow, https]
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Skipping adding existing rule' not in nginx_multisite_ufw_https.stdout"
  register: nginx_multisite_ufw_https

- name: Enable UFW
  ansible.builtin.command:
    argv: [ufw, --force, enable]
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Firewall is active and enabled on system startup' in nginx_multisite_ufw_enable.stdout"
  register: nginx_multisite_ufw_enable

- name: Create sysctl configuration directory
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx_multisite sysctl

- name: Apply kernel security settings
  ansible.posix.sysctl:
    name: "{{ item_nginx_multisite_sysctl['key'] }}"
    value: "{{ item_nginx_multisite_sysctl['value'] }}"
    sysctl_file: /etc/sysctl.d/99-security.conf
    state: present
    reload: true
  loop:
    - { key: net.ipv4.conf.default.rp_filter, value: "1" }
    - { key: net.ipv4.conf.all.rp_filter, value: "1" }
    - { key: net.ipv4.conf.all.accept_redirects, value: "0" }
    - { key: net.ipv6.conf.all.accept_redirects, value: "0" }
    - { key: net.ipv4.conf.default.accept_redirects, value: "0" }
    - { key: net.ipv6.conf.default.accept_redirects, value: "0" }
    - { key: net.ipv4.conf.all.send_redirects, value: "0" }
    - { key: net.ipv4.conf.default.send_redirects, value: "0" }
    - { key: net.ipv4.conf.all.accept_source_route, value: "0" }
    - { key: net.ipv6.conf.all.accept_source_route, value: "0" }
    - { key: net.ipv4.conf.default.accept_source_route, value: "0" }
    - { key: net.ipv6.conf.default.accept_source_route, value: "0" }
    - { key: net.ipv4.conf.all.log_martians, value: "1" }
    - { key: net.ipv4.conf.default.log_martians, value: "1" }
    - { key: net.ipv4.icmp_echo_ignore_all, value: "1" }
    - { key: net.ipv4.icmp_echo_ignore_broadcasts, value: "1" }
    - { key: net.ipv6.conf.all.disable_ipv6, value: "1" }
    - { key: net.ipv6.conf.default.disable_ipv6, value: "1" }
    - { key: net.ipv6.conf.lo.disable_ipv6, value: "1" }
    - { key: net.ipv4.tcp_syncookies, value: "1" }
    - { key: net.ipv4.tcp_max_syn_backlog, value: "2048" }
    - { key: net.ipv4.tcp_synack_retries, value: "2" }
    - { key: net.ipv4.tcp_syn_retries, value: "5" }
  loop_control:
    loop_var: item_nginx_multisite_sysctl

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    create: false
    backup: true
  when: nginx_multisite_ssh_disable_root | bool
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    create: false
    backup: true
  when: not nginx_multisite_ssh_password_auth | bool
  notify: Restart SSH
