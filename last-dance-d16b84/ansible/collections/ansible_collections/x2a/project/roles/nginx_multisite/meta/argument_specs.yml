---
argument_specs:
  main:
    short_description: Configures nginx with multiple SSL-enabled subdomains
    description:
      - Installs and configures Nginx, TLS certificates, virtual hosts, Fail2ban, UFW, and security hardening.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Site definitions containing document roots and SSL settings.
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory containing site certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory containing site private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban configuration is deployed.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW rules and activation are managed.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether root SSH login is disabled.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is permitted.
