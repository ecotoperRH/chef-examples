---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install application and database packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
      - python3-psycopg2
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize application repository  # noqa: R104,R106 - repository URL and source come from trusted role defaults
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - destination is a role default, not user input
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment  # noqa: R101 - command arguments come from trusted role defaults
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}/bin/python" # noqa: R114 - path is a role default, not user input

- name: Install Python dependencies  # noqa: R113 - requirements path comes from a trusted role default
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt"
    executable: "{{ fastapi_tutorial_venv_dir }}/bin/pip"

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create PostgreSQL application role  # noqa: L039,L047,R108 - credentials are validated by the preceding task, the password is intentionally hidden from logs, and PostgreSQL role management requires the postgres user
  community.postgresql.postgresql_user:
    name: "{{ username }}"
    password: "{{ password }}"
    role_attr_flags: LOGIN
    state: present
    login_user: postgres
  become: true
  become_user: postgres
  no_log: true

- name: Create PostgreSQL application database  # noqa: L039,R108 - database credentials are validated by the preceding task and PostgreSQL role management requires the postgres user
  community.postgresql.postgresql_db:
    name: "{{ database }}"
    owner: "{{ username }}"
    state: present
    login_user: postgres
  become: true
  become_user: postgres

- name: Grant PostgreSQL database privileges  # noqa: L039,R108 - database credentials are validated by the preceding task and PostgreSQL privilege management requires the postgres user
  community.postgresql.postgresql_privs:
    database: "{{ database }}"
    roles: "{{ username }}"
    type: database
    privs: ALL
    state: present
    login_user: postgres
  become: true
  become_user: postgres

- name: Deploy application environment  # noqa: L039 - database credentials are validated by the preceding task
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ username }}:{{ password }}@{{ host }}:{{ port }}/{{ database }}
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path is a role default, not user input
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy systemd service unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host {{ fastapi_tutorial_bind_host }} --port {{ fastapi_tutorial_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - path is a role default, not user input
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart systemd-managed FastAPI service

- name: Enable and start FastAPI service
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    daemon_reload: true
    state: started
    enabled: true
