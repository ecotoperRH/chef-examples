---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials for the FastAPI application to authenticate to its local PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application; currently fastapi.
        - id: password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; store this value in Ansible Vault.
        - id: host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL server; currently localhost.
        - id: port
          type: string
          label: Database Port
          help_text: TCP port for PostgreSQL; currently 5432.
        - id: database
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application; currently fastapi_db.
      required:
        - username
        - password
        - host
        - port
        - database
    injectors:
      extra_vars:
        username: !unsafe "{{ username }}"
        password: !unsafe "{{ password }}"
        host: !unsafe "{{ host }}"
        port: !unsafe "{{ port }}"
        database: !unsafe "{{ database }}"
