---
argument_specs:
  main:
    short_description: Deploy and configure the FastAPI tutorial application
    description:
      - Installs the FastAPI application, its Python dependencies, and PostgreSQL database resources.
      - Configures the application environment and systemd service.
    options:
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application installation directory.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_venv_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_tutorial_service_file:
        type: str
        required: false
        default: /etc/systemd/system/fastapi-tutorial.service
        description: Systemd unit file path.
      fastapi_tutorial_bind_host:
        type: str
        required: false
        default: 0.0.0.0
        description: Address on which the application listens.
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port for the FastAPI application.
      fastapi_tutorial_database_user:
        type: str
        required: false
        default: fastapi
        description: PostgreSQL application role name.
      fastapi_tutorial_database_name:
        type: str
        required: false
        default: fastapi_db
        description: PostgreSQL application database name.
      fastapi_tutorial_database_host:
        type: str
        required: false
        default: localhost
        description: PostgreSQL hostname used by the application.
      fastapi_tutorial_database_port:
        type: int
        required: false
        default: 5432
        description: PostgreSQL port used by the application.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output that handles the database password.
      password:
        type: str
        required: true
        description: Password injected by the AAP credential type for the PostgreSQL role.
