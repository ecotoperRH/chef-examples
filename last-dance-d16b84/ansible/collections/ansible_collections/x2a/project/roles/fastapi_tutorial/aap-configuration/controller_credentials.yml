---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials for the FastAPI application to authenticate to its local PostgreSQL database.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      username: "{{ username }}"
      password: "{{ vault_password }}"
      host: "{{ host }}"
      port: "{{ port }}"
      database: "{{ database }}"
