---
- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload sysctl settings
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

- name: Restart ssh
  ansible.builtin.service:
    name: "{{ nginx_multisite_ssh_service_name }}"
    state: restarted
