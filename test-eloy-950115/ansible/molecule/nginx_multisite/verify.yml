---
# Unsupported pre-flight checks: diagnostic output without a stated expected result,
# including configuration grep/dumps, UFW rules, kernel values, process/PID contents,
# log tails, certificate metadata, TLS modulus comparisons, and curl response content.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify required packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        loop:
          - nginx
          - fail2ban
          - ufw
          - openssl
          - ca-certificates
        loop_control:
          loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are active
      ansible.builtin.assert:
        that:
          - ansible_facts['services'][item_service + '.service']['state'] == 'running'
        loop:
          - nginx
          - fail2ban
        loop_control:
          loop_var: item_service

    - name: Verify nginx and fail2ban are enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ item_enabled_service }}"
      register: enabled_services
      changed_when: false
      loop:
        - nginx
        - fail2ban
      loop_control:
        loop_var: item_enabled_service

    - name: Assert nginx and fail2ban are enabled
      ansible.builtin.assert:
        that:
          - item_enabled_result['rc'] == 0
      loop: "{{ enabled_services['results'] }}"
      loop_control:
        loop_var: item_enabled_result

    - name: Verify nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: nginx_config_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_config_test['rc'] == 0

    - name: Verify SSH hardening directives
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - '^(PermitRootLogin no|PasswordAuthentication no)$'
          - /etc/ssh/sshd_config
      register: ssh_hardening
      changed_when: false

    - name: Assert SSH hardening directives are present
      ansible.builtin.assert:
        that:
          - ssh_hardening['rc'] == 0
          - ssh_hardening['stdout'] is search('^PermitRootLogin no$', multiline=True)
          - ssh_hardening['stdout'] is search('^PasswordAuthentication no$', multiline=True)

    - name: Verify nginx PID file exists
      ansible.builtin.stat:
        path: /run/nginx.pid
      register: nginx_pid_file

    - name: Assert nginx PID file exists
      ansible.builtin.assert:
        that:
          - nginx_pid_file['stat']['exists']
          - nginx_pid_file['stat']['isreg']

    - name: Verify nginx listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_listener }}"
        state: started
        timeout: 10
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_listener

    - name: Verify default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert default nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']

    - name: Verify site directories and files exist
      ansible.builtin.stat:
        path: "{{ item_site_path['path'] }}"
      register: site_paths
      loop:
        - path: /opt/server/test
        - path: /opt/server/test/index.html
        - path: /opt/server/ci
        - path: /opt/server/ci/index.html
        - path: /opt/server/status
        - path: /opt/server/status/index.html
      loop_control:
        loop_var: item_site_path

    - name: Assert site directories and files exist
      ansible.builtin.assert:
        that:
          - item_site_result['stat']['exists']
      loop: "{{ site_paths['results'] }}"
      loop_control:
        loop_var: item_site_result

    - name: Verify site configurations, links, certificates, and keys exist
      ansible.builtin.stat:
        path: "{{ item_artifact['path'] }}"
      register: site_artifacts
      loop:
        - path: /etc/nginx/sites-available/test.cluster.local
          kind: file
        - path: /etc/nginx/sites-enabled/test.cluster.local
          kind: link
        - path: /etc/ssl/certs/test.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/test.cluster.local.key
          kind: file
        - path: /etc/nginx/sites-available/ci.cluster.local
          kind: file
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          kind: link
        - path: /etc/ssl/certs/ci.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/ci.cluster.local.key
          kind: file
        - path: /etc/nginx/sites-available/status.cluster.local
          kind: file
        - path: /etc/nginx/sites-enabled/status.cluster.local
          kind: link
        - path: /etc/ssl/certs/status.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/status.cluster.local.key
          kind: file
      loop_control:
        loop_var: item_artifact

    - name: Assert site configurations, links, certificates, and keys exist
      ansible.builtin.assert:
        that:
          - item_artifact_result['stat']['exists']
          - (item_artifact_result['item']['kind'] == 'link' and
            item_artifact_result['stat']['islnk']) or
            (item_artifact_result['item']['kind'] == 'file' and
            item_artifact_result['stat']['isreg'])
      loop: "{{ site_artifacts['results'] }}"
      loop_control:
        loop_var: item_artifact_result
