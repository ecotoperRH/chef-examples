---
nginx_multisite_sites:
  test.cluster.local:
    document_root: /opt/server/test
    ssl_enabled: true
  ci.cluster.local:
    document_root: /opt/server/ci
    ssl_enabled: true
  status.cluster.local:
    document_root: /opt/server/status
    ssl_enabled: true
nginx_multisite_ssl_certificate_path: /etc/ssl/certs
nginx_multisite_ssl_private_key_path: /etc/ssl/private
nginx_multisite_ssl_validity_days: 365
nginx_multisite_ssl_subject_email: admin@example.com
nginx_multisite_fail2ban_enabled: true
nginx_multisite_ufw_enabled: true
nginx_multisite_disable_root_login: true
nginx_multisite_password_authentication: false
nginx_multisite_ssh_service_name: ssh
nginx_multisite_nginx_service_name: nginx
nginx_multisite_fail2ban_service_name: fail2ban
