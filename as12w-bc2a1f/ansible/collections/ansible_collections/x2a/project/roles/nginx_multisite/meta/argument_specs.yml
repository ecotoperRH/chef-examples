---
argument_specs:
  main:
    short_description: Configure a secure nginx multisite installation
    description:
      - Installs and configures nginx, fail2ban, UFW, SSH hardening, self-signed certificates, and three SSL virtual hosts.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Site names and document-root settings.
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for generated certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for generated private keys.
      nginx_multisite_ssl_validity_days:
        type: int
        required: false
        default: 365
        description: Validity period for self-signed certificates.
      nginx_multisite_ssl_subject_email:
        type: str
        required: false
        default: admin@example.com
        description: Email metadata used in certificate subjects.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW rules and activation are configured.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Disable SSH root login.
      nginx_multisite_password_authentication:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_ssh_service_name:
        type: str
        required: false
        default: ssh
        description: SSH service name on the target operating system.
      nginx_multisite_nginx_service_name:
        type: str
        required: false
        default: nginx
        description: Nginx service name.
      nginx_multisite_fail2ban_service_name:
        type: str
        required: false
        default: fail2ban
        description: Fail2ban service name.
