---
- name: Reload nginx
  ansible.builtin.service:
    name: "{{ nginx_multisite_nginx_service_name }}"
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.service:
    name: "{{ nginx_multisite_fail2ban_service_name }}"
    state: restarted

- name: Reload security sysctl
  ansible.builtin.command:
    argv:
      - sysctl
      - -p
      - /etc/sysctl.d/99-security.conf

- name: Restart SSH
  ansible.builtin.service:
    name: "{{ nginx_multisite_ssh_service_name }}"
    state: restarted
