---
# Unsupported: fail2ban-client detail output, configuration grep output, nginx -T output,
# lsof diagnostics, certificate dates, and log tails have no stated expected result.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that: item_package in ansible_facts.packages
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert fail2ban is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['fail2ban.service']['status'] == 'enabled'
          - ansible_facts.services['fail2ban.service']['state'] == 'running'

    - name: Assert nginx is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['nginx.service']['status'] == 'enabled'
          - ansible_facts.services['nginx.service']['state'] == 'running'

    - name: Assert SSH is active under the platform service name
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts.services['ssh.service'] is defined and
            ansible_facts.services['ssh.service']['state'] == 'running') or
            (ansible_facts.services['sshd.service'] is defined and
            ansible_facts.services['sshd.service']['state'] == 'running')

    - name: Read UFW verbose status
      ansible.builtin.command:
        argv: [ufw, status, verbose]
      register: item_ufw_verbose
      changed_when: false

    - name: Assert UFW is active with default-deny incoming policy
      ansible.builtin.assert:
        that:
          - "'Status: active' in item_ufw_verbose.stdout"
          - "'Default: deny (incoming)' in item_ufw_verbose.stdout"

    - name: Read UFW allowed ports
      ansible.builtin.command:
        argv: [ufw, status]
      register: item_ufw_ports
      changed_when: false

    - name: Assert UFW allows SSH HTTP and HTTPS
      ansible.builtin.assert:
        that:
          - item_ufw_ports.stdout is search('22/tcp')
          - item_ufw_ports.stdout is search('80/tcp')
          - item_ufw_ports.stdout is search('443/tcp')

    - name: Read required kernel settings
      ansible.builtin.command:
        argv:
          - sysctl
          - "{{ item_sysctl['name'] }}"
      register: item_sysctl_results
      changed_when: false
      loop:
        - name: net.ipv4.conf.default.rp_filter
          value: '1'
        - name: net.ipv4.conf.all.rp_filter
          value: '1'
        - name: net.ipv4.conf.all.accept_redirects
          value: '0'
        - name: net.ipv6.conf.all.accept_redirects
          value: '0'
        - name: net.ipv4.conf.all.send_redirects
          value: '0'
        - name: net.ipv4.conf.all.accept_source_route
          value: '0'
        - name: net.ipv6.conf.all.disable_ipv6
          value: '1'
        - name: net.ipv4.icmp_echo_ignore_all
          value: '1'
        - name: net.ipv4.tcp_syncookies
          value: '1'
        - name: net.ipv4.tcp_max_syn_backlog
          value: '2048'
      loop_control:
        loop_var: item_sysctl

    - name: Assert required kernel settings
      ansible.builtin.assert:
        that: item_sysctl_result['stdout'] is search(item_sysctl_result['item']['name'] ~ ' = ' ~ item_sysctl_result['item']['value'])
      loop: "{{ item_sysctl_results['results'] }}"
      loop_control:
        loop_var: item_sysctl_result

    - name: Read SSH configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: item_sshd_config

    - name: Assert SSH hardening settings
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (item_sshd_config['content'] | b64decode).splitlines()"
          - "'PasswordAuthentication no' in (item_sshd_config['content'] | b64decode).splitlines()"

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv: [sshd, -t]
      changed_when: false

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv: [nginx, -t]
      changed_when: false

    - name: Check required site paths and certificates
      ansible.builtin.stat:
        path: "{{ item_path }}"
      register: item_required_paths
      loop:
        - /opt/server/test
        - /opt/server/test/index.html
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /opt/server/status
        - /opt/server/status/index.html
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_path

    - name: Assert required site paths and certificates exist
      ansible.builtin.assert:
        that: item_required_path['stat']['exists']
      loop: "{{ item_required_paths['results'] }}"
      loop_control:
        loop_var: item_required_path

    - name: Assert document roots are directories
      ansible.builtin.assert:
        that: item_root['stat']['isdir']
      loop: "{{ item_required_paths['results'] | selectattr('item', 'match', '^/opt/server/(test|ci|status)$') | list }}"
      loop_control:
        loop_var: item_root

    - name: Assert enabled sites are symbolic links
      ansible.builtin.assert:
        that: item_link['stat']['islnk']
      loop: "{{ item_required_paths['results'] | selectattr('item', 'match', '^/etc/nginx/sites-enabled/') | list }}"
      loop_control:
        loop_var: item_link

    - name: Assert private keys have mode 640 and root ssl-cert ownership
      ansible.builtin.assert:
        that:
          - item_key['stat']['mode'] == '0640'
          - item_key['stat']['pw_name'] == 'root'
          - item_key['stat']['gr_name'] == 'ssl-cert'
      loop: "{{ item_required_paths['results'] | selectattr('item', 'match', '^/etc/ssl/private/.*\\.key$') | list }}"
      loop_control:
        loop_var: item_key

    - name: Check default nginx site absence
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: item_default_site

    - name: Assert default nginx site is absent
      ansible.builtin.assert:
        that: not item_default_site['stat']['exists']

    - name: Assert nginx listens on HTTP and HTTPS
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_listener }}"
        state: started
        timeout: 10
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_listener

    - name: Assert site HTTP requests redirect to HTTPS
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_site }}"
        status_code: 301
        follow_redirects: none
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site

    - name: Assert site HTTPS requests succeed
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_https_site }}"
        status_code: 200
        validate_certs: false
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_https_site

    - name: Read site certificate subjects
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "/etc/ssl/certs/{{ item_certificate['site'] }}.crt"
          - -noout
          - -subject
      register: item_certificate_results
      changed_when: false
      loop:
        - site: test.cluster.local
          cn: test.cluster.local
        - site: ci.cluster.local
          cn: ci.cluster.local
        - site: status.cluster.local
          cn: status.cluster.local
      loop_control:
        loop_var: item_certificate

    - name: Assert certificate subjects contain expected common names
      ansible.builtin.assert:
        that: item_certificate_result['stdout'] is search('CN=' ~ item_certificate_result['item']['cn'])
      loop: "{{ item_certificate_results['results'] }}"
      loop_control:
        loop_var: item_certificate_result
