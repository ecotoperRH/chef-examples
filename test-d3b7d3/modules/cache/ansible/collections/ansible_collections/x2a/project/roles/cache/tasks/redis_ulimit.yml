---
- name: Check for PAM su configuration
  ansible.builtin.stat:
    path: /etc/pam.d/su
  register: cache_pam_su

- name: Check for PAM sudo configuration
  ansible.builtin.stat:
    path: /etc/pam.d/sudo
  register: cache_pam_sudo

- name: Configure PAM su limits on Debian-family systems # noqa: L039 - cache_pam_su is registered by the preceding stat task
  ansible.builtin.template:
    src: su.j2
    dest: /etc/pam.d/su
    mode: "0644"
    backup: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - cache_pam_su.stat.exists

- name: Deploy PAM sudo limits override on Debian-family systems # noqa: L039 - cache_pam_sudo is registered by the preceding stat task
  ansible.builtin.copy:
    src: sudo
    dest: /etc/pam.d/sudo
    mode: "0644"
    backup: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - cache_pam_sudo.stat.exists

- name: Ensure Redis security limits directory exists
  ansible.builtin.file:
    path: /etc/security/limits.d
    state: directory
    mode: "0755"

- name: Apply configured user limits
  community.general.pam_limits:
    domain: "{{ item_cache_limit['key'] }}"
    limit_type: "{{ item_cache_limit['value']['limit_type'] }}"
    limit_item: "{{ item_cache_limit['value']['limit_item'] }}"
    value: "{{ item_cache_limit['value']['value'] }}"
    use_max: "{{ item_cache_limit['value'].get('use_max', false) }}"
  loop: "{{ (cache_redis_user_limits | default({})) | dict2items }}"
  loop_control:
    loop_var: item_cache_limit
