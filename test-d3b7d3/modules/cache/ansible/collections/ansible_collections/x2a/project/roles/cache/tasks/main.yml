---
- name: Validate Redis installation method
  ansible.builtin.assert:
    that:
      - cache_redis_install_from_source | bool or cache_redis_package_install | bool
    fail_msg: Enable cache_redis_install_from_source or cache_redis_package_install so Redis is installed.
    quiet: true

- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Memcached
  ansible.builtin.include_tasks: memcached.yml

- name: Install Redis prerequisites
  ansible.builtin.include_tasks: redis_prerequisites.yml
  when: cache_redis_install_from_source | bool

- name: Install Redis
  ansible.builtin.include_tasks: redis_install.yml

- name: Configure Redis service account and directories
  ansible.builtin.include_tasks: redis_configure_provider.yml

- name: Configure Redis ulimits
  ansible.builtin.include_tasks: redis_ulimit.yml

- name: Disable distribution Redis service
  ansible.builtin.include_tasks: redis_disable_os_default.yml

- name: Configure Redis instance
  ansible.builtin.include_tasks: redis_configure.yml

- name: Remove obsolete Redis directives
  ansible.builtin.replace:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - fixed role default configuration path
    regexp: (?m)^\s*(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority)\s+.* ?
    replace: ""
  notify: Restart Redis instance
  no_log: "{{ cache_secure_logging }}"

- name: Enable Redis instance
  ansible.builtin.include_tasks: redis_enable.yml
