# Unsupported pre-flight checks: nginx process/log inspection, symlink target resolution, certificate
# subject/date inspection, HTTP response checks, fail2ban-client output, sysctl output/application,
# and key ownership/mode output have no stated expected outcome in the pre-flight section.
---
- name: Verify nginx-multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify required packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_package['name'] in ansible_facts['packages']
        fail_msg: "Required package is not installed: {{ item_package['name'] }}"
      loop:
        - name: nginx
        - name: fail2ban
        - name: ufw
        - name: openssl
        - name: ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service status facts
      ansible.builtin.service_facts:

    - name: Assert nginx service is running
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts['services']"
          - ansible_facts['services']['nginx.service']['state'] == 'running'

    - name: Assert fail2ban service is running
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts['services']"
          - ansible_facts['services']['fail2ban.service']['state'] == 'running'

    - name: Verify nginx is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - nginx
      register: item_nginx_enabled
      changed_when: false

    - name: Assert nginx is enabled
      ansible.builtin.assert:
        that:
          - item_nginx_enabled['rc'] == 0

    - name: Verify fail2ban is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - fail2ban
      register: item_fail2ban_enabled
      changed_when: false

    - name: Assert fail2ban is enabled
      ansible.builtin.assert:
        that:
          - item_fail2ban_enabled['rc'] == 0

    - name: Verify nginx configuration syntax
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: item_nginx_config_test
      changed_when: false

    - name: Assert nginx configuration syntax is valid
      ansible.builtin.assert:
        that:
          - item_nginx_config_test['rc'] == 0

    - name: Verify HTTP and HTTPS listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_listener['port'] }}"
        state: started
        timeout: 5
      loop:
        - port: 80
        - port: 443
      loop_control:
        loop_var: item_listener

    - name: Verify required nginx files, directories, and links
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
        follow: false
      register: item_nginx_paths
      loop:
        - path: /etc/nginx/nginx.conf
          kind: file
        - path: /etc/nginx/conf.d/security.conf
          kind: file
        - path: /etc/nginx/sites-available/test.cluster.local
          kind: file
        - path: /etc/nginx/sites-available/ci.cluster.local
          kind: file
        - path: /etc/nginx/sites-available/status.cluster.local
          kind: file
        - path: /etc/nginx/sites-enabled/test.cluster.local
          kind: link
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          kind: link
        - path: /etc/nginx/sites-enabled/status.cluster.local
          kind: link
        - path: /opt/server/test
          kind: directory
        - path: /opt/server/test/index.html
          kind: file
        - path: /opt/server/ci
          kind: directory
        - path: /opt/server/ci/index.html
          kind: file
        - path: /opt/server/status
          kind: directory
        - path: /opt/server/status/index.html
          kind: file
        - path: /etc/ssl/certs/test.cluster.local.crt
          kind: file
        - path: /etc/ssl/certs/ci.cluster.local.crt
          kind: file
        - path: /etc/ssl/certs/status.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/test.cluster.local.key
          kind: file
        - path: /etc/ssl/private/ci.cluster.local.key
          kind: file
        - path: /etc/ssl/private/status.cluster.local.key
          kind: file
        - path: /etc/fail2ban/jail.local
          kind: file
        - path: /etc/sysctl.d/99-security.conf
          kind: file
        - path: /etc/ssh/sshd_config
          kind: file
      loop_control:
        loop_var: item_path

    - name: Assert required nginx files, directories, and links exist
      ansible.builtin.assert:
        that:
          - item_nginx_path['stat']['exists']
          - >-
            (item_nginx_path['stat']['isreg'] and item_nginx_path['item_path']['kind'] == 'file') or
            (item_nginx_path['stat']['isdir'] and item_nginx_path['item_path']['kind'] == 'directory') or
            (item_nginx_path['stat']['islnk'] and item_nginx_path['item_path']['kind'] == 'link')
      loop: "{{ item_nginx_paths['results'] }}"
      loop_control:
        loop_var: item_nginx_path

    - name: Verify UFW status and rules
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: item_ufw_status
      changed_when: false

    - name: Assert UFW denies incoming and allows SSH, HTTP, and HTTPS
      ansible.builtin.assert:
        that:
          - "(item_ufw_status['stdout'] | lower) is search('default: deny')"
          - "(item_ufw_status['stdout'] | lower) is search('22/tcp|ssh')"
          - "(item_ufw_status['stdout'] | lower) is search('80/tcp|http')"
          - "(item_ufw_status['stdout'] | lower) is search('443/tcp|https')"

    - name: Verify SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: item_sshd_config

    - name: Assert SSH root login is disabled
      ansible.builtin.assert:
        that:
          - >-
            (item_sshd_config['content'] | b64decode) is
            search('(?m)^\\s*PermitRootLogin\\s+no\\s*$')

    - name: Assert SSH password authentication is disabled
      ansible.builtin.assert:
        that:
          - >-
            (item_sshd_config['content'] | b64decode) is
            search('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')

    - name: Verify ssl-cert group exists
      ansible.builtin.getent:
        database: group
        key: ssl-cert

    - name: Assert ssl-cert group exists
      ansible.builtin.assert:
        that:
          - ansible_facts['getent_group']['ssl-cert'] is defined

    - name: Verify the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
        follow: false
      register: item_default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not item_default_site['stat']['exists']
