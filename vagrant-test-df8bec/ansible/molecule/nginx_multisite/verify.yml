---
# Unsupported diagnostic-only checks: systemctl status, ufw status verbose, sysctl value output,
# certificate subject/date output, journalctl output, log tails, and TLS-key stat formatting.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: false
  tasks:
    - name: Check nginx service enablement and activity
      ansible.builtin.command:
        argv:
          - systemctl
          - "{{ item_nginx_multisite }}"
          - nginx
      changed_when: false
      register: nginx_service_checks
      failed_when: false
      loop:
        - is-enabled
        - is-active
      loop_control:
        loop_var: item_nginx_multisite

    - name: Assert nginx service is enabled and active
      ansible.builtin.assert:
        that:
          - item_nginx_multisite['rc'] == 0
          - item_nginx_multisite['stdout'] == item_nginx_multisite['item'] | regex_replace('^is-enabled$', 'enabled') | regex_replace('^is-active$', 'active')
        fail_msg: Nginx service did not report the expected state.
      loop: "{{ nginx_service_checks['results'] }}"
      loop_control:
        loop_var: item_nginx_multisite

    - name: Check fail2ban service enablement and activity
      ansible.builtin.command:
        argv:
          - systemctl
          - "{{ item_nginx_multisite }}"
          - fail2ban
      changed_when: false
      register: fail2ban_service_checks
      failed_when: false
      loop:
        - is-enabled
        - is-active
      loop_control:
        loop_var: item_nginx_multisite

    - name: Assert fail2ban service is enabled and active
      ansible.builtin.assert:
        that:
          - item_nginx_multisite['rc'] == 0
          - item_nginx_multisite['stdout'] == item_nginx_multisite['item'] | regex_replace('^is-enabled$', 'enabled') | regex_replace('^is-active$', 'active')
        fail_msg: Fail2ban service did not report the expected state.
      loop: "{{ fail2ban_service_checks['results'] }}"
      loop_control:
        loop_var: item_nginx_multisite

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Check nginx HTTP and HTTPS listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_nginx_multisite }}"
        state: started
        timeout: 5
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_nginx_multisite

    - name: Read UFW status
      ansible.builtin.command:
        argv:
          - ufw
          - status
      changed_when: false
      register: ufw_status

    - name: Assert UFW permits required TCP ports
      ansible.builtin.assert:
        that:
          - "'22/tcp' in ufw_status['stdout']"
          - "'80/tcp' in ufw_status['stdout']"
          - "'443/tcp' in ufw_status['stdout']"
        fail_msg: UFW status does not list all required TCP rules.

    - name: Check fail2ban client and configured jails
      ansible.builtin.command:
        argv: "{{ item_nginx_multisite['argv'] }}"
      changed_when: false
      register: fail2ban_checks
      failed_when: false
      loop:
        - argv: [fail2ban-client, ping]
        - argv: [fail2ban-client, status]
        - argv: [fail2ban-client, status, sshd]
        - argv: [fail2ban-client, status, nginx-http-auth]
        - argv: [fail2ban-client, status, nginx-limit-req]
        - argv: [fail2ban-client, status, nginx-botsearch]
      loop_control:
        loop_var: item_nginx_multisite

    - name: Assert fail2ban client checks succeed
      ansible.builtin.assert:
        that:
          - item_nginx_multisite['rc'] == 0
        fail_msg: A fail2ban client validation command failed.
      loop: "{{ fail2ban_checks['results'] }}"
      loop_control:
        loop_var: item_nginx_multisite

    - name: Check SSH hardening directives
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - "{{ item_nginx_multisite }}"
          - /etc/ssh/sshd_config
      changed_when: false
      loop:
        - ^PermitRootLogin no$
        - ^PasswordAuthentication no$
      loop_control:
        loop_var: item_nginx_multisite

    - name: Check expected files, directories, and enabled site links
      ansible.builtin.stat:
        path: "{{ item_nginx_multisite['path'] }}"
        follow: false
      register: deployment_paths
      loop:
        - {path: /opt/server/test, expected_type: directory}
        - {path: /opt/server/test/index.html, expected_type: file}
        - {path: /etc/nginx/sites-available/test.cluster.local, expected_type: file}
        - {path: /etc/nginx/sites-enabled/test.cluster.local, expected_type: link}
        - {path: /etc/ssl/certs/test.cluster.local.crt, expected_type: file}
        - {path: /etc/ssl/private/test.cluster.local.key, expected_type: file}
        - {path: /opt/server/ci, expected_type: directory}
        - {path: /opt/server/ci/index.html, expected_type: file}
        - {path: /etc/nginx/sites-available/ci.cluster.local, expected_type: file}
        - {path: /etc/nginx/sites-enabled/ci.cluster.local, expected_type: link}
        - {path: /etc/ssl/certs/ci.cluster.local.crt, expected_type: file}
        - {path: /etc/ssl/private/ci.cluster.local.key, expected_type: file}
        - {path: /opt/server/status, expected_type: directory}
        - {path: /opt/server/status/index.html, expected_type: file}
        - {path: /etc/nginx/sites-available/status.cluster.local, expected_type: file}
        - {path: /etc/nginx/sites-enabled/status.cluster.local, expected_type: link}
        - {path: /etc/ssl/certs/status.cluster.local.crt, expected_type: file}
        - {path: /etc/ssl/private/status.cluster.local.key, expected_type: file}
      loop_control:
        loop_var: item_nginx_multisite

    - name: Assert expected deployment paths have the required type
      ansible.builtin.assert:
        that:
          - item_nginx_multisite['stat']['exists']
          - item_nginx_multisite['stat']['is' ~ item_nginx_multisite['item']['expected_type']]
        fail_msg: A required deployment path is missing or has the wrong type.
      loop: "{{ deployment_paths['results'] }}"
      loop_control:
        loop_var: item_nginx_multisite

    - name: Check each site redirects HTTP to HTTPS
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_nginx_multisite }}"
        status_code: 301
        follow_redirects: none
        return_content: false
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_nginx_multisite

    - name: Check each site responds over HTTPS
      ansible.builtin.command:
        argv:
          - curl
          - -skS
          - --resolve
          - "{{ item_nginx_multisite }}:443:127.0.0.1"
          - -o
          - /dev/null
          - -w
          - "%{http_code}"
          - "https://{{ item_nginx_multisite }}/"
      changed_when: false
      register: https_site_checks
      failed_when: false
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_nginx_multisite

    - name: Assert each site returns HTTPS status 200
      ansible.builtin.assert:
        that:
          - item_nginx_multisite['rc'] == 0
          - item_nginx_multisite['stdout'] == '200'
        fail_msg: A site did not return HTTP 200 over HTTPS.
      loop: "{{ https_site_checks['results'] }}"
      loop_control:
        loop_var: item_nginx_multisite

    - name: Check default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
        follow: false
      register: default_site

    - name: Assert default nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']
        fail_msg: The default nginx site is still enabled.

    - name: Check nginx security configuration directives
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - "{{ item_nginx_multisite }}"
          - /etc/nginx/conf.d/security.conf
      changed_when: false
      loop:
        - ^server_tokens off;
        - ^ssl_protocols TLSv1.2 TLSv1.3;
        - ^client_max_body_size 1k;
      loop_control:
        loop_var: item_nginx_multisite
