---
- name: Install NGINX
  ansible.builtin.package:
    name:
      - nginx
    state: present

- name: Deploy NGINX main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload NGINX

- name: Deploy NGINX security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload NGINX

- name: Create NGINX site document roots
  ansible.builtin.file:
    path: "{{ item_nginx_multisite['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dict, not user input
    owner: nginx
    group: nginx
    mode: "0755"
    state: directory
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite

- name: Deploy static site content
  ansible.builtin.copy:
    src: "{{ item_nginx_multisite['key'].split('.')[0] }}/index.html"
    dest: "{{ item_nginx_multisite['value']['document_root'] }}/index.html" # noqa: R114 - path from role-defined sites dict, not user input
    owner: nginx
    group: nginx
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
