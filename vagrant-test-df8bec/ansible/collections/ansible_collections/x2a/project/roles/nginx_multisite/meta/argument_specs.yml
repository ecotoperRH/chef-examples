---
argument_specs:
  main:
    short_description: Install and secure a multi-site NGINX web server
    description:
      - Installs NGINX, deploys three static TLS-enabled virtual hosts, and applies host security hardening.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Mapping of NGINX virtual hosts and their document roots.
        options:
          document_root:
            type: str
            required: true
            description: Absolute document root for the virtual host.
          ssl_enabled:
            type: bool
            required: true
            description: Whether the virtual host uses the generated TLS certificate.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory where generated TLS certificates are stored.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory where generated TLS private keys are stored.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban protection is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW is enabled after firewall rules are configured.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is enabled.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Controls redaction for tasks that handle sensitive material.
