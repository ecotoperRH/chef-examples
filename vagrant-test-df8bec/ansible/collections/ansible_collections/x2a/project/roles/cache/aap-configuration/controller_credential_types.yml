---
controller_credential_types:
  - name: Redis Authentication
    description: AAP custom credential for the Redis requirepass value used by the Redis instance on TCP port 6379.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password rendered as the Redis requirepass configuration value.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
