---
fastapi_tutorial_secure_logging: true
fastapi_tutorial_repository: https://github.com/dibanez/fastapi_tutorial.git
fastapi_tutorial_revision: main
fastapi_tutorial_install_dir: /opt/fastapi-tutorial
fastapi_tutorial_venv_dir: /opt/fastapi-tutorial/venv
fastapi_tutorial_environment_file: /opt/fastapi-tutorial/.env
fastapi_tutorial_systemd_unit: /etc/systemd/system/fastapi-tutorial.service
fastapi_tutorial_service_name: fastapi-tutorial
fastapi_tutorial_postgresql_service_name: postgresql
fastapi_tutorial_port: 8000
fastapi_tutorial_package_names:
  - python3
  - python3-pip
  - python3-venv
  - git
  - postgresql
  - postgresql-contrib
  - libpq-dev
