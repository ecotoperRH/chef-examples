---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials for the local PostgreSQL database user used by the FastAPI tutorial application.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL username created for the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL user created for the FastAPI application; currently hardcoded as fastapi_password and should be stored 
            securely.
      required:
        - db_username
        - db_password
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
