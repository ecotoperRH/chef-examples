---
argument_specs:
  main:
    short_description: Install and configure secure NGINX virtual hosts
    description:
      - Installs NGINX, applies a security baseline, creates self-signed TLS certificates, and deploys static SSL-enabled virtual hosts.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Mapping of NGINX site names to their document roots and TLS settings.
        options:
          document_root:
            type: str
            required: true
            description: Absolute directory containing the site's static content.
          ssl_enabled:
            type: bool
            required: true
            description: Whether the site uses a self-signed TLS certificate.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory where public TLS certificates are stored.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory where TLS private keys are stored.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to enable and configure the Fail2ban service.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure and enable the UFW firewall.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether to prohibit direct SSH root login.
      nginx_multisite_password_authentication:
        type: bool
        required: false
        default: false
        description: Whether to allow SSH password authentication.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether tasks handling TLS private keys suppress task output.
