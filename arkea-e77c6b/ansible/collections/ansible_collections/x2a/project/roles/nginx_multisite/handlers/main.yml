---
- name: Restart Fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload kernel networking settings
  ansible.builtin.command:
    argv:
      - sysctl
      - -p
      - /etc/sysctl.d/99-security.conf
  changed_when: true

- name: Restart SSH
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Validate NGINX configuration
  ansible.builtin.command:
    argv:
      - nginx
      - -t
  changed_when: false
  listen: Validate and reload NGINX

- name: Reload NGINX
  ansible.builtin.service:
    name: nginx
    state: reloaded
  listen: Validate and reload NGINX
