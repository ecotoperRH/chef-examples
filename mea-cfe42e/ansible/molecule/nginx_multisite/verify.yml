---
# Unsupported pre-flight checks: fail2ban-client status; sysctl -p/cat output; nginx
# and security.conf content dumps; certificate subject/key-size details; exact TLS
# key stat output beyond the explicitly expected ownership and mode; HTTP/HTTPS
# curl virtual-host response checks; journalctl/tail log diagnostics; and lsof
# diagnostics. These checks do not provide a directly stated assertion or require
# a diagnostic whose result is not safely comparable here.
- name: Verify nginx-multisite deployment
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify required packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts.packages
        fail_msg: "A required package is not installed."
      loop:
        - fail2ban
        - ufw
        - nginx
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service state facts
      ansible.builtin.service_facts:

    - name: Assert fail2ban is enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts.services['fail2ban.service'].status == 'enabled'"
          - "ansible_facts.services['fail2ban.service'].state == 'running'"
        fail_msg: "The fail2ban service is not enabled and active."

    - name: Assert nginx is enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts.services['nginx.service'].status == 'enabled'"
          - "ansible_facts.services['nginx.service'].state == 'running'"
        fail_msg: "The nginx service is not enabled and active."

    - name: Check required files and directories
      ansible.builtin.stat:
        path: "{{ item_path }}"
      loop:
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /opt/server/test
        - /opt/server/test/index.html
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /opt/server/status
        - /opt/server/status/index.html
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_path
      register: required_paths

    - name: Assert required files and directories exist
      ansible.builtin.assert:
        that:
          - item_path_result.stat.exists
        fail_msg: "A required deployment path is missing."
      loop: "{{ required_paths.results }}"
      loop_control:
        loop_var: item_path_result

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_site.link }}"
        follow: false
      loop:
        - link: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - link: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - link: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_site
      register: enabled_site_links

    - name: Assert enabled site links point to their site configurations
      ansible.builtin.assert:
        that:
          - item_link.stat.islnk
          - item_link.stat.lnk_source == item_link.item.target or item_link.stat.lnk_target == item_link.item.target
        fail_msg: "An expected nginx site symlink is missing or points to the wrong target."
      loop: "{{ enabled_site_links.results }}"
      loop_control:
        loop_var: item_link

    - name: Check default nginx site absence
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert default nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site.stat.exists
        fail_msg: "The default nginx site is present."

    - name: Verify ssl-cert group exists
      ansible.builtin.getent:
        database: group
        key: ssl-cert

    - name: Check SSL directory metadata
      ansible.builtin.stat:
        path: "{{ item_ssl_directory.path }}"
      loop:
        - path: /etc/ssl/certs
          mode: '0755'
        - path: /etc/ssl/private
          mode: '0710'
      loop_control:
        loop_var: item_ssl_directory
      register: ssl_directories

    - name: Assert SSL directories exist with expected modes
      ansible.builtin.assert:
        that:
          - item_ssl_result.stat.isdir
          - item_ssl_result.stat.mode == item_ssl_result.item.mode
        fail_msg: "An SSL directory is missing or has an unexpected mode."
      loop: "{{ ssl_directories.results }}"
      loop_control:
        loop_var: item_ssl_result

    - name: Check private key ownership and mode
      ansible.builtin.stat:
        path: "{{ item_key.path }}"
      loop:
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: private_keys

    - name: Assert private keys are root-owned by ssl-cert with mode 0640
      ansible.builtin.assert:
        that:
          - item_key_result.stat.pw_name == 'root'
          - item_key_result.stat.gr_name == 'ssl-cert'
          - item_key_result.stat.mode == '0640'
        fail_msg: "A generated private key has unexpected ownership or mode."
      loop: "{{ private_keys.results }}"
      loop_control:
        loop_var: item_key_result

    - name: Verify SSH hardening directives
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config

    - name: Assert SSH root login and password authentication are disabled
      ansible.builtin.assert:
        that:
          - (sshd_config.content | b64decode) is regex('(?m)^[[:space:]]*PermitRootLogin[[:space:]]+no[[:space:]]*$')
          - (sshd_config.content | b64decode) is regex('(?m)^[[:space:]]*PasswordAuthentication[[:space:]]+no[[:space:]]*$')
        fail_msg: "SSH hardening directives are not present as required."

    - name: Test nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
        changed_when: false
      register: nginx_config_test

    - name: Assert nginx configuration test succeeds
      ansible.builtin.assert:
        that:
          - nginx_config_test.rc == 0
        fail_msg: "nginx -t did not report a successful configuration test."

    - name: Read UFW verbose status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
        changed_when: false
      register: ufw_verbose

    - name: Read UFW rules
      ansible.builtin.command:
        argv:
          - ufw
          - status
        changed_when: false
      register: ufw_rules

    - name: Assert UFW default incoming policy is deny
      ansible.builtin.assert:
        that:
          - ufw_verbose.stdout is search('(?i)Default:\s*deny\s*\(incoming\)')
        fail_msg: "UFW does not have a default deny incoming policy."

    - name: Assert UFW allows SSH HTTP and HTTPS
      ansible.builtin.assert:
        that:
          - ufw_rules.stdout is search('(?im)^\s*(22|ssh)(/tcp)?\s+ALLOW')
          - ufw_rules.stdout is search('(?im)^\s*(80|http)(/tcp)?\s+ALLOW')
          - ufw_rules.stdout is search('(?im)^\s*(443|https)(/tcp)?\s+ALLOW')
        fail_msg: "UFW is missing one or more required service allowances."

    - name: Check listening ports 80 and 443
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
        changed_when: false
      register: listening_ports

    - name: Assert ports 80 and 443 are listening
      ansible.builtin.assert:
        that:
          - listening_ports.stdout is search('(?m)\s:80\s')
          - listening_ports.stdout is search('(?m)\s:443\s')
        fail_msg: "Ports 80 and 443 are not both listening."
