---
controller_credentials:
  - name: PostgreSQL FastAPI Application Database - fastapi_tutorial
    description: Database credentials used to create the FastAPI PostgreSQL role and populate the application's DATABASE_URL.
    organization: Default
    credential_type: PostgreSQL FastAPI Application Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      db_host: "{{ db_host }}"
      db_name: "{{ db_name }}"
