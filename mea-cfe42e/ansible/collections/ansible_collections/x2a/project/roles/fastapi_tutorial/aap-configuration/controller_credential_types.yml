---
controller_credential_types:
  - name: PostgreSQL FastAPI Application Database
    description: Database credentials used to create the FastAPI PostgreSQL role and populate the application's DATABASE_URL.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; use the same managed value for role creation and the application environment file.
        - id: db_host
          type: string
          label: Database Host
          help_text: PostgreSQL host used in the application connection string; currently localhost.
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application; currently fastapi_db.
      required:
        - db_username
        - db_password
        - db_host
        - db_name
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_host: !unsafe "{{ db_host }}"
        db_name: !unsafe "{{ db_name }}"
