---
controller_credential_types:
  - name: Redis Authentication
    description: Password used to authenticate clients to the Redis instance on port 6379.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required for authenticated access to the Redis 6379 instance.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
