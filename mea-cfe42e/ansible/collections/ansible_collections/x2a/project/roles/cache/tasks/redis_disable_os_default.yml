---
- name: Gather service facts before disabling distribution Redis
  ansible.builtin.service_facts:

- name: Select distribution Redis service name
  ansible.builtin.set_fact:
    redisio_distribution_service: >-
      {{ 'redis-server' if ansible_facts['os_family'] == 'Debian' else
        'redis' if ansible_facts['os_family'] == 'RedHat' else '' }}

- name: Stop and disable distribution Redis service
  ansible.builtin.service:
    name: "{{ redisio_distribution_service }}"
    state: stopped
    enabled: false
  when:
    - redisio_distribution_service | length > 0
    - (redisio_distribution_service + '.service') in ansible_facts.services
