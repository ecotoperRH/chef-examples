---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Inspect FastAPI tutorial managed paths
      ansible.builtin.stat:
        path: "{{ item_fastapi_tutorial['path'] }}" # noqa: R114 - paths are fixed Molecule verification values
      loop:
        - path: /opt/fastapi-tutorial
          type: directory
        - path: /opt/fastapi-tutorial/venv
          type: directory
        - path: /opt/fastapi-tutorial/requirements.txt
          type: file
        - path: /opt/fastapi-tutorial/.env
          type: file
          mode: "0600"
          owner: root
          group: root
        - path: /etc/systemd/system/fastapi-tutorial.service
          type: file
          mode: "0644"
          owner: root
          group: root
      loop_control:
        loop_var: item_fastapi_tutorial
      register: fastapi_tutorial_path_stats

    - name: Assert FastAPI tutorial managed paths have expected properties
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir'] == (item_result['item']['type'] == 'directory')
          - item_result['stat']['isreg'] == (item_result['item']['type'] == 'file')
          - item_result['item']['mode'] is not defined or item_result['stat']['mode'] == item_result['item']['mode']
          - item_result['item']['owner'] is not defined or item_result['stat']['pw_name'] == item_result['item']['owner']
          - item_result['item']['group'] is not defined or item_result['stat']['gr_name'] == item_result['item']['group']
        fail_msg: "Managed path has unexpected state"
      loop: "{{ fastapi_tutorial_path_stats['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Inspect Uvicorn executable
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/venv/bin/uvicorn
      register: fastapi_tutorial_uvicorn_stat

    - name: Assert Uvicorn executable exists
      ansible.builtin.assert:
        that:
          - fastapi_tutorial_uvicorn_stat['stat']['exists']
          - fastapi_tutorial_uvicorn_stat['stat']['isreg']
          - fastapi_tutorial_uvicorn_stat['stat']['executable']
        fail_msg: "Uvicorn executable is missing or is not executable"

    - name: Read FastAPI tutorial environment file
      ansible.builtin.slurp:
        src: /opt/fastapi-tutorial/.env
      register: fastapi_tutorial_env
      no_log: true

    - name: Assert non-secret FastAPI environment configuration
      ansible.builtin.assert:
        that:
          - "'PROJECT_NAME=\"FastAPI Tutorial\"' in (fastapi_tutorial_env['content'] | b64decode)"
          - "'API_VERSION=1.0.0' in (fastapi_tutorial_env['content'] | b64decode)"
          - "'DATABASE_URL=postgresql://fastapi:' in (fastapi_tutorial_env['content'] | b64decode)"
        fail_msg: "FastAPI environment configuration is invalid"
      no_log: true

    - name: Read FastAPI tutorial systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_tutorial_unit

    - name: Assert FastAPI tutorial systemd unit configuration
      ansible.builtin.assert:
        that:
          - "'WorkingDirectory=/opt/fastapi-tutorial' in (fastapi_tutorial_unit['content'] | b64decode)"
          - "'ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000' in (fastapi_tutorial_unit['content'] | b64decode)"
          - "'Restart=always' in (fastapi_tutorial_unit['content'] | b64decode)"
        fail_msg: "FastAPI systemd unit configuration is invalid"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert PostgreSQL and FastAPI tutorial services are enabled and running
      ansible.builtin.assert:
        that:
          - "item_fastapi_tutorial_service in ansible_facts['services']"
          - "ansible_facts['services'][item_fastapi_tutorial_service]['state'] == 'running'"
          - "ansible_facts['services'][item_fastapi_tutorial_service]['status'] == 'enabled'"
        fail_msg: "Required service is not enabled and running"
      loop:
        - postgresql.service
        - fastapi-tutorial.service
      loop_control:
        loop_var: item_fastapi_tutorial_service

    - name: Verify PostgreSQL and FastAPI tutorial TCP listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_fastapi_tutorial_port }}"
        state: started
        timeout: 10
      loop:
        - 5432
        - 8000
      loop_control:
        loop_var: item_fastapi_tutorial_port

    - name: Verify FastAPI HTTP endpoint is reachable
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/
        method: GET
        status_code:
          - 200
          - 404
          - 405
        timeout: 10

    - name: Query FastAPI database and role ownership # noqa: R108 - PostgreSQL administrative query must run as the postgres system user
      ansible.builtin.command:
        argv:
          - psql
          - -d
          - postgres
          - -tAc
          - >-
            SELECT 'database:' || datname || ':' || pg_get_userbyid(datdba)
            FROM pg_database WHERE datname = 'fastapi_db'
            UNION ALL SELECT 'role:' || rolname FROM pg_roles WHERE rolname = 'fastapi';
      changed_when: false
      become: true
      become_user: postgres
      register: fastapi_tutorial_database_identity

    - name: Assert FastAPI database and role exist
      ansible.builtin.assert:
        that:
          - "'database:fastapi_db:fastapi' in fastapi_tutorial_database_identity['stdout_lines']"
          - "'role:fastapi' in fastapi_tutorial_database_identity['stdout_lines']"
        fail_msg: "FastAPI database or role is missing"
