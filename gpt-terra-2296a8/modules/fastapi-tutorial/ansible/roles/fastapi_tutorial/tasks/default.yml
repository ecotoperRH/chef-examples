---
- name: Create FastAPI tutorial application group
  ansible.builtin.group:
    name: "{{ fastapi_tutorial_group }}"
    state: present
  when: fastapi_tutorial_group != 'root'

- name: Create FastAPI tutorial application user
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_user }}"
    group: "{{ fastapi_tutorial_group }}"
    state: present
  when: fastapi_tutorial_user != 'root'

- name: Install FastAPI tutorial system packages
  ansible.builtin.package:
    name: "{{ fastapi_tutorial_packages }}" # noqa: R113 - package list is selected by trusted role defaults for the target OS
    state: present

- name: Create FastAPI tutorial application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: "{{ fastapi_tutorial_user }}"
    group: "{{ fastapi_tutorial_group }}"
    mode: "0755"

- name: Check out FastAPI tutorial application # noqa: R106 - repository URL and revision are trusted role defaults; # noqa: R104 - repository uses HTTPS
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repo }}"
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path from role defaults, not user input
    version: "{{ fastapi_tutorial_revision }}"
    update: true
  notify: Restart fastapi tutorial

- name: Create FastAPI tutorial virtual environment # noqa: R101 - virtual environment path is supplied by trusted role defaults
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}/bin/python" # noqa: R114 - path from role defaults, not user input
  notify: Restart fastapi tutorial

- name: Install FastAPI tutorial Python dependencies
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt" # noqa: R114 - path from role defaults, not user input
    virtualenv: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path from role defaults, not user input
    state: present
  notify: Restart fastapi tutorial

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_postgresql_service }}"
    enabled: true
    state: started

- name: Wait for PostgreSQL to accept connections
  ansible.builtin.wait_for:
    host: "{{ fastapi_tutorial_database_host }}"
    port: "{{ fastapi_tutorial_database_port }}"
    timeout: 60

- name: Check whether FastAPI database role exists # noqa: R101 - SQL identifier is a trusted role default; # noqa: R108 - PostgreSQL administrative query requires the postgres system user
  ansible.builtin.command:
    argv:
      - psql
      - -d
      - postgres
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = '{{ fastapi_tutorial_database_user }}'
  changed_when: false
  register: fastapi_tutorial_role_check
  become: true
  become_user: postgres
  no_log: true

- name: Create FastAPI database role # noqa: L039 - fastapi_tutorial_role_check is registered by the preceding task and db_password is supplied by secure inventory; # noqa: R101 - SQL identifiers are role defaults and password is supplied by secure inventory; # noqa: R108 - role creation requires the postgres system user
  ansible.builtin.command:
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -d
      - postgres
      - -c
      - CREATE ROLE {{ fastapi_tutorial_database_user }} LOGIN PASSWORD '{{ db_password | replace("'", "''") }}'
  when: fastapi_tutorial_role_check.stdout | trim != '1'
  become: true
  become_user: postgres
  no_log: true

- name: Check whether FastAPI database exists # noqa: R101 - SQL identifier is a trusted role default; # noqa: R108 - PostgreSQL administrative query requires the postgres system user
  ansible.builtin.command:
    argv:
      - psql
      - -d
      - postgres
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ fastapi_tutorial_database_name }}'
  changed_when: false
  register: fastapi_tutorial_database_check
  become: true
  become_user: postgres

- name: Create FastAPI database # noqa: L039 - fastapi_tutorial_database_check is registered by the preceding task; # noqa: R101 - database name and owner are trusted role defaults; # noqa: R108 - database creation requires the postgres system user
  ansible.builtin.command:
    argv:
      - createdb
      - --owner={{ fastapi_tutorial_database_user }}
      - "{{ fastapi_tutorial_database_name }}"
  when: fastapi_tutorial_database_check.stdout | trim != '1'
  notify: Restart fastapi tutorial
  become: true
  become_user: postgres

- name: Grant FastAPI database privileges # noqa: R101 - database and role identifiers are trusted role defaults; # noqa: R108 - privilege grant requires the postgres system user
  ansible.builtin.command:
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -d
      - postgres
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ fastapi_tutorial_database_name }} TO {{ fastapi_tutorial_database_user }}
  changed_when: false
  become: true
  become_user: postgres

- name: Deploy FastAPI tutorial environment file # noqa: L039 - db_password is supplied by secure inventory
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ fastapi_tutorial_database_user }}:{{ db_password }}@{{ fastapi_tutorial_database_host }}/{{ fastapi_tutorial_database_name }}
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path from role defaults, not user input
    owner: "{{ fastapi_tutorial_user }}"
    group: "{{ fastapi_tutorial_group }}"
    mode: "0600"
    backup: true
  notify: Restart fastapi tutorial
  no_log: true

- name: Deploy FastAPI tutorial systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target {{ fastapi_tutorial_postgresql_service }}.service
      [Service]
      Type=simple
      User={{ fastapi_tutorial_user }}
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host {{ fastapi_tutorial_listen_host }} --port {{ fastapi_tutorial_listen_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/fastapi-tutorial.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Reload systemd
    - Restart fastapi tutorial

- name: Enable and start FastAPI tutorial service
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
