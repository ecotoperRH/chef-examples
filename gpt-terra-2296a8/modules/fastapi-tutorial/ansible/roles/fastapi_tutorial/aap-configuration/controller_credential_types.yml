---
controller_credential_types:
  - name: FastAPI PostgreSQL Database
    description: Credentials for the FastAPI application's local PostgreSQL role and database connection.
    kind: cloud
    inputs:
      fields:
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role, used by the FastAPI application to connect to fastapi_db.
      required:
        - db_password
    injectors:
      extra_vars:
        db_password: !unsafe "{{ db_password }}"
