---
- name: Install Nginx
  ansible.builtin.package:
    name: "{{ nginx_multisite_package }}"
    state: present

- name: Create Nginx runtime group
  ansible.builtin.group:
    name: "{{ nginx_multisite_group }}"
    system: true
    state: present

- name: Create Nginx runtime user
  ansible.builtin.user:
    name: "{{ nginx_multisite_user }}"
    group: "{{ nginx_multisite_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create Nginx virtual-host directories
  ansible.builtin.file:
    path: "{{ item_nginx_multisite }}" # noqa: R114 - paths are role defaults, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ nginx_multisite_sites_available_path }}"
    - "{{ nginx_multisite_sites_enabled_path }}"
  loop_control:
    loop_var: item_nginx_multisite

- name: Deploy Nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload Nginx

- name: Deploy Nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true

- name: Create Nginx document root directories
  ansible.builtin.file:
    path: "{{ item_nginx_multisite['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dict, not user input
    state: directory
    owner: "{{ nginx_multisite_user }}"
    group: "{{ nginx_multisite_group }}"
    mode: "0755"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite

- name: Deploy static site content
  ansible.builtin.copy:
    src: "{{ item_nginx_multisite['key'].split('.')[0] }}/index.html"
    dest: "{{ item_nginx_multisite['value']['document_root'] }}/index.html" # noqa: R114 - path from role-defined sites dict, not user input
    owner: "{{ nginx_multisite_user }}"
    group: "{{ nginx_multisite_group }}"
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
