---
argument_specs:
  main:
    short_description: Install and harden an Nginx multisite web server
    description:
      - Installs Nginx, configures web-server hardening, TLS, Fail2ban, UFW, and static virtual hosts.
    options:
      nginx_multisite_package:
        type: str
        required: false
        default: nginx
        description: Nginx package name.
      nginx_multisite_service:
        type: str
        required: false
        default: nginx
        description: Nginx service name.
      nginx_multisite_user:
        type: str
        required: false
        default: www-data
        description: Owner of site document roots and static content.
      nginx_multisite_group:
        type: str
        required: false
        default: www-data
        description: Group owner of site document roots and static content.
      nginx_multisite_sites_available_path:
        type: str
        required: false
        default: /etc/nginx/sites-available
        description: Directory containing available Nginx virtual-host configurations.
      nginx_multisite_sites_enabled_path:
        type: str
        required: false
        default: /etc/nginx/sites-enabled
        description: Directory containing enabled Nginx virtual-host configurations.
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory containing TLS certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory containing TLS private keys.
      nginx_multisite_ssl_group:
        type: str
        required: false
        default: ssl-cert
        description: Group allowed to read TLS private keys.
      nginx_multisite_fail2ban_package:
        type: str
        required: false
        default: fail2ban
        description: Fail2ban package name.
      nginx_multisite_fail2ban_service:
        type: str
        required: false
        default: fail2ban
        description: Fail2ban service name.
      nginx_multisite_ssh_service:
        type: str
        required: false
        default: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        description: SSH service name.
      nginx_multisite_ssh_config_path:
        type: str
        required: false
        default: /etc/ssh/sshd_config
        description: Path to the SSH daemon configuration.
      nginx_multisite_security_packages:
        type: list
        elements: str
        required: false
        default:
          - fail2ban
          - ufw
        description: Security packages to install.
      nginx_multisite_ssl_packages:
        type: list
        elements: str
        required: false
        default:
          - openssl
          - ca-certificates
        description: Packages required to generate and trust TLS certificates.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to enable and start Fail2ban.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure and enable UFW.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether to disable direct SSH root login.
      nginx_multisite_disable_password_authentication:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH password authentication.
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Virtual hosts and their document-root and TLS settings.
