---
controller_credential_types:
  - name: Redis Client Authentication
    description: Credential for Redis instance 6379 client authentication.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password used for Redis requirepass authentication on the Redis 6379 instance.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
