---
controller_credential_types:
  - name: PostgreSQL Database User
    description: PostgreSQL database user credentials for FastAPI application database connection
    kind: cloud
    inputs:
      fields:
        - id: database_username
          type: string
          label: Database Username
          help_text: PostgreSQL database user for FastAPI application (fastapi)
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: PostgreSQL password for fastapi database user
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database name for FastAPI application (fastapi_db)
        - id: database_host
          type: string
          label: Database Host
          help_text: PostgreSQL server hostname or IP address
        - id: database_port
          type: string
          label: Database Port
          help_text: PostgreSQL server port number
      required:
        - database_username
        - database_password
        - database_name
        - database_host
    injectors:
      extra_vars:
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
        database_port: !unsafe "{{ database_port }}"
