---
argument_specs:
  main:
    short_description: Deploy and configure FastAPI tutorial application with PostgreSQL
    description:
      - Deploys a FastAPI web application with PostgreSQL database backend
      - Installs Python 3 with pip and venv
      - Clones the FastAPI tutorial repository from GitHub
      - Creates a Python virtual environment and installs dependencies
      - Configures PostgreSQL with a dedicated database user
      - Creates environment configuration
      - Manages the application as a systemd service listening on port 8000
    options:
      fastapi_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Directory where the FastAPI application will be deployed
      fastapi_app_user:
        type: str
        required: false
        default: root
        description: User that owns the application directory and runs the service
      fastapi_app_group:
        type: str
        required: false
        default: root
        description: Group that owns the application directory
      fastapi_app_mode:
        type: str
        required: false
        default: "0755"
        description: File mode for the application directory
      fastapi_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Project name used in environment configuration
      fastapi_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version used in environment configuration
      fastapi_port:
        type: int
        required: false
        default: 8000
        description: TCP port the FastAPI application listens on
      fastapi_git_repo:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL for the FastAPI tutorial application
      fastapi_git_branch:
        type: str
        required: false
        default: main
        description: Git branch to clone from the repository
      fastapi_venv_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Path to the Python virtual environment
      fastapi_requirements_file:
        type: str
        required: false
        default: /opt/fastapi-tutorial/requirements.txt
        description: Path to the Python requirements.txt file
      fastapi_postgresql_service:
        type: str
        required: false
        default: postgresql
        description: Name of the PostgreSQL systemd service
      fastapi_postgresql_enabled:
        type: bool
        required: false
        default: true
        description: Whether to enable and start the PostgreSQL service
      fastapi_required_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-venv
          - git
          - postgresql
          - postgresql-contrib
          - libpq-dev
        description: List of system packages to install
      fastapi_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Name of the systemd service for the FastAPI application
      fastapi_service_enabled:
        type: bool
        required: false
        default: true
        description: Whether to enable the FastAPI service on boot
      fastapi_service_started:
        type: bool
        required: false
        default: true
        description: Whether to start the FastAPI service immediately
      database_username:
        type: str
        required: true
        description: PostgreSQL database username (injected by AAP credential type)
      database_password:
        type: str
        required: true
        description: PostgreSQL database password (injected by AAP credential type)
      database_name:
        type: str
        required: true
        description: PostgreSQL database name (injected by AAP credential type)
      database_host:
        type: str
        required: true
        description: PostgreSQL database host (injected by AAP credential type)
      database_port:
        type: int
        required: true
        description: PostgreSQL database port (injected by AAP credential type)
