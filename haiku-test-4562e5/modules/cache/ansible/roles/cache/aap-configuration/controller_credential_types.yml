---
controller_credential_types:
  - name: Redis Authentication Password
    description: Redis server authentication password for requirepass configuration
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required for authentication to Redis server on port 6379
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
