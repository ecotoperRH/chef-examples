---
- name: Verify nginx_multisite role
  hosts: all
  gather_facts: false
  tasks:
    # Service status checks
    - name: Check nginx service is running
      ansible.builtin.service_facts:

    - name: Assert nginx service is active
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - ansible_facts.services['nginx.service']['state'] == 'running'
        fail_msg: "Nginx service is not running"

    - name: Assert fail2ban service is active
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - ansible_facts.services['fail2ban.service']['state'] == 'running'
        fail_msg: "Fail2ban service is not running"

    - name: Assert ssh service is active
      ansible.builtin.assert:
        that:
          - "'ssh.service' in ansible_facts.services"
          - ansible_facts.services['ssh.service']['state'] == 'running'
        fail_msg: "SSH service is not running"

    # Nginx configuration validation
    - name: Validate nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
      register: nginx_test_result

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_test_result.rc == 0
        fail_msg: "Nginx configuration validation failed"

    # Configuration files existence
    - name: Check nginx configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
      loop_control:
        loop_var: item_config
      register: config_stat_results

    - name: Assert nginx configuration files exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected configuration file not found or empty"
      loop: "{{ config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # SSL certificates and keys
    - name: Check SSL certificates and keys exist
      ansible.builtin.stat:
        path: "{{ item_cert }}"
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_cert
      register: cert_stat_results

    - name: Assert SSL certificates and keys exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL certificate or key not found"
      loop: "{{ cert_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # SSL certificate permissions
    - name: Check private key permissions
      ansible.builtin.stat:
        path: "{{ item_key }}"
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: key_stat_results

    - name: Assert private key permissions are correct
      ansible.builtin.assert:
        that:
          - item_result['stat']['mode'] == '0640'
        fail_msg: "Private key permissions are incorrect"
      loop: "{{ key_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Document root directories and content
    - name: Check document root directories exist
      ansible.builtin.stat:
        path: "{{ item_docroot }}"
      loop:
        - /opt/server/test
        - /opt/server/ci
        - /opt/server/status
      loop_control:
        loop_var: item_docroot
      register: docroot_stat_results

    - name: Assert document root directories exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected document root directory not found"
      loop: "{{ docroot_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check static content files exist
      ansible.builtin.stat:
        path: "{{ item_content }}"
      loop:
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_content
      register: content_stat_results

    - name: Assert static content files exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected static content file not found"
      loop: "{{ content_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Site symlinks
    - name: Check site symlinks exist
      ansible.builtin.stat:
        path: "{{ item_link }}"
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_link
      register: link_stat_results

    - name: Assert site symlinks exist and are links
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['islnk']
        fail_msg: "Expected site symlink not found"
      loop: "{{ link_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Default site removal
    - name: Check default site is removed
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site_stat

    - name: Assert default site is removed
      ansible.builtin.assert:
        that:
          - not default_site_stat['stat']['exists']
        fail_msg: "Default nginx site should be removed"

    # Port listening verification
    - name: Check ports are listening
      ansible.builtin.wait_for:
        port: "{{ item_port }}"
        state: started
        timeout: 5
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_port

    # Virtual host content verification
    - name: Check test.cluster.local HTTPS response
      ansible.builtin.uri:
        url: https://test.cluster.local/
        validate_certs: false
        follow_redirects: none
      register: test_https_response
      ignore_errors: true

    - name: Assert test.cluster.local HTTPS response is successful
      ansible.builtin.assert:
        that:
          - test_https_response.status in [200, 301, 302]
        fail_msg: "test.cluster.local HTTPS request failed"

    - name: Check ci.cluster.local HTTPS response
      ansible.builtin.uri:
        url: https://ci.cluster.local/
        validate_certs: false
        follow_redirects: none
      register: ci_https_response
      ignore_errors: true

    - name: Assert ci.cluster.local HTTPS response is successful
      ansible.builtin.assert:
        that:
          - ci_https_response.status in [200, 301, 302]
        fail_msg: "ci.cluster.local HTTPS request failed"

    - name: Check status.cluster.local HTTPS response
      ansible.builtin.uri:
        url: https://status.cluster.local/
        validate_certs: false
        follow_redirects: none
      register: status_https_response
      ignore_errors: true

    - name: Assert status.cluster.local HTTPS response is successful
      ansible.builtin.assert:
        that:
          - status_https_response.status in [200, 301, 302]
        fail_msg: "status.cluster.local HTTPS request failed"

    # HTTP to HTTPS redirect verification
    - name: Check test.cluster.local HTTP redirect
      ansible.builtin.uri:
        url: http://test.cluster.local/
        follow_redirects: false
      register: test_http_redirect
      ignore_errors: true

    - name: Assert test.cluster.local HTTP redirects to HTTPS
      ansible.builtin.assert:
        that:
          - test_http_redirect.status == 301
        fail_msg: "test.cluster.local HTTP should redirect to HTTPS"

    - name: Check ci.cluster.local HTTP redirect
      ansible.builtin.uri:
        url: http://ci.cluster.local/
        follow_redirects: false
      register: ci_http_redirect
      ignore_errors: true

    - name: Assert ci.cluster.local HTTP redirects to HTTPS
      ansible.builtin.assert:
        that:
          - ci_http_redirect.status == 301
        fail_msg: "ci.cluster.local HTTP should redirect to HTTPS"

    - name: Check status.cluster.local HTTP redirect
      ansible.builtin.uri:
        url: http://status.cluster.local/
        follow_redirects: false
      register: status_http_redirect
      ignore_errors: true

    - name: Assert status.cluster.local HTTP redirects to HTTPS
      ansible.builtin.assert:
        that:
          - status_http_redirect.status == 301
        fail_msg: "status.cluster.local HTTP should redirect to HTTPS"

    # Security headers verification
    - name: Check test.cluster.local security headers
      ansible.builtin.uri:
        url: https://test.cluster.local/
        validate_certs: false
        method: HEAD
      register: test_headers
      ignore_errors: true

    - name: Assert test.cluster.local has HSTS header
      ansible.builtin.assert:
        that:
          - test_headers.get('strict_transport_security', '') != ''
        fail_msg: "test.cluster.local missing HSTS header"

    - name: Check ci.cluster.local security headers
      ansible.builtin.uri:
        url: https://ci.cluster.local/
        validate_certs: false
        method: HEAD
      register: ci_headers
      ignore_errors: true

    - name: Assert ci.cluster.local has HSTS header
      ansible.builtin.assert:
        that:
          - ci_headers.get('strict_transport_security', '') != ''
        fail_msg: "ci.cluster.local missing HSTS header"

    - name: Check status.cluster.local security headers
      ansible.builtin.uri:
        url: https://status.cluster.local/
        validate_certs: false
        method: HEAD
      register: status_headers
      ignore_errors: true

    - name: Assert status.cluster.local has HSTS header
      ansible.builtin.assert:
        that:
          - status_headers.get('strict_transport_security', '') != ''
        fail_msg: "status.cluster.local missing HSTS header"

    # Kernel security parameters
    - name: Check kernel security parameters # noqa: R101 - loop over trusted hardcoded kernel parameters
      ansible.builtin.command:
        cmd: sysctl -n {{ item_param }}
      loop:
        - net.ipv4.conf.all.rp_filter
        - net.ipv4.conf.all.accept_redirects
        - net.ipv4.conf.all.send_redirects
        - net.ipv4.conf.all.accept_source_route
        - net.ipv4.conf.all.log_martians
        - net.ipv4.icmp_echo_ignore_all
        - net.ipv4.icmp_echo_ignore_broadcasts
        - net.ipv4.tcp_syncookies
      loop_control:
        loop_var: item_param
      register: sysctl_results
      changed_when: false

    - name: Assert kernel security parameters are set
      ansible.builtin.assert:
        that:
          - item_result.stdout | int >= 0
        fail_msg: "Kernel security parameter not set correctly"
      loop: "{{ sysctl_results['results'] }}"
      loop_control:
        loop_var: item_result

    # SSH configuration
    - name: Check SSH configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config_content

    - name: Assert SSH root login is disabled
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in sshd_config_content['content'] | b64decode"
        fail_msg: "SSH root login should be disabled"

    - name: Assert SSH password authentication is disabled
      ansible.builtin.assert:
        that:
          - "'PasswordAuthentication no' in sshd_config_content['content'] | b64decode"
        fail_msg: "SSH password authentication should be disabled"

    # Fail2ban configuration
    - name: Check fail2ban configuration exists
      ansible.builtin.slurp:
        src: /etc/fail2ban/jail.local
      register: fail2ban_config_content

    - name: Assert fail2ban configuration contains expected jails
      ansible.builtin.assert:
        that:
          - "'[sshd]' in fail2ban_config_content['content'] | b64decode"
          - "'[nginx-http-auth]' in fail2ban_config_content['content'] | b64decode"
          - "'[nginx-limit-req]' in fail2ban_config_content['content'] | b64decode"
          - "'[nginx-botsearch]' in fail2ban_config_content['content'] | b64decode"
        fail_msg: "Fail2ban configuration missing expected jails"

    # UFW firewall verification
    - name: Check UFW status # noqa: L033 - variable registration is necessary for subsequent tasks
      ansible.builtin.command:
        cmd: ufw status
      register: ufw_status
      changed_when: false
      ignore_errors: true

    - name: Assert UFW is enabled
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status.stdout"
        fail_msg: "UFW firewall should be enabled"

    # Nginx logs verification
    - name: Check nginx log files exist
      ansible.builtin.stat:
        path: "{{ item_log }}"
      loop:
        - /var/log/nginx/access.log
        - /var/log/nginx/error.log
        - /var/log/nginx/test.cluster.local_access.log
        - /var/log/nginx/ci.cluster.local_access.log
        - /var/log/nginx/status.cluster.local_access.log
      loop_control:
        loop_var: item_log
      register: log_stat_results

    - name: Assert nginx log files exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
        fail_msg: "Expected nginx log file not found"
      loop: "{{ log_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Document root permissions
    - name: Check document root permissions
      ansible.builtin.stat:
        path: "{{ item_dir }}"
      loop:
        - /opt/server/test
        - /opt/server/ci
        - /opt/server/status
      loop_control:
        loop_var: item_dir
      register: docroot_perm_results

    - name: Assert document root permissions are correct
      ansible.builtin.assert:
        that:
          - item_result['stat']['mode'] == '0755'
          - item_result['stat']['pw_name'] == 'www-data'
          - item_result['stat']['gr_name'] == 'www-data'
        fail_msg: "Document root permissions are incorrect"
      loop: "{{ docroot_perm_results['results'] }}"
      loop_control:
        loop_var: item_result

    # SSL certificate directory permissions
    - name: Check SSL certificate directory permissions
      ansible.builtin.stat:
        path: /etc/ssl/certs
      register: cert_dir_stat

    - name: Assert SSL certificate directory permissions are correct
      ansible.builtin.assert:
        that:
          - cert_dir_stat['stat']['mode'] == '0755'
          - cert_dir_stat['stat']['pw_name'] == 'root'
          - cert_dir_stat['stat']['gr_name'] == 'root'
        fail_msg: "SSL certificate directory permissions are incorrect"

    # SSL private key directory permissions
    - name: Check SSL private key directory permissions
      ansible.builtin.stat:
        path: /etc/ssl/private
      register: key_dir_stat

    - name: Assert SSL private key directory permissions are correct
      ansible.builtin.assert:
        that:
          - key_dir_stat['stat']['mode'] == '0710'
          - key_dir_stat['stat']['pw_name'] == 'root'
          - key_dir_stat['stat']['gr_name'] == 'ssl-cert'
        fail_msg: "SSL private key directory permissions are incorrect"
