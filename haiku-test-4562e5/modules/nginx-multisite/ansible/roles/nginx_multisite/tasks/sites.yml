---
- name: Deploy site-specific nginx configurations
  block:
    - name: Deploy site configuration templates # noqa: R114 - path from role-defined sites dict
      ansible.builtin.template:
        src: site.conf.j2
        dest: /etc/nginx/sites-available/{{ item_site['key'] }}
        mode: "0644"
        backup: true
      loop: "{{ nginx_multisite_sites | dict2items }}"
      loop_control:
        loop_var: item_site
      notify: Reload nginx
      vars:
        server_name: "{{ item_site['key'] }}"
        document_root: "{{ item_site['value']['document_root'] }}"
        ssl_enabled: "{{ item_site['value']['ssl_enabled'] }}"
        cert_file: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_site['key'] }}.crt"
        key_file: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_site['key'] }}.key"

    - name: Create symbolic links to enable sites # noqa: R114 - path from role-defined sites dict
      ansible.builtin.file:
        src: /etc/nginx/sites-available/{{ item_site['key'] }}
        dest: /etc/nginx/sites-enabled/{{ item_site['key'] }}
        state: link
      loop: "{{ nginx_multisite_sites | dict2items }}"
      loop_control:
        loop_var: item_site
      notify: Reload nginx

    - name: Delete default nginx site configuration
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx
