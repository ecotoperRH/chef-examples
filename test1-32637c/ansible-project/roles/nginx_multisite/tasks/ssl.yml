---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present
- name: Ensure ssl-cert group exists
  ansible.builtin.group:
    name: ssl-cert
    state: present
- name: Ensure SSL certificate directory exists
  ansible.builtin.file:
    path: /etc/ssl/certs
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Ensure SSL private key directory exists
  ansible.builtin.file:
    path: /etc/ssl/private
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"
- name: Generate self-signed SSL certificate for each site
  ansible.builtin.shell:
    cmd: "openssl req -x509 -nodes -days {{ nginx_multisite_ssl_days }} \\\n  -newkey rsa:2048 \\\n  -keyout {{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl['key']
      }}.key \\\n  -out {{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl['key'] }}.crt \\\n  -subj \"/C={{ nginx_multisite_ssl_country }}/ST={{ nginx_multisite_ssl_state
      }}/L={{ nginx_multisite_ssl_locality }}/O={{ nginx_multisite_ssl_org }}/OU={{ nginx_multisite_ssl_ou }}/CN={{ item_ssl['key'] }}/emailAddress={{ nginx_multisite_ssl_email
      }}\"\nchmod 640 {{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl['key'] }}.key\nchown root:ssl-cert {{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl['key']
      }}.key\n"
  args:
    creates: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl['key'] }}.crt"
  when: item_ssl['value']['ssl_enabled'] | bool
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl
  notify: Reload nginx
