---
controller_credential_types:
- name: FastAPI PostgreSQL Database
  description: PostgreSQL database credentials for the FastAPI tutorial application,
    migrated from hardcoded plaintext values in the Chef recipe to Ansible Vault
  kind: cloud
  inputs:
    fields:
    - id: db_username
      type: string
      label: Database Username
      help_text: PostgreSQL username for the FastAPI application database (e.g., 'fastapi')
    - id: db_password
      type: string
      label: Database Password
      secret: true
      help_text: PostgreSQL password for the FastAPI application user. Originally
        hardcoded as 'fastapi_password' in cookbooks/fastapi-tutorial/recipes/default.rb.
        Used in CREATE USER SQL statement and DATABASE_URL.
    - id: db_name
      type: string
      label: Database Name
      help_text: PostgreSQL database name for the FastAPI application (e.g., 'fastapi_db')
    - id: db_host
      type: string
      label: Database Host
      help_text: Hostname or IP address of the PostgreSQL server (e.g., 'localhost')
    - id: database_url
      type: string
      label: Database URL
      secret: true
      help_text: Full PostgreSQL connection string written to /opt/fastapi-tutorial/.env.
        Originally hardcoded as 'postgresql://fastapi:fastapi_password@localhost/fastapi_db'.
        Contains embedded credentials and is read by the FastAPI application at runtime
        via python-dotenv.
    required:
    - db_username
    - db_password
    - db_name
    - db_host
    - database_url
  injectors:
    extra_vars:
      db_username: !unsafe '{{ db_username }}'
      db_password: !unsafe '{{ db_password }}'
      db_name: !unsafe '{{ db_name }}'
      db_host: !unsafe '{{ db_host }}'
      database_url: !unsafe '{{ database_url }}'
