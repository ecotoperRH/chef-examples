---
controller_credentials:
- name: FastAPI PostgreSQL Database - fastapi_tutorial
  description: PostgreSQL database credentials for the FastAPI tutorial application,
    migrated from hardcoded plaintext values in the Chef recipe to Ansible Vault
  organization: Default
  credential_type: FastAPI PostgreSQL Database
  update_secrets: true
  inputs:
    db_username: '{{ db_username }}'
    db_password: '{{ vault_db_password }}'
    db_name: '{{ db_name }}'
    db_host: '{{ db_host }}'
    database_url: '{{ vault_database_url }}'
