---
controller_credential_types:
- name: Redis Authentication Password
  description: Redis authentication credential for the standalone Redis instance on
    port 6379
  kind: cloud
  inputs:
    fields:
    - id: redis_password
      type: string
      label: Redis Password
      secret: true
      help_text: Password for Redis requirepass directive; all clients must authenticate
        with AUTH before issuing commands. Migrated from hardcoded value 'redis_secure_password_123'
        in cookbooks/cache/recipes/default.rb.
    required:
    - redis_password
  injectors:
    extra_vars:
      redis_password: !unsafe '{{ redis_password }}'
