---
# Unsupported diagnostics without stated expected output: service status, runtime sysctl values,
# curl headers, certificate subject/dates, private-key stat output, and log tail output.
- name: Verify nginx_multisite deployment
  hosts: all
  gather_facts: false
  vars:
    verify_packages:
      - nginx
      - fail2ban
      - ufw
      - openssl
      - ca-certificates
    verify_directories:
      - /opt/server/test
      - /opt/server/ci
      - /opt/server/status
    verify_files:
      - /etc/fail2ban/jail.local
      - /etc/sysctl.d/99-security.conf
      - /etc/ssh/sshd_config
      - /etc/nginx/nginx.conf
      - /etc/nginx/conf.d/security.conf
      - /opt/server/test/index.html
      - /etc/nginx/sites-available/test.cluster.local
      - /etc/ssl/certs/test.cluster.local.crt
      - /etc/ssl/private/test.cluster.local.key
      - /opt/server/ci/index.html
      - /etc/nginx/sites-available/ci.cluster.local
      - /etc/ssl/certs/ci.cluster.local.crt
      - /etc/ssl/private/ci.cluster.local.key
      - /opt/server/status/index.html
      - /etc/nginx/sites-available/status.cluster.local
      - /etc/ssl/certs/status.cluster.local.crt
      - /etc/ssl/private/status.cluster.local.key
    verify_links:
      - /etc/nginx/sites-enabled/test.cluster.local
      - /etc/nginx/sites-enabled/ci.cluster.local
      - /etc/nginx/sites-enabled/status.cluster.local
    verify_content:
      - path: /etc/ssh/sshd_config
        patterns:
          - PermitRootLogin no
          - PasswordAuthentication no
      - path: /etc/sysctl.d/99-security.conf
        patterns:
          - net.ipv4.conf.all.rp_filter = 1
          - net.ipv4.icmp_echo_ignore_all = 1
          - net.ipv6.conf.all.disable_ipv6 = 1
          - net.ipv4.tcp_syncookies = 1
      - path: /etc/nginx/nginx.conf
        patterns:
          - worker_processes auto;
      - path: /etc/nginx/conf.d/security.conf
        patterns:
          - server_tokens off;
          - ssl_protocols TLSv1.2 TLSv1.3;
          - client_max_body_size 1k;
      - path: /etc/nginx/sites-available/test.cluster.local
        patterns:
          - server_name test.cluster.local;
          - root /opt/server/test;
          - ssl_certificate /etc/ssl/certs/test.cluster.local.crt;
      - path: /etc/nginx/sites-available/ci.cluster.local
        patterns:
          - server_name ci.cluster.local;
          - root /opt/server/ci;
          - ssl_certificate /etc/ssl/certs/ci.cluster.local.crt;
      - path: /etc/nginx/sites-available/status.cluster.local
        patterns:
          - server_name status.cluster.local;
          - root /opt/server/status;
          - ssl_certificate /etc/ssl/certs/status.cluster.local.crt;

  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_nginx_multisite in ansible_facts['packages']
        fail_msg: Required package is not installed.
      loop: "{{ verify_packages }}"
      loop_control:
        loop_var: item_nginx_multisite

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      failed_when: false
      register: verify_nginx_config

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - verify_nginx_config['rc'] == 0
        fail_msg: Nginx configuration validation failed.

    - name: Validate Fail2ban status checks
      ansible.builtin.command:
        argv: "{{ item_nginx_multisite }}"
      changed_when: false
      failed_when: false
      register: verify_fail2ban_status
      loop:
        - [fail2ban-client, status]
        - [fail2ban-client, status, sshd]
        - [fail2ban-client, status, nginx-http-auth]
        - [fail2ban-client, status, nginx-limit-req]
        - [fail2ban-client, status, nginx-botsearch]
      loop_control:
        loop_var: item_nginx_multisite

    - name: Assert Fail2ban status checks succeed
      ansible.builtin.assert:
        that:
          - item_nginx_multisite['rc'] == 0
        fail_msg: A Fail2ban status check failed.
      loop: "{{ verify_fail2ban_status['results'] }}"
      loop_control:
        loop_var: item_nginx_multisite

    - name: Read UFW verbose status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      changed_when: false
      failed_when: false
      register: verify_ufw_status

    - name: Assert UFW rules and default policy
      ansible.builtin.assert:
        that:
          - verify_ufw_status['rc'] == 0
          - "'22/tcp' in verify_ufw_status['stdout']"
          - "'80/tcp' in verify_ufw_status['stdout']"
          - "'443/tcp' in verify_ufw_status['stdout']"
          - "'Default: deny' in verify_ufw_status['stdout']"
        fail_msg: UFW status does not contain the required rules and default policy.

    - name: Read SSH daemon effective configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -T
      changed_when: false
      failed_when: false
      register: verify_sshd_config

    - name: Assert SSH daemon hardening settings
      ansible.builtin.assert:
        that:
          - verify_sshd_config['rc'] == 0
          - "'permitrootlogin no' in verify_sshd_config['stdout']"
          - "'passwordauthentication no' in verify_sshd_config['stdout']"
        fail_msg: SSH daemon effective hardening settings are not configured.

    - name: Read expected configuration files
      ansible.builtin.slurp:
        src: "{{ item_nginx_multisite['path'] }}"
      register: verify_configuration_files
      loop: "{{ verify_content }}"
      loop_control:
        loop_var: item_nginx_multisite

    - name: Assert expected configuration content
      ansible.builtin.assert:
        that:
          - >-
            item_nginx_multisite['item']['patterns']
            | difference(item_nginx_multisite['content'] | b64decode | split('\n'))
            | length == 0
        fail_msg: A required configuration setting is missing.
      loop: "{{ verify_configuration_files['results'] }}"
      loop_control:
        loop_var: item_nginx_multisite

    - name: Inspect required directories
      ansible.builtin.stat:
        path: "{{ item_nginx_multisite }}"
      register: verify_directory_stats
      loop: "{{ verify_directories }}"
      loop_control:
        loop_var: item_nginx_multisite

    - name: Assert required directories exist
      ansible.builtin.assert:
        that:
          - item_nginx_multisite['stat']['isdir']
        fail_msg: A required directory does not exist.
      loop: "{{ verify_directory_stats['results'] }}"
      loop_control:
        loop_var: item_nginx_multisite

    - name: Inspect required files
      ansible.builtin.stat:
        path: "{{ item_nginx_multisite }}"
      register: verify_file_stats
      loop: "{{ verify_files }}"
      loop_control:
        loop_var: item_nginx_multisite

    - name: Assert required files exist
      ansible.builtin.assert:
        that:
          - item_nginx_multisite['stat']['isreg']
        fail_msg: A required file does not exist.
      loop: "{{ verify_file_stats['results'] }}"
      loop_control:
        loop_var: item_nginx_multisite

    - name: Inspect enabled Nginx site links
      ansible.builtin.stat:
        path: "{{ item_nginx_multisite }}"
      register: verify_link_stats
      loop: "{{ verify_links }}"
      loop_control:
        loop_var: item_nginx_multisite

    - name: Assert enabled Nginx sites are symbolic links
      ansible.builtin.assert:
        that:
          - item_nginx_multisite['stat']['islnk']
        fail_msg: An enabled Nginx site is not a symbolic link.
      loop: "{{ verify_link_stats['results'] }}"
      loop_control:
        loop_var: item_nginx_multisite

    - name: Inspect default Nginx site link
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: verify_default_site

    - name: Assert default Nginx site link is absent
      ansible.builtin.assert:
        that:
          - not verify_default_site['stat']['exists']
        fail_msg: The default Nginx site link is present.

    - name: Verify Nginx HTTP and HTTPS listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_nginx_multisite }}"
        state: started
        timeout: 5
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_nginx_multisite
