---
- name: Check for PAM su configuration
  ansible.builtin.stat:
    path: /etc/pam.d/su
  register: cache_pam_su
  when: ansible_facts['os_family'] == 'Debian'

- name: Deploy PAM su configuration for ulimit support # noqa: L039 - cache_pam_su is registered by the preceding Debian-only stat task
  ansible.builtin.template:
    src: su.j2
    dest: /etc/pam.d/su
    owner: root
    group: root
    mode: "0644"
    backup: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - cache_pam_su.stat.exists | default(false)

- name: Check for PAM sudo configuration
  ansible.builtin.stat:
    path: /etc/pam.d/sudo
  register: cache_pam_sudo
  when: ansible_facts['os_family'] == 'Debian'

- name: Deploy PAM sudo configuration for ulimit support # noqa: L039 - cache_pam_sudo is registered by the preceding Debian-only stat task
  ansible.builtin.copy:
    src: sudo
    dest: /etc/pam.d/sudo
    owner: root
    group: root
    mode: "0644"
    backup: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - cache_pam_sudo.stat.exists | default(false)
