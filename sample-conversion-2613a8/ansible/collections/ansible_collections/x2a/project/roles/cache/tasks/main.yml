---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Memcached service
  ansible.builtin.include_tasks: memcached.yml

- name: Configure Redis ulimit support
  ansible.builtin.include_tasks: ulimit.yml

- name: Configure standalone Redis instance # noqa: L038 - eloy.redis is a pinned role dependency in this role's requirements.yml
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_install_method: "{{ cache_redis_install_method }}"
    redis_port: "{{ cache_redis_port }}"
    redis_requirepass: "{{ redis_password }}"
    redis_rdb_enabled: "{{ cache_redis_rdb_enabled }}"
    redis_aof_enabled: "{{ cache_redis_aof_enabled }}"
    redis_replication_enabled: "{{ cache_redis_replication_enabled }}"
    redis_cluster_enabled: "{{ cache_redis_cluster_enabled }}"
    redis_sentinel_enabled: "{{ cache_redis_sentinel_enabled }}"

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_directory }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"

- name: Remove obsolete Redis replication directives
  ansible.builtin.replace:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a role default, not user input
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).* ?
    replace: ""
  notify: Restart Redis
