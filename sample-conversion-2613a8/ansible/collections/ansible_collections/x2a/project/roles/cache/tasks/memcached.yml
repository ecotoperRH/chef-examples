---
- name: Install Memcached package
  ansible.builtin.package:
    name:
      - "{{ cache_memcached_package }}"
    state: present

- name: Ensure Memcached group exists
  ansible.builtin.group:
    name: "{{ cache_memcached_group }}"
    state: present
    system: true

- name: Ensure Memcached user exists
  ansible.builtin.user:
    name: "{{ cache_memcached_user }}"
    group: "{{ cache_memcached_group }}"
    system: true
    create_home: false
    state: present

- name: Create Memcached log directory
  ansible.builtin.file:
    path: "{{ cache_memcached_log_directory }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: "{{ cache_memcached_user }}"
    group: "{{ cache_memcached_group }}"
    mode: "0755"

- name: Configure Memcached systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/memcached.service.d
    state: directory
    mode: "0755"
  when: ansible_facts['service_mgr'] == 'systemd'

- name: Configure Memcached systemd override
  ansible.builtin.copy:
    content: |
      [Service]
      ExecStart=
      ExecStart={{ cache_memcached_binary }} -m {{ cache_memcached_memory }} -p {{ cache_memcached_port }} -U {{ cache_memcached_udp_port }} -l {{ cache_memcached_listen }} -c {{ cache_memcached_maxconn }} -I {{ cache_memcached_max_object_size }} -t {{ cache_memcached_threads }} -u {{ cache_memcached_user }} -n {{ cache_memcached_ulimit }} {{ cache_memcached_extra_cli_options | join(' ') }}
    dest: /etc/systemd/system/memcached.service.d/cache.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: ansible_facts['service_mgr'] == 'systemd'
  notify:
    - Reload systemd daemon
    - Restart Memcached

- name: Ensure Memcached service is enabled and running
  ansible.builtin.service:
    name: "{{ cache_memcached_service }}"
    enabled: true
    state: started
