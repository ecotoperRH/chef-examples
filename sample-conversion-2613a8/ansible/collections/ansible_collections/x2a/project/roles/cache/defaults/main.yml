---
# User-facing cache service configuration.
cache_secure_logging: true
cache_memcached_package: memcached
cache_memcached_service: memcached
cache_memcached_binary: /usr/bin/memcached
cache_memcached_user: memcache
cache_memcached_group: memcache
cache_memcached_log_directory: /var/log/memcached
cache_memcached_memory: 64
cache_memcached_port: 11211
cache_memcached_udp_port: 11211
cache_memcached_listen: 0.0.0.0
cache_memcached_maxconn: 1024
cache_memcached_max_object_size: 1m
cache_memcached_threads: 4
cache_memcached_extra_cli_options: []
cache_memcached_ulimit: 1024
# Redis is managed by the approved eloy.redis.redis role.
cache_redis_install_method: package
cache_redis_port: 6379
cache_redis_user: redis
cache_redis_group: redis
cache_redis_log_directory: /var/log/redis
cache_redis_config_file: /etc/redis/6379.conf
cache_redis_rdb_enabled: true
cache_redis_aof_enabled: false
cache_redis_replication_enabled: false
cache_redis_cluster_enabled: false
cache_redis_sentinel_enabled: false
