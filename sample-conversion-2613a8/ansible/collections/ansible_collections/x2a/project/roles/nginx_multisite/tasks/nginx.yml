---
- name: Install Nginx
  ansible.builtin.package:
    name:
      - nginx
    state: present

- name: Create Nginx worker group
  ansible.builtin.group:
    name: www-data
    system: true
    state: present

- name: Create Nginx worker user
  ansible.builtin.user:
    name: www-data
    group: www-data
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present

- name: Configure Nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload Nginx

- name: Configure Nginx security settings
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload Nginx

- name: Create site document root directories
  ansible.builtin.file:
    path: "{{ item_nginx_multisite['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dict, not user input
    owner: www-data
    group: www-data
    mode: "0755"
    state: directory
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite

- name: Deploy site index pages
  ansible.builtin.copy:
    src: "{{ item_nginx_multisite['key'].split('.')[0] }}/index.html"
    dest: "{{ item_nginx_multisite['value']['document_root'] }}/index.html" # noqa: R114 - path from role-defined sites dict, not user input
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
