---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
    state: present
  when: nginx_multisite_fail2ban_enabled | bool or nginx_multisite_ufw_enabled | bool

- name: Configure Fail2ban jails
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart Fail2ban

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Set UFW default policy to deny incoming traffic
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - default
      - deny
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Allow SSH through UFW
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - ssh
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Allow HTTP through UFW
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - http
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - https
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Enable UFW
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - enable
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Configure kernel security parameters
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl settings

- name: Install OpenSSH server
  ansible.builtin.package:
    name: openssh-server
    state: present
  when: nginx_multisite_ssh_disable_root or not nginx_multisite_ssh_password_auth

- name: Check for SSH server configuration
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable SSH root login # noqa: L039 - nginx_multisite_sshd_config is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin\\s+
    line: PermitRootLogin no
    create: false
    backup: true
  when:
    - nginx_multisite_ssh_disable_root
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart SSH

- name: Disable SSH password authentication # noqa: L039 - nginx_multisite_sshd_config is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication\\s+
    line: PasswordAuthentication no
    create: false
    backup: true
  when:
    - not nginx_multisite_ssh_password_auth
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart SSH
