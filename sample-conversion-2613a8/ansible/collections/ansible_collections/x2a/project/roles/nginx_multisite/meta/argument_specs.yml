---
argument_specs:
  main:
    short_description: Configure Nginx with multiple SSL-enabled subdomains
    description:
      - Installs Nginx and its security controls, generates development TLS certificates, and deploys configured static HTTPS virtual hosts.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Static Nginx virtual hosts to configure.
        options:
          document_root:
            type: str
            required: true
            description: Absolute directory containing the site's static content.
          ssl_enabled:
            type: bool
            required: true
            description: Whether the site listens with the generated TLS certificate.
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory in which development TLS certificates are stored.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory in which development TLS private keys are stored.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban is enabled for the configured jail settings.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW default-deny policy and web access rules are configured.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether tasks handling TLS private keys suppress task output.
