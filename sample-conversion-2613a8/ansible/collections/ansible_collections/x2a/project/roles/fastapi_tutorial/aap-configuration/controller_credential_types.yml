---
controller_credential_types:
  - name: PostgreSQL FastAPI Application Database
    description: Credentials for the FastAPI application PostgreSQL role and local fastapi_db database.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application (fastapi).
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the FastAPI PostgreSQL role; replaces the hardcoded fastapi_password value.
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application (fastapi_db).
        - id: db_host
          type: string
          label: Database Host
          help_text: PostgreSQL host used in the application DATABASE_URL (localhost).
      required:
        - db_username
        - db_password
        - db_name
        - db_host
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_name: !unsafe "{{ db_name }}"
        db_host: !unsafe "{{ db_host }}"
