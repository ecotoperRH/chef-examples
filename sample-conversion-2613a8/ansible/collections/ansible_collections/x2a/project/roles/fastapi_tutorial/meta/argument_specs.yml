---
argument_specs:
  main:
    short_description: Configure FastAPI tutorial application with PostgreSQL
    description:
      - Deploys the FastAPI tutorial application, a local PostgreSQL database, and a systemd service.
    options:
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the database password.
      db_username:
        type: str
        required: true
        description: PostgreSQL application role injected by an AAP credential type.
      db_password:
        type: str
        required: true
        no_log: true
        description: PostgreSQL application password injected by an AAP credential type.
      db_name:
        type: str
        required: true
        description: PostgreSQL database name injected by an AAP credential type.
      db_host:
        type: str
        required: true
        description: PostgreSQL host name injected by an AAP credential type.
