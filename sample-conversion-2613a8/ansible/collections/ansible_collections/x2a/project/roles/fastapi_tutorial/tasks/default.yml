---
- name: Install FastAPI tutorial system packages
  ansible.builtin.package:
    name: "{{ fastapi_tutorial_packages }}"
    state: present

- name: Initialize PostgreSQL database cluster on Red Hat
  ansible.builtin.command:
    argv:
      - postgresql-setup
      - initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] == 'RedHat'

- name: Create FastAPI tutorial application directory
  ansible.builtin.file:
    path: /opt/fastapi-tutorial
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check out FastAPI tutorial application
  ansible.builtin.git:
    repo: https://github.com/dibanez/fastapi_tutorial.git
    dest: /opt/fastapi-tutorial
    version: main
    update: true

- name: Create FastAPI tutorial virtual environment
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - /opt/fastapi-tutorial/venv
    creates: /opt/fastapi-tutorial/venv/bin/python

- name: Install FastAPI tutorial Python dependencies
  ansible.builtin.pip:
    requirements: /opt/fastapi-tutorial/requirements.txt
    virtualenv: /opt/fastapi-tutorial/venv
    virtualenv_command: python3 -m venv

- name: Enable and start PostgreSQL service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_postgresql_service }}"
    enabled: true
    state: started

- name: Check whether the PostgreSQL role exists # noqa: L039 R101 - database credentials are required role parameters used intentionally in the PostgreSQL query
  ansible.builtin.command: # noqa: R101 - database credentials are required role parameters used intentionally in the PostgreSQL query
    argv:
      - psql
      - -d
      - postgres
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = '{{ db_username }}'
  changed_when: false
  register: fastapi_tutorial_role_exists
  become: true # noqa: R108 - PostgreSQL administration must run as the postgres system user
  become_user: postgres

- name: Create PostgreSQL application role # noqa: L039 R101 - database credentials and prior registered check are required role parameters used intentionally to create the role
  ansible.builtin.command: # noqa: R101 - database credentials are required role parameters used intentionally to create the role
    argv:
      - psql
      - -d
      - postgres
      - -c
      - CREATE ROLE {{ db_username }} LOGIN PASSWORD '{{ db_password }}'
  when: fastapi_tutorial_role_exists.stdout | trim != '1'
  become: true # noqa: R108 - PostgreSQL role creation must run as the postgres system user
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether the PostgreSQL database exists # noqa: L039 R101 - database name is a required role parameter used intentionally in the PostgreSQL query
  ansible.builtin.command: # noqa: R101 - database name is a required role parameter used intentionally in the PostgreSQL query
    argv:
      - psql
      - -d
      - postgres
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ db_name }}'
  changed_when: false
  register: fastapi_tutorial_database_exists
  become: true # noqa: R108 - PostgreSQL administration must run as the postgres system user
  become_user: postgres

- name: Create PostgreSQL application database # noqa: L039 R101 - database parameters and prior registered check are required role parameters used intentionally to create the database
  ansible.builtin.command: # noqa: R101 - database parameters are required role parameters used intentionally to create the database
    argv:
      - psql
      - -d
      - postgres
      - -c
      - CREATE DATABASE {{ db_name }} OWNER {{ db_username }}
  when: fastapi_tutorial_database_exists.stdout | trim != '1'
  become: true # noqa: R108 - PostgreSQL database creation must run as the postgres system user
  become_user: postgres

- name: Grant application role access to PostgreSQL database # noqa: L039 R101 - database parameters are required role parameters used intentionally for the PostgreSQL grant
  ansible.builtin.command: # noqa: R101 - database parameters are required role parameters used intentionally for the PostgreSQL grant
    argv:
      - psql
      - -d
      - postgres
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_username }}
  changed_when: false
  become: true # noqa: R108 - PostgreSQL privilege grants must run as the postgres system user
  become_user: postgres

- name: Deploy FastAPI tutorial environment configuration # noqa: L039 - database connection values are required role parameters used intentionally in the application configuration
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}/{{ db_name }}
    dest: /opt/fastapi-tutorial/.env
    owner: root
    group: root
    mode: "0600"
    backup: true
  notify: Reload systemd daemon
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy FastAPI tutorial systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target {{ fastapi_tutorial_postgresql_service }}.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/fastapi-tutorial
      Environment="PATH=/opt/fastapi-tutorial/venv/bin"
      ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/fastapi-tutorial.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd daemon

- name: Flush systemd reload handler before starting application
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI tutorial service
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
