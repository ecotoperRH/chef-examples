---
controller_credentials:
  - name: PostgreSQL FastAPI Application Database - fastapi_tutorial
    description: Credentials for the FastAPI application PostgreSQL role and local fastapi_db database.
    organization: Default
    credential_type: PostgreSQL FastAPI Application Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      db_name: "{{ db_name }}"
      db_host: "{{ db_host }}"
