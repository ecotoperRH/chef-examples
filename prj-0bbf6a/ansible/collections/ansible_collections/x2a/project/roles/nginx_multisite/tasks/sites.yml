---
- name: Render virtual host configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item_site['name'] }}"  # noqa R114 - site name from role-defined sites list
    mode: '0644'
    backup: true
  vars:
    site_name: "{{ item_site['name'] }}"
    document_root: "{{ item_site['document_root'] }}"
    certificate_path: "{{ item_site['certificate'] }}"
    key_path: "{{ item_site['private_key'] }}"
  loop: "{{ nginx_multisite_sites }}"
  loop_control:
    loop_var: item_site
  notify: Reload nginx

- name: Enable virtual host configurations
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item_site_link['name'] }}"
    dest: "/etc/nginx/sites-enabled/{{ item_site_link['name'] }}"  # noqa R114 - site name from role-defined sites list
    state: link
    force: true
  loop: "{{ nginx_multisite_sites }}"
  loop_control:
    loop_var: item_site_link
  notify: Reload nginx

- name: Remove nginx default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
