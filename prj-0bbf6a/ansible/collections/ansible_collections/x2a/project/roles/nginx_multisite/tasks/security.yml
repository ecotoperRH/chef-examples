---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
    state: present

- name: Configure fail2ban
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: '0644'
    backup: true
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started

- name: Read UFW status
  ansible.builtin.command:
    argv: ['ufw', 'status', 'verbose']
  register: nginx_multisite_ufw_status
  changed_when: false

- name: Set UFW default incoming policy
  ansible.builtin.command:
    argv: ['ufw', 'default', 'deny', 'incoming']
  when: "'Default: deny (incoming)' not in nginx_multisite_ufw_status.stdout"

- name: Allow required firewall ports
  ansible.builtin.command:
    argv: ['ufw', 'allow', '{{ item_ufw_port }}/tcp']
  loop:
    - '22'
    - '80'
    - '443'
  loop_control:
    loop_var: item_ufw_port
  when: "(item_ufw_port ~ '/tcp') not in nginx_multisite_ufw_status.stdout"

- name: Enable UFW
  ansible.builtin.command:
    argv: ['ufw', '--force', 'enable']
  when: "'Status: active' not in nginx_multisite_ufw_status.stdout"

- name: Configure kernel security settings
  ansible.posix.sysctl:
    name: "{{ item_sysctl['key'] }}"
    value: "{{ item_sysctl['value'] }}"
    state: present
    reload: true
  loop:
    - { key: 'net.ipv4.conf.default.rp_filter', value: '1' }
    - { key: 'net.ipv4.conf.all.rp_filter', value: '1' }
    - { key: 'net.ipv4.conf.all.accept_redirects', value: '0' }
    - { key: 'net.ipv6.conf.all.accept_redirects', value: '0' }
    - { key: 'net.ipv4.conf.all.accept_source_route', value: '0' }
    - { key: 'net.ipv6.conf.all.accept_source_route', value: '0' }
    - { key: 'net.ipv4.conf.all.log_martians', value: '1' }
    - { key: 'net.ipv4.icmp_echo_ignore_all', value: '1' }
    - { key: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
    - { key: 'net.ipv6.conf.all.disable_ipv6', value: '1' }
    - { key: 'net.ipv4.tcp_syncookies', value: '1' }
    - { key: 'net.ipv4.tcp_max_syn_backlog', value: '2048' }
    - { key: 'net.ipv4.tcp_synack_retries', value: '5' }
    - { key: 'net.ipv4.tcp_syn_retries', value: '5' }
  loop_control:
    loop_var: item_sysctl

- name: Harden SSH configuration
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^{{ item_ssh['key'] }}"
    line: "{{ item_ssh['key'] }} {{ item_ssh['value'] }}"
    state: present
    backup: true
  loop:
    - { key: 'PermitRootLogin', value: 'no' }
    - { key: 'PasswordAuthentication', value: 'no' }
  loop_control:
    loop_var: item_ssh
  notify: Restart SSH
