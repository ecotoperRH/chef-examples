---
argument_specs:
  main:
    short_description: 'Configure nginx as a secure multi-site HTTPS server.'
    description:
      - 'Installs and configures nginx, TLS certificates, fail2ban, firewall rules, and SSH and kernel hardening.'
    options:
      nginx_multisite_sites:
        type: list
        elements: dict
        required: false
        default:
          - name: 'test.cluster.local'
            document_root: '/opt/server/test'
            certificate: '/etc/ssl/certs/test.cluster.local.crt'
            private_key: '/etc/ssl/private/test.cluster.local.key'
          - name: 'ci.cluster.local'
            document_root: '/opt/server/ci'
            certificate: '/etc/ssl/certs/ci.cluster.local.crt'
            private_key: '/etc/ssl/private/ci.cluster.local.key'
          - name: 'status.cluster.local'
            document_root: '/opt/server/status'
            certificate: '/etc/ssl/certs/status.cluster.local.crt'
            private_key: '/etc/ssl/private/status.cluster.local.key'
        description: 'Virtual hosts and their document and TLS paths.'
      nginx_multisite_certificate_days:
        type: int
        required: false
        default: 365
        description: 'Validity period for generated self-signed certificates.'
      nginx_multisite_certificate_email:
        type: str
        required: false
        default: 'admin@example.com'
        description: 'Email metadata included in generated certificates.'
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: 'Whether to suppress output for tasks handling private keys.'
