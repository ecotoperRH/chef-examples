---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application
    description:
      - Deploys a FastAPI application from Git with a Python virtual environment and PostgreSQL dependency.
      - Configures the application environment and systemd service.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: '/opt/fastapi-tutorial'
        description: Application checkout directory.
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: '/opt/fastapi-tutorial/venv'
        description: Python virtual environment directory.
      fastapi_tutorial_repository_url:
        type: str
        required: false
        default: ''
        description: Git repository URL for the application.
      fastapi_tutorial_repository_version:
        type: str
        required: false
        default: 'HEAD'
        description: Git revision or branch to deploy.
      fastapi_tutorial_repository_accept_hostkey:
        type: bool
        required: false
        default: true
        description: Whether Git should accept the repository host key.
      fastapi_tutorial_app_user:
        type: str
        required: false
        default: 'root'
        description: User that owns and runs the application.
      fastapi_tutorial_app_group:
        type: str
        required: false
        default: 'root'
        description: Group that owns and runs the application.
      fastapi_tutorial_app_service_name:
        type: str
        required: false
        default: 'fastapi-tutorial'
        description: Systemd service name.
      fastapi_tutorial_app_service_file:
        type: str
        required: false
        default: '/etc/systemd/system/fastapi-tutorial.service'
        description: Systemd unit file path.
      fastapi_tutorial_app_service_exec_start:
        type: str
        required: false
        default: '/opt/fastapi-tutorial/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000'
        description: Application process command.
      fastapi_tutorial_app_service_working_directory:
        type: str
        required: false
        default: '/opt/fastapi-tutorial'
        description: Application working directory.
      fastapi_tutorial_app_service_environment_file:
        type: str
        required: false
        default: '/opt/fastapi-tutorial/.env'
        description: Environment file consumed by systemd.
      fastapi_tutorial_app_service_restart:
        type: str
        required: false
        default: 'always'
        description: systemd restart policy.
      fastapi_tutorial_app_env_content:
        type: str
        required: false
        description: Environment file content; defaults to the database credentials.
      fastapi_tutorial_database_host:
        type: str
        required: false
        default: '127.0.0.1'
        description: PostgreSQL host.
      fastapi_tutorial_database_port:
        type: int
        required: false
        default: 5432
        description: PostgreSQL port.
      fastapi_tutorial_database_os_user:
        type: str
        required: false
        default: 'postgres'
        description: PostgreSQL operating-system account.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide tasks that process the database password from logs.
      database_username:
        type: str
        required: true
        description: Database username injected by an AAP credential type.
      database_password:
        type: str
        required: true
        no_log: true
        description: Database password injected by an AAP credential type.
      database_name:
        type: str
        required: true
        description: Database name injected by an AAP credential type.
