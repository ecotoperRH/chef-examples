---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI and PostgreSQL packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - "{{ 'python3-venv' if ansible_facts.os_family == 'Debian' else 'python3-virtualenv' }}"
      - git
      - "{{ 'postgresql' if ansible_facts.os_family == 'Debian' else 'postgresql-server' }}"
      - postgresql-contrib
      - "{{ 'libpq-dev' if ansible_facts.os_family == 'Debian' else 'postgresql-devel' }}"
    state: present

- name: Initialize PostgreSQL on RedHat-family systems
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts.os_family == 'RedHat'

- name: Create FastAPI application directory
  ansible.builtin.file:
    path: /opt/fastapi-tutorial
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Synchronize FastAPI tutorial repository  # noqa: L039,R104,R106 - repository settings are intentional administrator-controlled role parameters and default to the trusted GitHub source
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository | default('https://github.com/dibanez/fastapi_tutorial.git') }}"
    dest: /opt/fastapi-tutorial
    version: "{{ fastapi_tutorial_revision | default('main') }}"
    update: true

- name: Create Python virtual environment
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - /opt/fastapi-tutorial/venv
    creates: /opt/fastapi-tutorial/venv/bin/python

- name: Install application Python dependencies
  ansible.builtin.pip:
    requirements: /opt/fastapi-tutorial/requirements.txt
    virtualenv: /opt/fastapi-tutorial/venv

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the FastAPI PostgreSQL role exists  # noqa: L039,R101,R108 - credentials are validated role inputs, and querying PostgreSQL requires the postgres operating-system account
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = '{{ database_username }}'
  changed_when: false
  register: fastapi_tutorial_role_check
  become: true
  become_user: postgres

- name: Create the FastAPI PostgreSQL role  # noqa: L039,R101,R108 - credentials and the prior role check are validated inputs/results, and creating a role requires the postgres operating-system account
  ansible.builtin.command:
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -c
      - CREATE ROLE {{ database_username }} LOGIN PASSWORD '{{ database_password }}';
  when: fastapi_tutorial_role_check.stdout | trim != '1'
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging | default(true) }}"

- name: Check whether the FastAPI database exists  # noqa: L039,R101,R108 - database_name is a validated role input, and querying PostgreSQL requires the postgres operating-system account
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'
  changed_when: false
  register: fastapi_tutorial_database_check
  become: true
  become_user: postgres

- name: Create the FastAPI database  # noqa: L039,R101,R108 - database inputs and the prior check are validated inputs/results, and creating a database requires the postgres operating-system account
  ansible.builtin.command:
    argv:
      - createdb
      - -O
      - "{{ database_username }}"
      - "{{ database_name }}"
  when: fastapi_tutorial_database_check.stdout | trim != '1'
  become: true
  become_user: postgres

- name: Ensure the FastAPI database owner is correct  # noqa: L039,R101,R108 - database identifiers are validated administrator-supplied inputs, and altering ownership requires the postgres operating-system account
  ansible.builtin.command:
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -c
      - ALTER DATABASE {{ database_name }} OWNER TO {{ database_username }};
  changed_when: false
  become: true
  become_user: postgres

- name: Grant all privileges on the FastAPI database  # noqa: L039,R101,R108 - database identifiers are validated administrator-supplied inputs, and granting privileges requires the postgres operating-system account
  ansible.builtin.command:
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ database_username }};
  changed_when: false
  become: true
  become_user: postgres

- name: Deploy FastAPI environment configuration  # noqa: L039 - database credentials are validated administrator-supplied role inputs
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ database_username }}:{{ database_password }}@localhost/{{ database_name }}
    dest: /opt/fastapi-tutorial/.env
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging | default(true) }}"

- name: Deploy FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/fastapi-tutorial
      Environment="PATH=/opt/fastapi-tutorial/venv/bin"
      ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/fastapi-tutorial.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd and restart FastAPI tutorial

- name: Enable and start FastAPI tutorial
  ansible.builtin.systemd:
    name: fastapi-tutorial
    daemon_reload: true
    enabled: true
    state: started
