---
# argument spec file for x2a.project.fastapi_tutorial
argument_specs:
  main:
    short_description: Deploy the FastAPI tutorial application and PostgreSQL database.
    options:
      fastapi_tutorial_my_variable:
        type: str
        description: A simple string argument for demonstration.
        default: default_value
      fastapi_tutorial_repository:
        type: str
        description: Git repository containing the FastAPI tutorial application.
        default: https://github.com/dibanez/fastapi_tutorial.git
      fastapi_tutorial_revision:
        type: str
        description: Git revision to deploy.
        default: main
      fastapi_tutorial_secure_logging:
        type: bool
        description: Hide database credentials in task output.
        default: true
      database_username:
        type: str
        description: PostgreSQL role used by the application.
        required: true
      database_password:
        type: str
        description: Password for the application PostgreSQL role.
        required: true
      database_name:
        type: str
        description: PostgreSQL database used by the application.
        required: true
