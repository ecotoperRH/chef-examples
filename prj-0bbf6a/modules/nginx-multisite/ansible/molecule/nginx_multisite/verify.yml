---
# Unsupported pre-flight checks: exact sysctl values matching the rendered file, the full
# certificate validity-period calculation, and SSH service status have no directly stated
# expected outcome that can be asserted here without inventing additional expectations.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        loop:
          - nginx
          - fail2ban
          - ufw
          - openssl
          - ca-certificates
        loop_control:
          loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are enabled and running
      ansible.builtin.assert:
        that:
          - ansible_facts['services'][item_service]['state'] == 'running'
          - ansible_facts['services'][item_service]['status'] == 'enabled'
        loop:
          - nginx.service
          - fail2ban.service
        loop_control:
          loop_var: item_service

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: nginx_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_test['rc'] == 0

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      register: sshd_test
      changed_when: false

    - name: Assert SSH configuration is valid
      ansible.builtin.assert:
        that:
          - sshd_test['rc'] == 0

    - name: Apply and validate the security sysctl configuration
      ansible.builtin.command:
        argv:
          - sysctl
          - -p
          - /etc/sysctl.d/99-security.conf
      register: sysctl_test
      changed_when: false

    - name: Assert the security sysctl configuration applies successfully
      ansible.builtin.assert:
        that:
          - sysctl_test['rc'] == 0

    - name: Check required nginx files and site content
      ansible.builtin.stat:
        path: "{{ item_file }}"
      register: required_files
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /opt/server/test
        - /opt/server/test/index.html
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /opt/server/status
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_file

    - name: Assert required nginx files and site content exist
      ansible.builtin.assert:
        that:
          - item_file_result['stat']['exists']
        loop: "{{ required_files['results'] }}"
        loop_control:
          loop_var: item_file_result

    - name: Check enabled nginx site links
      ansible.builtin.stat:
        path: "{{ item_link }}"
      register: enabled_site_links
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_link

    - name: Assert enabled nginx site links are symbolic links
      ansible.builtin.assert:
        that:
          - item_link_result['stat']['islnk'] | default(false)
        loop: "{{ enabled_site_links['results'] }}"
        loop_control:
          loop_var: item_link_result

    - name: Check that the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert that the default nginx site does not exist
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']

    - name: Check TLS certificates
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
          - -nameopt
          - RFC2253
          - -dates
      register: certificate_checks
      changed_when: false
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          common_name: test.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
          common_name: ci.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
          common_name: status.cluster.local
      loop_control:
        loop_var: item_certificate

    - name: Assert TLS certificates contain the corresponding site names
      ansible.builtin.assert:
        that:
          - item_certificate_result['rc'] == 0
          - "'subject=CN=' ~ item_certificate_result['item']['common_name'] in item_certificate_result['stdout']"
        loop: "{{ certificate_checks['results'] }}"
        loop_control:
          loop_var: item_certificate_result

    - name: Check TLS private-key permissions
      ansible.builtin.stat:
        path: "{{ item_key }}"
      register: private_keys
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key

    - name: Assert TLS private-key ownership and mode
      ansible.builtin.assert:
        that:
          - item_key_result['stat']['pw_name'] == 'root'
          - item_key_result['stat']['gr_name'] == 'ssl-cert'
          - item_key_result['stat']['mode'] == '0640'
        loop: "{{ private_keys['results'] }}"
        loop_control:
          loop_var: item_key_result

    - name: Check HTTP endpoints redirect to HTTPS
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_site }}"
        follow_redirects: none
        return_content: false
        status_code:
          - 301
          - 302
      register: http_redirects
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site

    - name: Assert HTTP endpoints redirect to HTTPS
      ansible.builtin.assert:
        that:
          - item_redirect['status'] in [301, 302]
          - item_redirect['location'] is defined
          - item_redirect['location'] is search('^https://')
        loop: "{{ http_redirects['results'] }}"
        loop_control:
          loop_var: item_redirect

    - name: Check HTTPS endpoints return successful responses
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --insecure
          - --output
          - /dev/null
          - --write-out
          - '%{http_code}'
          - --resolve
          - "{{ item_https_site }}:443:127.0.0.1"
          - "https://{{ item_https_site }}/"
      register: https_responses
      changed_when: false
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_https_site

    - name: Assert HTTPS endpoints return successful responses
      ansible.builtin.assert:
        that:
          - item_https_response['stdout'] == '200'
        loop: "{{ https_responses['results'] }}"
        loop_control:
          loop_var: item_https_response

    - name: Check that nginx listens on HTTP and HTTPS ports
      ansible.builtin.wait_for:
        port: "{{ item_port }}"
        state: started
        timeout: 5
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_port

    - name: Check UFW policy and allowed ports
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: ufw_status
      changed_when: false

    - name: Check numbered UFW rules
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - numbered
      register: ufw_rules
      changed_when: false

    - name: Assert UFW is active with the required policy and ports
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status['stdout']"
          - "'Default: deny (incoming)' in ufw_status['stdout']"
          - "'22/tcp' in ufw_status['stdout'] or '22/tcp' in ufw_rules['stdout']"
          - "'80/tcp' in ufw_status['stdout'] or '80/tcp' in ufw_rules['stdout']"
          - "'443/tcp' in ufw_status['stdout'] or '443/tcp' in ufw_rules['stdout']"

    - name: Check fail2ban jail status
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
          - "{{ item_jail }}"
      register: fail2ban_jails
      changed_when: false
      loop:
        - sshd
        - nginx-http-auth
        - nginx-limit-req
        - nginx-botsearch
      loop_control:
        loop_var: item_jail

    - name: Assert required fail2ban jails are enabled
      ansible.builtin.assert:
        that:
          - item_jail_result['rc'] == 0
          - "'Status for the jail:' in item_jail_result['stdout']"
        loop: "{{ fail2ban_jails['results'] }}"
        loop_control:
          loop_var: item_jail_result

    - name: Check effective SSH hardening settings
      ansible.builtin.command:
        argv:
          - sshd
          - -T
      register: sshd_effective
      changed_when: false

    - name: Assert SSH root login and password authentication are disabled
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in sshd_effective['stdout'].splitlines()"
          - "'passwordauthentication no' in sshd_effective['stdout'].splitlines()"
