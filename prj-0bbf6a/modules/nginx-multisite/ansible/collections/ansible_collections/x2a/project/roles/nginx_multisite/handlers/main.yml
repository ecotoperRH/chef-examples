---
# handlers file for x2a.project.nginx_multisite
- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Restart SSH
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}"
    state: restarted

- name: Reload nginx_multisite sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true
