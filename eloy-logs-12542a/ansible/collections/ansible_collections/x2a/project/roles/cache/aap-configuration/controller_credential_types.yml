---
controller_credential_types:
  - name: Redis Client Authentication
    description: Redis requirepass credential for cache instance 6379.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password used by Redis clients to authenticate to the Redis instance.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
