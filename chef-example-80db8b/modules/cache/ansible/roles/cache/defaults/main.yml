---
# =============================================================================
# Memcached defaults
# =============================================================================
cache_memcached_version:
cache_memcached_memory: 64
cache_memcached_port: 11211
cache_memcached_udp_port: 11211
cache_memcached_listen: 0.0.0.0
cache_memcached_maxconn: 1024
cache_memcached_max_object_size: 1m
cache_memcached_ulimit: 1024
cache_memcached_logfilepath: /var/log/memcached
cache_memcached_experimental_options: []
cache_memcached_extra_cli_options: []
# OS-family-specific memcached service user/group
# Debian/Ubuntu: memcache  |  RHEL/Fedora: memcached
cache_memcached_user: "{{ 'memcache' if ansible_os_family == 'Debian' else 'memcached' }}"
cache_memcached_group: "{{ 'memcache' if ansible_os_family == 'Debian' else 'memcached' }}"
# =============================================================================
# Redis defaults
# =============================================================================
# Redis version to compile from source
cache_redis_version: 3.2.11
cache_redis_download_url: http://download.redis.io/releases/redis-3.2.11.tar.gz
cache_redis_safe_install: true
cache_redis_bin_path: /usr/local/bin
cache_redis_install_dir: /tmp/redis-build
# Redis instance configuration
cache_redis_port: 6379
cache_redis_name: "6379"
cache_redis_user: redis
cache_redis_group: redis
cache_redis_homedir: /var/lib/redis
cache_redis_shell: /bin/false
cache_redis_configdir: /etc/redis
cache_redis_datadir: /var/lib/redis
cache_redis_base_piddir: /var/run/redis
cache_redis_logdir: /var/log/redis
# redis_password is injected by AAP credential type at runtime — do NOT set a default here
# cache_redis_password: (set via AAP credential variable: redis_password)
# Network
cache_redis_address:
cache_redis_tcpbacklog: "511"
cache_redis_timeout: "0"
cache_redis_keepalive: "0"
cache_redis_protected_mode:
cache_redis_unixsocket:
cache_redis_unixsocketperm:
# Logging
cache_redis_loglevel: notice
cache_redis_logfile:
cache_redis_syslogenabled: "yes"
cache_redis_syslogfacility: local0
# Databases
cache_redis_databases: "16"
# Persistence / RDB
cache_redis_backuptype: rdb
cache_redis_save:
cache_redis_stopwritesonbgsaveerror: "yes"
cache_redis_rdbcompression: "yes"
cache_redis_rdbchecksum: "yes"
cache_redis_dbfilename:
# Replication (deprecated directives intentionally omitted for Redis 3.2.11)
cache_redis_replicaof:
cache_redis_masterauth:
cache_redis_repldisklesssync: "no"
cache_redis_repldisklesssyncdelay: "5"
cache_redis_repltimeout: "60"
cache_redis_repldisabletcpnodelay: "no"
cache_redis_replbacklogsize: 1mb
cache_redis_replbacklogttl: 3600
cache_redis_minreplicastowrite:
cache_redis_minreplicasmaxlag:
# Security
cache_redis_rename_commands:
# Limits
cache_redis_maxclients: 10000
cache_redis_maxmemory:
cache_redis_maxmemorypolicy:
cache_redis_maxmemorysamples:
# Computed file descriptor limit: maxclients + 32
cache_redis_limit_nofile: 10032
# AOF
cache_redis_appendfilename:
cache_redis_appendfsync: everysec
cache_redis_noappendfsynconrewrite: "no"
cache_redis_aofrewritepercentage: "100"
cache_redis_aofrewriteminsize: 64mb
cache_redis_aofloadtruncated: "yes"
# Lua
cache_redis_luatimelimit: "5000"
# Slow log
cache_redis_slowloglogslowerthan: "10000"
cache_redis_slowlogmaxlen: "1024"
# Keyspace notifications
cache_redis_notifykeyspaceevents: ""
# Advanced config
cache_redis_hashmaxziplistentries: "512"
cache_redis_hashmaxziplistvalue: "64"
cache_redis_setmaxintsetentries: "512"
cache_redis_zsetmaxziplistentries: "128"
cache_redis_zsetmaxziplistvalue: "64"
cache_redis_hllsparsemaxbytes: "3000"
cache_redis_activerehasing: "yes"
cache_redis_hz: "10"
cache_redis_aofrewriteincrementalfsync: "yes"
# Cluster (disabled by default)
cache_redis_clusterenabled: "no"
cache_redis_clusterconfigfile:
cache_redis_clusternodetimeout: 5000
cache_redis_clusterport:
# ACL
cache_redis_aclfile:
# Includes
cache_redis_includes:
# TLS (all disabled by default)
cache_redis_tlsport:
cache_redis_tlscertfile:
cache_redis_tlskeyfile:
cache_redis_tlskeyfilepass:
cache_redis_tlsclientcertfile:
cache_redis_tlsclientkeyfile:
cache_redis_tlsclientkeyfilepass:
cache_redis_tlsdhparamsfile:
cache_redis_tlscacertfile:
cache_redis_tlscacertdir:
cache_redis_tlsauthclients:
cache_redis_tlsreplication:
cache_redis_tlscluster:
cache_redis_tlsprotocols:
cache_redis_tlsciphers:
cache_redis_tlsciphersuites:
cache_redis_tlspreferserverciphers:
cache_redis_tlssessioncaching:
cache_redis_tlssessioncachesize:
cache_redis_tlssessioncachetimeout:
# OS-default Redis service to stop/disable (conflicts with source-compiled)
cache_redis_os_default_service: "{{ 'redis-server' if ansible_os_family == 'Debian' else 'redis' }}"
# Job control type (systemd on modern Linux)
cache_redis_job_control: systemd
