---
controller_credential_types:
  - name: Redis Authentication Password
    description: Redis requirepass credential hardcoded in the cache cookbook recipe, to be migrated to AAP Vault
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: The Redis authentication password set via the 'requirepass' directive in /etc/redis/6379.conf. All Redis clients must authenticate with 
            this password using AUTH before issuing commands.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
