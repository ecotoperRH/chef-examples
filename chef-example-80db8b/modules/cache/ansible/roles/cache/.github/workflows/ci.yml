---
name: CI
true:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ansible-lint
        run: |
          pip install ansible-lint
      - name: Run ansible-lint
        run: |
          ansible-lint ansible/roles/cache
  molecule:
    name: Molecule Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        distro:
          - ubuntu2204
          - rockylinux9
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install ansible molecule molecule-plugins[docker] docker
      - name: Run Molecule tests
        run: |
          cd ansible/roles/cache
          molecule test
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
