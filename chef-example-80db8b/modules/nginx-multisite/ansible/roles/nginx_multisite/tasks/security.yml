---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Deploy fail2ban jail configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  notify: Restart fail2ban

- name: Enable and start fail2ban service
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started

- name: Set UFW default policy to deny # noqa: command-instead-of-shell
  ansible.builtin.shell:
    cmd: ufw --force default deny
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Default incoming policy changed' in nginx_multisite_ufw_default.stdout"
  register: nginx_multisite_ufw_default

- name: Allow SSH through UFW # noqa: command-instead-of-shell
  ansible.builtin.shell:
    cmd: ufw allow ssh
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Rules updated' in nginx_multisite_ufw_ssh.stdout"
  register: nginx_multisite_ufw_ssh

- name: Allow HTTP through UFW # noqa: command-instead-of-shell
  ansible.builtin.shell:
    cmd: ufw allow http
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Rules updated' in nginx_multisite_ufw_http.stdout"
  register: nginx_multisite_ufw_http

- name: Allow HTTPS through UFW # noqa: command-instead-of-shell
  ansible.builtin.shell:
    cmd: ufw allow https
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Rules updated' in nginx_multisite_ufw_https.stdout"
  register: nginx_multisite_ufw_https

- name: Enable UFW # noqa: command-instead-of-shell
  ansible.builtin.shell:
    cmd: ufw --force enable
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Firewall is active and enabled' in nginx_multisite_ufw_enable.stdout"
  register: nginx_multisite_ufw_enable

- name: Set kernel sysctl - IP spoofing protection (default rp_filter)
  ansible.posix.sysctl:
    name: net.ipv4.conf.default.rp_filter
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-security.conf
    reload: true

- name: Set kernel sysctl - IP spoofing protection (all rp_filter)
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.rp_filter
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-security.conf
    reload: true

- name: Set kernel sysctl - disable IPv4 accept_redirects all
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.accept_redirects
    value: "0"
    state: present
    sysctl_file: /etc/sysctl.d/99-security.conf
    reload: true

