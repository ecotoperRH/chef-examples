- name: Set kernel sysctl - TCP syncookies
  ansible.posix.sysctl:
    name: net.ipv4.tcp_syncookies
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-security.conf
    reload: true

- name: Set kernel sysctl - TCP max syn backlog
  ansible.posix.sysctl:
    name: net.ipv4.tcp_max_syn_backlog
    value: "2048"
    state: present
    sysctl_file: /etc/sysctl.d/99-security.conf
