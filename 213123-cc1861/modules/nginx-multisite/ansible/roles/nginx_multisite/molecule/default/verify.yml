- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check nginx configuration files exist
    ansible.builtin.stat:
      path: '{{ item_config }}'
    loop:
    - /tmp/molecule_test/etc/nginx/nginx.conf
    - /tmp/molecule_test/etc/nginx/conf.d/security.conf
    loop_control:
      loop_var: item_config
    register: nginx_config_results
  - name: Assert nginx configuration files exist
    ansible.builtin.assert:
      that:
      - item_result['stat']['exists']
      - item_result['stat']['size'] > 0
      fail_msg: Expected nginx configuration file not found
    loop: '{{ nginx_config_results[''results''] }}'
    loop_control:
      loop_var: item_result
  - name: Check site configuration files exist
    ansible.builtin.stat:
      path: '{{ item_site_config }}'
    loop:
    - /tmp/molecule_test/etc/nginx/sites-available/test.cluster.local
    - /tmp/molecule_test/etc/nginx/sites-available/ci.cluster.local
    - /tmp/molecule_test/etc/nginx/sites-available/status.cluster.local
    loop_control:
      loop_var: item_site_config
    register: site_config_results
  - name: Assert site configuration files exist
    ansible.builtin.assert:
      that:
      - item_result['stat']['exists']
      - item_result['stat']['size'] > 0
      fail_msg: Expected site configuration file not found
    loop: '{{ site_config_results[''results''] }}'
    loop_control:
      loop_var: item_result
  - name: Check site symlinks exist
    ansible.builtin.stat:
      path: '{{ item_site_link }}'
    loop:
    - /tmp/molecule_test/etc/nginx/sites-enabled/test.cluster.local
    - /tmp/molecule_test/etc/nginx/sites-enabled/ci.cluster.local
    - /tmp/molecule_test/etc/nginx/sites-enabled/status.cluster.local
    loop_control:
      loop_var: item_site_link
    register: site_link_results
  - name: Assert site symlinks exist and are links
    ansible.builtin.assert:
      that:
      - item_result['stat']['exists']
      - item_result['stat']['islnk']
      fail_msg: Expected site symlink not found or not a symlink
    loop: '{{ site_link_results[''results''] }}'
    loop_control:
      loop_var: item_result
  - name: Check document root directories exist
    ansible.builtin.stat:
      path: '{{ item_doc_root }}'
    loop:
    - /tmp/molecule_test/opt/server/test
    - /tmp/molecule_test/opt/server/ci
    - /tmp/molecule_test/opt/server/status
    loop_control:
      loop_var: item_doc_root
    register: doc_root_results
  - name: Assert document root directories exist
    ansible.builtin.assert:
      that:
      - item_result['stat']['exists']
      - item_result['stat']['isdir']
      fail_msg: Expected document root directory not found
    loop: '{{ doc_root_results[''results''] }}'
    loop_control:
      loop_var: item_result
  - name: Check index.html files exist
    ansible.builtin.stat:
      path: '{{ item_index }}'
    loop:
    - /tmp/molecule_test/opt/server/test/index.html
    - /tmp/molecule_test/opt/server/ci/index.html
    - /tmp/molecule_test/opt/server/status/index.html
    loop_control:
      loop_var: item_index
    register: index_results
  - name: Assert index.html files exist
    ansible.builtin.assert:
      that:
      - item_result['stat']['exists']
      - item_result['stat']['size'] > 0
      fail_msg: Expected index.html file not found
    loop: '{{ index_results[''results''] }}'
    loop_control:
      loop_var: item_result
  - name: Check SSL certificates exist
    ansible.builtin.stat:
      path: '{{ item_cert }}'
    loop:
    - /tmp/molecule_test/etc/ssl/certs/test.cluster.local.crt
    - /tmp/molecule_test/etc/ssl/certs/ci.cluster.local.crt
    - /tmp/molecule_test/etc/ssl/certs/status.cluster.local.crt
    loop_control:
      loop_var: item_cert
    register: cert_results
  - name: Assert SSL certificates exist
    ansible.builtin.assert:
      that:
      - item_result['stat']['exists']
      - item_result['stat']['size'] > 0
      fail_msg: Expected SSL certificate not found
    loop: '{{ cert_results[''results''] }}'
    loop_control:
      loop_var: item_result
  - name: Check SSL private keys exist
    ansible.builtin.stat:
      path: '{{ item_key }}'
    loop:
    - /tmp/molecule_test/etc/ssl/private/test.cluster.local.key
    - /tmp/molecule_test/etc/ssl/private/ci.cluster.local.key
    - /tmp/molecule_test/etc/ssl/private/status.cluster.local.key
    loop_control:
      loop_var: item_key
    register: key_results
  - name: Assert SSL private keys exist
    ansible.builtin.assert:
      that:
      - item_result['stat']['exists']
      - item_result['stat']['size'] > 0
      fail_msg: Expected SSL private key not found
    loop: '{{ key_results[''results''] }}'
    loop_control:
      loop_var: item_result
  - name: Check fail2ban configuration exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/fail2ban/jail.local
    register: fail2ban_config_result
  - name: Assert fail2ban configuration exists
    ansible.builtin.assert:
      that:
      - fail2ban_config_result['stat']['exists']
      - fail2ban_config_result['stat']['size'] > 0
      fail_msg: Expected fail2ban configuration not found
  - name: Check sysctl security configuration exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-security.conf
    register: sysctl_config_result
  - name: Assert sysctl security configuration exists
    ansible.builtin.assert:
      that:
      - sysctl_config_result['stat']['exists']
      - sysctl_config_result['stat']['size'] > 0
      fail_msg: Expected sysctl security configuration not found
  - name: Check SSH configuration exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/ssh/sshd_config
    register: ssh_config_result
  - name: Assert SSH configuration exists
    ansible.builtin.assert:
      that:
      - ssh_config_result['stat']['exists']
      - ssh_config_result['stat']['size'] > 0
      fail_msg: Expected SSH configuration not found
  - name: Get nginx.conf content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/nginx/nginx.conf
    register: nginx_conf_content
  - name: Assert nginx.conf contains expected settings
    ansible.builtin.assert:
      that:
      - '''worker_processes'' in (nginx_conf_content[''content''] | b64decode)'
      - '''worker_connections'' in (nginx_conf_content[''content''] | b64decode)'
      fail_msg: nginx.conf missing expected settings
  - name: Get security.conf content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/nginx/conf.d/security.conf
    register: security_conf_content
  - name: Assert security.conf contains expected settings
    ansible.builtin.assert:
      that:
      - '''server_tokens off'' in (security_conf_content[''content''] | b64decode)'
      - '''ssl_protocols'' in (security_conf_content[''content''] | b64decode)'
      fail_msg: security.conf missing expected settings
  - name: Get site configuration content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/nginx/sites-available/{{ item_site }}
    register: site_conf_content
    loop:
    - test.cluster.local
    - ci.cluster.local
    - status.cluster.local
    loop_control:
      loop_var: item_site
  - name: Assert site configurations contain expected settings
    ansible.builtin.assert:
      that:
      - '''server_name'' in (item_result[''content''] | b64decode)'
      - '''ssl_certificate'' in (item_result[''content''] | b64decode)'
      - '''root'' in (item_result[''content''] | b64decode)'
      fail_msg: Site configuration missing expected settings
    loop: '{{ site_conf_content[''results''] }}'
    loop_control:
      loop_var: item_result
  - name: Get fail2ban jail.local content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/fail2ban/jail.local
    register: fail2ban_content
  - name: Assert fail2ban jail.local contains expected settings
    ansible.builtin.assert:
      that:
      - '''bantime'' in (fail2ban_content[''content''] | b64decode)'
      - '''maxretry'' in (fail2ban_content[''content''] | b64decode)'
      - '''enabled'' in (fail2ban_content[''content''] | b64decode)'
      fail_msg: fail2ban jail.local missing expected settings
  - name: Get sysctl security configuration content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-security.conf
    register: sysctl_content
  - name: Assert sysctl security configuration contains expected settings
    ansible.builtin.assert:
      that:
      - '''rp_filter'' in (sysctl_content[''content''] | b64decode)'
      - '''accept_redirects'' in (sysctl_content[''content''] | b64decode)'
      - '''tcp_syncookies'' in (sysctl_content[''content''] | b64decode)'
      fail_msg: sysctl security configuration missing expected settings
  - name: Get SSH configuration content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/ssh/sshd_config
    register: ssh_content
  - name: Assert SSH configuration contains expected settings
    ansible.builtin.assert:
      that:
      - '''PermitRootLogin no'' in (ssh_content[''content''] | b64decode)'
      - '''PasswordAuthentication no'' in (ssh_content[''content''] | b64decode)'
      fail_msg: SSH configuration missing expected settings
