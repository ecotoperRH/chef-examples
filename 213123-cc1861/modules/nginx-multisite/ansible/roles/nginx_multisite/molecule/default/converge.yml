- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create base directories
    ansible.builtin.file:
      path: '{{ item_dir }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/nginx/sites-available
    - /tmp/molecule_test/etc/nginx/sites-enabled
    - /tmp/molecule_test/etc/nginx/conf.d
    - /tmp/molecule_test/etc/fail2ban
    - /tmp/molecule_test/etc/sysctl.d
    - /tmp/molecule_test/etc/ssl/certs
    - /tmp/molecule_test/etc/ssl/private
    - /tmp/molecule_test/etc/ssh
    - /tmp/molecule_test/opt/server/test
    - /tmp/molecule_test/opt/server/ci
    - /tmp/molecule_test/opt/server/status
    loop_control:
      loop_var: item_dir
  - name: Create mock nginx.conf
    ansible.builtin.copy:
      content: "user www-data;\nworker_processes auto;\npid /run/nginx.pid;\nevents {\n  worker_connections 1024;\n}\nhttp {\n  include /etc/nginx/mime.types;\n  default_type
        application/octet-stream;\n  access_log /var/log/nginx/access.log;\n  error_log /var/log/nginx/error.log;\n  include /etc/nginx/conf.d/*.conf;\n  include
        /etc/nginx/sites-enabled/*;\n}\n"
      dest: /tmp/molecule_test/etc/nginx/nginx.conf
      mode: '0644'
      backup: true
  - name: Create mock security.conf
    ansible.builtin.copy:
      content: '# Security settings

        server_tokens off;

        add_header X-Frame-Options SAMEORIGIN;

        add_header X-Content-Type-Options nosniff;

        add_header X-XSS-Protection "1; mode=block";

        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_prefer_server_ciphers on;

        '
      dest: /tmp/molecule_test/etc/nginx/conf.d/security.conf
      mode: '0644'
      backup: true
  - name: Create mock site configurations
    ansible.builtin.copy:
      content: "server {\n  listen 80;\n  server_name {{ item_site['key'] }};\n  return 301 https://$host$request_uri;\n}\n\nserver {\n  listen 443 ssl;\n  server_name
        {{ item_site['key'] }};\n  \n  ssl_certificate {{ nginx_multisite_ssl_certificate_path }}/{{ item_site['key'] }}.crt;\n  ssl_certificate_key {{ nginx_multisite_ssl_private_key_path
        }}/{{ item_site['key'] }}.key;\n  \n  root {{ item_site['value']['document_root'] }};\n  index index.html;\n  \n  location / {\n    try_files $uri $uri/ =404;\n
        \ }\n}\n"
      dest: /tmp/molecule_test/etc/nginx/sites-available/{{ item_site['key'] }}
      mode: '0644'
      backup: true
    loop: '{{ nginx_multisite_sites | dict2items }}'
    loop_control:
      loop_var: item_site
    vars:
      nginx_multisite_sites:
        test.cluster.local:
          document_root: /opt/server/test
          ssl_enabled: true
        ci.cluster.local:
          document_root: /opt/server/ci
          ssl_enabled: true
        status.cluster.local:
          document_root: /opt/server/status
          ssl_enabled: true
      nginx_multisite_ssl_certificate_path: /etc/ssl/certs
      nginx_multisite_ssl_private_key_path: /etc/ssl/private
  - name: Create mock site symlinks
    ansible.builtin.file:
      src: /tmp/molecule_test/etc/nginx/sites-available/{{ item_site['key'] }}
      dest: /tmp/molecule_test/etc/nginx/sites-enabled/{{ item_site['key'] }}
      state: link
    loop:
    - key: test.cluster.local
    - key: ci.cluster.local
    - key: status.cluster.local
    loop_control:
      loop_var: item_site
  - name: Create mock index.html files
    ansible.builtin.copy:
      content: "<!DOCTYPE html>\n<html>\n<head>\n  <title>{{ item_site['key'] }}</title>\n</head>\n<body>\n  <h1>Welcome to {{ item_site['key'] }}</h1>\n  <p>This
        is the default page for {{ item_site['key'] }}</p>\n</body>\n</html>\n"
      dest: /tmp/molecule_test/opt/server/{{ item_site['value']['dir'] }}/index.html
      mode: '0644'
      backup: true
    loop:
    - key: test.cluster.local
      value:
        dir: test
    - key: ci.cluster.local
      value:
        dir: ci
    - key: status.cluster.local
      value:
        dir: status
    loop_control:
      loop_var: item_site
  - name: Create mock SSL certificates
    ansible.builtin.copy:
      content: '# Mock SSL certificate for {{ item_site[''key''] }}'
      dest: /tmp/molecule_test/etc/ssl/certs/{{ item_site['key'] }}.crt
      mode: '0644'
      backup: true
    loop:
    - key: test.cluster.local
    - key: ci.cluster.local
    - key: status.cluster.local
    loop_control:
      loop_var: item_site
  - name: Create mock SSL private keys
    ansible.builtin.copy:
      content: '# Mock SSL private key for {{ item_site[''key''] }}'
      dest: /tmp/molecule_test/etc/ssl/private/{{ item_site['key'] }}.key
      mode: '0640'
      backup: true
    loop:
    - key: test.cluster.local
    - key: ci.cluster.local
    - key: status.cluster.local
    loop_control:
      loop_var: item_site
  - name: Create mock fail2ban jail.local
    ansible.builtin.copy:
      content: '[DEFAULT]

        bantime = 3600

        findtime = 600

        maxretry = 5


        [sshd]

        enabled = true

        port = ssh

        filter = sshd

        logpath = /var/log/auth.log

        maxretry = 3


        [nginx-http-auth]

        enabled = true

        port = http,https

        filter = nginx-http-auth

        logpath = /var/log/nginx/*error.log

        maxretry = 3

        '
      dest: /tmp/molecule_test/etc/fail2ban/jail.local
      mode: '0644'
      backup: true
  - name: Create mock sysctl security config
    ansible.builtin.copy:
      content: '# IP Spoofing protection

        net.ipv4.conf.all.rp_filter = 1

        net.ipv4.conf.default.rp_filter = 1


        # Ignore ICMP broadcast requests

        net.ipv4.icmp_echo_ignore_broadcasts = 1


        # Disable source packet routing

        net.ipv4.conf.all.accept_source_route = 0

        net.ipv4.conf.default.accept_source_route = 0


        # Ignore send redirects

        net.ipv4.conf.all.send_redirects = 0

        net.ipv4.conf.default.send_redirects = 0


        # Block SYN attacks

        net.ipv4.tcp_syncookies = 1

        net.ipv4.tcp_max_syn_backlog = 2048

        net.ipv4.tcp_synack_retries = 2

        net.ipv4.tcp_syn_retries = 5


        # Log Martians

        net.ipv4.conf.all.log_martians = 1

        net.ipv4.conf.default.log_martians = 1


        # Ignore ICMP redirects

        net.ipv4.conf.all.accept_redirects = 0

        net.ipv4.conf.default.accept_redirects = 0

        net.ipv4.conf.all.secure_redirects = 0

        net.ipv4.conf.default.secure_redirects = 0

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-security.conf
      mode: '0644'
      backup: true
  - name: Create mock SSH config
    ansible.builtin.copy:
      content: '# Mock SSH config for testing

        PermitRootLogin no

        PasswordAuthentication no

        '
      dest: /tmp/molecule_test/etc/ssh/sshd_config
      mode: '0644'
      backup: true
