---
argument_specs:
  main:
    short_description: Configure Nginx with multiple SSL-enabled virtual hosts
    description:
      - Installs Nginx and configures static HTTPS sites with system security hardening.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Mapping of Nginx virtual hosts and their document-root settings.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory that stores generated TLS certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory that stores generated TLS private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Retained compatibility setting for Fail2ban configuration.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Retained compatibility setting for UFW configuration.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether to disable direct SSH root login.
      nginx_multisite_password_authentication:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is enabled.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether tasks handling generated TLS private keys hide their output.
