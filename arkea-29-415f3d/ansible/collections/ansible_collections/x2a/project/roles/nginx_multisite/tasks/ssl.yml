---
- name: Install TLS packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create TLS private-key group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create TLS certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_certificate_path }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create TLS private-key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Generate self-signed TLS certificates
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx_multisite_private_key_path }}/{{ item_nginx_multisite['key'] }}.key"
      - -out
      - "{{ nginx_multisite_certificate_path }}/{{ item_nginx_multisite['key'] }}.crt"
      - -subj
      - /C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_nginx_multisite['key'] }}/emailAddress=admin@example.com
    creates: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_multisite['key'] }}.key"
  when: item_nginx_multisite['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
  notify: Reload Nginx
  no_log: "{{ nginx_multisite_secure_logging }}"

- name: Set TLS private-key ownership and permissions
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_multisite['key'] }}.key" # noqa: R114 - path from role-defined sites dict, not user input
    state: file
    owner: root
    group: ssl-cert
    mode: "0640"
  when: item_nginx_multisite['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
  no_log: "{{ nginx_multisite_secure_logging }}"
