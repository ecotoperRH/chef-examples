---
argument_specs:
  main:
    short_description: Install and harden NGINX multi-site HTTPS hosting
    description:
      - Deploys NGINX, hardened system settings, self-signed TLS certificates, and static HTTPS virtual hosts.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Mapping of NGINX virtual hosts and their document-root and TLS settings.
        options:
          document_root:
            type: str
            required: true
            description: Absolute document-root path for the virtual host.
          ssl_enabled:
            type: bool
            required: true
            description: Whether the virtual host uses TLS.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory in which TLS certificates are stored.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory in which TLS private keys are stored.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Retained source setting for Fail2ban enablement.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Retained source setting for UFW enablement.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_disable_password_authentication:
        type: bool
        required: false
        default: true
        description: Whether SSH password authentication is disabled.
